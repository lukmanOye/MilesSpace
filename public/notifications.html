<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="MilesSpace brings your wallet and everyday digital services together. Fund your wallet, buy airtime and data, pay bills, get gift cards, use eSIM and more.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="icon" href="/images/miles.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/miles.png">
  <title>MilesSpace | Notifications</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script src="/js/session.js"></script>
  <script src="/js/presence.js" defer></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { max-width: 100vw; overflow-x: hidden; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f0f4f7;
      color: #0d2b33;
      min-height: 100vh;
      min-height: 100dvh;
    }
    :root {
      --primary: #0f4c5c;
      --primary-light: #e8f4f8;
      --unread-bg: #f0f9ff;
      --border: #e2e8f0;
      --radius: 14px;
      --radius-lg: 22px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: calc(28px + var(--safe-t)) 28px calc(28px + var(--safe-b));
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 24px;
      font-weight: 500;
      padding: 6px 4px;
      min-height: 40px;
    }
    .back-link:hover { text-decoration: underline; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .unread-count {
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .mark-all {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: 8px;
      min-height: 40px;
    }
    .mark-all:hover { text-decoration: underline; background: var(--primary-light); }
    .notification-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      transition: background .15s, border-color .15s;
      align-items: flex-start;
    }
    .notification-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .notification-item.unread {
      background: var(--unread-bg);
      border-left: 3px solid var(--primary);
    }
    .notif-icon {
      width: 40px;
      height: 40px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .notif-content { flex: 1; min-width: 0; }
    .notif-title { font-weight: 700; margin-bottom: 4px; }
    .notif-message {
      font-size: .85rem;
      color: #4a6572;
      margin-bottom: 6px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .notif-time { font-size: .7rem; color: #8da4ae; }
    .notif-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .mark-read-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: .75rem;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 6px;
      transition: background .2s;
      min-width: 40px;
      min-height: 40px;
    }
    .mark-read-btn:hover { background: var(--primary-light); }
    .delete-btn {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 6px;
      transition: background .2s;
      min-width: 40px;
      min-height: 40px;
    }
    .delete-btn:hover { background: #fee2e2; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8da4ae;
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
      color: #dde4e9;
    }
    .empty-state h3 { font-size: 1rem; margin-bottom: 6px; color: #0d2b33; }
    .empty-state p { font-size: .85rem; }
    .loading-state {
      text-align: center;
      padding: 40px;
      color: #8da4ae;
    }
    .loading-state i { font-size: 2rem; margin-bottom: 12px; display: block; }
    .toast {
      position: fixed;
      bottom: calc(20px + var(--safe-b));
      right: 20px;
      left: 20px;
      background: #0d2b33;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      display: none;
      z-index: 999;
      max-width: 320px;
      margin-left: auto;
      word-break: break-word;
    }
    @media (min-width: 641px) {
      .toast { left: auto; right: 20px; }
    }
    .toast.show { display: flex; align-items: center; gap: 10px; animation: slideUp 0.3s ease; }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      .container { padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); }
      .notification-item { padding: 14px; flex-wrap: wrap; }
      .notif-actions {
        margin-top: 8px;
        width: 100%;
        justify-content: flex-end;
      }
      .toast { left: 16px; right: 16px; max-width: none; }
    }
  </style>
</head>
<body>

<div class="container">
  <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

  <div class="header">
    <h1>
      <i class="fas fa-bell"></i> Notifications
      <span class="unread-count" id="unreadCount">0</span>
    </h1>
    <button class="mark-all" id="markAllBtn"><i class="fas fa-check-double"></i> Mark all as read</button>
  </div>

  <div id="notificationsList">
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      Loading notifications...
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const API_BASE = '/api';
const CACHE_KEY = 'ms:notifs:v1';
const CACHE_TTL = 60000; // 60 s

const State = {
  notifs: [],
  lastSignature: null,
  inFlight: false
};

/* ═══════════════════════════════════════════════════════════
   HTML ESCAPE
   ═══════════════════════════════════════════════════════════ */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, function (m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    if (m === "'") return '&#39;';
    return m;
  });
}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  const icon =
    type === 'success' ? 'fa-check-circle' :
    type === 'error' ? 'fa-times-circle' :
    'fa-info-circle';
  toast.innerHTML = `<i class="fas ${icon}"></i> <span></span>`;
  toast.querySelector('span').textContent = String(message || '');
  toast.className = 'toast show ' + type;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

/* ═══════════════════════════════════════════════════════════
   API WRAPPER
   ═══════════════════════════════════════════════════════════ */
async function apiCall(path, options = {}) {
  const fetcher = (typeof window.userFetch === 'function')
    ? window.userFetch
    : (url, o) => fetch(url, { ...o, credentials: 'include' });

  const headers = {
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };

  let res;
  try {
    res = await fetcher(API_BASE + path, { ...options, headers });
  } catch (err) {
    console.error('API Error:', err);
    throw err;
  }

  if (res.status === 401) {
    if (typeof window.redirectToUserLogin === 'function') {
      window.redirectToUserLogin();
    } else {
      window.location.replace('login.html');
    }
    throw new Error('Session expired');
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok || (data && data.success === false)) {
    throw new Error((data && (data.error || data.message)) || `HTTP ${res.status}`);
  }
  return data;
}

/* ═══════════════════════════════════════════════════════════
   NORMALIZER — same shape whether it came from the API
   or sessionStorage
   ═══════════════════════════════════════════════════════════ */
function normalizeNotif(n) {
  const isRead = (n.is_read === true || n.read === true);
  return {
    id: n.id,
    type: n.type || 'other',
    title: n.title || 'Notification',
    message: n.message || '',
    created_at: n.created_at || null,
    is_read: isRead
  };
}

/* ═══════════════════════════════════════════════════════════
   SESSION CACHE (read/write, TTL-aware)
   ═══════════════════════════════════════════════════════════ */
function readCache() {
  try {
    const raw = sessionStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.items)) return null;
    if (parsed.ts && Date.now() - parsed.ts > CACHE_TTL) return null;
    return parsed.items.map(normalizeNotif);
  } catch (_) { return null; }
}

function writeCache(items) {
  try {
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), items }));
  } catch (_) {}
}

/* ═══════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════ */
function formatTime(dateStr) {
  if (!dateStr) return 'Just now';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  if (diff < 172800000) return 'Yesterday';
  return date.toLocaleDateString('en-NG', {
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}

function iconForType(type) {
  return (
    type === 'wallet'   ? 'fa-wallet' :
    type === 'order'    ? 'fa-shopping-cart' :
    type === 'boost'    ? 'fa-chart-line' :
    type === 'giftcard' ? 'fa-gift' :
    'fa-bell'
  );
}

function renderNotifications(items) {
  const container = document.getElementById('notificationsList');
  const unreadEl = document.getElementById('unreadCount');

  const unread = items.filter(n => !n.is_read).length;
  if (unreadEl) unreadEl.textContent = String(unread);

  if (!items.length) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-bell-slash"></i>
        <h3>No notifications yet</h3>
        <p>When you receive notifications, they'll appear here.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = items.map(n => {
    const iconName = iconForType(n.type);
    return `
      <div class="notification-item ${!n.is_read ? 'unread' : ''}"
           data-id="${escapeHtml(n.id)}"
           data-read="${n.is_read ? '1' : '0'}">
        <div class="notif-icon">
          <i class="fas ${iconName}"></i>
        </div>
        <div class="notif-content">
          <div class="notif-title">${escapeHtml(n.title)}</div>
          <div class="notif-message">${escapeHtml(n.message)}</div>
          <div class="notif-time">
            <i class="far fa-clock"></i> ${formatTime(n.created_at)}
          </div>
        </div>
        <div class="notif-actions">
          ${!n.is_read
            ? `<button class="mark-read-btn" data-action="read" data-id="${escapeHtml(n.id)}" title="Mark as read" aria-label="Mark as read"><i class="fas fa-check"></i></button>`
            : ''}
          <button class="delete-btn" data-action="delete" data-id="${escapeHtml(n.id)}" title="Delete" aria-label="Delete notification"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    `;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   LOAD — cache-first, then fetch, then diff by signature
   ═══════════════════════════════════════════════════════════ */
function signatureOf(items) {
  return items.map(n => `${n.id}|${n.is_read ? 1 : 0}|${n.title}|${n.created_at || ''}`).join('::');
}

async function loadNotifications({ background = false } = {}) {
  if (State.inFlight) return;
  State.inFlight = true;

  const container = document.getElementById('notificationsList');

  /* FAST PAINT: sessionStorage cache on first load only */
  if (!background) {
    const cached = readCache();
    if (cached) {
      State.notifs = cached;
      State.lastSignature = signatureOf(cached);
      renderNotifications(cached);
    } else if (container && !container.querySelector('.notification-item')) {
      container.innerHTML = `
        <div class="loading-state">
          <i class="fas fa-spinner fa-spin"></i>
          Loading notifications...
        </div>
      `;
    }
  }

  try {
    const result = await apiCall('/notifications');
    const raw = Array.isArray(result.data) ? result.data : [];
    const items = raw.map(normalizeNotif);
    const sig = signatureOf(items);

    /* Skip re-render if nothing changed AND we already have a painted list */
    if (sig === State.lastSignature && State.notifs.length) {
      State.inFlight = false;
      return;
    }

    State.notifs = items;
    State.lastSignature = sig;
    writeCache(items);
    renderNotifications(items);
  } catch (err) {
    console.error('Load notifications error:', err);
    if (!State.notifs.length) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <h3>Could not load notifications</h3>
          <p>Please refresh the page to try again.</p>
        </div>
      `;
    }
  } finally {
    State.inFlight = false;
  }
}

/* ═══════════════════════════════════════════════════════════
   OPTIMISTIC MUTATIONS (no full list reload)
   ═══════════════════════════════════════════════════════════ */
function findNotif(id) {
  return State.notifs.find(n => String(n.id) === String(id)) || null;
}

function markLocal(id, isRead) {
  const n = findNotif(id);
  if (!n) return;
  n.is_read = isRead;

  const row = document.querySelector(`.notification-item[data-id="${cssEscape(id)}"]`);
  if (!row) return;

  if (isRead) {
    row.classList.remove('unread');
    row.setAttribute('data-read', '1');
    const btn = row.querySelector('.mark-read-btn');
    if (btn) btn.remove();
  } else {
    row.classList.add('unread');
    row.setAttribute('data-read', '0');
  }

  const unread = State.notifs.filter(x => !x.is_read).length;
  const unreadEl = document.getElementById('unreadCount');
  if (unreadEl) unreadEl.textContent = String(unread);

  State.lastSignature = signatureOf(State.notifs);
  writeCache(State.notifs);
}

function removeLocal(id) {
  State.notifs = State.notifs.filter(n => String(n.id) !== String(id));

  const row = document.querySelector(`.notification-item[data-id="${cssEscape(id)}"]`);
  if (row) {
    row.style.opacity = '0';
    row.style.transition = 'opacity .15s';
    setTimeout(() => row.remove(), 160);
  }

  const unread = State.notifs.filter(x => !x.is_read).length;
  const unreadEl = document.getElementById('unreadCount');
  if (unreadEl) unreadEl.textContent = String(unread);

  if (!State.notifs.length) {
    const container = document.getElementById('notificationsList');
    if (container) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-bell-slash"></i>
          <h3>No notifications yet</h3>
          <p>When you receive notifications, they'll appear here.</p>
        </div>
      `;
    }
  }

  State.lastSignature = signatureOf(State.notifs);
  writeCache(State.notifs);
}

function cssEscape(s) {
  return String(s).replace(/["\\]/g, '\\$&');
}

/* ═══════════════════════════════════════════════════════════
   EVENT DELEGATION — replaces inline onclick
   ═══════════════════════════════════════════════════════════ */
document.getElementById('notificationsList').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.getAttribute('data-action');
  const id = btn.getAttribute('data-id');
  if (!id) return;

  if (action === 'read') {
    markLocal(id, true);
    try {
      await apiCall(`/notifications/${encodeURIComponent(id)}/read`, { method: 'PUT' });
    } catch (err) {
      markLocal(id, false);
      showToast('Failed to mark as read', 'error');
    }
  } else if (action === 'delete') {
    if (!confirm('Delete this notification?')) return;
    removeLocal(id);
    try {
      await apiCall(`/notifications/${encodeURIComponent(id)}`, { method: 'DELETE' });
      showToast('Notification deleted', 'success');
    } catch (err) {
      /* Best effort — on error, force a reload so state is correct */
      await loadNotifications();
      showToast('Failed to delete notification', 'error');
    }
  }
});

/* ═══════════════════════════════════════════════════════════
   MARK ALL AS READ
   ═══════════════════════════════════════════════════════════ */
document.getElementById('markAllBtn').addEventListener('click', async () => {
  const unreadBefore = State.notifs.filter(n => !n.is_read).length;
  if (!unreadBefore) { showToast('Nothing to mark as read'); return; }

  /* Optimistic: flip every unread to read, strip the action buttons */
  State.notifs.forEach(n => { n.is_read = true; });
  renderNotifications(State.notifs);
  writeCache(State.notifs);

  try {
    await apiCall('/notifications/read/all', { method: 'PUT' });
    showToast('All notifications marked as read', 'success');
    State.lastSignature = signatureOf(State.notifs);
  } catch (err) {
    await loadNotifications({ background: true });
    showToast('Failed to mark all as read', 'error');
  }
});

/* ═══════════════════════════════════════════════════════════
   BACKGROUND REFRESH — replaces the 30 s poll
   Only re-renders if the payload changed (signature check)
   ═══════════════════════════════════════════════════════════ */
let refreshInterval = setInterval(() => {
  if (!document.hidden) loadNotifications({ background: true });
}, 30000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadNotifications({ background: true });
});

window.addEventListener('beforeunload', () => {
  clearInterval(refreshInterval);
});

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
  await new Promise(r => setTimeout(r, 0));

  if (typeof window.getUser === 'function' && !window.getUser()) {
    setTimeout(() => {
      if (!window.getUser()) {
        if (typeof window.redirectToUserLogin === 'function') {
          window.redirectToUserLogin();
        } else {
          window.location.replace('login.html');
        }
      }
    }, 1500);
    return;
  }

  loadNotifications();
});
</script>
</body>
</html>
