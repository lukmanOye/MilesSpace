<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>MilesSpace | Transaction History</title>
  <link rel="icon" href="/images/miles.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --navy:   #0b1a4f;
      --blue:   #2563eb;
      --blue-l: #eaf0ff;
      --bg:     #f1f3f6;
      --card:   #fff;
      --line:   #e6e9f0;
      --head:   #f7f8fb;
      --t1:     #0f1b3d;
      --t2:     #6b7794;
      --t3:     #9aa4bb;
      --ok:     #12b76a;
      --warn:   #d97706;
      --err:    #ef4444;
      --buy-bg:  #dcd8fb; --buy-t:  #4c3fc4;
      --in-bg:   #d1fae5; --in-t:   #065f46;
      --out-bg:  #fee2e2; --out-t:  #991b1b;
      --fd: 'Inter', system-ui, sans-serif;
      --fb: 'Inter', system-ui, sans-serif;
      --ease: cubic-bezier(.25, .8, .25, 1);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html { font-size: 15px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { max-width: 100vw; overflow-x: hidden; }
    body {
      font-family: var(--fb); background: var(--bg); color: var(--t1);
      min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased;
    }
    body.lock { overflow: hidden; }
    a { text-decoration: none; color: inherit; }
    button {
      font-family: inherit; cursor: pointer; border: none;
      background: none; color: inherit; font-size: inherit;
    }
    input, select { font-family: inherit; font-size: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    /* ── Overlay ── */
    .ov {
      position: fixed; inset: 0;
      background: rgba(11, 26, 79, .45);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 590; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .ov.on { opacity: 1; pointer-events: auto; }

    /* ── Sidebar shell (kept from original; ms-shell will override) ── */
    .sidebar {
      position: fixed; top: 0; left: 0;
      width: min(86vw, 290px); max-width: 290px;
      height: 100vh; height: 100dvh;
      background: var(--card); z-index: 600;
      display: flex; flex-direction: column;
      overflow-y: auto; overflow-x: hidden;
      transform: translateX(-100%); visibility: hidden;
      transition: transform .3s var(--ease), visibility .3s;
      box-shadow: 0 0 40px rgba(11, 26, 79, .18);
      -webkit-overflow-scrolling: touch;
    }
    .sidebar.open { transform: none; visibility: visible; }
    .sb-foot {
      margin-top: auto;
      padding: 12px 10px; padding-bottom: calc(12px + var(--safe-b));
      border-top: 1px solid var(--line);
    }
    .sb-prof { display: flex; align-items: center; gap: 10px; padding: 8px; }
    .sb-prof-link { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; cursor: pointer; }
    .sb-av {
      width: 34px; height: 34px; border-radius: 50%;
      background: #0c3d4a; color: #fff;
      display: grid; place-items: center;
      font-weight: 700; font-size: .85rem; flex-shrink: 0;
      overflow: hidden; border: 2px solid #f59e0b;
    }
    .sb-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .sb-un { font-size: .82rem; font-weight: 700; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-ue { font-size: .7rem; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-out {
      width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center; color: var(--t3); font-size: .85rem;
      transition: all .18s; cursor: pointer; border: none; background: none; flex-shrink: 0;
    }
    .sb-out:hover { background: var(--out-bg); color: var(--err); }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 400;
      background: var(--card);
      height: calc(68px + var(--safe-t));
      padding: var(--safe-t) 20px 0;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid var(--line);
    }
    .ico-btn {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; font-size: 1.05rem;
      background: #e8f4f7; color: #0c3d4a; flex-shrink: 0;
    }
    .ico-btn:hover { background: var(--bg); }
    .topbar h1 {
      font-family: var(--fd); font-size: 1.3rem; font-weight: 700;
      letter-spacing: -.01em; flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tb-right { display: flex; align-items: center; gap: 6px; }
    .tb-av {
      width: 34px; height: 34px; border-radius: 50%;
      background: #0c3d4a; color: #fff;
      display: grid; place-items: center;
      font-weight: 700; font-size: .85rem;
      border: 2px solid #f59e0b; flex-shrink: 0;
    }

    /* ── Content ── */
    .content {
      max-width: 1280px; margin: 0 auto;
      padding: 28px 20px calc(60px + var(--safe-b));
    }
    @media (min-width: 768px) {
      .content { padding: 36px 32px calc(70px + var(--safe-b)); }
    }

    /* ── Search + filter bar ── */
    .bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .count { font-size: 1.05rem; font-weight: 500; color: var(--t2); }
    .tools {
      display: flex; gap: 12px; flex: 1;
      justify-content: flex-end; min-width: 0;
    }

    .search { position: relative; flex: 1; max-width: 560px; min-width: 0; }
    .search input {
      width: 100%; height: 52px; padding: 0 48px 0 20px;
      border: 1px solid transparent; border-radius: 12px;
      background: var(--card); font-size: 16px; color: var(--t1); outline: none;
      -webkit-appearance: none; appearance: none;
    }
    .search input:focus { border-color: var(--blue); }
    .search input::placeholder { color: var(--t2); }
    .search i {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      color: var(--navy); pointer-events: none;
    }

    /* ── Filter: two implementations ──
       Desktop: custom pill with hidden native select overlay.
       Mobile (<=640px): native <select> shown as a real pill so iOS
       Safari opens its native picker reliably and never auto-zooms. */
    .filter {
      position: relative; height: 52px; min-width: 170px;
      background: var(--card); border-radius: 12px;
      display: flex; align-items: center; padding: 0 18px; gap: 12px;
      font-weight: 600; font-size: .92rem;
    }
    .filter span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .filter select {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      font-size: 16px; /* iOS: prevent zoom */
    }
    .filter i { color: var(--navy); }

    /* Native-only variant used on mobile */
    .filter-native {
      display: none;
      position: relative; height: 52px;
      background: var(--card); border-radius: 12px;
      padding: 0 42px 0 18px;
      font-weight: 600; font-size: .92rem;
      color: var(--t1);
      -webkit-appearance: none; appearance: none;
      border: 1px solid transparent;
      width: 100%; min-width: 0;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%230b1a4f' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 14px 14px;
      outline: none;
      cursor: pointer;
    }
    .filter-native:focus { border-color: var(--blue); }

    @media (max-width: 640px) {
      .tools { flex-direction: column; width: 100%; justify-content: stretch; align-items: stretch; gap: 10px; }
      .search { max-width: none; }
      .filter { display: none; }
      .filter-native { display: block; }
    }

    /* ── Table ── */
    .table {
      background: var(--card); border-radius: 14px; overflow: hidden;
    }
    .t-head { display: none; }

    .t-row {
      display: grid; width: 100%; text-align: left; align-items: center;
      padding: 18px 16px; border-bottom: 1px solid var(--line);
      background: var(--card); gap: 4px 12px;
      grid-template-columns: 1fr auto;
      grid-template-areas: "type amt" "type st";
    }
    .t-row:last-child { border-bottom: none; }
    .t-row:hover { background: var(--head); }

    .c-type { grid-area: type; display: flex; align-items: center; gap: 12px; min-width: 0; }
    .c-ref, .c-date-d { display: none; }
    .c-amt {
      grid-area: amt; text-align: right; font-family: var(--fd);
      font-weight: 700; font-size: .9rem; white-space: nowrap;
    }
    .c-st { grid-area: st; justify-self: end; }

    .t-ic {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--bg); color: var(--navy);
      display: grid; place-items: center; font-size: .95rem; flex-shrink: 0;
    }
    .t-txt {
      min-width: 0; display: flex; flex-direction: column;
      gap: 5px; align-items: flex-start;
    }
    .t-title {
      font-weight: 600; font-size: .9rem; max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .pill {
      display: inline-block; font-size: .66rem; font-weight: 700;
      padding: 3px 10px; border-radius: 7px;
    }
    .pill.bought { background: var(--buy-bg); color: var(--buy-t); }
    .pill.in     { background: var(--in-bg);  color: var(--in-t); }
    .pill.out    { background: var(--out-bg); color: var(--out-t); }
    .pill.wallet { background: var(--blue-l); color: var(--blue); }

    .t-date-m { font-size: .7rem; color: var(--t3); }

    .st {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: .78rem; font-weight: 600;
    }
    .st::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: currentColor;
    }
    .st.completed { color: var(--ok); }
    .st.pending   { color: var(--warn); }
    .st.failed    { color: var(--err); }

    @media (min-width: 900px) {
      .t-head {
        display: grid; grid-template-columns: 2.3fr 1.5fr 1fr 1.1fr 1.5fr;
        gap: 12px; padding: 22px 28px; background: var(--head);
        font-weight: 700; font-size: .9rem;
      }
      .t-row {
        grid-template-columns: 2.3fr 1.5fr 1fr 1.1fr 1.5fr;
        grid-template-areas: "type ref amt st date";
        padding: 22px 28px; gap: 12px;
      }
      .c-ref {
        display: block; grid-area: ref; font-size: .9rem; font-weight: 500;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .c-date-d {
        display: block; grid-area: date; font-size: .9rem; white-space: nowrap;
      }
      .c-amt { grid-area: amt; text-align: left; font-size: .9rem; font-weight: 500; }
      .c-st { justify-self: start; }
      .t-date-m { display: none; }
      .t-title { font-size: .95rem; }
    }

    /* ── Empty / error / skeleton ── */
    .empty { padding: 64px 20px; text-align: center; color: var(--t2); }
    .empty i { font-size: 2rem; display: block; margin-bottom: 12px; color: var(--t3); }
    .empty b { display: block; font-size: 1rem; color: var(--t1); margin-bottom: 4px; }
    .empty p { font-size: .85rem; max-width: 340px; margin: 0 auto; }

    .btn-ghost {
      margin-top: 16px; padding: 10px 16px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--card); font-size: .82rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
    }
    .btn-ghost:hover { border-color: var(--blue); color: var(--blue); }

    .sk {
      background: linear-gradient(90deg, var(--line) 25%, var(--head) 37%, var(--line) 63%);
      background-size: 400% 100%;
      animation: sh 1.4s ease infinite;
      border-radius: 8px;
    }
    @keyframes sh { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    .sk-row {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 16px; border-bottom: 1px solid var(--line);
    }

    .pager {
      display: flex; justify-content: center; align-items: center;
      gap: 12px; padding: 20px 0;
    }
    .pager button {
      padding: 12px 18px; border-radius: 10px; background: var(--card);
      font-size: .8rem; font-weight: 700; min-height: 44px;
    }
    .pager button:disabled { opacity: .4; cursor: not-allowed; }
    .pager span { font-size: .8rem; color: var(--t2); }

    /* ── Detail (receipt) ── */
    .d-card {
      background: var(--card); border-radius: 14px; padding: 28px 20px 24px;
    }
    @media (min-width: 900px) { .d-card { padding: 36px; } }

    .d-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; margin-bottom: 34px;
    }
    .d-back {
      display: flex; align-items: center; gap: 12px;
      color: var(--blue); font-size: 1.3rem; font-weight: 600;
      overflow: hidden;
    }
    .d-back i { font-size: 1rem; }

    .share {
      height: 60px; padding: 0 30px; border-radius: 12px;
      background: var(--navy); color: #fff; font-weight: 700;
      font-size: 1rem; display: inline-flex; align-items: center; gap: 12px;
    }
    .share:hover { background: #142570; }
    .share.m { display: none; }

    .rc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 28px; }
    .f .l {
      color: var(--t2); font-size: 1rem; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .f .v {
      font-size: 1.2rem; font-weight: 500;
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap; word-break: break-word; overflow-wrap: anywhere;
    }
    .cp {
      color: var(--blue); font-size: .95rem; padding: 4px;
      min-height: 32px; min-width: 32px;
    }
    .cp:hover { opacity: .7; }

    .issue { margin-top: 40px; }
    .issue button {
      color: var(--t2); font-size: 1.05rem; font-weight: 500;
      border-bottom: 2px solid var(--t2); padding-bottom: 2px;
      min-height: 44px;
    }
    .issue button:hover { color: var(--blue); border-color: var(--blue); }

    .rate { margin-top: 46px; }
    .rate h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 18px; }
    .rate p {
      color: var(--t2); font-size: 1.1rem; line-height: 1.6;
      max-width: 360px; margin-bottom: 22px;
    }
    .faces { display: flex; gap: 22px; flex-wrap: wrap; }
    .face {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; color: var(--t2); font-size: .9rem; min-height: 44px;
    }
    .face span {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--bg); display: grid; place-items: center;
      font-size: 1.9rem; transition: transform .15s, background .15s;
    }
    .face:hover span { transform: scale(1.08); }
    .face.on span { background: var(--blue-l); box-shadow: 0 0 0 2px var(--blue); }
    .face.on { color: var(--blue); font-weight: 700; }

    @media (max-width: 899px) {
      .rc { grid-template-columns: repeat(2, 1fr); gap: 30px 20px; }
    }

    @media (max-width: 640px) {
      .d-card { padding: 6px 18px 110px; border-radius: 14px; }
      .d-top { margin-bottom: 6px; }
      .d-back { font-size: 1.05rem; }
      .share.d { display: none; }
      .rc { display: block; }
      .f {
        display: flex; justify-content: space-between; align-items: center;
        gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line);
      }
      .f:last-child { border-bottom: none; }
      .f .l { font-size: .8rem; margin: 0; flex-shrink: 0; max-width: 46%; }
      .f .v { font-size: .82rem; font-weight: 600; justify-content: flex-end; text-align: right; }
      .issue, .rate { margin-top: 28px; }
      .face span { width: 52px; height: 52px; font-size: 1.6rem; }
      .share.m {
        display: flex; position: fixed; left: 16px; right: 16px;
        bottom: calc(16px + var(--safe-b)); height: 54px;
        justify-content: center; background: var(--blue);
        z-index: 300; box-shadow: 0 8px 24px rgba(37, 99, 235, .35);
      }
    }

    /* ── Toasts ── */
    .toasts {
      position: fixed; bottom: calc(86px + var(--safe-b));
      right: 14px; left: 14px; z-index: 900;
      display: flex; flex-direction: column; gap: 8px;
      max-width: none; pointer-events: none;
    }
    @media (min-width: 641px) { .toasts { left: auto; max-width: 300px; } }
    .toast {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px; border-radius: 12px;
      font-size: .8rem; font-weight: 600;
      box-shadow: 0 10px 28px rgba(11, 26, 79, .16);
      animation: ti .22s ease; pointer-events: auto; word-break: break-word;
    }
    .toast.ok { background: var(--in-bg); color: var(--in-t); }
    .toast.err { background: var(--out-bg); color: var(--out-t); }
    .toast.info { background: var(--card); border: 1px solid var(--line); }
    @keyframes ti {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ═══════════════════════════════════════════════════════════
       Stale transaction banner (from the pasted spec)
       ═══════════════════════════════════════════════════════════ */
    .tx-stale-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 14px; margin: 8px 0;
      border-radius: 10px;
      background: rgba(245, 166, 35, 0.12);
      border: 1px solid rgba(245, 166, 35, 0.35);
      font-size: 12.5px;
      color: var(--t2);
    }
    .tx-stale-banner strong { color: var(--t1); font-weight: 600; }
    .tx-stale-banner button {
      padding: 6px 12px; border-radius: 8px; border: none;
      background: #0f4c5c; color: #fff;
      font-size: 12px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
    }
    .tx-stale-banner button:disabled { opacity: .55; cursor: not-allowed; }
    @media (max-width: 420px) {
      .tx-stale-banner { flex-direction: column; align-items: stretch; }
      .tx-stale-banner button { width: 100%; min-height: 44px; }
    }
  </style>

  <script>window.MILES_WIDGET_DISABLE = true;</script>
  <script src="/js/session.js"></script>
  <script src="/js/presence.js" defer></script>
  <link rel="stylesheet" href="/css/ms-shell.css?v=1">
  <script src="/js/ms-shell.js?v=1" defer></script>
</head>

<body>

<div class="ov" id="ov"></div>

<aside class="sidebar" id="sb">
  <div class="sb-foot">
    <div class="sb-prof">
      <a href="usersettings.html" class="sb-prof-link">
        <div class="sb-av" id="sbAv">U</div>
        <div style="min-width:0">
          <p class="sb-un" id="sbName">Loading…</p>
          <p class="sb-ue" id="sbEmail"></p>
        </div>
      </a>
      <button class="sb-out" id="logoutBtn" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>
</aside>

<header class="topbar">
  <button class="ico-btn" id="hbg" aria-label="Open menu"><i class="fas fa-bars"></i></button>
  <h1 id="pageTitle">Transaction History</h1>
  <div class="tb-right">
    <a href="notifications.html" class="ico-btn" aria-label="Notifications"><i class="far fa-bell"></i></a>
    <a href="usersettings.html" class="avatar tb-av" id="tbAv" aria-label="Account">U</a>
  </div>
</header>

<main class="content">

  <section id="listView">

    <div class="bar">
      <div class="count" id="countLbl">Transactions</div>
      <div class="tools">
        <div class="search">
          <input type="search" id="searchInput" placeholder="Search by Reference ID" autocomplete="off" aria-label="Search by Reference ID" />
          <i class="fas fa-magnifying-glass"></i>
        </div>

        <!-- Desktop custom pill -->
        <label class="filter" for="filterType">
          <span id="filterLbl">All</span>
          <i class="fas fa-sliders"></i>
          <select id="filterType" aria-label="Filter transactions">
            <option value="all">All</option>
            <option value="airtime">Airtime</option>
            <option value="data">Data</option>
            <option value="bills">Bills</option>
            <option value="electricity">Electricity</option>
            <option value="cable">Cable TV</option>
            <option value="internet">Internet</option>
            <option value="esim">eSIM</option>
            <option value="giftcard_buy">Gift cards</option>
            <option value="marketplace">Marketplace</option>
            <option value="virtual">Virtual numbers</option>

<div class="toasts" id="toasts"></div>

<script>
'use strict';

const API_BASE = '/api';
const PAGE_SIZE = 20;

/* ─── Service-only filter ────────────────────────────────────
   history.html is for SERVICE PURCHASES only.
   Wallet activity (deposits, credits, debits, refunds, cashback,
   referrals, withdrawals, transfers, crypto) belongs on fund.html.
   Gift-card SALE is gone — only gift-card PURCHASE (from DT One)
   remains.                                                   */
const SERVICE_TYPES = new Set([
  'airtime',
  'data',
  'bills',
  'electricity',
  'cable',
  'internet',
  'esim',
  'giftcard_buy',
  'marketplace',
  'virtual',
  'virtual_sms',
  'boost'
]);

/* Server-side filter value we send when the user picks "All".
   Empty string means "give me everything"; the client then drops
   any non-service rows that slipped in. */
const ALL_SENTINEL = '';

const State = {
  page: 1,
  limit: PAGE_SIZE,
  type: 'all',
  search: '',
  loading: false,
  rows: [],
  reqId: 0,
  current: null,
  total: 0
};
const $ = id => document.getElementById(id);

const esc = (s) => (window.MS && window.MS.esc) ? window.MS.esc(s) : (s == null ? '' : String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c])));

const nf = n => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, c) => String(c || 'NGN').toUpperCase() === 'USD' ? '$' + nf(n) : '₦' + nf(n);
const moneyCode = (n, c) => String(c || 'NGN').toUpperCase() + ' ' + nf(n);

function fmtDate(iso, long) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const day = d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const time = d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit' });
  return long ? `${day} | ${time}` : `${day} - ${time}`;
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = { ok: 'fa-circle-check', err: 'fa-circle-xmark', info: 'fa-circle-info' };
  el.innerHTML = `<i class="fas ${ic[type] || ic.info}"></i><span></span>`;
  el.querySelector('span').textContent = String(msg || '');
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .25s';
    setTimeout(() => el.remove(), 260);
  }, 3000);
}

async function copyText(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg || 'Copied to clipboard', 'ok');
  } catch {
    toast('Could not copy', 'err');
  }
}

function getCurrentUser() {
  return (typeof window.getUser === 'function') ? window.getUser() : null;
}

function toLogin() {
  if (typeof window.redirectToUserLogin === 'function') {
    window.redirectToUserLogin();
  } else {
    window.location.replace('login.html');
  }
}

async function apiFetch(path, opts = {}) {
  const fetcher = (typeof window.userFetch === 'function')
    ? window.userFetch
    : (url, o) => fetch(url, { ...o, credentials: 'include' });

  const res = await fetcher(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });

  if (res.status === 401) {
    toLogin();
    throw Object.assign(new Error('UNAUTHORIZED'), { status: 401 });
  }

  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.success === false) {
    const e = new Error(body.error || `HTTP ${res.status}`);
    e.code = body.code;
    e.status = res.status;
    throw e;
  }
  return body;
}

/* ─── Type map — service purchases only ──────────────────────
   Every entry corresponds to a real service adapter. Anything
   not listed here will be silently filtered out before render. */
const TYPES = {
  airtime:       ['Airtime',              'fas fa-mobile-screen',      'bought', 'Purchased'],
  data:          ['Data Purchase',        'fas fa-receipt',            'bought', 'Purchased'],
  bills:         ['Bill Payment',         'fas fa-file-invoice-dollar','bought', 'Payment'],
  electricity:   ['Electricity',          'fas fa-bolt',               'bought', 'Payment'],
  cable:         ['Cable TV',             'fas fa-tv',                 'bought', 'Payment'],
  internet:      ['Internet',             'fas fa-wifi',               'bought', 'Payment'],
  esim:          ['eSIM',                 'fas fa-sim-card',           'bought', 'Purchased'],
  giftcard_buy:  ['Gift Card Purchase',   'fas fa-gift',               'bought', 'Bought'],
  giftcard:      ['Gift Card Purchase',   'fas fa-gift',               'bought', 'Bought'],
  marketplace:   ['Marketplace Purchase', 'fas fa-store',              'bought', 'Bought'],
  virtual:       ['Virtual Number',       'fas fa-phone-alt',          'bought', 'Bought'],
  virtual_sms:   ['Virtual Number',       'fas fa-phone-alt',          'bought', 'Bought'],
  boost:         ['Social Boost',         'fas fa-chart-line',         'bought', 'Bought']
};

function typeView(type) {
  const t = TYPES[String(type || '').toLowerCase()];
  if (t) return { label: t[0], icon: t[1], kind: t[2], kindLabel: t[3] };
  return null;
}

function statusView(status) {
  const s = String(status || '').toLowerCase();
  if (['completed', 'success', 'successful', 'finished', 'delivered', 'sms_received'].includes(s)) {
    return { label: 'Completed', cls: 'completed' };
  }
  if (['under_review', 'manual_review', 'partially_paid'].includes(s)) {
    return { label: 'Under review', cls: 'pending' };
  }
  if (['refunded', 'reversed'].includes(s)) return { label: 'Refunded', cls: 'failed' };
  if (['failed', 'cancelled', 'canceled', 'expired'].includes(s)) return { label: 'Failed', cls: 'failed' };
  if (['pending', 'processing', 'provider_unknown', 'confirming'].includes(s)) {
    return { label: 'Processing', cls: 'pending' };
  }
  // Unknown → Pending, never leak raw provider strings
  return { label: 'Pending', cls: 'pending' };
}

/* Keep only service rows */
function keepServiceRows(rows) {
  return rows.filter(r => SERVICE_TYPES.has(String(r.type || '').toLowerCase()));
}

async function fetchTransactions() {
  const myReq = ++State.reqId;
  State.loading = true;
  renderSkeleton();

  const p = new URLSearchParams({ page: State.page, limit: State.limit });
  if (State.type !== 'all') p.set('type', State.type);
  if (State.search) p.set('search', State.search);

  try {
    const body = await apiFetch('/transactions?' + p);
    if (myReq !== State.reqId) return;
    State.rows = keepServiceRows(Array.isArray(body.data) ? body.data : []);
    State.total = (body.pagination || {}).total ?? State.rows.length;
    renderCount();
    renderList();
    renderPager(body.pagination || {});
  } catch (e) {
    if (myReq !== State.reqId) return;
    console.error('fetchTransactions:', e);
    renderError(e);
    if (e.status !== 401) toast(e.message || 'Could not load transactions.', 'err');
  } finally {
    if (myReq === State.reqId) State.loading = false;
  }
}

function renderCount() {
  const n = State.total;
  const opt = getSelectedFilterLabel();
  $('countLbl').textContent = State.type === 'all'
    ? `${n} Transaction${n === 1 ? '' : 's'}`
    : `${n} ${opt} Transaction${n === 1 ? '' : 's'}`;
  $('filterLbl').textContent = opt;
}

function getSelectedFilterLabel() {
  const desktop = $('filterType');
  return desktop?.selectedOptions[0]?.textContent || 'All';
}

function renderSkeleton() {
  $('txBody').innerHTML = Array.from({ length: 6 }).map(() => `
    <div class="sk-row">
      <div class="sk" style="width:42px;height:42px;border-radius:50%"></div>
      <div style="flex:1">
        <div class="sk" style="width:55%;height:12px;margin-bottom:8px"></div>
        <div class="sk" style="width:25%;height:10px"></div>
      </div>
      <div class="sk" style="width:70px;height:14px"></div>
    </div>`).join('');
}

function renderList() {
  const body = $('txBody');
  if (!State.rows.length) {
    const f = State.search || State.type !== 'all';
    body.innerHTML = `<div class="empty">
      <i class="fas ${f ? 'fa-magnifying-glass' : 'fa-receipt'}"></i>
      <b>${f ? 'No matching transactions' : 'No service transactions yet'}</b>
      <p>${f ? 'Try a different reference ID or clear the filter.' : 'Your service purchases (airtime, bills, gift cards, eSIM, marketplace) will appear here.'}</p>
      ${f ? '<button class="btn-ghost" id="clearF"><i class="fas fa-xmark"></i> Clear filters</button>' : ''}
    </div>`;
    $('clearF')?.addEventListener('click', () => {
      $('searchInput').value = '';
      $('filterType').value = 'all';
      $('filterTypeMobile').value = 'all';
      State.search = '';
      State.type = 'all';
      State.page = 1;
      fetchTransactions();
    });
    return;
  }

  body.innerHTML = State.rows.map((r, i) => {
    const v = typeView(r.type);
    const st = statusView(r.status);
    const title = r.description || (v ? v.label : 'Transaction');
    return `<button type="button" class="t-row" data-i="${i}">
      <div class="c-type">
        <div class="t-ic"><i class="${v ? v.icon : 'fas fa-receipt'}"></i></div>
        <div class="t-txt">
          <div class="t-title" title="${esc(title)}">${esc(title)}</div>
          <span class="pill ${v ? v.kind : 'bought'}">${esc(v ? v.kindLabel : 'Transaction')}</span>
          <span class="t-date-m">${esc(fmtDate(r.created_at))}</span>
        </div>
      </div>
      <div class="c-ref" title="${esc(r.reference || '')}">${esc(r.reference || '—')}</div>
      <div class="c-amt">${esc(money(Math.abs(Number(r.amount) || 0), r.currency))}</div>
      <div class="c-st"><span class="st ${st.cls}">${esc(st.label)}</span></div>
      <div class="c-date-d">${esc(fmtDate(r.created_at))}</div>
    </button>`;
  }).join('');

  body.querySelectorAll('.t-row').forEach(el =>
    el.addEventListener('click', () => openDetail(State.rows[Number(el.dataset.i)]))
  );
}

function renderPager(p) {
  const total = p.total || 0, pages = p.totalPages || 1, page = p.page || 1;
  if (total <= State.limit) {
    $('pager').hidden = true;
    return;
  }
  $('pager').hidden = false;
  $('pageInfo').textContent = `Page ${page} of ${pages}`;
  $('prevBtn').disabled = page <= 1;
  $('nextBtn').disabled = !p.hasMore;
}

function renderError(e) {
  $('txBody').innerHTML = `<div class="empty">
    <i class="fas fa-triangle-exclamation" style="color:var(--err)"></i>
    <b>Couldn't load transactions</b>
    <p>${esc(e.message || 'Please try again in a moment.')}</p>
    <button class="btn-ghost" id="retryT"><i class="fas fa-rotate"></i> Retry</button>
  </div>`;
  $('retryT').addEventListener('click', fetchTransactions);
  $('pager').hidden = true;
}

function fieldsFor(row) {
  const v = typeView(row.type);
  const st = statusView(row.status);
  const m = row.metadata || {};
  const amt = Math.abs(Number(row.amount) || 0);
  const fee = Math.abs(Number(row.fee) || 0);
  const ref = row.reference || '—';

  const F = [];
  F.push(['Transaction Type', `${esc(row.description || (v ? v.label : 'Transaction'))} <span class="pill ${v ? v.kind : 'bought'}">${esc(v ? v.kindLabel : 'Transaction')}</span>`]);
  F.push(['Reference ID', `<span>${esc(ref)}</span><button class="cp" data-copy="${esc(ref)}" aria-label="Copy reference"><i class="far fa-copy"></i></button>`]);
  F.push(['Status', `<span class="st ${st.cls}">${esc(st.label)}</span>`]);
  F.push(['Transaction Date', esc(fmtDate(row.created_at, true))]);

  const extra = [
    ['Network Provider', m.operator_name],
    ['Phone Number', m.phone_number],
    ['Country', m.country_name],
    ['Gift Card', m.card_name],
    ['Category', m.category],
    ['Subcategory', m.subcategory],
    ['Plan', m.plan_name],
    ['Data', m.data_display],
    ['Service', m.service_name],
    ['Platform', m.platform],
    ['Quantity', m.quantity],
    ['Product', m.product_title],
    ['Face Value', m.face_value ? `${m.face_currency || ''} ${m.face_value}`.trim() : null],
    ['Rate', m.rate],
    ['Units', m.units]
  ];

  for (const [l, val] of extra) {
    if (val != null && val !== '') F.push([l, esc(String(val))]);
  }

  const wallet = String(row.currency || 'NGN').toUpperCase() === 'USD' ? 'Dollar Wallet' : 'Naira Wallet';
  F.push(['Payment Method', wallet]);
  if (fee > 0) F.push(['Fee', esc(moneyCode(fee, row.currency))]);
  F.push(['Total Amount', esc(moneyCode(amt, row.currency))]);
  return F;
}

function openDetail(row) {
  if (!row) return;
  State.current = row;

  $('rc').innerHTML = fieldsFor(row)
    .map(([l, v]) => `<div class="f"><div class="l">${esc(l)}</div><div class="v">${v}</div></div>`)
    .join('');

  document.querySelectorAll('#detailView [data-copy]').forEach(el =>
    el.addEventListener('click', () => copyText(el.dataset.copy))
  );

  document.querySelectorAll('.face').forEach(f => f.classList.remove('on'));
  $('listView').hidden = true;
  $('detailView').hidden = false;
  $('pageTitle').textContent = 'Transaction Details';
  window.scrollTo({ top: 0 });
  history.pushState({ d: 1 }, '');
}

function closeDetail(fromPop) {
  if ($('detailView').hidden) return;
  $('detailView').hidden = true;
  $('listView').hidden = false;
  $('pageTitle').textContent = 'Transaction History';
  State.current = null;
  if (!fromPop && history.state?.d) history.back();
}

function shareReceipt() {
  const r = State.current;
  if (!r) return;
  const v = typeView(r.type);
  const st = statusView(r.status);
  const text = [
    'MilesSpace Receipt', '─────────────────',
    `Type: ${r.description || (v ? v.label : 'Transaction')}`,
    `Reference: ${r.reference || '—'}`,
    `Status: ${st.label}`,
    `Date: ${fmtDate(r.created_at, true)}`,
    `Amount: ${moneyCode(Math.abs(Number(r.amount) || 0), r.currency)}`,
    '', 'Thank you for using MilesSpace.'
  ].join('\n');

  if (navigator.share) {
    navigator.share({ title: 'MilesSpace Receipt', text })
      .catch(() => copyText(text, 'Receipt copied to clipboard'));
  } else {
    copyText(text, 'Receipt copied to clipboard');
  }
}

function renderUser() {
  const u = getCurrentUser() || {};
  const name = u.username || (u.email || '').split('@')[0] || 'Account';
  const ini = name.charAt(0).toUpperCase() || 'U';

  const sbName = $('sbName');
  const sbEmail = $('sbEmail');
  const sbAv = $('sbAv');
  const tbAv = $('tbAv');

  if (sbName) sbName.textContent = name;
  if (sbEmail) sbEmail.textContent = u.email || '';
  if (sbAv) sbAv.textContent = ini;
  if (tbAv) tbAv.textContent = ini;
}

function syncFilters(from) {
  if (from === 'desktop') {
    $('filterTypeMobile').value = $('filterType').value;
  } else {
    $('filterType').value = $('filterTypeMobile').value;
  }
  $('filterLbl').textContent = getSelectedFilterLabel();
}

function init() {
  if (!getCurrentUser()) {
    setTimeout(() => {
      if (!getCurrentUser()) toLogin();
    }, 1500);
    return;
  }

  renderUser();

  $('logoutBtn')?.addEventListener('click', () => {
    if (typeof window.doUserLogout === 'function') {
      window.doUserLogout();
    } else {
      toLogin();
    }
  });

  /* Search — debounced */
  let timer;
  $('searchInput').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      State.search = e.target.value.trim();
      State.page = 1;
      fetchTransactions();
    }, 350);
  });

  /* Filter — desktop custom pill */
  $('filterType').addEventListener('change', e => {
    State.type = e.target.value || 'all';
    State.page = 1;
    syncFilters('desktop');
    fetchTransactions();
  });

  /* Filter — mobile native select */
  $('filterTypeMobile').addEventListener('change', e => {
    State.type = e.target.value || 'all';
    State.page = 1;
    syncFilters('mobile');
    fetchTransactions();
  });

  $('prevBtn').addEventListener('click', () => {
    if (State.page > 1) {
      State.page--;
      fetchTransactions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  $('nextBtn').addEventListener('click', () => {
    State.page++;
    fetchTransactions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('detailBack').addEventListener('click', () => closeDetail(false));
  window.addEventListener('popstate', () => closeDetail(true));

  $('shareD').addEventListener('click', shareReceipt);
  $('shareM').addEventListener('click', shareReceipt);

  $('reportBtn').addEventListener('click', () => {
    const ref = State.current?.reference;
    if (ref) copyText(ref, 'Reference copied. Send it to support so we can look into it.');
  });

  $('faces').addEventListener('click', e => {
    const b = e.target.closest('.face');
    if (!b) return;
    document.querySelectorAll('.face').forEach(f => f.classList.toggle('on', f === b));
    toast('Thanks for your feedback', 'ok');
  });

  /* Speed: paint cached page 1 instantly on the default view, then refresh. */
  if (State.type === 'all' && State.page === 1 && !State.search && window.MS && MS.swr) {
    MS.swr('history:page1', () => apiFetch('/transactions?page=1&limit=' + PAGE_SIZE), (cached) => {
      if (!cached || !cached.data) return;
      const rows = keepServiceRows(cached.data);
      if (!rows.length) return;
      State.rows = rows;
      State.total = (cached.pagination || {}).total ?? rows.length;
      renderCount();
      renderList();
      renderPager(cached.pagination || {});
    }).catch(() => {});
    fetchTransactions();
  } else {
    fetchTransactions();
  }
}

document.addEventListener('DOMContentLoaded', init);

/* ═══════════════════════════════════════════════════════════════════
   Stale transaction banner + "Check status" button.
   Appended exactly per the pasted spec.
   Requires nothing except a signed-in user.
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ─── PAGE ADAPTER — history.html ───────────────────────────
  // Row selector: every transaction row rendered by renderList().
  // Record lookup: data-i → State.rows[i]. State.rows is guaranteed
  //   to be service-only because fetchTransactions() filters before
  //   storing. So no financial rows can ever end up here.
  // Fields: State.rows[i] has reference, status, created_at.
  // Token fetcher: window.userFetch (falls back to fetch with cookies).
  // Toast: local toast(msg, type) → 'ok' / 'err' / 'info'.
  const ROW_SELECTOR = '.t-row[data-i]';
  const RECORD_LOOKUP = (el) => State.rows[Number(el.getAttribute('data-i'))] || null;
  const ESCAPE_HTML = esc;
  const SHOW_TOAST = (msg, kind) => toast(msg, kind === 'ok' ? 'ok' : (kind === 'err' ? 'err' : 'info'));
  // ──────────────────────────────────────────────────────────

  const API_CHECK = '/api/transactions';
  const STALE_MS = 10 * 60 * 1000;
  const STALEABLE = new Set(['pending','processing','under_review','provider_unknown','manual_review']);
  const TERMINAL  = new Set(['completed','failed','refunded','cancelled','reversed']);

  function userLabel(s) {
    s = String(s || '').toLowerCase();
    if (['completed','success','finished','delivered','sms_received'].includes(s)) return 'completed';
    if (['failed','declined','expired'].includes(s)) return 'failed';
    if (['cancelled','canceled'].includes(s)) return 'cancelled';
    if (['refunded','reversed'].includes(s)) return 'refunded';
    if (['under_review','manual_review','partially_paid'].includes(s)) return 'under_review';
    if (['processing','provider_unknown','confirming'].includes(s)) return 'processing';
    return 'pending';
  }

  function isStale(rec) {
    if (!rec || !rec.created_at) return false;
    if (!STALEABLE.has(String(rec.status || '').toLowerCase())) return false;
    return (Date.now() - new Date(rec.created_at).getTime()) > STALE_MS;
  }

  function bannerMessage(rec) {
    const label = userLabel(rec.status);
    if (label === 'under_review') return { main: 'A specialist is checking this for you.', tail: '' };
    if (label === 'processing')  return { main: 'Confirming with the provider.',          tail: ' Most complete within a few more minutes.' };
    return                              { main: 'Taking longer than expected.',            tail: ' Most complete within a few more minutes.' };
  }

  async function callCheck(reference) {
    const fetcher = (typeof window.userFetch === 'function') ? window.userFetch : fetch;
    try {
      const resp = await fetcher(
        `${API_CHECK}/${encodeURIComponent(reference)}/check`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include' }
      );
      let body = null;
      try { body = await resp.json(); } catch (_) {}
      return { ok: resp.ok, status: resp.status, body };
    } catch (err) {
      return { ok: false, status: 0, body: { error: err.message || 'Network error' } };
    }
  }

  function inject(rowEl, rec) {
    // Already injected?
    const sib = rowEl.nextElementSibling;
    if (sib && sib.classList && sib.classList.contains('tx-stale-banner')) return;
    if (rowEl.querySelector && rowEl.querySelector('.tx-stale-banner')) return;

    const reference = rec.reference || rec.id || rec.ref;
    if (!reference) return;

    const { main, tail } = bannerMessage(rec);
    const banner = document.createElement('div');
    banner.className = 'tx-stale-banner';
    banner.innerHTML =
      '<span><strong>' + ESCAPE_HTML(main) + '</strong>' + ESCAPE_HTML(tail) + '</span>' +
      '<button type="button" data-check="' + ESCAPE_HTML(String(reference)) + '">Check status</button>';

    rowEl.parentNode.insertBefore(banner, rowEl.nextSibling);

    const btn = banner.querySelector('button');
    btn.addEventListener('click', async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Checking\u2026';

      const r = await callCheck(reference);
      if (r.ok && r.body && r.body.data) {
        const s = r.body.data;
        const label = userLabel(s.status);
        const span = banner.querySelector('span');
        if (span) span.innerHTML = '<strong>' + ESCAPE_HTML(s.status_message || 'Updated.') + '</strong>';
        if (TERMINAL.has(label)) {
          btn.remove();
          SHOW_TOAST('Status updated.', 'ok');
          if (typeof window.fetchTransactions === 'function') {
            // fetchTransactions is a function declaration in the module scope above
            // — it's not on window, but we can reach it through the closure by
            // calling the exported hook below.
            if (typeof window.__historyRefresh === 'function') {
              setTimeout(() => window.__historyRefresh(), 400);
            }
          }
        } else {
          btn.disabled = false;
          btn.textContent = 'Check status';
        }
      } else if (r.status === 429) {
        btn.textContent = 'Wait a moment';
        const wait = (r.body && r.body.retry_after_ms) || 30000;
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Check status'; }, wait);
      } else {
        btn.textContent = 'Check status';
        btn.disabled = false;
        SHOW_TOAST((r.body && r.body.error) || 'Could not check status right now.', 'err');
      }
    });
  }

  let isScanning = false;
  function scan() {
    if (isScanning) return;
    isScanning = true;
    try {
      document.querySelectorAll(ROW_SELECTOR).forEach(el => {
        // Skip invisible rows
        if (el.getClientRects().length === 0) return;
        const rec = RECORD_LOOKUP(el);
        if (!isStale(rec)) return;
        inject(el, rec);
      });
    } finally { isScanning = false; }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(scan, 800), { once: true });
  } else {
    setTimeout(scan, 800);
  }

  let debounce = null;
  new MutationObserver(() => {
    clearTimeout(debounce);
    debounce = setTimeout(scan, 300);
  }).observe(document.body, { childList: true, subtree: true });

  /* Expose the refresh hook for the terminal-status path */
  window.__historyRefresh = function () {
    try { fetchTransactions(); } catch (_) {}
  };
})();
</script>
</body>
</html>
