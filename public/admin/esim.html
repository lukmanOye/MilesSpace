    cacheBust('products');
    loadProducts({ force: true });
    return true;
  });
}

async function toggleFeatured(id, featured) {
  const r = await api(API.productUpdate(id), { method: 'PUT', body: { featured }, idempotency: true });
  if (!r.ok) { toast(r.message || 'Update failed', 'error'); return; }
  toast(featured ? 'Marked as featured' : 'Unfeatured', 'success');
  cacheBust('products');
  loadProducts({ force: true });
}

      ${li(d.belowCost, 'Below cost')}
      ${li(d.belowMinMargin, 'Below minimum margin')}

async function loadPricing({ force = false } = {}) {
  const current = document.getElementById('esPricingCurrent');
  if (!current) return;
  const tok = nextToken('pricing');
  const cached = force ? null : cacheGet('pricing');
  if (!cached) current.innerHTML = skelRows(4);

  let data = cached;
  if (!data) {
    const r = await api(API.pricingGet());
    if (!isCurrent('pricing', tok)) return;
    if (!r.ok) {
      renderErrorState(current, r.message, r.requestId, () => loadPricing({ force: true }));
      return;
    }
    data = r.data;
    cacheSet('pricing', data);
  }
  State.pricingConfig = data;

  const d = data.display || {};
  current.innerHTML = `
    <div class="es-pv-field"><span class="es-k">USD to NGN</span><span class="es-v">${esc(data.usdToNgn || '—')}</span></div>
    <div class="es-pv-field"><span class="es-k">USD markup</span><span class="es-v">${esc(d.markupUsdPct || '—')}</span></div>
    <div class="es-pv-field"><span class="es-k">NGN markup</span><span class="es-v">${esc(d.markupNgnPct || '—')}</span></div>
    <div class="es-pv-field"><span class="es-k">Min NGN</span><span class="es-v">${fmtMoney(data.minNgn, 'NGN')}</span></div>
    <div class="es-pv-field"><span class="es-k">Max NGN</span><span class="es-v">${fmtMoney(data.maxNgn, 'NGN')}</span></div>
    <div class="es-pv-field"><span class="es-k">Version</span><span class="es-v">${esc(data.pricingVersion || '0')}</span></div>
  `;

  document.getElementById('esPUsdNgn').value = data.usdToNgn || '';
  document.getElementById('esPMarkupUsd').value = decimalToPct(data.markupUsd || '0');
  document.getElementById('esPMarkupNgn').value = decimalToPct(data.markupNgn || '0');
  document.getElementById('esPMinNgn').value = data.minNgn || '';
  document.getElementById('esPMaxNgn').value = data.maxNgn || '';
  document.getElementById('esPMarkupUsdHint').textContent = '';
  document.getElementById('esPMarkupNgnHint').textContent = '';
  markUpdated();
}

async function savePricing() {
  const usdNgn = (document.getElementById('esPUsdNgn').value || '').trim();
  const usdPct = (document.getElementById('esPMarkupUsd').value || '').trim();
  const ngnPct = (document.getElementById('esPMarkupNgn').value || '').trim();
  const minNgn = (document.getElementById('esPMinNgn').value || '').trim();
  const maxNgn = (document.getElementById('esPMaxNgn').value || '').trim();
  const reason = (document.getElementById('esPReason').value || '').trim();
  const err = document.getElementById('esPErr');
  err.style.display = 'none';

  if (reason.length < 4) { err.textContent = 'Reason must be at least 4 characters.'; err.style.display = 'block'; return; }
  const usdDec = pctToDecimal(usdPct);
  const ngnDec = pctToDecimal(ngnPct);
  if (usdDec == null) { err.textContent = 'Invalid USD markup percent.'; err.style.display = 'block'; return; }
  if (ngnDec == null) { err.textContent = 'Invalid NGN markup percent.'; err.style.display = 'block'; return; }

  const patch = {
    usd_to_ngn: usdNgn,
    esim_markup_pct_usd: usdDec,
    esim_markup_pct_ngn: ngnDec,
    esim_min_ngn: minNgn,
    esim_max_ngn: maxNgn
  };
  const expectedVersion = State.pricingConfig && State.pricingConfig.pricingVersion != null
    ? String(State.pricingConfig.pricingVersion)
    : '0';

  const r = await api(API.pricingPut(), {
    method: 'PUT',
    body: { patch, reason, expectedVersion },
    idempotency: true
  });
  if (!r.ok) {
    if (r.code === 'CONFIG_VERSION_CONFLICT') {
      err.textContent = 'Another admin saved this section first. Reloading…';
      err.style.display = 'block';
      cacheBust('pricing');
      setTimeout(() => loadPricing({ force: true }), 800);
    } else {
      err.textContent = r.message || 'Save failed.';
      err.style.display = 'block';
    }
    return;
  }
  toast('Pricing saved', 'success');
  document.getElementById('esPReason').value = '';
  cacheBust('pricing');
  loadPricing({ force: true });
}

async function runCalculator() {
  const el = document.getElementById('esCalcResult');
  if (!el) return;
  const amount = (document.getElementById('esCalcAmount').value || '').trim();
  const currency = document.getElementById('esCalcCurrency').value;
  const mode = document.getElementById('esCalcMode').value;
  const value = (document.getElementById('esCalcValue').value || '').trim();
  if (!amount) { el.innerHTML = '<div class="es-state">Enter a wholesale amount.</div>'; return; }

  el.innerHTML = '<div class="es-state"><i class="fas fa-circle-notch fa-spin"></i></div>';
  const body = {
    wholesale_amount: amount,
    wholesale_currency: currency,
    mode,
    value: mode === 'global' ? null : value
  };
  const r = await api(API.preview(), { method: 'POST', body });

    el.innerHTML = `<div class="es-state es-error">${esc(r.message || 'Preview failed')}</div>`;

  const d = r.data || {};

    <div class="es-pv-field"><span class="es-k">Cost (NGN)</span><span class="es-v">${fmtMoney(d.costNgn, 'NGN')}</span></div>
    <div class="es-pv-field"><span class="es-k">Cost (USD)</span><span class="es-v">${fmtMoney(d.costUsd, 'USD')}</span></div>
    <div class="es-pv-field"><span class="es-k">Customer (NGN)</span><span class="es-v">${fmtMoney(d.priceNgn, 'NGN')}</span></div>
    <div class="es-pv-field"><span class="es-k">Customer (USD)</span><span class="es-v">${fmtMoney(d.priceUsd, 'USD')}</span></div>
    <div class="es-pv-field"><span class="es-k">Profit (NGN)</span><span class="es-v">${fmtMoney(d.profitNgn, 'NGN')}</span></div>
    <div class="es-pv-field"><span class="es-k">Margin</span><span class="es-v">${d.marginPct != null ? esc(String(d.marginPct)) + '%' : '—'}</span></div>

async function loadAttention({ force = false } = {}) {
  const el = document.getElementById('esAttBody');
  if (!el) return;
  const tok = nextToken('attention');
  const cached = force ? null : cacheGet('attention');
  if (!cached) el.innerHTML = skelRows(5);

  let data = cached;
  if (!data) {
    const r = await api(API.attention());
    if (!isCurrent('attention', tok)) return;
    if (!r.ok) {
      renderErrorState(el, r.message, r.requestId, () => loadAttention({ force: true }));
      return;
    }
    data = r.data;
    cacheSet('attention', data);
  }
  State.attentionData = data;
  renderAttention(data);
  markUpdated();
}

  if (!rows.length) {
    renderEmptyState(el, 'fa-check-circle', 'Nothing needs attention in this view');
    return;
  }

  el.innerHTML = `

          <tr>
            <th scope="col">Reference</th>
            <th scope="col">Customer</th>

              <td data-label="Reason" style="max-width:280px">${esc(o.reason || o.refund_error || o.failure_reason || '—')}</td>
              <td data-label="Age">${esc(fmtAgeMinutes(o.age_minutes))}</td>

}

function bindRefunds() {
  const refresh = document.getElementById('esRefundsRefresh');
  if (refresh) refresh.addEventListener('click', () => { cacheBust('refunds'); loadRefunds({ force: true }); });
  const prev = document.getElementById('esRefundsPrev');
  const next = document.getElementById('esRefundsNext');
  if (prev) prev.addEventListener('click', () => { if (State.refundPage > 1) { State.refundPage--; loadRefunds(); } });
  if (next) next.addEventListener('click', () => { if (State.refundPage < State.refundTotalPages) { State.refundPage++; loadRefunds(); } });
}

async function loadRefunds({ force = false } = {}) {
  const el = document.getElementById('esRefundsBody');
  if (!el) return;
  State.refundPage = State.refundPage || 1;
  const tok = nextToken('refunds');
  const q = new URLSearchParams();
  q.set('status', 'refunded');
  q.set('limit', '25');
  q.set('page', String(State.refundPage));
  const cacheKey = 'refunds:' + q.toString();
  const cached = force ? null : cacheGet(cacheKey);
  if (!cached) el.innerHTML = skelRows(5);

  let data = cached;
  if (!data) {
    const r = await api(API.orders() + '?' + q.toString());
    if (!isCurrent('refunds', tok)) return;
    if (!r.ok) {
      renderErrorState(el, r.message, r.requestId, () => loadRefunds({ force: true }));
      return;
    }
    data = r.data;
    cacheSet(cacheKey, data);
  }
  const rows = data.orders || [];
  State.refundTotalPages = data.totalPages || 1;
  const total = data.count || 0;

  const byCcy = {};
  for (const o of rows) {
    const p = paidValue(o);
    if (!p) continue;
    if (!byCcy[p.ccy]) byCcy[p.ccy] = '0.00';
    byCcy[p.ccy] = safeDecimalAdd(byCcy[p.ccy], p.amount);
  }
  document.getElementById('esRefundsSummary').innerHTML = `
    <div class="es-pv-field"><span class="es-k">Count on this page</span><span class="es-v">${fmtInt(rows.length)}</span></div>
    ${Object.entries(byCcy).map(([ccy, amt]) => `<div class="es-pv-field"><span class="es-k">Total refunded (${esc(ccy)})</span><span class="es-v">${fmtMoney(amt, ccy)}</span></div>`).join('')}
  `;

  if (!rows.length) {
    renderEmptyState(el, 'fa-inbox', 'No refunds yet');
    document.getElementById('esRefundsPageInfo').textContent = 'No results';
    document.getElementById('esRefundsPrev').disabled = true;
    document.getElementById('esRefundsNext').disabled = true;
    markUpdated();
    return;
  }

  el.innerHTML = `
    <div class="es-table-wrap">
      <table class="es-table" role="table">
        <thead>
          <tr>
            <th scope="col">Reference</th>
            <th scope="col">Customer</th>
            <th scope="col">Refunded amount</th>
            <th scope="col">Refund transaction</th>
            <th scope="col">Refunded at</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((o) => `
            <tr tabindex="0" data-open-id="${esc(o.id)}" aria-label="Open order ${esc(o.reference)}">
              <td data-label="Reference" class="es-cell-mono" data-primary>
                <span class="es-ref">${esc(o.reference || '—')}</span>
                <span class="es-badge ${statusBadgeClass(o.status)}">${esc(o.status || '—')}</span>
              </td>
              <td data-label="Customer">${esc((o.user && o.user.username) || '—')}</td>
              <td data-label="Refunded amount" class="es-cell-amount">${paidLabel(o)}</td>
              <td data-label="Refund transaction" class="es-cell-mono">${o.refund_transaction_id ? esc(o.refund_transaction_id) : '<em style="color:var(--es-text-faint)">Not recorded</em>'}</td>
              <td data-label="Refunded at">${esc(fmtDateTime(o.refunded_at))}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  wireRowOpen(el);

  const start = (State.refundPage - 1) * 25 + 1;
  const end = Math.min(State.refundPage * 25, total);
  document.getElementById('esRefundsPageInfo').textContent = `Showing ${start} to ${end} of ${total}`;
  document.getElementById('esRefundsPrev').disabled = State.refundPage <= 1;
  document.getElementById('esRefundsNext').disabled = State.refundPage >= State.refundTotalPages;
  markUpdated();
}

function safeDecimalAdd(a, b) {
  const norm = (v) => {
    const s = String(v || '0').trim();
    if (!/^-?\d+(\.\d+)?$/.test(s)) return '0.00';
    const [i, f = ''] = s.split('.');
    return i + '.' + (f + '00').slice(0, 2);
  };
  const [ai, af] = norm(a).split('.');
  const [bi, bf] = norm(b).split('.');
  const aScaled = BigInt(ai) * 100n + BigInt(af || '0');
  const bScaled = BigInt(bi) * 100n + BigInt(bf || '0');
  const sum = aScaled + bScaled;
  const neg = sum < 0n;
  const abs = neg ? -sum : sum;
  const i = abs / 100n;
  const f = (abs % 100n).toString().padStart(2, '0');
  return (neg ? '-' : '') + i.toString() + '.' + f;
}

function bindProvider() {
  const root = document.getElementById('panel-provider');
  if (!root) return;
  root.addEventListener('click', async (e) => {
    if (e.target.closest('[data-refresh-balance-provider]')) {
      await loadProviderBalanceInto(document.getElementById('esBalBodyProvider'), { force: true });
    }
    if (e.target.closest('[data-refresh-health-provider]')) {
      await loadProviderHealthInto(document.getElementById('esProviderBodyProvider'), { force: true });
    }
    if (e.target.closest('[data-toggle-rawkeys-provider]')) {
      const body = document.getElementById('esBalBodyProvider');
      const show = body.dataset.showRawkeys !== '1';
      body.dataset.showRawkeys = show ? '1' : '0';
      loadProviderBalanceInto(body, { force: false });
    }
    if (e.target.closest('[data-test-provider]')) {
      const btn = e.target.closest('[data-test-provider]');
      btn.disabled = true;
      const r = await api(API.providerCheck(), { method: 'POST', body: {}, idempotency: true });
      btn.disabled = false;
      if (!r.ok) { toast(r.message || 'Test failed', 'error'); return; }
      const ok = r.data && r.data.reachable;
      toast(ok ? 'Reachable' : 'Unreachable', ok ? 'success' : 'error');
      cacheBust('health');
      loadProviderHealthInto(document.getElementById('esProviderBodyProvider'), { force: true });
    }
  });
}

async function loadProviderPanel({ force = false } = {}) {
  await Promise.all([
    loadProviderBalanceInto(document.getElementById('esBalBodyProvider'), { force }),
    loadProviderHealthInto(document.getElementById('esProviderBodyProvider'), { force })
  ]);
  markUpdated();
}
