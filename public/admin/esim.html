<html lang="en">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
/* ─────────────────────────────────────────────────────────────
   Tokens
   ───────────────────────────────────────────────────────────── */
.es-page,
.es-overlay-root {
  --es-brand:        var(--navy, #0f4c5c);
  --es-brand-deep:   var(--navy-deep, #0a3542);
  --es-brand-light:  var(--navy-light, #14607a);
  --es-gold:         var(--gold, #f5a623);
  --es-gold-soft:    var(--gold-soft, #fef3d9);
  --es-bg:           var(--bg, #f4f7fb);
  --es-bg-alt:       var(--bg-alt, #eef2f6);
  --es-surface:      var(--bg-card, var(--surface, #ffffff));
  --es-border:       var(--border, rgba(15,76,92,.10));
  --es-border-strong:var(--border-strong, rgba(15,76,92,.18));
  --es-text:         var(--text, #0c1f26);
  --es-text-dim:     var(--text-dim, #5b7480);
  --es-text-faint:   var(--text-faint, #93a7ae);
  --es-success:      var(--success, #15803d);
  --es-success-bg:   var(--success-bg, #e7f6ec);
  --es-success-bd:   var(--success-bd, #b7e5c4);
  --es-danger:       var(--danger, #c81e1e);
  --es-danger-bg:    var(--danger-bg, #fdecec);
  --es-danger-bd:    var(--danger-bd, #f5c2c2);
  --es-warn:         var(--warn, #b45309);
  --es-warn-bg:      var(--warn-bg, #fef3c7);
  --es-warn-bd:      var(--warn-bd, #fde68a);
  --es-info:         var(--info, #1d4ed8);
  --es-info-bg:      var(--info-bg, #e6edfd);
  --es-info-bd:      var(--info-bd, #c3d3fa);
  --es-purple:       var(--purple, #6d28d9);
  --es-purple-bg:    var(--purple-bg, #ede9fe);
  --es-purple-bd:    var(--purple-bd, #c9bdfb);
  --es-r-sm:         9px;
  --es-r-md:         12px;
  --es-r-lg:         16px;
  --es-r-xl:         20px;
  --es-shadow-md:    var(--sh-md, 0 6px 18px -6px rgba(8,42,51,.14), 0 2px 6px rgba(8,42,51,.05));
  --es-shadow-lg:    var(--sh-lg, 0 20px 44px -18px rgba(8,42,51,.28), 0 8px 20px -10px rgba(8,42,51,.14));
  --es-topbar:       64px;
  --es-safe-top:     env(safe-area-inset-top, 0px);
  --es-safe-bottom:  env(safe-area-inset-bottom, 0px);
  --es-safe-left:    env(safe-area-inset-left, 0px);
  --es-safe-right:   env(safe-area-inset-right, 0px);
}
html.dark .es-page, html.dark .es-overlay-root {
  --es-bg:          #071318; --es-bg-alt:      #0c1f26;
  --es-surface:     rgba(18,36,44,.85);
  --es-border:      rgba(255,255,255,.08); --es-border-strong:rgba(255,255,255,.14);
  --es-text:        #eaf3f5; --es-text-dim:    #9db4bb; --es-text-faint:  #6b8a93;
  --es-success-bg:  rgba(21,128,61,.18);   --es-success-bd:  rgba(21,128,61,.35);
  --es-danger-bg:   rgba(200,30,30,.18);   --es-danger-bd:   rgba(200,30,30,.35);
  --es-warn-bg:     rgba(180,83,9,.18);    --es-warn-bd:     rgba(180,83,9,.35);
  --es-info-bg:     rgba(29,78,216,.20);   --es-info-bd:     rgba(29,78,216,.38);
  --es-purple-bg:   rgba(109,40,217,.20);  --es-purple-bd:   rgba(109,40,217,.40);
}
@media (prefers-color-scheme: dark) {
  html:not(.light) .es-page, html:not(.light) .es-overlay-root {
    --es-bg:#071318; --es-bg-alt:#0c1f26; --es-surface:rgba(18,36,44,.85);
    --es-border:rgba(255,255,255,.08); --es-border-strong:rgba(255,255,255,.14);
    --es-text:#eaf3f5; --es-text-dim:#9db4bb; --es-text-faint:#6b8a93;
    --es-success-bg:rgba(21,128,61,.18); --es-success-bd:rgba(21,128,61,.35);
    --es-danger-bg:rgba(200,30,30,.18);  --es-danger-bd:rgba(200,30,30,.35);
    --es-warn-bg:rgba(180,83,9,.18);     --es-warn-bd:rgba(180,83,9,.35);
    --es-info-bg:rgba(29,78,216,.20);    --es-info-bd:rgba(29,78,216,.38);
    --es-purple-bg:rgba(109,40,217,.20); --es-purple-bd:rgba(109,40,217,.40);
  }
}

/* ─────────────────────────────────────────────────────────────
   Base
   ───────────────────────────────────────────────────────────── */
.es-page {
  width: 100%; max-width: 1400px; margin-inline: auto;
  overflow-anchor: none;
  color: var(--es-text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.es-page *, .es-page *::before, .es-page *::after { box-sizing: border-box; }
.es-page .es-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.es-sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* Head */
.es-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; min-width:0; }
.es-head > div { min-width:0; }
.es-head h2 { font-size:clamp(17px,2.4vw,21px); font-weight:800; letter-spacing:-.01em; margin:0 0 2px; color:var(--es-text); }
.es-head .es-sub { font-size:12.5px; color:var(--es-text-dim); margin:0; }
.es-head .es-head-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.es-head .es-updated { font-size:11px; color:var(--es-text-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* Layout */
.es-layout { display:flex; gap:18px; align-items:flex-start; min-width:0; }
.es-nav {
  width:220px; flex-shrink:0; padding:8px;
  background:var(--es-surface); border:1px solid var(--es-border);
  border-radius:var(--es-r-lg);
  position:sticky; top:calc(var(--es-topbar) + 12px);
  max-height:calc(100dvh - var(--es-topbar) - 32px);
  overflow-y:auto; display:flex; flex-direction:column; gap:2px;
  scrollbar-width:thin;
}
.es-tab {
  display:flex; align-items:center; gap:9px;
  padding:9px 10px; min-height:40px;
  border-radius:var(--es-r-sm);
  background:transparent; color:var(--es-text-dim);
  font-size:12.5px; font-weight:600;
  border:none; cursor:pointer; font-family:inherit;
  text-align:left; white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; position:relative;
  transition:background 120ms, color 120ms;
}
.es-tab i { width:15px; text-align:center; flex-shrink:0; }
.es-tab .es-tab-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.es-tab[aria-selected="true"] {
  background:var(--es-gold-soft); color:var(--es-brand-deep);
  border:1px solid rgba(245,166,35,.35);
}
html.dark .es-tab[aria-selected="true"] {
  background:rgba(245,166,35,.16); color:#ffd899; border-color:rgba(245,166,35,.32);
}
.es-tab .es-tab-badge {
  background:var(--es-danger); color:#fff;
  font-size:10px; font-weight:800;
  min-width:18px; height:18px; padding:0 5px;
  border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center;
  margin-left:auto;
}
.es-tab-badge[hidden] { display:none !important; }

.es-panels { flex:1; min-width:0; }
.es-panel { display:none; min-width:0; }
.es-panel.es-active { display:block; }

/* Card */
.es-card {
  background:var(--es-surface);
  border:1px solid var(--es-border);
  border-radius:var(--es-r-lg);
  box-shadow:0 1px 3px rgba(8,42,51,.06);
  padding:16px 18px; min-width:0; margin-bottom:14px;
}
.es-card:last-child { margin-bottom:0; }
.es-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; min-width:0; }
.es-card-head > h3 { margin:0; font-size:13px; font-weight:800; display:inline-flex; align-items:center; gap:7px; color:var(--es-text); }
.es-card-head > h3 i { color:var(--es-text-dim); }
.es-card-head .es-card-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }

/* KPI */
.es-kpi-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
.es-kpi { padding:12px 13px; background:var(--es-surface); border:1px solid var(--es-border); border-radius:var(--es-r-md); min-width:0; }
.es-kpi .es-k { display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--es-text-dim); margin-bottom:4px; }
.es-kpi .es-v { font-size:clamp(18px,2.4vw,22px); font-weight:800; color:var(--es-text); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; line-height:1.15; }
.es-kpi .es-v.es-num-null { color:var(--es-text-faint); }
.es-kpi .es-v.es-color-success { color:var(--es-success); }
.es-kpi .es-v.es-color-warn    { color:var(--es-warn); }
.es-kpi .es-v.es-color-danger  { color:var(--es-danger); }
.es-kpi .es-v.es-color-info    { color:var(--es-info); }
.es-kpi .es-v.es-color-purple  { color:var(--es-purple); }

/* Segmented control */
.es-seg { display:inline-flex; padding:3px; gap:2px; background:var(--es-bg-alt); border:1px solid var(--es-border); border-radius:99px; max-width:100%; overflow-x:auto; scrollbar-width:none; }
.es-seg::-webkit-scrollbar { display:none; }
.es-seg button { border:none; background:transparent; padding:7px 12px; min-height:32px; font-size:12px; font-weight:600; color:var(--es-text-dim); border-radius:99px; cursor:pointer; font-family:inherit; white-space:nowrap; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.es-seg button[aria-pressed="true"] { background:var(--es-brand); color:#fff; }
html.dark .es-seg button[aria-pressed="true"] { background:var(--es-gold); color:#07202a; }

/* Buttons */
.es-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 12px; min-height:38px; border:1px solid var(--es-border); background:var(--es-surface); color:var(--es-text); border-radius:var(--es-r-sm); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background 120ms, border-color 120ms; }
.es-btn:disabled { opacity:.5; cursor:not-allowed; }
.es-btn.es-btn-primary { background:var(--es-brand); color:#fff; border-color:var(--es-brand); }
.es-btn.es-btn-danger  { background:var(--es-danger); color:#fff; border-color:var(--es-danger); }
.es-btn.es-btn-ghost   { background:transparent; }
.es-btn.es-btn-sm { padding:5px 9px; font-size:11.5px; min-height:32px; border-radius:7px; }
.es-btn.es-btn-icon { padding:6px 8px; min-width:34px; }
@media (pointer: coarse) {
  .es-btn, .es-btn.es-btn-sm { min-height:44px; }
  .es-btn.es-btn-icon { min-width:44px; }
  .es-tab { min-height:44px; }
  .es-seg button { min-height:44px; }
}

/* Filters - FIXED FOR MOBILE */
.es-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
.es-filters > input, .es-filters > select { min-height:44px; padding:8px 11px; border:1px solid var(--es-border); background:var(--es-surface); color:var(--es-text); border-radius:var(--es-r-sm); font-size:16px; font-family:inherit; min-width:0; }
@media (min-width:901px) { .es-filters > input, .es-filters > select { font-size:13px; min-height:40px; } }
.es-filters > input[type="search"] { flex:1 1 240px; }
.es-filters > input[type="date"]   { flex:0 1 150px; }
.es-filters > select               { flex:0 1 160px; }
.es-filters .es-filter-actions { display:flex; gap:6px; flex-wrap:wrap; }

@media (max-width: 900px) {
  .es-filters { flex-direction:column; align-items:stretch; }
  .es-filters > input, .es-filters > select, .es-filters .es-filter-actions .es-btn { 
    flex: 0 0 auto !important; width: 100% !important; max-width: 100%;
  }
  .es-filters .es-filter-actions { flex-direction:column; }
}

/* Tables */
.es-table-wrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--es-r-md); }
.es-table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:900px; }
.es-table th { text-align:left; padding:10px 12px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--es-text-faint); background:var(--es-bg-alt); border-bottom:1px solid var(--es-border); white-space:nowrap; position:sticky; top:0; z-index:1; }
.es-table td { padding:10px 12px; border-bottom:1px solid var(--es-border); vertical-align:middle; overflow-wrap:anywhere; }
.es-table tr[data-open-id] { cursor:pointer; }
.es-table tr[data-open-id]:focus-visible { outline:2px solid var(--es-gold); outline-offset:-2px; }
@media (hover:hover) { .es-table tr[data-open-id]:hover { background:rgba(245,166,35,.05); } }
.es-table tr:last-child td { border-bottom:none; }
.es-table .es-cell-amount { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.es-table .es-cell-mono { font-family:'JetBrains Mono', monospace; font-size:11.5px; }

/* Badges */
.es-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; font-size:10.5px; font-weight:700; border-radius:99px; border:1px solid transparent; white-space:nowrap; line-height:1.4; }
.es-badge.es-success { background:var(--es-success-bg); color:var(--es-success); border-color:var(--es-success-bd); }
.es-badge.es-danger  { background:var(--es-danger-bg);  color:var(--es-danger);  border-color:var(--es-danger-bd); }
.es-badge.es-warn    { background:var(--es-warn-bg);    color:var(--es-warn);    border-color:var(--es-warn-bd); }
.es-badge.es-info    { background:var(--es-info-bg);    color:var(--es-info);    border-color:var(--es-info-bd); }
.es-badge.es-purple  { background:var(--es-purple-bg);  color:var(--es-purple);  border-color:var(--es-purple-bd); }
.es-badge.es-neutral { background:var(--es-bg); color:var(--es-text-dim); border-color:var(--es-border); }

/* States */
.es-state { padding:26px 14px; text-align:center; color:var(--es-text-faint); font-size:12.5px; }
.es-state.es-error { color:var(--es-danger); }
.es-state.es-error .es-rid { display:block; margin-top:6px; font-size:10.5px; font-family:'JetBrains Mono', monospace; color:var(--es-text-faint); overflow-wrap:anywhere; }
.es-state .es-state-icon { font-size:22px; margin-bottom:6px; opacity:.6; display:block; }
.es-state .es-state-action { margin-top:10px; }

/* Skeletons */
.es-skel-row { height:44px; border-radius:8px; margin-top:6px; }
.es-skel-kpi { height:78px; border-radius:var(--es-r-md); }
.es-skel { background:linear-gradient(90deg, var(--es-bg-alt) 25%, rgba(255,255,255,.55) 50%, var(--es-bg-alt) 75%); background-size:200% 100%; animation:es-shimmer 1.4s infinite; }
html.dark .es-skel { background:linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.10) 50%, rgba(255,255,255,.04) 75%); background-size:200% 100%; }
@keyframes es-shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

/* Pagination */
.es-pg { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 4px 0; font-size:12px; color:var(--es-text-dim); }
.es-pg .es-pg-actions { display:flex; gap:6px; }

/* Provider cards */
.es-bal-card .es-bal-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--es-border); flex-wrap:wrap; min-width:0; }
.es-bal-card .es-bal-row:last-child { border-bottom:none; }
.es-bal-card .es-bal-ccy { font-size:11.5px; font-weight:800; color:var(--es-text-dim); min-width:42px; }
.es-bal-card .es-bal-amount { font-size:clamp(16px,2.4vw,20px); font-weight:800; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.es-bal-card .es-bal-meta { font-size:11px; color:var(--es-text-faint); }
.es-bal-card .es-bal-rawkeys { margin-top:8px; padding:8px 10px; background:var(--es-bg-alt); border:1px dashed var(--es-border); border-radius:8px; font-family:'JetBrains Mono', monospace; font-size:11px; line-height:1.5; color:var(--es-text-dim); overflow-wrap:anywhere; }

.es-pv-pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; border:1px solid transparent; }
.es-pv-pill::before { content:''; width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; }
.es-pv-pill.es-operational { background:var(--es-success-bg); color:var(--es-success); border-color:var(--es-success-bd); }
.es-pv-pill.es-degraded    { background:var(--es-warn-bg);    color:var(--es-warn);    border-color:var(--es-warn-bd); }
.es-pv-pill.es-unreachable { background:var(--es-danger-bg);  color:var(--es-danger);  border-color:var(--es-danger-bd); }
.es-pv-pill.es-not_configured { background:var(--es-bg); color:var(--es-text-dim); border-color:var(--es-border); }
.es-pv-field { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--es-border); font-size:12.5px; min-width:0; }
.es-pv-field:last-child { border-bottom:none; }
.es-pv-field .es-k { color:var(--es-text-dim); font-weight:600; flex-shrink:0; }
.es-pv-field .es-v { font-weight:700; text-align:right; overflow-wrap:anywhere; min-width:0; }

/* ─────────────────────────────────────────────────────────────
   OVERLAY SYSTEM (drawer + modal, single scrim, single stack)
   ───────────────────────────────────────────────────────────── */
.es-overlay-root { position:relative; }

.es-scrim {
  position:fixed; inset:0;
  background:rgba(5,15,20,.55);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  z-index:2000;
  opacity:0; pointer-events:none;
  transition:opacity 200ms ease;
}
.es-scrim.es-show { opacity:1; pointer-events:auto; }

.es-drawer {
  position:fixed; top:0; right:0;
  width:min(680px,100vw); height:100dvh;
  background:var(--es-bg); color:var(--es-text);
  z-index:2010; box-shadow:var(--es-shadow-lg);
  transform:translateX(100%);
  transition:transform 240ms cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
  overflow:hidden;
  padding-bottom:var(--es-safe-bottom);
}
.es-drawer.es-open { transform:translateX(0); }
.es-dh {
  display:flex; align-items:center; gap:12px;
  padding:16px 18px;
  background:linear-gradient(135deg, var(--es-brand-deep), var(--es-brand));
  color:#eaf6f8; flex-shrink:0;
  padding-top:calc(16px + var(--es-safe-top));
}
.es-dh .es-dh-icon {
  width:38px; height:38px; border-radius:10px;
  background:rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.es-dh .es-dh-titles { flex:1; min-width:0; }
.es-dh .es-dh-titles h2 {
  margin:0; font-size:15.5px; font-weight:800;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.es-dh .es-dh-sub {
  font-size:11.5px; color:rgba(255,255,255,.7);
  margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.es-dh .es-close {
  width:40px; height:40px;
  border-radius:10px; border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10);
  color:#fff; cursor:pointer;
  display:grid; place-items:center;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.es-dh .es-close:hover { background:rgba(255,255,255,.20); }
.es-db {
  flex:1; overflow-y:auto; min-height:0;

}
.es-dh-actions {

.es-dh-hero {

.es-dh-title {

}

.es-dh-field .es-k {
  color:var(--es-text-dim); font-weight:600;

}
.es-dh-field .es-v {
  font-weight:700; text-align:right;

}
.es-dh-note {
  margin-top:8px; padding:8px 10px;
  border-radius:8px; background:var(--es-warn-bg); color:var(--es-warn);

}

.es-dh-copy {
  display:flex; align-items:center; gap:8px;

}
.es-dh-copy .es-v { flex:1; min-width:0; overflow-wrap:anywhere; word-break:break-all; }
.es-dh-copy .es-btn { flex-shrink:0; }

.es-qr { display:inline-block; padding:10px; background:#fff; border:1px solid var(--es-border); border-radius:10px; margin-top:6px; }
.es-qr img { display:block; max-width:100%; height:auto; image-rendering:pixelated; }

/* MODALS - FIXED FOR IOS */
.es-modal {
  position:fixed; inset:0;
  z-index:2020;
  display:none;
  align-items:center; justify-content:center;
  padding:16px;
  padding-top:calc(16px + var(--es-safe-top));
  padding-bottom:calc(16px + var(--es-safe-bottom));

.es-modal.es-show { display:flex; }
.es-modal-card {
  background:var(--es-bg); color:var(--es-text);
  border-radius:var(--es-r-lg);
  box-shadow:var(--es-shadow-lg);
  width:min(520px,100%);

  overflow:hidden;
}
.es-modal-head {
  display:flex; align-items:center; justify-content:space-between;

}
.es-modal-head h3 { margin:0; font-size:14.5px; font-weight:800; overflow-wrap:anywhere; }
.es-modal-head .es-close {

.es-modal-body label {

.es-modal-body input, .es-modal-body select, .es-modal-body textarea {

}
@media (min-width:901px) { .es-modal-body input, .es-modal-body select, .es-modal-body textarea { font-size:13px; } }
.es-modal-body textarea { resize:vertical; min-height:76px; line-height:1.5; }
.es-modal-body .es-hint { font-size:11px; color:var(--es-text-faint); margin-top:4px; }
.es-modal-body .es-err {

}

.es-modal-foot {

  flex-wrap:wrap; flex-shrink:0;
}
/* Primary button goes on the bottom on mobile (standard iOS) */
@media (max-width:900px) {
  .es-modal-foot { flex-direction:column; }
  .es-modal-foot .es-btn { width:100%; }
}

.es-toasts {
  position:fixed; bottom:calc(20px + var(--es-safe-bottom)); right:max(20px, calc(20px + var(--es-safe-right)));
  z-index:2030; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 32px); pointer-events:none;
}
.es-toast {
  pointer-events:auto; display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:600;

  background:#0c1f26; color:#fff; border-left:3px solid var(--es-gold); animation:es-toast-in 180ms ease;
}
.es-toast.es-success { border-left-color:var(--es-success); }
.es-toast.es-error   { border-left-color:var(--es-danger); }
.es-toast.es-warn    { border-left-color:var(--es-warn); }
.es-toast.es-info    { border-left-color:var(--es-gold); }
@keyframes es-toast-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

.es-split { display:grid; grid-template-columns:1fr; gap:14px; }
.es-split > * { min-width:0; }
.es-split label { display:block; font-size:11.5px; font-weight:700; color:var(--es-text-dim); text-transform:uppercase; letter-spacing:.05em; margin:10px 0 4px; }
.es-split input[type="text"], .es-split select, .es-split textarea { width:100%; padding:9px 11px; min-height:44px; border:1px solid var(--es-border); background:var(--es-surface); color:var(--es-text); border-radius:var(--es-r-sm); font-size:16px; font-family:inherit; }

.es-prod-logo {

}

.es-sel-all {

}

.es-sel-all .es-count { font-weight:800; color:var(--es-text); }

.es-sticky-import { display:none; }
@media (max-width:900px) {
  .es-sticky-import.es-visible {
    display:flex; align-items:center; gap:8px;
    position:fixed; left:12px; right:12px;
    bottom:calc(12px + var(--es-safe-bottom)); padding:10px 12px;
    background:var(--es-surface); border:1px solid var(--es-border-strong);
    border-radius:var(--es-r-md); box-shadow:var(--es-shadow-lg);

  }

}

@media (max-width:1023px) {
  .es-layout { flex-direction:column; gap:12px; }
  .es-nav {
    width:100%; position:sticky; top:calc(var(--es-topbar) + 6px); z-index:30;
    display:flex; flex-direction:row; gap:4px; padding:6px;
    background:var(--es-surface); border:1px solid var(--es-border);
    border-radius:99px; overflow-x:auto; overflow-y:hidden; max-height:none;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; flex-wrap:nowrap;
  }
  .es-nav::-webkit-scrollbar { display:none; }
  .es-tab {
    flex:0 0 auto; padding:8px 12px; min-height:44px; border-radius:99px;
    border:none; white-space:nowrap;
  }
  .es-tab .es-tab-label { display:inline; }
  .es-tab i { width:auto; }
  .es-tab[aria-selected="true"] { border:none; }
  .es-kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
}

@media (min-width:640px) {
  .es-kpi-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media (min-width:1024px) {
  .es-kpi-grid { grid-template-columns:repeat(6,minmax(0,1fr)); }
  .es-split { grid-template-columns:1fr 1fr; }
}

@media (max-width:900px) {
  .es-table { min-width:0; display:block; }
  .es-table thead { display:none; }
  .es-table tbody { display:block; }
  
  /* THE FIX FOR MOBILE CARDS */
  .es-table tbody tr {
    display:block; padding:12px; margin-bottom:8px;
    background:var(--es-surface); border:1px solid var(--es-border);
    border-radius:var(--es-r-md); position:relative;
    cursor:pointer;
  }
  .es-table tbody tr[data-open-id]:focus-visible { outline:2px solid var(--es-gold); outline-offset:-2px; }
  .es-table tbody td {
    display:block; padding:0; border:0;
    text-align:left !important; font-size:12.5px;
    min-width:0; overflow-wrap:anywhere;
  }
  .es-table tbody td[data-label]::before {
    content:attr(data-label); display:inline-block;
    font-size:10.5px; font-weight:700; color:var(--es-text-dim);
    text-transform:uppercase; letter-spacing:.05em; margin-right:6px;
  }
  .es-table tbody td[data-label] {
    display:flex; justify-content:space-between; align-items:baseline;
    gap:8px; padding:6px 0; border-bottom:1px dashed var(--es-border);
  }
  .es-table tbody td[data-label]:last-child { border-bottom:none; }
  
  /* The primary header row */
  .es-table tbody td[data-primary] {
    display:flex; justify-content:space-between; align-items:center;
    padding:0 0 8px; border-bottom:1px solid var(--es-border); margin-bottom:6px;
  }
  .es-table tbody td[data-primary]::before { display:none; }
  .es-table tbody td[data-primary] .es-ref {
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px; font-weight:700;
    overflow-wrap:anywhere; min-width:0;
  }

  /* Hide the duplicate status cell */
  .es-table tbody td.es-dup { display:none !important; }

  /* Catalog checkbox pinned to the card corner */
  .es-table tbody td[data-label="Select"] {
    position:absolute; top:12px; right:12px; width:auto; padding:0; border:0; z-index:1;
  }
  .es-table tbody td[data-label="Select"]::before { display:none; }
  .es-table tbody td[data-label="Select"] input { width:22px; height:22px; }
  .es-table tbody tr:has(td[data-label="Select"]) td[data-primary] { padding-right:40px; }

  /* Drawer as bottom sheet */
  .es-drawer {
    top:auto; bottom:0; right:0; left:0; width:100vw;
    height:92dvh; border-radius:var(--es-r-xl) var(--es-r-xl) 0 0;
    transform:translateY(100%);
  }
  .es-drawer.es-open { transform:translateY(0); }
  .es-drawer::before {
    content:""; position:absolute; top:8px; left:50%;
    transform:translateX(-50%); width:40px; height:4px;
    border-radius:99px; background:rgba(255,255,255,.45); z-index:2;
  }
  .es-dh { padding-top:calc(20px + var(--es-safe-top)); }

  /* Modal as bottom sheet */
  .es-modal { padding:0; align-items:flex-end; }
  .es-modal-card {
    border-radius:var(--es-r-xl) var(--es-r-xl) 0 0;
    width:100%; max-height:90dvh;
    transform:translateY(0);
    animation:es-sheet-in 240ms cubic-bezier(.4,0,.2,1);
  }
  @keyframes es-sheet-in { from { transform:translateY(100%); } to { transform:translateY(0); } }
  
  .es-toasts {
    top:calc(12px + var(--es-safe-top)); left:12px; right:12px; bottom:auto;
    max-width:none; align-items:center;
  }
  .es-toast { width:100%; }
}

@media (max-width:480px) {
  .es-head h2 { font-size:16px; }
  .es-kpi .es-v { font-size:18px; }
  .es-dh-actions .es-btn { min-width:0; flex:1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .es-scrim, .es-drawer, .es-skel, .es-modal-card { transition:none !important; animation:none !important; }
  .es-toast { animation:none !important; }
}

@media (hover: hover) {
  .es-tab:hover { background:var(--es-bg-alt); color:var(--es-text); }
  .es-tab[aria-selected="true"]:hover { background:var(--es-gold-soft); color:var(--es-brand-deep); }
  .es-btn:hover:not(:disabled) { background:var(--es-bg-alt); }
  .es-btn.es-btn-primary:hover:not(:disabled) { background:var(--es-brand-light); }
}

<body>

<div class="app" id="appRoot"></div>

<script>
'use strict';

const PROVIDER_LABEL = 'DT One';
const API_BASE = '/api/admin/esim';
const CACHE_TTL_MS = 30_000;
const SEARCH_DEBOUNCE_MS = 300;
const ORDER_LIMIT = 25;
const PRODUCT_LIMIT = 50;
const CATALOG_LIMIT = 50;
const HIDDEN_SECTION_IDS = ['overview','orders','catalog','products','pricing','attention','refunds','provider'];

const API = {
  stats:           () => `${API_BASE}/stats`,
  orders:          () => `${API_BASE}/orders`,
  order:           (id) => `${API_BASE}/orders/${encodeURIComponent(id)}`,
  sync:            (id) => `${API_BASE}/orders/${encodeURIComponent(id)}/sync`,
  refund:          (id) => `${API_BASE}/orders/${encodeURIComponent(id)}/refund`,
  review:          (id) => `${API_BASE}/orders/${encodeURIComponent(id)}/review`,
  reveal:          (id) => `${API_BASE}/orders/${encodeURIComponent(id)}/reveal`,
  attention:       () => `${API_BASE}/attention`,
  providerHealth:  (fresh) => `${API_BASE}/provider/health${fresh ? '?fresh=1' : ''}`,
  providerBalances:() => `${API_BASE}/provider/balances`,
  providerCheck:   () => `${API_BASE}/provider/health-check`,
  products:        () => `${API_BASE}/products`,
  productEnabled:  (id) => `${API_BASE}/products/${encodeURIComponent(id)}/enabled`,
  productPricing:  (id) => `${API_BASE}/products/${encodeURIComponent(id)}/pricing`,
  productUpdate:   (id) => `${API_BASE}/products/${encodeURIComponent(id)}`,
  catalog:         () => `${API_BASE}/catalog`,
  import:          () => `${API_BASE}/products/import`,
  preview:         () => `${API_BASE}/pricing/preview`,
  pricingGet:      () => `${API_BASE}/pricing`,
  pricingPut:      () => `${API_BASE}/pricing`,
  refreshCosts:    () => `${API_BASE}/products/refresh-costs`
};

function unwrap(p) {
  return (p && typeof p === 'object' && p.success === true && 'data' in p) ? p.data : p;
}

function debugEnabled() {
  try { return localStorage.getItem('esim_debug') === '1'; } catch (_) { return false; }
}
function debugKeys(label, payload) {
  if (!debugEnabled()) return;
  try {
    const keys = payload && typeof payload === 'object' ? Object.keys(payload) : typeof payload;
    console.log('[esim debug]', label, keys);
  } catch (_) {}
}

const hasMS = (k) => !!(window.MS && typeof window.MS[k] === 'function');
const esc = hasMS('esc')
  ? (s) => MS.esc(s)
  : (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])));

const fmtInt = hasMS('fmtInt')
  ? (v) => MS.fmtInt(v)
  : (v) => (v == null ? '—' : Number(v).toLocaleString('en-US'));

const CCY_SYMBOLS = { NGN: '₦', USD: '$', GHS: 'GH₵', KES: 'KSh', ZAR: 'R', EUR: '€', GBP: '£' };
function fmtMoney(v, ccy) {
  if (v == null || v === '') return '—';
  const s = String(v);
  if (!/^-?\d+(\.\d+)?$/.test(s)) return '—';
  const [i, f = ''] = s.split('.');
  const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const frac = (f + '00').slice(0, 2);
  const c = String(ccy || '').toUpperCase();
  const prefix = CCY_SYMBOLS[c] || (c ? c + ' ' : '');
  return prefix + grouped + '.' + frac;
}

const timeAgo = hasMS('timeAgo') ? (iso) => MS.timeAgo(iso) : (iso) => {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (!Number.isFinite(s) || s < 0) return '—';
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
};

const fmtDateTime = hasMS('fmtDateTime') ? (iso) => MS.fmtDateTime(iso) : (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
};

const debounce = hasMS('debounce') ? (fn, ms) => MS.debounce(fn, ms) : (fn, ms = SEARCH_DEBOUNCE_MS) => {
  let t = null;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
};

const toast = hasMS('toast') ? (m, k) => MS.toast(m, k) : (m, k = 'info') => {
  const root = getOverlayRoot();
  let stack = root.querySelector('.es-toasts');
  if (!stack) { stack = document.createElement('div'); stack.className = 'es-toasts'; root.appendChild(stack); }
  const el = document.createElement('div');
  el.className = 'es-toast es-' + (k || 'info');
  el.textContent = m;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 3600);
};

const copyText = hasMS('copyText') ? (t) => MS.copyText(t) : async (t) => {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove(); return true;
  }
};

function newIdempotencyKey() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'k-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
}

async function api(url, { method = 'GET', body = null, signal = null, idempotency = false } = {}) {
  const opts = { method, signal: signal || undefined };
  if (body != null) {
    opts.body = JSON.stringify(body);
    opts.headers = { 'Content-Type': 'application/json' };
  } else if (method !== 'GET' && method !== 'HEAD') {
    opts.body = '{}';
    opts.headers = { 'Content-Type': 'application/json' };
  }
  if (idempotency) {
    opts.headers = { ...(opts.headers || {}), 'Idempotency-Key': newIdempotencyKey() };
  }

  if (hasMS('api')) {
    const r = await MS.api(url, opts);
    if (r.ok) {
      const data = unwrap(r.data);
      debugKeys(url, data);
      return { ok: true, data };
    }
    return {
      ok: false,
      status: r.status || 0,
      code: r.code || 'UNKNOWN',
      message: r.error || r.message || ('HTTP ' + (r.status || 0)),
      requestId: r.requestId || null,
      aborted: !!r.aborted
    };
  }

  if (!window.AdminSession || typeof window.AdminSession.fetch !== 'function') {
    return { ok: false, status: 0, code: 'NO_SESSION', message: 'Session not loaded' };
  }
  try {
    const res = await AdminSession.fetch(url, opts);
    let json = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      try { json = await res.json(); } catch (_) {}
    }
    if (!res.ok) {
      return {
        ok: false, status: res.status,
        code: (json && json.code) || ('HTTP_' + res.status),
        message: (json && (json.message || json.error)) || 'Request failed',
        requestId: (json && json.request_id) || res.headers.get('X-Request-ID') || res.headers.get('X-Request-Id')
      };
    }
    const data = unwrap(json);
    debugKeys(url, data);
    return { ok: true, data };
  } catch (e) {
    if (e && e.name === 'AbortError') return { ok: false, aborted: true };
    return { ok: false, status: 0, code: 'NETWORK_ERROR', message: e.message || 'Network error' };
  }
}

const _tokens = {};
function nextToken(panel) {
  _tokens[panel] = (_tokens[panel] || 0) + 1;
  return _tokens[panel];
}
function isCurrent(panel, tok) { return _tokens[panel] === tok; }

const _cache = new Map();
function cacheSet(key, data) { _cache.set(key, { at: Date.now(), data }); }
function cacheGet(key) {
  const e = _cache.get(key);
  if (!e) return null;
  if (Date.now() - e.at > CACHE_TTL_MS) { _cache.delete(key); return null; }
  return e.data;
}
function cacheBust(prefix) {
  for (const k of Array.from(_cache.keys())) {
    if (k === prefix || k.startsWith(prefix + ':')) _cache.delete(k);
  }
}

let _overlayRoot = null;
function getOverlayRoot() {
  if (_overlayRoot && document.body.contains(_overlayRoot)) return _overlayRoot;
  _overlayRoot = document.createElement('div');
  _overlayRoot.className = 'es-overlay-root';
  document.body.appendChild(_overlayRoot);
  return _overlayRoot;
}

// Scroll lock
let _lockCount = 0;
let _scrollLock = { active: false, container: null, prevOverflow: '', prevPadRight: '', y: 0 };
function lockPageScroll() {
  _lockCount++;
  if (_lockCount > 1) return;
  if (_scrollLock.active) return; // guard just in case
  const target = (document.scrollingElement && document.scrollingElement.scrollHeight > window.innerHeight)
    ? document.scrollingElement
    : document.body;
  _scrollLock.active = true;
  _scrollLock.container = target;
  _scrollLock.y = window.scrollY || window.pageYOffset || 0;
  _scrollLock.prevOverflow = target.style.overflow;
  _scrollLock.prevPadRight = document.body.style.paddingRight;
  const sbw = window.innerWidth - document.documentElement.clientWidth;
  if (sbw > 0) document.body.style.paddingRight = sbw + 'px';
  target.style.overflow = 'hidden';
  if (target === document.scrollingElement) {
    document.body.style.position = 'fixed';
    document.body.style.top = `-${_scrollLock.y}px`;
    document.body.style.width = '100%';
  }
}
function unlockPageScroll() {
  _lockCount = Math.max(0, _lockCount - 1);
  if (_lockCount > 0) return;
  if (!_scrollLock.active) return;
  const target = _scrollLock.container;
  if (target) target.style.overflow = _scrollLock.prevOverflow || '';
  document.body.style.paddingRight = _scrollLock.prevPadRight || '';
  if (target === document.scrollingElement) {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, _scrollLock.y);
  }
  _scrollLock.active = false;
  _scrollLock.container = null;
}

}

}

function fmtAgeMinutes(min) {
  const n = Number(min);
  if (!Number.isFinite(n) || n < 0) return '—';
  if (n < 60) return `${n}m`;
  if (n < 1440) return `${Math.floor(n / 60)}h`;
  return `${Math.floor(n / 1440)}d`;
}

function pctToDecimal(input) {
  const s = String(input == null ? '' : input).trim();
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  const [ip, fp = ''] = s.split('.');
  const paddedIp = ip.padStart(3, '0');
  const whole = paddedIp.slice(0, -2).replace(/^0+(?=\d)/, '');
  const frac = (paddedIp.slice(-2) + fp + '0000').slice(0, 4);
  return whole + '.' + frac;
}
function decimalToPct(input) {
  const s = String(input == null ? '' : input).trim();
  if (!/^-?\d+(\.\d+)?$/.test(s)) return '';
  const neg = s.startsWith('-');
  const body = neg ? s.slice(1) : s;
  const [ip = '0', fp = ''] = body.split('.');
  const frac = (fp + '0000').slice(0, 4);
  const whole = (ip + frac.slice(0, 2)).replace(/^0+(?=\d)/, '');
  const tail = frac.slice(2).replace(/0+$/, '');
  const out = tail ? `${whole}.${tail}` : whole;
  return (neg ? '-' : '') + (out === '' ? '0' : out);
}

function openSection(section, { fromBoot = false } = {}) {
  if (!HIDDEN_SECTION_IDS.includes(section)) return;
  State.section = section;
  document.querySelectorAll('.es-tab').forEach((t) => {
    const on = t.dataset.section === section;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    if (on && t.parentElement && t.parentElement.scrollWidth > t.parentElement.clientWidth) {
      const nav = t.parentElement;
      const target = t.offsetLeft - 8;
      nav.scrollLeft = Math.max(0, target);
    }
  });
  document.querySelectorAll('.es-panel').forEach((p) => {
    p.classList.toggle('es-active', p.id === `panel-${section}`);
  });
  if (!fromBoot) {
    try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (_) { window.scrollTo(0, 0); }
  }
  refreshSection(section);
}

function refreshSection(section, { force = false } = {}) {
  switch (section) {
    case 'overview':  return loadOverview({ force });
    case 'orders':    return loadOrders({ force });
    case 'catalog':   return loadCatalog({ force });
    case 'products':  return loadProducts({ force });
    case 'pricing':   return loadPricing({ force });
    case 'attention': return loadAttention({ force });
    case 'refunds':   return loadRefunds({ force });
    case 'provider':  return loadProviderPanel({ force });
  }
}

async function loadProviderBalanceInto(el, { force = false } = {}) {
  if (!el) return;
  const tok = nextToken('balances:' + (el.id || 'x'));
  const cached = force ? null : cacheGet('balances');
  if (!cached) el.innerHTML = skelRows(2);

  let result = cached;
  if (!result) {
    const r = await api(API.providerBalances());
    if (!isCurrent('balances:' + (el.id || 'x'), tok)) return;
    if (!r.ok) {
      renderErrorState(el, r.message, r.requestId, () => loadProviderBalanceInto(el, { force: true }));
      return;
    }
    result = r.data;
    cacheSet('balances', result);
  }

  if (result && result.error) {
    renderErrorState(el, result.error, null, () => loadProviderBalanceInto(el, { force: true }));
    return;
  }

  const balances = Array.isArray(result.balances) ? result.balances : [];
  const showRaw = el.dataset.showRawkeys === '1';
  const fetchedAt = result.fetchedAt ? new Date(result.fetchedAt) : null;

  if (!balances.length) {
    el.innerHTML = `
      <div class="es-state">
        <i class="fas fa-wallet es-state-icon"></i>
        <div>Provider returned no balances</div>
        ${fetchedAt ? `<div class="es-bal-meta" style="margin-top:6px">Fetched ${esc(fetchedAt.toLocaleTimeString())}</div>` : ''}
      </div>`;
    return;
  }

  const rows = balances.map((b) => {
    const currency = b.currency || '—';
    const available = b.available ?? b.amount ?? null;
    const amount = b.amount ?? null;
    const reserved = b.reserved ?? null;
    const showAmount = amount != null && available != null && String(amount) !== String(available);
    const showReserved = reserved != null && String(reserved) !== '0';
    const metaBits = [];
    if (showAmount)   metaBits.push(`Total ${fmtMoney(amount, currency)}`);
    if (showReserved) metaBits.push(`Reserved ${fmtMoney(reserved, currency)}`);
    return `
      <div class="es-bal-row">
        <div>
          <div class="es-bal-ccy">${esc(currency)}</div>
          <div class="es-bal-amount">${available != null ? fmtMoney(available, currency) : '—'}</div>
          ${metaBits.length ? `<div class="es-bal-meta">${metaBits.map(esc).join(' · ')}</div>` : ''}
        </div>
        ${showRaw && Array.isArray(b.rawKeys) && b.rawKeys.length
          ? `<div class="es-bal-rawkeys">rawKeys: ${esc(b.rawKeys.join(', '))}</div>`
          : ''}
      </div>`;
  }).join('');

  el.innerHTML = `
    ${rows}
    <div class="es-bal-meta" style="margin-top:6px">
      ${fetchedAt ? `Updated ${esc(fetchedAt.toLocaleTimeString())}` : ''}
      ${result.latencyMs != null ? ` · ${fmtInt(result.latencyMs)} ms` : ''}
    </div>`;
}

      openOrder(tr.dataset.openId, tr);

      if (e.key === 'Enter' || e.key === ' ') {

        openOrder(tr.dataset.openId, tr);
      }
    });
  });
}

function bindOrders() {
  const search = document.getElementById('esOrderSearch');
  if (search) {
    search.addEventListener('input', debounce(() => {
      State.orderFilters.search = search.value.trim();
      State.orderPage = 1;
      cacheBust('orders');
      loadOrders({ force: true });
    }, SEARCH_DEBOUNCE_MS));
  }
  const apply = document.getElementById('esOrderApply');
  if (apply) apply.addEventListener('click', () => {
    State.orderFilters = {
      search: document.getElementById('esOrderSearch').value.trim(),
      status: document.getElementById('esOrderStatus').value,
      delivery_status: document.getElementById('esOrderDelivery').value,
      country: document.getElementById('esOrderCountry').value.trim().toUpperCase(),
      from: document.getElementById('esOrderFrom').value,
      to: document.getElementById('esOrderTo').value
    };
    State.orderPage = 1;
    cacheBust('orders');
    loadOrders({ force: true });
  });
  const clear = document.getElementById('esOrderClear');
  if (clear) clear.addEventListener('click', () => {
    document.getElementById('esOrderSearch').value = '';
    document.getElementById('esOrderStatus').value = 'all';
    document.getElementById('esOrderDelivery').value = 'all';
    document.getElementById('esOrderCountry').value = '';
    document.getElementById('esOrderFrom').value = '';
    document.getElementById('esOrderTo').value = '';
    State.orderFilters = { search: '', status: 'all', delivery_status: 'all', country: '', from: '', to: '' };
    State.orderPage = 1;
    cacheBust('orders');
    loadOrders({ force: true });
  });
  const prev = document.getElementById('esOrdersPrev');
  const next = document.getElementById('esOrdersNext');
  if (prev) prev.addEventListener('click', () => {
    if (State.orderPage > 1) { State.orderPage--; loadOrders(); }
  });
  if (next) next.addEventListener('click', () => {
    if (State.orderPage < State.orderTotalPages) { State.orderPage++; loadOrders(); }
  });
}

function buildOrdersQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.orderPage));
  q.set('limit', String(ORDER_LIMIT));
  const f = State.orderFilters;
  if (f.search) q.set('search', f.search);
  if (f.status && f.status !== 'all') q.set('status', f.status);
  if (f.delivery_status && f.delivery_status !== 'all') q.set('delivery_status', f.delivery_status);
  if (f.country) q.set('country', f.country);
  if (f.from) q.set('from', f.from);
  if (f.to) q.set('to', f.to);
  return q.toString();
}

    const r = await api(API.orders() + '?' + buildOrdersQuery());
    if (!isCurrent('orders', tok)) return;
    if (!r.ok) {
      renderErrorState(el, r.message, r.requestId, () => loadOrders({ force: true }));
      return;
    }
    data = r.data;
    cacheSet(cacheKey, data);
  }
  const rows = data.orders || [];
  State.orderTotalPages = data.totalPages || 1;
  State.orderCount = data.count || 0;
  if (!rows.length) {
    renderEmptyState(el, 'fa-inbox', 'No orders match this filter');

            const usd = paidUSDNote(o);
            return `
              <tr tabindex="0" data-open-id="${esc(o.id)}" aria-label="Open order ${esc(o.reference)}">
                <td data-label="Reference" class="es-cell-mono" data-primary>
                  <span class="es-ref">${esc(o.reference || '—')}</span>
                  <span class="es-badge ${statusBadgeClass(o.status)}">${esc(o.status || '—')}</span>
                </td>
                <td data-label="Customer">${esc((o.user && o.user.username) || '—')}<div style="font-size:11px;color:var(--es-text-faint)">${esc((o.user && o.user.email) || '')}</div></td>
                <td data-label="Country">${esc(o.country_name || o.country_iso3 || '—')}</td>
                <td data-label="Plan">${esc(o.plan_name || '—')}</td>
                <td data-label="Paid" class="es-cell-amount">
                  ${paidLabel(o)}
                  ${usd ? `<div style="font-size:11px;color:var(--es-text-faint)">${esc(usd)}</div>` : ''}
                </td>
                <td data-label="Status" class="es-dup"><span class="es-badge ${statusBadgeClass(o.status)}">${esc(o.status || '—')}</span></td>
                <td data-label="Delivery">${o.delivery_status ? `<span class="es-badge ${deliveryBadgeClass(o.delivery_status)}">${esc(o.delivery_status)}</span>` : '—'}</td>
                <td data-label="Created" title="${esc(fmtDateTime(o.created_at))}">${esc(timeAgo(o.created_at))}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  wireRowOpen(el);

  const start = (State.orderPage - 1) * ORDER_LIMIT + 1;
  const end = Math.min(State.orderPage * ORDER_LIMIT, State.orderCount);
  document.getElementById('esOrdersPageInfo').textContent =
    `Showing ${start} to ${end} of ${State.orderCount}`;
  document.getElementById('esOrdersPrev').disabled = State.orderPage <= 1;
  document.getElementById('esOrdersNext').disabled = State.orderPage >= State.orderTotalPages;
  markUpdated();
}

function buildDrawerOverlay() {
  const root = getOverlayRoot();
  if (!root.querySelector('.es-drawer')) {
    const scrim = document.createElement('div');
    scrim.className = 'es-scrim';
    scrim.setAttribute('aria-hidden', 'true');
    scrim.addEventListener('click', closeDrawer);
    root.appendChild(scrim);

    const drawer = document.createElement('aside');
    drawer.className = 'es-drawer';
    drawer.setAttribute('role', 'dialog');
    drawer.setAttribute('aria-modal', 'true');
    drawer.setAttribute('aria-labelledby', 'esDrawerTitle');
    drawer.innerHTML = `
      <div class="es-dh">
        <div class="es-dh-icon"><i class="fas fa-sim-card"></i></div>
        <div class="es-dh-titles">
          <h2 id="esDrawerTitle">Order</h2>
          <div class="es-dh-sub" id="esDrawerSub"></div>
        </div>
        <button type="button" class="es-close" aria-label="Close" data-close-drawer><i class="fas fa-xmark"></i></button>
      </div>
      <div class="es-db" id="esDrawerBody"></div>
      <div class="es-dh-actions" id="esDrawerActions"></div>
    `;
    drawer.querySelector('[data-close-drawer]').addEventListener('click', closeDrawer);
    root.appendChild(drawer);
  }
}
function drawerEls() {
  const root = getOverlayRoot();
  return {
    scrim: root.querySelector('.es-scrim'),
    drawer: root.querySelector('.es-drawer'),
    body: root.querySelector('#esDrawerBody'),
    title: root.querySelector('#esDrawerTitle'),
    sub: root.querySelector('#esDrawerSub'),
    actions: root.querySelector('#esDrawerActions')
  };
}

async function openOrder(id, opener) {
  if (!id) return;
  buildDrawerOverlay();
  const els = drawerEls();
  State.currentOrderId = id;
  State.drawerOpener = opener || document.activeElement;

  els.title.textContent = 'Loading…';
  els.sub.textContent = '';
  els.body.innerHTML = skelRows(6);
  els.actions.innerHTML = '';

  const wasOpen = els.drawer.classList.contains('es-open');
  els.scrim.classList.add('es-show');
  els.drawer.classList.add('es-open');
  if (!wasOpen) lockPageScroll();
  
  setTimeout(() => {
    const close = els.drawer.querySelector('[data-close-drawer]');
    if (close) close.focus({ preventScroll: true });
  }, 40);

  const tok = nextToken('drawer');
  const r = await api(API.order(id));
  if (!isCurrent('drawer', tok)) return;
  if (!r.ok) {
    renderErrorState(els.body, r.message, r.requestId, () => openOrder(id, opener));
    return;
  }
  renderOrderDrawer(r.data);
}

function closeDrawer() {
  const els = drawerEls();
  if (!els.drawer) return;
  els.drawer.classList.remove('es-open');
  els.scrim.classList.remove('es-show');
  unlockPageScroll();
  State.currentOrderId = null;
  const opener = State.drawerOpener;
  State.drawerOpener = null;
  if (opener && document.body.contains(opener) && typeof opener.focus === 'function') {
    setTimeout(() => opener.focus({ preventScroll: true }), 0);
  }
}

      <div class="es-dh-field"><span class="es-k">Has QR</span><span class="es-v">${o.has_qr ? '<span class="es-badge es-success">Yes</span>' : '<span class="es-badge es-neutral">No</span>'}</span></div>

    </div>`;

  const ledgerSection = led.length ? `
    <div class="es-dh-section">
      <h4 class="es-dh-title">Ledger</h4>
      ${led.map((e) => `
        <div class="es-dh-field">
          <span class="es-k">${esc(e.entry_type || '')} ${esc(e.currency || '')}</span>
          <span class="es-v">${fmtMoney(e.amount, e.currency)} · after ${fmtMoney(e.balance_after, e.currency)}</span>
        </div>`).join('')}
    </div>` : '';

  const timelineSection = timeline.length ? `
    <div class="es-dh-section">
      <h4 class="es-dh-title">Timeline</h4>
      ${timeline.map((t) => `<div class="es-dh-field"><span class="es-k">${esc(t.label)}</span><span class="es-v" style="font-weight:500;color:var(--es-text-dim)">${esc(fmtDateTime(t.at))}</span></div>`).join('')}
    </div>` : '';

  const st = String(o.status || '').toLowerCase();
  const needsReviewFirst = ['processing', 'pending', 'delivery_pending'].includes(st)
    && String(o.refund_status || '').toLowerCase() === 'failed';
  const refundHint = needsReviewFirst ? `
    <div class="es-dh-note">
      <strong>Refund failed:</strong> ${esc(o.refund_error || 'No reason recorded')}
      <div>Mark the order for manual review first, then refund.</div>
      <button type="button" class="es-btn es-btn-sm es-btn-primary" data-hint-review>Mark for manual review</button>
    </div>` : '';

  els.body.innerHTML = hero + customerSection + purchaseSection + financialSection + providerSection + deliverySection + refundHint + ledgerSection + timelineSection;

  const revealBtn = els.body.querySelector('[data-reveal]');
  if (revealBtn) revealBtn.addEventListener('click', () => revealActivation(o.id));
  const hintBtn = els.body.querySelector('[data-hint-review]');
  if (hintBtn) hintBtn.addEventListener('click', () => doReview(o));

  els.actions.innerHTML = buildDrawerActions(o);
  const syncBtn = els.actions.querySelector('[data-action-sync]');
  if (syncBtn) syncBtn.addEventListener('click', () => doSync(o));
  const refundBtn = els.actions.querySelector('[data-action-refund]');
  if (refundBtn) refundBtn.addEventListener('click', () => doRefund(o));
  const reviewBtn = els.actions.querySelector('[data-action-review]');
  if (reviewBtn) reviewBtn.addEventListener('click', () => doReview(o));
}

function buildDrawerActions(o) {
  const st = String(o.status || '').toLowerCase();
  const btns = [];
  if (st !== 'completed' && st !== 'refunded') {
    btns.push(`<button type="button" class="es-btn" data-action-sync><i class="fas fa-sync"></i> Sync</button>`);
  }
  if (['failed', 'cancelled', 'manual_review'].includes(st)) {
    btns.push(`<button type="button" class="es-btn es-btn-danger" data-action-refund><i class="fas fa-rotate-left"></i> Refund</button>`);
  }
  if (['pending', 'processing', 'delivery_pending'].includes(st)) {
    btns.push(`<button type="button" class="es-btn" data-action-review><i class="fas fa-clipboard-check"></i> Review</button>`);
  }
  return btns.join('');
}

async function doSync(o) {
  const r = await api(API.sync(o.id), { method: 'POST', body: {}, idempotency: true });
  if (!r.ok) { toast(r.message || 'Sync failed', 'error'); return; }
  const resolved = r.data && r.data.resolved ? r.data.resolved : 'unknown';
  toast(`Synced: ${resolved}`, 'success');
  cacheBust('overview'); cacheBust('orders'); cacheBust('recent'); cacheBust('attention'); cacheBust('refunds');
  openOrder(o.id, State.drawerOpener);
  refreshSection(State.section, { force: true });
}

async function doRefund(o) {
  const modal = openModal({
    title: 'Refund eSIM order',
    body: `
      <p style="font-size:12.5px;color:var(--es-text-dim);line-height:1.5">Credits the customer's wallet and marks the order refunded. The original debit is unchanged.</p>
      <label for="esRefundReason">Reason (required, min 4 chars)</label>
      <textarea id="esRefundReason" rows="3"></textarea>
      <div class="es-err" id="esRefundErr"></div>
    `,
    confirmLabel: 'Refund',
    confirmKind: 'danger'
  });
  modal.onConfirm(async () => {
    const reason = (document.getElementById('esRefundReason').value || '').trim();
    const errEl = document.getElementById('esRefundErr');
    errEl.classList.remove('es-show');
    if (reason.length < 4) {
      errEl.textContent = 'Reason must be at least 4 characters.';
      errEl.classList.add('es-show');
      return false;
    }
    const r = await api(API.refund(o.id), { method: 'POST', body: { reason }, idempotency: true });
    if (!r.ok) {
      errEl.textContent = r.message || 'Refund failed.';
      errEl.classList.add('es-show');
      return false;
    }
    toast(r.data && r.data.refund && r.data.refund.already_refunded ? 'Already refunded' : 'Refund applied', 'success');
    cacheBust('overview'); cacheBust('orders'); cacheBust('recent'); cacheBust('attention'); cacheBust('refunds');
    setTimeout(() => {
      openOrder(o.id, State.drawerOpener);
      refreshSection(State.section, { force: true });
    }, 100);
    return true;
  });
}

async function revealActivation(id) {

function openModal({ title, body, confirmLabel = 'Confirm', confirmKind = 'primary' }) {
  const root = getOverlayRoot();
  const card = document.createElement('div');
  card.className = 'es-modal es-show';
  card.innerHTML = `
    <div class="es-modal-card" role="dialog" aria-modal="true" aria-labelledby="esModalTitle">
      <div class="es-modal-head">
        <h3 id="esModalTitle">${esc(title || 'Confirm')}</h3>
        <button type="button" class="es-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="es-modal-body">${body || ''}</div>
      <div class="es-modal-foot">
        <button type="button" class="es-btn es-btn-ghost" data-modal-cancel>Cancel</button>
        <button type="button" class="es-btn ${confirmKind === 'danger' ? 'es-btn-danger' : 'es-btn-primary'}" data-modal-confirm>${esc(confirmLabel)}</button>
      </div>
    </div>`;
  root.appendChild(card);
  lockPageScroll();
  State.modalStack.push(card);

  let onConfirm = null;
  const close = () => {
    card.remove();
    unlockPageScroll();
    const idx = State.modalStack.indexOf(card);
    if (idx >= 0) State.modalStack.splice(idx, 1);
  };
  card.querySelector('[data-modal-cancel]').addEventListener('click', close);
  card.querySelector('.es-close').addEventListener('click', close);
  card.addEventListener('click', (e) => { if (e.target === card) close(); });
  card.querySelector('[data-modal-confirm]').addEventListener('click', async () => {
    if (typeof onConfirm !== 'function') { close(); return; }
    const btn = card.querySelector('[data-modal-confirm]');
    btn.disabled = true;
    try {
      const ok = await onConfirm();
      if (ok) close();
    } finally { btn.disabled = false; }
  });

  setTimeout(() => {
    const i = card.querySelector('input, textarea, select');
    if (i) i.focus({ preventScroll: true });
  }, 40);

  return {
    close,
    onConfirm: (fn) => { onConfirm = fn; }
  };
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const modal = State.modalStack[State.modalStack.length - 1];
  if (modal) {
    modal.remove();
    unlockPageScroll();
    State.modalStack.pop();
    return;
  }
  const els = drawerEls();
  if (els.drawer && els.drawer.classList.contains('es-open')) {
    closeDrawer();
  }
});

function bindCatalog() {
  const apply = document.getElementById('esCatApply');
  if (apply) apply.addEventListener('click', () => {
    State.catalogFilters = {
      search: document.getElementById('esCatSearch').value.trim(),
      country: document.getElementById('esCatCountry').value.trim().toUpperCase(),
      coverage: document.getElementById('esCatCoverage').value,
      hide_imported: document.getElementById('esCatHideImported').checked
    };
    State.catalogPage = 1;
    cacheBust('catalog');
    loadCatalog({ force: true });
  });
  const clear = document.getElementById('esCatClear');
  if (clear) clear.addEventListener('click', () => {
    document.getElementById('esCatSearch').value = '';
    document.getElementById('esCatCountry').value = '';
    document.getElementById('esCatCoverage').value = '';
    document.getElementById('esCatHideImported').checked = false;
    State.catalogFilters = { search: '', country: '', coverage: '', hide_imported: false };
    State.catalogPage = 1;
    cacheBust('catalog');
    loadCatalog({ force: true });
  });
  const search = document.getElementById('esCatSearch');
  if (search) {
    search.addEventListener('input', debounce(() => {
      State.catalogFilters.search = search.value.trim();
      State.catalogPage = 1;
      cacheBust('catalog');
      loadCatalog({ force: true });
    }, SEARCH_DEBOUNCE_MS));
  }
  const selAll = document.getElementById('esCatSelectAll');
  if (selAll) selAll.addEventListener('change', () => {
    State.catalogRows.forEach((r) => {
      if (r.alreadyImported) return;
      if (selAll.checked) State.catalogSelected.add(String(r.providerProductId));
      else State.catalogSelected.delete(String(r.providerProductId));
    });
    document.querySelectorAll('#esCatBody input[data-cat-cb]').forEach((cb) => {
      if (cb.disabled) return;
      cb.checked = State.catalogSelected.has(String(cb.dataset.catCb));
    });
    updateCatalogSelectionUI();
  });
  const importBtn = document.getElementById('esCatImportBtn');
  if (importBtn) importBtn.addEventListener('click', openImportModal);
  const stickyBtn = document.getElementById('esCatStickyImportBtn');
  if (stickyBtn) stickyBtn.addEventListener('click', openImportModal);
  const prev = document.getElementById('esCatPrev');
  const next = document.getElementById('esCatNext');
  if (prev) prev.addEventListener('click', () => {
    if (State.catalogPage > 1) { State.catalogPage--; loadCatalog(); }
  });
  if (next) next.addEventListener('click', () => {
    if (State.catalogPage < State.catalogTotalPages) { State.catalogPage++; loadCatalog(); }
  });
}

function buildCatalogQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.catalogPage));
  q.set('limit', String(CATALOG_LIMIT));
  const f = State.catalogFilters;
  if (f.search) q.set('search', f.search);
  if (f.country) q.set('country', f.country);
  if (f.coverage) q.set('coverage', f.coverage);
  if (f.hide_imported) q.set('hide_imported', 'true');
  return q.toString();
}

async function loadCatalog({ force = false } = {}) {
  const el = document.getElementById('esCatBody');
  if (!el) return;
  const tok = nextToken('catalog');
  const cacheKey = 'catalog:' + buildCatalogQuery();
  const cached = force ? null : cacheGet(cacheKey);
  if (!cached) el.innerHTML = skelRows(6);

  let data = cached;
  if (!data) {
    const r = await api(API.catalog() + '?' + buildCatalogQuery());
    if (!isCurrent('catalog', tok)) return;
    if (!r.ok) {
      renderErrorState(el, r.message, r.requestId, () => loadCatalog({ force: true }));
      return;
    }
    data = r.data;
    cacheSet(cacheKey, data);
  }
  const rows = data.products || [];
  State.catalogRows = rows;
  State.catalogTotalPages = data.totalPages || 1;
  const total = data.total || 0;

  const pageIds = new Set(rows.map((r) => String(r.providerProductId)));
  for (const id of Array.from(State.catalogSelected)) {
    if (!pageIds.has(id)) State.catalogSelected.delete(id);
  }

  if (!rows.length) {
    renderEmptyState(el, 'fa-inbox', 'No catalog products for this filter');
  } else {
    el.innerHTML = `
      <div class="es-table-wrap">
        <table class="es-table" role="table">
          <thead>
            <tr>
              <th scope="col" style="width:38px"><span class="es-sr-only">Select</span></th>
              <th scope="col">Plan</th>
              <th scope="col">Coverage</th>
              <th scope="col">Data</th>
              <th scope="col">Validity</th>
              <th scope="col">Wholesale</th>
              <th scope="col">Suggested NGN</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r) => `
              <tr>
                <td data-label="Select">
                  ${r.alreadyImported
                    ? '<i class="fas fa-check" style="color:var(--es-success)" aria-label="Imported"></i>'
                    : `<input type="checkbox" data-cat-cb="${esc(r.providerProductId)}" ${State.catalogSelected.has(String(r.providerProductId)) ? 'checked' : ''} aria-label="Select ${esc(r.planName)}">`}
                </td>
                <td data-label="Plan" data-primary><span class="es-ref">${esc(r.planName || '—')}</span></td>
                <td data-label="Coverage">${esc(r.countryName || r.coverageLabel || r.coverageType || '—')}</td>
                <td data-label="Data">${esc(r.dataDisplay || (r.dataMb != null ? r.dataMb + ' MB' : '—'))}</td>
                <td data-label="Validity">${r.validityDays != null ? esc(r.validityDays + ' days') : '—'}</td>
                <td data-label="Wholesale">${esc(String(r.wholesaleAmount || ''))} ${esc(r.wholesaleCurrency || '')}</td>
                <td data-label="Suggested NGN">${fmtMoney(r.suggestedPriceNgn, 'NGN')}</td>
                <td data-label="Status">${r.alreadyImported ? '<span class="es-badge es-success">Imported</span>' : '<span class="es-badge es-neutral">Not imported</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    el.querySelectorAll('input[data-cat-cb]').forEach((cb) => {
      cb.addEventListener('change', () => {
        if (cb.checked) State.catalogSelected.add(String(cb.dataset.catCb));
        else State.catalogSelected.delete(String(cb.dataset.catCb));
        updateCatalogSelectionUI();
      });
    });
  }
  updateCatalogSelectionUI();

  const start = total === 0 ? 0 : (State.catalogPage - 1) * CATALOG_LIMIT + 1;
  const end = Math.min(State.catalogPage * CATALOG_LIMIT, total);
  document.getElementById('esCatPageInfo').textContent =
    total === 0 ? 'No results' : `Showing ${start} to ${end} of ${total}`;
  document.getElementById('esCatPrev').disabled = State.catalogPage <= 1;
  document.getElementById('esCatNext').disabled = State.catalogPage >= State.catalogTotalPages;
  markUpdated();
}

function updateCatalogSelectionUI() {
  const n = State.catalogSelected.size;
  const btn = document.getElementById('esCatImportBtn');
  const count = document.getElementById('esCatCount');
  const sticky = document.getElementById('esCatStickyImport');
  const stickyCount = document.getElementById('esCatStickyCount');
  if (btn) { btn.disabled = n === 0; btn.innerHTML = `<i class="fas fa-download"></i> Import selected${n ? ' (' + n + ')' : ''}`; }
  if (count) count.textContent = `${n} selected`;
  if (sticky) sticky.classList.toggle('es-visible', n > 0);
  if (stickyCount) stickyCount.textContent = `${n} selected`;
  const selAll = document.getElementById('esCatSelectAll');
  if (selAll) {
    const importable = State.catalogRows.filter((r) => !r.alreadyImported);
    selAll.checked = importable.length > 0 && importable.every((r) => State.catalogSelected.has(String(r.providerProductId)));
  }
}

function openImportModal() {
  if (!State.catalogSelected.size) return;
  const n = State.catalogSelected.size;
  const modal = openModal({
    title: `Import ${n} product${n === 1 ? '' : 's'}`,
    body: `
      <p style="font-size:12.5px;color:var(--es-text-dim);line-height:1.55">Imported products are created disabled. Enable each one after reviewing its pricing.</p>
      <label for="esImportReason">Reason (required, min 4 chars)</label>
      <textarea id="esImportReason" rows="3"></textarea>
      <div class="es-err" id="esImportErr"></div>
    `,
    confirmLabel: 'Import',
    confirmKind: 'primary'
  });
  modal.onConfirm(async () => {
    const reason = (document.getElementById('esImportReason').value || '').trim();
    const errEl = document.getElementById('esImportErr');
    errEl.classList.remove('es-show');
    if (reason.length < 4) {
      errEl.textContent = 'Reason must be at least 4 characters.';
      errEl.classList.add('es-show');
      return false;
    }
    const r = await api(API.import(), {
      method: 'POST',
      body: {
        provider_product_ids: Array.from(State.catalogSelected),
        enable: false,
        reason
      },
      idempotency: true
    });
    if (!r.ok) {
      errEl.textContent = r.message || 'Import failed.';
      errEl.classList.add('es-show');
      return false;
    }
    const imported = (r.data && r.data.imported && r.data.imported.length) || 0;
    toast(`Imported ${imported}`, 'success');
    State.catalogSelected.clear();
    cacheBust('catalog'); cacheBust('products');
    loadCatalog({ force: true });
    return true;
  });
}

function bindProducts() {
  const apply = document.getElementById('esProdApply');
  if (apply) apply.addEventListener('click', () => {
    State.productFilters = {
      search: document.getElementById('esProdSearch').value.trim(),
      enabled: document.getElementById('esProdEnabled').value,
      coverage_type: document.getElementById('esProdCoverage').value
    };
    State.productPage = 1;
    cacheBust('products');
    loadProducts({ force: true });
  });
  const clear = document.getElementById('esProdClear');
  if (clear) clear.addEventListener('click', () => {
    document.getElementById('esProdSearch').value = '';
    document.getElementById('esProdEnabled').value = '';
    document.getElementById('esProdCoverage').value = '';
    State.productFilters = { search: '', enabled: '', coverage_type: '' };
    State.productPage = 1;
    cacheBust('products');
    loadProducts({ force: true });
  });
  const search = document.getElementById('esProdSearch');
  if (search) search.addEventListener('input', debounce(() => {
    State.productFilters.search = search.value.trim();
    State.productPage = 1;
    cacheBust('products');
    loadProducts({ force: true });
  }, SEARCH_DEBOUNCE_MS));
  const prev = document.getElementById('esProdPrev');
  const next = document.getElementById('esProdNext');
  if (prev) prev.addEventListener('click', () => { if (State.productPage > 1) { State.productPage--; loadProducts(); } });
  if (next) next.addEventListener('click', () => { if (State.productPage < State.productTotalPages) { State.productPage++; loadProducts(); } });
  const refresh = document.getElementById('esProdRefreshCosts');
  if (refresh) refresh.addEventListener('click', openRefreshCostsModal);
}

function buildProductsQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.productPage));
  q.set('limit', String(PRODUCT_LIMIT));
  const f = State.productFilters;
  if (f.search) q.set('search', f.search);
  if (f.enabled === 'true' || f.enabled === 'false') q.set('enabled', f.enabled);
  if (f.coverage_type) q.set('coverage_type', f.coverage_type);
  return q.toString();
}

async function loadProducts({ force = false } = {}) {
  const el = document.getElementById('esProdBody');
  if (!el) return;
  const tok = nextToken('products');
  const cacheKey = 'products:' + buildProductsQuery();
  const cached = force ? null : cacheGet(cacheKey);
  if (!cached) el.innerHTML = skelRows(6);

  let data = cached;
  if (!data) {
    const r = await api(API.products() + '?' + buildProductsQuery());
    if (!isCurrent('products', tok)) return;
    if (!r.ok) {
      renderErrorState(el, r.message, r.requestId, () => loadProducts({ force: true }));
      return;
    }
    data = r.data;
    cacheSet(cacheKey, data);
  }
  const rows = data.products || [];
  State.products = rows;
  State.productTotalPages = data.totalPages || 1;
  const total = data.count || 0;

  if (!rows.length) {
    renderEmptyState(el, 'fa-inbox', 'No products for this filter');
    document.getElementById('esProdPageInfo').textContent = 'No results';
    document.getElementById('esProdPrev').disabled = true;
    document.getElementById('esProdNext').disabled = true;
    markUpdated();
    return;
  }

  el.innerHTML = `
    <div class="es-table-wrap">
      <table class="es-table" role="table">
        <thead>
          <tr>
            <th scope="col">Product</th>
            <th scope="col">Coverage</th>
            <th scope="col">Data / validity</th>
            <th scope="col">Wholesale</th>
            <th scope="col">Pricing</th>
            <th scope="col">Margin</th>
            <th scope="col">Customer NGN</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((p) => {
            const initials = (p.display_name || p.name || '?').slice(0, 2).toUpperCase();
            const dataStr = p.data_mb != null
              ? (p.data_mb >= 1024 ? (p.data_mb / 1024).toFixed(0) + ' GB' : p.data_mb + ' MB')
              : '—';
            const validity = p.validity_days != null ? p.validity_days + 'd' : '—';
            const marginBadges = [];
            if (p.below_cost) marginBadges.push('<span class="es-badge es-danger">Below cost</span>');
            else if (p.below_min_margin) marginBadges.push('<span class="es-badge es-warn">Low margin</span>');
            return `
              <tr>
                <td data-label="Product" data-primary>
                  <div class="es-prod">
                    <div class="es-prod-logo">${p.logo_url
                      ? `<img src="${esc(p.logo_url)}" alt="" loading="lazy">`
                      : esc(initials)}</div>
                    <div style="min-width:0">
                      <div style="font-weight:700;overflow-wrap:anywhere">${esc(p.display_name || p.name || '—')}</div>
                      <div style="font-size:11px;color:var(--es-text-faint)">
                        ${p.enabled ? '<span class="es-badge es-success">Enabled</span>' : '<span class="es-badge es-neutral">Disabled</span>'}
                        ${p.featured ? '<span class="es-badge es-warn" style="margin-left:4px">Featured</span>' : ''}
                      </div>
                    </div>
                  </div>
                </td>
                <td data-label="Coverage">${esc(p.coverage_type || '—')}</td>
                <td data-label="Data / validity">${esc(dataStr)} / ${esc(validity)}</td>
                <td data-label="Wholesale">${esc(String(p.wholesale_amount || ''))} ${esc(p.wholesale_currency || '')}</td>
                <td data-label="Pricing">${esc(p.pricing_mode || 'global')}${p.pricing_value ? ' · ' + esc(String(p.pricing_value)) : ''}</td>
                <td data-label="Margin">
                  ${p.margin_pct != null ? esc(decimalToPct(p.margin_pct)) + '%' : '—'}
                  ${marginBadges.join(' ')}
                </td>
                <td data-label="Customer NGN">
                  ${fmtMoney(p.customer_price_ngn, 'NGN')}
                  <div style="font-size:11px;color:var(--es-text-faint)">${fmtMoney(p.customer_price_usd, 'USD')}</div>
                </td>
                <td data-label="Actions">
                  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
                    <button type="button" class="es-btn es-btn-sm" data-price-id="${esc(p.id)}" aria-label="Edit pricing"><i class="fas fa-tag"></i> Price</button>
                    <button type="button" class="es-btn es-btn-sm" data-toggle-id="${esc(p.id)}" data-enabled="${p.enabled ? 'true' : 'false'}">${p.enabled ? 'Disable' : 'Enable'}</button>
                    <button type="button" class="es-btn es-btn-sm" data-feature-id="${esc(p.id)}" data-featured="${p.featured ? 'true' : 'false'}" aria-label="Toggle featured"><i class="fas fa-fire"></i></button>
                  </div>
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  el.querySelectorAll('[data-price-id]').forEach((b) => b.addEventListener('click', () => {
    const p = State.products.find((x) => x.id === b.dataset.priceId);
    if (p) openPricingModal(p);
  }));
  el.querySelectorAll('[data-toggle-id]').forEach((b) => b.addEventListener('click', () => {
    openToggleEnabledModal(b.dataset.toggleId, b.dataset.enabled !== 'true');
  }));
  el.querySelectorAll('[data-feature-id]').forEach((b) => b.addEventListener('click', () => {
    toggleFeatured(b.dataset.featureId, b.dataset.featured !== 'true');
  }));

  const start = (State.productPage - 1) * PRODUCT_LIMIT + 1;
  const end = Math.min(State.productPage * PRODUCT_LIMIT, total);
  document.getElementById('esProdPageInfo').textContent = `Showing ${start} to ${end} of ${total}`;
  document.getElementById('esProdPrev').disabled = State.productPage <= 1;
  document.getElementById('esProdNext').disabled = State.productPage >= State.productTotalPages;
  markUpdated();
}

function openPricingModal(p) {
  const currentMode = p.pricing_mode || 'global';
  const currentValue = p.pricing_value || '';
  const modal = openModal({
    title: `Pricing — ${p.display_name || p.name || ''}`,
    body: `
      <label for="esPmMode">Mode</label>
      <select id="esPmMode">
        <option value="global" ${currentMode === 'global' ? 'selected' : ''}>Global markup</option>
        <option value="markup_pct" ${currentMode === 'markup_pct' ? 'selected' : ''}>Custom markup</option>
        <option value="fixed_ngn" ${currentMode === 'fixed_ngn' ? 'selected' : ''}>Fixed NGN price</option>
        <option value="fixed_usd" ${currentMode === 'fixed_usd' ? 'selected' : ''}>Fixed USD price</option>
      </select>
      <label for="esPmValue">Value</label>
      <input type="text" id="esPmValue" inputmode="decimal" value="${esc(currentValue)}" placeholder="0.1000 or 12500.00">
      <div class="es-hint">markup_pct is a fraction: 0.1000 = 10 percent. fixed_ngn and fixed_usd are 2dp amounts.</div>
      <label for="esPmReason">Reason (required, min 4 chars)</label>
      <textarea id="esPmReason" rows="3"></textarea>
      <div style="margin-top:10px">
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:600;text-transform:none;letter-spacing:0;font-size:12px;color:var(--es-text)">
          <input type="checkbox" id="esPmAllowBelowCost"> Allow below cost
        </label>
      </div>
      <div class="es-err" id="esPmErr"></div>
    `,
    confirmLabel: 'Save pricing',
    confirmKind: 'primary'
  });

  const modeEl = document.getElementById('esPmMode');
  const valueWrap = document.getElementById('esPmValue');
  const updateValueState = () => { valueWrap.disabled = modeEl.value === 'global'; };
  modeEl.addEventListener('change', updateValueState);
  updateValueState();

  modal.onConfirm(async () => {
    const mode = modeEl.value;
    const value = (document.getElementById('esPmValue').value || '').trim();
    const reason = (document.getElementById('esPmReason').value || '').trim();
    const allow = document.getElementById('esPmAllowBelowCost').checked;
    const errEl = document.getElementById('esPmErr');
    errEl.classList.remove('es-show');
    if (reason.length < 4) { errEl.textContent = 'Reason must be at least 4 characters.'; errEl.classList.add('es-show'); return false; }
    if (mode !== 'global' && !value) { errEl.textContent = 'Value is required for this mode.'; errEl.classList.add('es-show'); return false; }

    const body = {
      mode,
      value: mode === 'global' ? null : value,
      reason,
      expected_updated_at: p.price_updated_at || null,
      allow_below_cost: allow
    };
    const r = await api(API.productPricing(p.id), { method: 'PUT', body, idempotency: true });
    if (!r.ok) {
      if (r.code === 'PRICING_BELOW_COST') {
        errEl.innerHTML = `Price is below provider cost. Tick <strong>Allow below cost</strong> and try again.`;
      } else if (r.code === 'OPTIMISTIC_LOCK_FAILED') {
        errEl.textContent = 'This product was modified by another admin. Reloading…';
        setTimeout(() => { loadProducts({ force: true }); modal.close(); }, 800);
      } else {
        errEl.textContent = r.message || 'Update failed.';
      }
      errEl.classList.add('es-show');
      return false;
    }
    toast('Pricing updated', 'success');
    cacheBust('products');
    loadProducts({ force: true });
    return true;
  });
}

function openToggleEnabledModal(id, enabled) {
  const modal = openModal({
    title: `${enabled ? 'Enable' : 'Disable'} product`,
    body: `
      <label for="esEnReason">Reason (required, min 4 chars)</label>
      <textarea id="esEnReason" rows="3"></textarea>
      <div class="es-err" id="esEnErr"></div>
    `,
    confirmLabel: enabled ? 'Enable' : 'Disable',
    confirmKind: enabled ? 'primary' : 'danger'
  });
  modal.onConfirm(async () => {
    const reason = (document.getElementById('esEnReason').value || '').trim();
    const errEl = document.getElementById('esEnErr');
    errEl.classList.remove('es-show');
    if (reason.length < 4) { errEl.textContent = 'Reason must be at least 4 characters.'; errEl.classList.add('es-show'); return false; }
    const r = await api(API.productEnabled(id), { method: 'PUT', body: { enabled, reason }, idempotency: true });
