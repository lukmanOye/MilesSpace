<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// MilesSpace Marketplace — Admin page
//
// Uses the shared admin shell:
//   • Sidebar + topbar injected by admin-shell.js via MS.init().
//   • Content rendered into #content (which MS.init creates).
//   • Drawer / modal / toast use the shell's CSS classes.
//   • No page-level sidebar, hamburger, collapse button, or scrim.
//
// Data endpoints (all from the marketplace backend):
//   GET  /api/admin/marketplace/stats
//   GET  /api/admin/marketplace/trend?days=30
//   GET  /api/admin/marketplace/products
//   GET|POST  /api/admin/marketplace/products
//   GET|PUT|DELETE /api/admin/marketplace/products/:id
//   POST /api/admin/marketplace/products/:id/duplicate
//   POST /api/admin/marketplace/products/bulk-status
//   GET  /api/admin/marketplace/categories
//   POST /api/admin/marketplace/categories
//   PUT|DELETE /api/admin/marketplace/categories/:id
//   GET  /api/admin/marketplace/inventory/:productId
//   POST /api/admin/marketplace/inventory
//   PUT  /api/admin/marketplace/inventory/:id
//   POST /api/admin/marketplace/inventory/:id/reveal
//   POST /api/admin/marketplace/inventory/:id/void
//   GET  /api/admin/marketplace/orders
//   GET  /api/admin/marketplace/orders/:id
//   POST /api/admin/marketplace/orders/:id/refund
//   POST /api/admin/marketplace/orders/:id/fail
//   POST /api/admin/marketplace/orders/:id/complete
//   POST /api/admin/marketplace/orders/:id/resend
//   GET  /api/admin/marketplace/disputes
//   POST /api/admin/marketplace/disputes/:id/resolve
//   GET  /api/admin/marketplace/audit
//   GET  /api/admin/marketplace/search?q=
//
// Money: prices are shown from the server. The client-side preview
// uses the SAME markup math for the editor preview; the server
// recomputes at charge time and the checkout route answers
// PRICE_CHANGED if they differ. The client never sends a price
// that the server trusts.
//
// Credentials: masked in lists, reveal requires a reason and is
// permission-gated (marketplace.inventory_reveal) + audited by the
// backend. This page never displays content from a list response.
// ═══════════════════════════════════════════════════════════════════

const API = {
  stats:          '/api/admin/marketplace/stats',
  trend:          (d = 30) => `/api/admin/marketplace/trend?days=${encodeURIComponent(d)}`,
  products:       '/api/admin/marketplace/products',
  product:        (id) => `/api/admin/marketplace/products/${encodeURIComponent(id)}`,
  productDup:     (id) => `/api/admin/marketplace/products/${encodeURIComponent(id)}/duplicate`,
  productBulk:    '/api/admin/marketplace/products/bulk-status',
  categories:     '/api/admin/marketplace/categories',
  category:       (id) => `/api/admin/marketplace/categories/${encodeURIComponent(id)}`,
  inventory:      (pid) => `/api/admin/marketplace/inventory/${encodeURIComponent(pid)}`,
  inventoryAdd:   '/api/admin/marketplace/inventory',
  inventoryItem:  (id) => `/api/admin/marketplace/inventory/${encodeURIComponent(id)}`,
  inventoryReveal:(id) => `/api/admin/marketplace/inventory/${encodeURIComponent(id)}/reveal`,
  inventoryVoid:  (id) => `/api/admin/marketplace/inventory/${encodeURIComponent(id)}/void`,
  orders:         '/api/admin/marketplace/orders',
  order:          (id) => `/api/admin/marketplace/orders/${encodeURIComponent(id)}`,
  orderRefund:    (id) => `/api/admin/marketplace/orders/${encodeURIComponent(id)}/refund`,
  orderFail:      (id) => `/api/admin/marketplace/orders/${encodeURIComponent(id)}/fail`,
  orderComplete:  (id) => `/api/admin/marketplace/orders/${encodeURIComponent(id)}/complete`,
  orderResend:    (id) => `/api/admin/marketplace/orders/${encodeURIComponent(id)}/resend`,
  disputes:       '/api/admin/marketplace/disputes',
  disputeResolve: (id) => `/api/admin/marketplace/disputes/${encodeURIComponent(id)}/resolve`,
  audit:          '/api/admin/marketplace/audit',
  search:         (q) => `/api/admin/marketplace/search?q=${encodeURIComponent(q)}`,
  me:             '/api/admin/me',
};

const State = {
  section: 'overview',
  products: { rows: [], page: 1, totalPages: 1, count: 0, filters: { q: '', status: 'all', category: 'all', stock: 'all', sort: 'created_desc' } },
  categories: { rows: [] },
  orders: { rows: [], page: 1, totalPages: 1, count: 0, filters: { status: 'all', currency: 'all', q: '', from: '', to: '' } },
  disputes: { rows: [], page: 1, totalPages: 1, count: 0, filters: { status: 'all' }, available: true, reason: null },
  audit: { rows: [], page: 1, totalPages: 1, count: 0, filters: { target_id: '', admin_id: '', from: '', to: '' } },
  currentProduct: null,
  currentOrder: null,
  currentInventoryProduct: null,
  admin: { id: null, permissions: [], role: null, canReveal: false },
  charts: { trend: null },
};

// ─── WAT-aware formatters ────────────────────────────────────────
const WAT_TZ = 'Africa/Lagos';

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('en-NG', { timeZone: WAT_TZ, day: '2-digit', month: 'short', year: 'numeric' });
  } catch { return iso; }
}
function fmtTime(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleTimeString('en-NG', { timeZone: WAT_TZ, hour: '2-digit', minute: '2-digit', hour12: true });
  } catch { return iso; }
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  return `${fmtDate(iso)} · ${fmtTime(iso)} WAT`;
}
function timeAgo(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function ageMinutes(iso) {
  if (!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
}

function money(amount, currency) {
  const ccy = String(currency || '').toUpperCase();
  if (amount === null || amount === undefined || amount === '') return null;
  const n = Number(amount);
  if (!Number.isFinite(n)) return null;
  const sym = ccy === 'USD' ? '$' : ccy === 'NGN' ? '₦' : (ccy ? ccy + ' ' : '');
  return sym + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function num(n) {
  if (n === null || n === undefined || n === '') return null;
  const x = Number(n);
  return Number.isFinite(x) ? x.toLocaleString('en-US') : null;
}
function pct(n) {
  if (n === null || n === undefined || n === '') return null;
  const x = Number(n);
  if (!Number.isFinite(x)) return null;
  return x.toFixed(1) + '%';
}
function trunc(s, n) {
  const t = String(s == null ? '' : s);
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
}

function toast(msg, kind) { MS.toast(msg, kind === 'ok' ? 'success' : kind === 'err' ? 'error' : kind === 'warn' ? 'warn' : 'info'); }

function statusClass(status) {
  const s = String(status || '').toLowerCase();
  if (['completed', 'success', 'active', 'available'].includes(s)) return 'success';
  if (['failed', 'cancelled', 'refunded', 'inactive', 'void', 'deleted', 'rejected'].includes(s)) return 'danger';
  if (['pending', 'processing', 'open', 'approved', 'manual_review'].includes(s)) return 'warn';
  if (['sold', 'archived'].includes(s)) return 'info';
  return 'neutral';
}

function setSection(sec) {
  State.section = sec;
  document.querySelectorAll('#mktNav .side-menu-item').forEach(b => {
    b.classList.toggle('active', b.dataset.section === sec);
  });
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('hidden', s.dataset.section !== sec));
  if (sec === 'overview')   loadOverview();
  if (sec === 'products')   loadProducts();
  if (sec === 'categories') loadCategories();
  if (sec === 'inventory')  loadInventoryRoot();
  if (sec === 'orders')     loadOrders();
  if (sec === 'disputes')   loadDisputes();
  if (sec === 'audit')      loadAudit();
}

// ═══════════════════════════════════════════════════════════════════
// Shell bootstrap
// ═══════════════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', async () => {
  if (!window.AdminSession?.getToken?.()) {
    window.AdminSession?.redirectToLogin?.();
    return window.location.replace('/admin/index.html');
  }

  MS.init({
    activeKey: 'marketplace-products',
    title: 'Marketplace',
    breadcrumb: [
      { label: 'Home', href: '/admin/dashboard.html' },
      { label: 'Services' },
      { label: 'Marketplace' },
    ],
  });

  // Load the admin profile (permissions, role) once.
  await loadAdminProfile();

  renderContent();
  setSection('overview');
});

async function loadAdminProfile() {
  try {
    const res = await fetch(API.me, {
      headers: { 'Authorization': `Bearer ${AdminSession.getToken()}` },
      credentials: 'include',
    });
    if (!res.ok) return;
    const j = await res.json().catch(() => null);
    const user = j?.data?.user || j?.user;
    if (!user) return;
    State.admin.id = user.id || null;
    State.admin.role = user.role || null;
    State.admin.permissions = Array.isArray(user.permissions) ? user.permissions : [];
    State.admin.canReveal = State.admin.role === 'super_admin'
      || State.admin.permissions.includes('*')
      || State.admin.permissions.includes('marketplace.inventory_reveal');
  } catch (_) { /* fail closed: canReveal stays false */ }
}

// ═══════════════════════════════════════════════════════════════════
// Overview
// ═══════════════════════════════════════════════════════════════════

async function loadOverview() {
  const root = document.getElementById('overviewSection');
  root.innerHTML = `
    <div class="kpi-grid" id="ovKpis">
      ${['Total products','Active','Total stock','Sold','Low stock','Out of stock','Orders','Pending','Completed','Refunded','USD revenue','NGN revenue'].map(l => `
        <div class="kpi-card"><div class="lbl">${l}</div><div class="val"><span class="skel" style="display:inline-block;width:60px;height:16px"></span></div></div>
      `).join('')}
    </div>
    <div class="card panel" style="margin-bottom:14px">
      <div class="flex-between" style="margin-bottom:10px">
        <h3 style="font-size:14px;font-weight:800">30-day sales trend</h3>
        <span class="badge neutral" id="trendBadge"><i class="fas fa-spinner fa-spin"></i> Loading</span>
      </div>
      <div id="trendChartWrap" style="min-height:180px">
        <div class="unavailable-box"><i class="fas fa-circle-notch fa-spin"></i><div>Loading trend…</div></div>
      </div>
    </div>
    <div class="card panel" id="attentionCard" style="margin-bottom:14px;display:none">
      <h3 style="font-size:14px;font-weight:800;margin-bottom:10px">Needs attention</h3>
      <div id="attentionList" class="filters-bar" style="background:transparent;border:none;padding:0"></div>
    </div>
  `;

  // KPIs
  const statsRes = await MS.api(API.stats);
  if (!statsRes.ok) {
    document.getElementById('ovKpis').innerHTML = `
      <div style="grid-column:1/-1" class="unavailable-box">
        <i class="fas fa-triangle-exclamation"></i>
        <div>Stats unavailable</div>
        <div style="font-size:11.5px;margin-top:4px;color:var(--text-faint)">${MS.esc(statsRes.error || 'Server error')}</div>
        <button class="btn btn-ghost" id="ovRetry" type="button" style="margin-top:10px"><i class="fas fa-rotate"></i> Retry</button>
      </div>`;
    document.getElementById('ovRetry').addEventListener('click', loadOverview);
  } else {
    const s = (statsRes.data.data || statsRes.data).stats || {};
    const tiles = [
      ['Total products', num(s.totalProducts) ?? '—'],
      ['Active',         num(s.active) ?? '—'],
      ['Total stock',    num(s.totalStock) ?? '—'],
      ['Sold',           num(s.totalSold) ?? '—'],
      ['Low stock',      num(s.lowStock) ?? '—'],
      ['Out of stock',   num(s.outOfStock) ?? '—'],
      ['Orders',         num(s.totalOrders) ?? '—'],
      ['Pending',        num(s.pending) ?? '—'],
      ['Completed',      num(s.completed) ?? '—'],
      ['Refunded',       num(s.refunded) ?? '—'],
      ['USD revenue',    money(s.usdRev, 'USD') ?? '—'],
      ['NGN revenue',    money(s.ngnRev, 'NGN') ?? '—'],
    ];
    document.getElementById('ovKpis').innerHTML = tiles.map(([l, v]) => `
      <div class="kpi-card"><div class="lbl">${MS.esc(l)}</div><div class="val">${v}</div></div>
    `).join('');

    // Attention strip
    const items = [];
    if (Number(s.pending) > 0) items.push({ label: `${s.pending} pending order${s.pending === 1 ? '' : 's'}`, kind: 'warn', go: () => setSection('orders') });
    if (Number(s.failed) > 0)  items.push({ label: `${s.failed} failed order${s.failed === 1 ? '' : 's'}`,  kind: 'danger', go: () => setSection('orders') });
    if (Number(s.refunded) > 0) items.push({ label: `${s.refunded} refunded order${s.refunded === 1 ? '' : 's'}`, kind: 'info', go: () => setSection('orders') });
    if (Number(s.lowStock) > 0) items.push({ label: `${s.lowStock} low-stock product${s.lowStock === 1 ? '' : 's'}`, kind: 'warn', go: () => setSection('products') });
    if (Number(s.outOfStock) > 0) items.push({ label: `${s.outOfStock} out-of-stock product${s.outOfStock === 1 ? '' : 's'}`, kind: 'danger', go: () => setSection('products') });
    if (items.length) {
      const card = document.getElementById('attentionCard');
      card.style.display = '';
      const list = document.getElementById('attentionList');
      list.innerHTML = items.map((it, i) => `
        <button class="btn btn-ghost" data-attn="${i}" type="button">
          <span class="badge ${it.kind}">${MS.esc(it.label)}</span>
        </button>
      `).join('');
      list.querySelectorAll('[data-attn]').forEach((b, i) => {
        b.addEventListener('click', () => items[i].go());
      });
    }
  }

  // Trend
  await loadTrendChart();
}

async function loadTrendChart() {
  const wrap = document.getElementById('trendChartWrap');
  const badge = document.getElementById('trendBadge');
  if (!wrap) return;

  const res = await MS.api(API.trend(30));
  if (!res.ok) {
    wrap.innerHTML = `<div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>Trend unavailable</div><div style="font-size:11.5px;margin-top:4px;color:var(--text-faint)">${MS.esc(res.error || 'Server error')}</div></div>`;
    if (badge) badge.outerHTML = '<span class="badge danger">Unavailable</span>';
    return;
  }

  const d = res.data.data || res.data;
  if (d.available === false) {
    wrap.innerHTML = `<div class="unavailable-box"><i class="fas fa-circle-info"></i><div>Trend RPC not deployed</div><div style="font-size:11.5px;margin-top:4px;color:var(--text-faint)">Reason: ${MS.esc(d.reason || 'unknown')}</div></div>`;
    if (badge) badge.outerHTML = '<span class="badge neutral">Not deployed</span>';
    return;
  }

  const usd = Array.isArray(d.USD) ? d.USD : [];
  const ngn = Array.isArray(d.NGN) ? d.NGN : [];

  if (!usd.length && !ngn.length) {
    wrap.innerHTML = `<div class="unavailable-box"><i class="fas fa-inbox"></i><div>No sales in the last 30 days</div></div>`;
    if (badge) badge.outerHTML = '<span class="badge neutral">Empty</span>';
    return;
  }

  if (badge) badge.outerHTML = '<span class="badge success"><i class="fas fa-check"></i> Loaded</span>';

  // Render two small tables side by side (per-currency; never summed).
  const renderSeries = (label, rows, ccy) => {
    if (!rows.length) return `<div class="unavailable-box" style="padding:14px"><div>No ${ccy} sales</div></div>`;
    return `
      <table style="min-width:0;width:100%">

    });
    ['pStatus','pCategory','pStock','pSort'].forEach((id) => {
      document.getElementById(id).addEventListener('change', () => {
        State.products.filters.status   = document.getElementById('pStatus').value;
        State.products.filters.category = document.getElementById('pCategory').value;
        State.products.filters.stock    = document.getElementById('pStock').value;

      });
    });

async function ensureCategoryFilterOptions() {
  if (State.categories.rows.length) return;
  const res = await MS.api(API.categories);
  if (!res.ok) return;
  State.categories.rows = (res.data.data || res.data).categories || [];
  const sel = document.getElementById('pCategory');
  if (!sel) return;
  sel.innerHTML = `<option value="all">All categories</option>` + State.categories.rows.map(c =>
    `<option value="${MS.esc(c.id)}">${MS.esc(c.name)}</option>`
  ).join('');
}

async function fetchProducts() {
  const tb = document.getElementById('productsBody');
  if (!tb) return;
  tb.innerHTML = `<tr><td colspan="9"><span class="skel" style="display:inline-block;width:50%"></span></td></tr>`;

  const f = State.products.filters;
  const qs = new URLSearchParams({
    page: String(State.products.page), limit: '25',
    q: f.q || '', status: f.status || 'all', category: f.category || 'all',
    stock: f.stock || 'all', sort: f.sort || 'created_desc',
  });
  const res = await MS.api(`${API.products}?${qs.toString()}`);
  if (!res.ok) {
    tb.innerHTML = `<tr><td colspan="9"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>${MS.esc(res.error || 'Could not load products')}</div><button class="btn btn-ghost" id="pRetry" type="button" style="margin-top:8px">Retry</button></div></td></tr>`;
    document.getElementById('pRetry')?.addEventListener('click', fetchProducts);
    return;
  }

  const d = res.data.data || res.data;
  State.products.rows = d.products || [];
  State.products.count = d.count || 0;
  State.products.totalPages = d.totalPages || 1;

  if (!State.products.rows.length) {
    tb.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fas fa-box"></i><div class="title">No products</div><div class="sub">Create the first product to get started.</div></div></td></tr>`;
    document.getElementById('productsInfo').textContent = 'No products';
    document.getElementById('productsPager').innerHTML = '';
    return;
  }

  tb.innerHTML = State.products.rows.map(p => `
    <tr data-pid="${MS.esc(p.id)}">
      <td class="checkbox-cell"><input type="checkbox" class="row-check" data-pid="${MS.esc(p.id)}" aria-label="Select ${MS.esc(p.name)}" /></td>
      <td><strong>${MS.esc(p.name)}</strong><div class="text-xs text-faint mono" style="font-size:10px">${MS.esc(p.id)}</div></td>
      <td>${p.category_icon ? `<i class="fas ${MS.esc(p.category_icon)}"></i> ` : ''}${MS.esc(p.category_name || p.category_id || '—')}</td>
      <td>${money(p.price_usd, 'USD') ?? '—'}</td>
      <td>${p.price_ngn ? (money(p.price_ngn, 'NGN') ?? '—') : '<span class="text-faint text-xs">FX</span>'}</td>
      <td>${num(p.stock) ?? 0}</td>
      <td>${num(p.sold) ?? 0}</td>
      <td><span class="badge ${statusClass(p.status)}">${MS.esc(p.status || '—')}</span></td>
      <td class="table-actions">
        <button class="btn btn-ghost btn-sm" data-edit="${MS.esc(p.id)}" type="button"><i class="fas fa-pen"></i> Edit</button>
        <button class="btn btn-ghost btn-sm" data-dup="${MS.esc(p.id)}" type="button" title="Duplicate"><i class="fas fa-copy"></i></button>
        <button class="btn btn-ghost btn-sm" data-inv="${MS.esc(p.id)}" type="button" title="Inventory"><i class="fas fa-warehouse"></i></button>
        <button class="btn btn-danger btn-sm" data-del="${MS.esc(p.id)}" type="button" title="Archive or delete"><i class="fas fa-trash"></i></button>
      </td>
    </tr>
  `).join('');

  tb.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProductEditor(b.dataset.edit)));
  tb.querySelectorAll('[data-dup]').forEach(b => b.addEventListener('click', () => duplicateProduct(b.dataset.dup)));
  tb.querySelectorAll('[data-inv]').forEach(b => b.addEventListener('click', () => { State.currentInventoryProduct = b.dataset.inv; setSection('inventory'); }));
  tb.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteProduct(b.dataset.del)));
  tb.querySelectorAll('.row-check[data-pid]').forEach(c => c.addEventListener('change', updateBulkButtons));

  document.getElementById('productsInfo').textContent = State.products.count
    ? `Showing ${(State.products.page - 1) * 25 + 1}–${Math.min(State.products.page * 25, State.products.count)} of ${State.products.count}`
    : 'No results';
  renderPager('productsPager', State.products, (p) => { State.products.page = p; fetchProducts(); });
  updateBulkButtons();
}

function updateBulkButtons() {
  const any = document.querySelectorAll('.row-check[data-pid]:checked').length > 0;
  document.getElementById('pBulkOn').disabled = !any;
  document.getElementById('pBulkOff').disabled = !any;
}

async function bulkStatus(status) {
  const ids = Array.from(document.querySelectorAll('.row-check[data-pid]:checked')).map(c => c.dataset.pid);
  if (!ids.length) return;
  const res = await MS.api(API.productBulk, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids, status }),
  });
  if (!res.ok) { toast(res.error || 'Bulk update failed', 'err'); return; }
  toast(`${status === 'Active' ? 'Activated' : 'Deactivated'} ${ids.length} product(s).`, 'ok');
  fetchProducts();
}

async function duplicateProduct(id) {
  const res = await MS.api(API.productDup(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (!res.ok) { toast(res.error || 'Duplicate failed', 'err'); return; }
  toast('Product duplicated.', 'ok');
  fetchProducts();
}

async function deleteProduct(id) {
  const ok = await confirmDialog({
    title: 'Archive or delete product?',
    body: 'Products with existing orders will be archived (retained for history). Products with no orders will be deleted.',
    confirmText: 'Confirm',
    kind: 'danger',
  });
  if (!ok) return;
  const res = await MS.api(API.product(id), { method: 'DELETE' });
  if (!res.ok) { toast(res.error || 'Delete failed', 'err'); return; }
  const d = res.data.data || res.data;
  toast(d.archived ? 'Product archived.' : 'Product deleted.', 'ok');
  fetchProducts();
}

async function openProductEditor(id) {

    const res = await MS.api(API.product(id));

    product = (res.data.data || res.data).product;
  }
  if (!State.categories.rows.length) await ensureCategoryFilterOptions();

  const p = product || {
    name: '', category_id: '', description: '', long_description: '',
    how_to_use: '', features: '', mail_access: '', login_tutorial: '',
    login_format: '', country: 'Global', price_usd: '', price_ngn: '',
    delivery_type: 'structured', status: 'Active',
  };

  const catOpts = State.categories.rows.map(c =>
    `<option value="${MS.esc(c.id)}" ${p.category_id === c.id ? 'selected' : ''}>${MS.esc(c.name)}</option>`
  ).join('');

  openModal({
    title: id ? 'Edit product' : 'New product',
    body: `
      <div class="editor-grid">
        <div class="form-row" style="grid-column:1/-1">
          <label>Name <span class="req">*</span></label>
          <input id="pfName" type="text" value="${MS.esc(p.name)}" maxlength="200" />
        </div>
        <div class="form-row">
          <label>Category <span class="req">*</span></label>
          <select id="pfCat"><option value="">— Select —</option>${catOpts}</select>
        </div>
        <div class="form-row">
          <label>Status</label>
          <select id="pfStatus">
            ${['Active','Inactive','Archived'].map(s => `<option value="${s}" ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <label>Price USD <span class="req">*</span></label>
          <input id="pfUsd" type="number" min="0" step="0.01" value="${p.price_usd ?? ''}" />
        </div>
        <div class="form-row">
          <label>Price NGN</label>
          <input id="pfNgn" type="number" min="0" step="1" value="${p.price_ngn ?? ''}" placeholder="Blank = derive from live FX" />
          <div class="help">Leave blank to derive NGN from USD at charge time.</div>
        </div>
        <div class="form-row">
          <label>Country / Region</label>
          <input id="pfCountry" type="text" value="${MS.esc(p.country || 'Global')}" maxlength="80" />
        </div>
        <div class="form-row">
          <label>Delivery type</label>
          <select id="pfDelivery">
            ${['structured','plain_text','file_upload','mixed'].map(v =>
              `<option value="${v}" ${p.delivery_type === v ? 'selected' : ''}>${v}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Short description</label>
        <textarea id="pfDesc" rows="2" maxlength="400">${MS.esc(p.description || '')}</textarea>
      </div>
      <div class="form-row">
        <label>Long description</label>
        <textarea id="pfLongDesc" rows="6">${MS.esc(p.long_description || '')}</textarea>
      </div>
      <div class="form-row">
        <label>Features (one per line)</label>
        <textarea id="pfFeatures" rows="4">${MS.esc(p.features || '')}</textarea>
      </div>
      <div class="form-row">
        <label>How to use / instructions</label>
        <textarea id="pfHowToUse" rows="4">${MS.esc(p.how_to_use || '')}</textarea>
      </div>
      <div class="editor-grid">
        <div class="form-row">
          <label>Login format</label>
          <input id="pfLoginFormat" type="text" value="${MS.esc(p.login_format || '')}" />
        </div>
        <div class="form-row">
          <label>Mail access link</label>
          <input id="pfMailAccess" type="text" value="${MS.esc(p.mail_access || '')}" />
        </div>
      </div>
      <div class="form-row">
        <label>Login tutorial</label>
        <textarea id="pfLoginTutorial" rows="3">${MS.esc(p.login_tutorial || '')}</textarea>
      </div>
      ${!id ? `
      <div class="form-row">
        <label>Initial inventory (one item per line)</label>
        <textarea id="pfInventory" rows="4" placeholder="user1@example.com:password1&#10;user2@example.com:password2"></textarea>
        <div class="help">Optional. Items are added to the product's inventory on save.</div>
      </div>
      ` : ''}
      <div class="form-summary" id="pfPreview"></div>
    `,
    confirmText: id ? 'Save changes' : 'Create product',
    kind: 'primary',
    onConfirm: async () => {
      const name = document.getElementById('pfName').value.trim();
      const category_id = document.getElementById('pfCat').value;
      const price_usd = parseFloat(document.getElementById('pfUsd').value);
      if (!name) { toast('Name is required', 'err'); return false; }
      if (!category_id) { toast('Category is required', 'err'); return false; }
      if (!Number.isFinite(price_usd) || price_usd <= 0) { toast('USD price must be positive', 'err'); return false; }

      const body = {
        name, category_id, price_usd,
        price_ngn: document.getElementById('pfNgn').value || null,
        country: document.getElementById('pfCountry').value.trim() || 'Global',
        description: document.getElementById('pfDesc').value,
        long_description: document.getElementById('pfLongDesc').value,
        features: document.getElementById('pfFeatures').value,
        how_to_use: document.getElementById('pfHowToUse').value,
        login_format: document.getElementById('pfLoginFormat').value.trim(),
        mail_access: document.getElementById('pfMailAccess').value.trim(),
        login_tutorial: document.getElementById('pfLoginTutorial').value,
        delivery_type: document.getElementById('pfDelivery').value,
        status: document.getElementById('pfStatus').value,
      };
      if (!id) {
        const raw = (document.getElementById('pfInventory')?.value || '').trim();
        if (raw) body.inventory_items = raw.split('\n').map(s => s.trim()).filter(Boolean);
      }

      const res = await MS.api(id ? API.product(id) : API.products, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) { toast(res.error || 'Save failed', 'err'); return false; }
      toast(id ? 'Product updated.' : 'Product created.', 'ok');
      fetchProducts();
      return true;
    },
  });

  // Live price preview
  const preview = () => {
    const usd = parseFloat(document.getElementById('pfUsd').value) || 0;
    const ngn = parseFloat(document.getElementById('pfNgn').value) || null;
    const markupPct = State._markupPct ?? null;
    const rate = State._usdToNgn ?? null;
    const wrap = document.getElementById('pfPreview');
    if (!wrap) return;
    if (markupPct == null || rate == null) {
      wrap.innerHTML = `<div class="preview-row"><span class="k">Final price</span><span class="v text-faint">Markup / FX not loaded</span></div>`;
      return;
    }
    const m = 1 + markupPct / 100;
    const finalUsd = Math.round((usd * m + Number.EPSILON) * 100) / 100;
    const finalNgn = ngn != null ? Math.round((ngn * m + Number.EPSILON) * 100) / 100 : Math.round((finalUsd * rate + Number.EPSILON) * 100) / 100;
    wrap.innerHTML = `
      <div class="preview-row"><span class="k">Markup</span><span class="v">${markupPct}%</span></div>
      <div class="preview-row"><span class="k">FX (USD→NGN)</span><span class="v">${rate.toLocaleString('en-US')}</span></div>
      <div class="preview-row"><span class="k">Final USD</span><span class="v">${money(finalUsd, 'USD')}</span></div>
      <div class="preview-row"><span class="k">Final NGN</span><span class="v">${money(finalNgn, 'NGN')}</span></div>
    `;
  };
  ['pfUsd','pfNgn'].forEach((idEl) => document.getElementById(idEl)?.addEventListener('input', preview));

  // Load markup + FX once (best-effort — the preview is informational;
  // server recomputes at charge time and checkout can return PRICE_CHANGED).
  if (State._markupPct == null) {
    try {
      const s = await MS.api(API.stats);
      if (s.ok) {
        const meta = (s.data.data || s.data).raw || {};
        State._markupPct = (s.data.data || s.data).markupPct ?? null;
        State._usdToNgn = (s.data.data || s.data).usdToNgn ?? null;
      }
    } catch (_) {}
  }
  preview();
}

async function deleteCategory(id) {
  const ok = await confirmDialog({
    title: 'Delete category?',
    body: 'Categories that are in use by products cannot be deleted. Reassign products first.',
    confirmText: 'Delete',
    kind: 'danger',

async function fetchInventory(page = 1) {
  const tb = document.getElementById('invBody');
  if (!tb) return;
  tb.innerHTML = `<tr><td colspan="6"><span class="skel" style="display:inline-block;width:50%"></span></td></tr>`;
  const status = document.getElementById('invStatus')?.value || 'all';
  const qs = new URLSearchParams({ page: String(page), limit: '25', status });
  const res = await MS.api(`${API.inventory(State.currentInventoryProduct)}?${qs.toString()}`);
  if (!res.ok) {
    tb.innerHTML = `<tr><td colspan="6"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>${MS.esc(res.error || 'Could not load inventory')}</div></div></td></tr>`;
    return;
  }
  const d = res.data.data || res.data;
  const items = d.inventory || [];
  if (!items.length) {
    tb.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-inbox"></i><div class="title">No inventory</div><div class="sub">Add items to sell this product.</div></div></td></tr>`;
    document.getElementById('invInfo').textContent = 'No items';
    document.getElementById('invPager').innerHTML = '';
    return;
  }
  tb.innerHTML = items.map(it => `
    <tr>
      <td class="mono" style="font-size:11px">${MS.esc(it.id)}</td>
      <td><span class="badge ${statusClass(it.status)}">${MS.esc(it.status)}</span></td>
      <td><div class="content-preview">${MS.esc(it.content_masked || '')}</div></td>
      <td>${num(it.content_length) ?? 0}</td>
      <td>${it.sold_at ? fmtDateTime(it.sold_at) : '<span class="text-faint">—</span>'}</td>
      <td class="table-actions">
        ${State.admin.canReveal ? `<button class="btn btn-ghost btn-sm" data-reveal="${MS.esc(it.id)}" type="button"><i class="fas fa-eye"></i></button>` : ''}
        ${it.status === 'available' ? `<button class="btn btn-danger btn-sm" data-void="${MS.esc(it.id)}" type="button" title="Void"><i class="fas fa-ban"></i></button>` : ''}
      </td>
    </tr>
  `).join('');
  tb.querySelectorAll('[data-reveal]').forEach(b => b.addEventListener('click', () => revealItem(b.dataset.reveal)));
  tb.querySelectorAll('[data-void]').forEach(b => b.addEventListener('click', () => voidItem(b.dataset.void)));

    ? `Showing ${(d.page - 1) * 25 + 1}–${Math.min(d.page * 25, d.count)} of ${d.count}`
    : 'No items';
  renderPager('invPager', { page: d.page || 1, totalPages: d.totalPages || 1, count: d.count || 0 }, (p) => fetchInventory(p));
}

async function revealItem(id) {
  const reason = await MS.reasonModal({
    title: 'Reveal inventory content',
    message: 'This action is audited. Provide a short reason for the reveal.',
    confirmText: 'Reveal',
    kind: 'primary',
  });
  if (!reason) return;
  if (reason.trim().length < 4) { toast('Reason must be at least 4 characters.', 'err'); return; }
  const res = await MS.api(API.inventoryReveal(id), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reason: reason.trim() }),
  });
  if (!res.ok) { toast(res.error || 'Reveal failed', 'err'); return; }
  const d = res.data.data || res.data;
  openModal({
    title: 'Inventory content',
    body: `<div class="content-preview" style="max-height:260px">${MS.esc(d.content || '')}</div>`,
    confirmText: null,
    cancelText: 'Close',
  });
}

async function voidItem(id) {
  const ok = await confirmDialog({
    title: 'Void this item?',
    body: 'Voided items cannot be sold. This is permanent.',
    confirmText: 'Void',
    kind: 'danger',
  });
  if (!ok) return;
  const res = await MS.api(API.inventoryVoid(id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (!res.ok) { toast(res.error || 'Void failed', 'err'); return; }
  toast('Item voided.', 'ok');
  fetchInventory();
}

function openInventoryAdd() {
  openModal({
    title: 'Add inventory',
    body: `
      <div class="form-row">
        <label>Items (one per line)</label>
        <textarea id="iaItems" rows="8" placeholder="user1@example.com:pass1&#10;user2@example.com:pass2"></textarea>
        <div class="help">Maximum 500 items per request. Duplicates within this list are dropped; server rejects duplicates against existing stock.</div>
      </div>
    `,
    confirmText: 'Add',
    kind: 'primary',
    onConfirm: async () => {
      const raw = (document.getElementById('iaItems').value || '').trim();
      const items = [...new Set(raw.split('\n').map(s => s.trim()).filter(Boolean))];
      if (!items.length) { toast('No items to add.', 'err'); return false; }
      if (items.length > 500) { toast('Maximum 500 items.', 'err'); return false; }
      const res = await MS.api(API.inventoryAdd, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product_id: State.currentInventoryProduct, items }),
      });
      if (!res.ok) { toast(res.error || 'Add failed', 'err'); return false; }
      toast(`Added ${items.length} item(s).`, 'ok');
      fetchInventory();
      return true;
    },
  });
}

async function doOrderAction(kind, order) {
  if (kind === 'resend') {
    const ok = await confirmDialog({
      title: 'Resend delivery?',
      body: 'The buyer will be able to re-download from their Purchase History.',
      confirmText: 'Resend',
      kind: 'primary',
    });
    if (!ok) return;
    const res = await MS.api(API.orderResend(order.id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (!res.ok) { toast(res.error || 'Resend failed', 'err'); return; }
    toast('Delivery available to buyer.', 'ok');
    return;
  }

  const label = kind === 'refund' ? 'Refund order' : kind === 'complete' ? 'Mark completed' : 'Fail order';
  const message = kind === 'refund'
    ? 'Credits the buyer via refundService, burns inventory, and marks the order refunded.'
    : kind === 'complete'
      ? 'Marks the order completed. Only use this if you have manually verified delivery.'
      : 'You can fail with or without refunding. Orders with a ledger debit must be refunded.';

  const reason = await MS.reasonModal({
    title: label,
    message,
    confirmText: kind === 'refund' ? 'Refund' : kind === 'complete' ? 'Complete' : 'Fail',
    kind: kind === 'complete' ? 'primary' : 'danger',
  });
  if (!reason) return;
  if (reason.trim().length < 4) { toast('Reason must be at least 4 characters.', 'err'); return; }

  const endpoint = kind === 'refund'   ? API.orderRefund(order.id)
                 : kind === 'complete' ? API.orderComplete(order.id)
                 :                       API.orderFail(order.id);

  const body = { reason: reason.trim() };
  const doRefundOnFail = kind === 'fail' ? await confirmDialog({
    title: 'Refund as well?',
    body: 'The order was debited. Choose Refund to credit the buyer; Cancel to leave the order pending for manual review.',
    confirmText: 'Refund',
    cancelText: 'Leave pending',
    kind: 'danger',
  }) : null;
  if (kind === 'fail' && doRefundOnFail) body.refund = true;

  const res = await MS.api(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    if (res.code === 'ORDER_HAS_DEBIT') {
      // The fail path detected a debit and requires refund.
      const wantsRefund = await confirmDialog({
        title: 'Order was debited',
        body: 'Fail requires a refund to protect the buyer. Refund now?',
        confirmText: 'Refund',
        kind: 'danger',
      });
      if (wantsRefund) { doOrderAction('refund', order); }
      return;
    }
    toast(res.error || 'Action failed', 'err');
    return;
  }
  toast('Done.', 'ok');
  fetchOrders();
  // Refresh drawer.
  openOrderDrawer(order.id);
}

                <th>Created</th>
                <th>Order</th>
                <th>User</th>
                <th>Reason</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="disputesBody"></tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('dStatus').addEventListener('change', fetchDisputes);
    document.getElementById('dReload').addEventListener('click', fetchDisputes);
  }
  fetchDisputes();
}

async function fetchDisputes() {
  const tb = document.getElementById('disputesBody');
  if (!tb) return;
  tb.innerHTML = `<tr><td colspan="6"><span class="skel" style="display:inline-block;width:50%"></span></td></tr>`;
  const status = document.getElementById('dStatus')?.value || 'all';
  const res = await MS.api(`${API.disputes}?status=${encodeURIComponent(status)}`);
  if (!res.ok) {
    tb.innerHTML = `<tr><td colspan="6"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>${MS.esc(res.error || 'Could not load disputes')}</div></div></td></tr>`;
    return;
  }
  const d = res.data.data || res.data;
  if (d.available === false) {
    tb.innerHTML = `<tr><td colspan="6"><div class="unavailable-box"><i class="fas fa-circle-info"></i><div>Disputes not deployed</div><div style="font-size:11.5px;margin-top:4px;color:var(--text-faint)">Reason: ${MS.esc(d.reason || 'unknown')}</div></div></td></tr>`;
    return;
  }
  const rows = d.disputes || [];
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-scale-balanced"></i><div class="title">No disputes</div><div class="sub">Buyer-reported issues appear here.</div></div></td></tr>`;
    return;
  }
  tb.innerHTML = rows.map(r => `
    <tr data-did="${MS.esc(r.id)}">
      <td>${MS.esc(timeAgo(r.created_at))}</td>
      <td class="mono" style="font-size:11px">${MS.esc(r.order_id)}</td>
      <td>${MS.esc(r.user_id)}</td>
      <td>${MS.esc(trunc(r.reason || '', 80))}</td>
      <td><span class="badge ${statusClass(r.status)}">${MS.esc(r.status)}</span></td>
      <td>
        ${r.status === 'open' ? `<button class="btn btn-primary btn-sm" data-dopen="${MS.esc(r.id)}" type="button">Resolve</button>` : ''}
      </td>
    </tr>
  `).join('');
  tb.querySelectorAll('[data-dopen]').forEach(b => b.addEventListener('click', () => openDisputeResolve(b.dataset.dopen)));
}

async function openDisputeResolve(id) {
  openModal({
    title: 'Resolve dispute',
    body: `
      <div class="form-row">
        <label>Resolution</label>
        <select id="drResolution">
          <option value="">— Choose —</option>
          <option value="approved_replacement">Approve replacement (new item allocated)</option>
          <option value="approved_refund">Approve refund (via refundService)</option>
          <option value="rejected">Reject</option>
        </select>
      </div>
      <div class="form-row">
        <label>Notes <span class="req">*</span></label>
        <textarea id="drNotes" rows="3" placeholder="Explain the resolution"></textarea>
      </div>
    `,
    confirmText: 'Resolve',
    kind: 'primary',
    onConfirm: async () => {
      const resolution = document.getElementById('drResolution').value;
      const notes = document.getElementById('drNotes').value.trim();
      if (!resolution) { toast('Choose a resolution', 'err'); return false; }
      if (notes.length < 4) { toast('Notes must be at least 4 characters', 'err'); return false; }
      const res = await MS.api(API.disputeResolve(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resolution, notes }),
      });
      if (!res.ok) { toast(res.error || 'Resolve failed', 'err'); return false; }
      toast('Dispute resolved.', 'ok');
      fetchDisputes();
      return true;
    },
  });
}

async function loadAudit() {
  const root = document.getElementById('auditSection');
  if (!root.dataset.built) {
    root.dataset.built = '1';
    root.innerHTML = `
      <div class="filters-card">
        <div class="filters-bar">
          <input id="aTarget" type="search" class="search-input" placeholder="Target id (order, product, inventory)…" />
          <input id="aAdmin"  type="search" class="search-input" placeholder="Admin id…" />
          <input id="aFrom" type="date" class="date-input" />
          <input id="aTo"   type="date" class="date-input" />
          <button class="btn btn-primary" id="aApply" type="button"><i class="fas fa-filter"></i> Apply</button>
          <button class="btn btn-ghost" id="aClear" type="button">Clear</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>When</th>
                <th>Admin</th>
                <th>Action</th>
                <th>Target</th>
                <th>Reason</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <div id="auditInfo">—</div>
          <div class="pagination" id="auditPager"></div>
        </div>
      </div>
    `;
    document.getElementById('aApply').addEventListener('click', () => {
      State.audit.filters.target_id = document.getElementById('aTarget').value.trim();
      State.audit.filters.admin_id  = document.getElementById('aAdmin').value.trim();
      State.audit.filters.from      = document.getElementById('aFrom').value;
      State.audit.filters.to        = document.getElementById('aTo').value;
      State.audit.page = 1;
      fetchAudit();
    });
    document.getElementById('aClear').addEventListener('click', () => {
      document.getElementById('aTarget').value = '';
      document.getElementById('aAdmin').value = '';
      document.getElementById('aFrom').value = '';
      document.getElementById('aTo').value = '';
      State.audit.filters = { target_id: '', admin_id: '', from: '', to: '' };
      State.audit.page = 1;
      fetchAudit();
    });
  }
  fetchAudit();
}

async function fetchAudit() {
  const tb = document.getElementById('auditBody');
  if (!tb) return;
  tb.innerHTML = `<tr><td colspan="6"><span class="skel" style="display:inline-block;width:50%"></span></td></tr>`;
  const f = State.audit.filters;
  const qs = new URLSearchParams({ page: String(State.audit.page), limit: '50', action_prefix: 'marketplace.' });
  if (f.target_id) qs.set('target_id', f.target_id);
  if (f.admin_id)  qs.set('admin_id', f.admin_id);
  if (f.from)      qs.set('from', f.from);
  if (f.to)        qs.set('to', f.to);
  const res = await MS.api(`${API.audit}?${qs.toString()}`);
  if (!res.ok) {
    tb.innerHTML = `<tr><td colspan="6"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>${MS.esc(res.error || 'Could not load audit')}</div></div></td></tr>`;
    return;
  }
  const d = res.data.data || res.data;
  if (d.available === false) {
    tb.innerHTML = `<tr><td colspan="6"><div class="unavailable-box"><i class="fas fa-circle-info"></i><div>Audit log unavailable</div><div style="font-size:11.5px;margin-top:4px;color:var(--text-faint)">Reason: ${MS.esc(d.reason || 'unknown')}</div></div></td></tr>`;
    return;
  }
  const rows = d.logs || [];
  State.audit.count = d.count || 0;
  State.audit.totalPages = d.totalPages || 1;
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-clipboard-list"></i><div class="title">No audit entries</div><div class="sub">Marketplace admin actions appear here.</div></div></td></tr>`;
    document.getElementById('auditInfo').textContent = 'No results';
    document.getElementById('auditPager').innerHTML = '';
    return;
  }
  tb.innerHTML = rows.map(r => `
    <tr>
      <td>${MS.esc(fmtDateTime(r.created_at))}</td>
      <td class="mono" style="font-size:11px">${MS.esc(r.admin_id || '—')}</td>
      <td>${MS.esc(r.action || '—')}</td>
      <td class="mono" style="font-size:11px">${MS.esc(r.target_id || '—')}</td>
      <td>${r.reason ? MS.esc(trunc(r.reason, 80)) : '<span class="text-faint">—</span>'}</td>
      <td><span class="badge ${r.result === 'success' ? 'success' : 'danger'}">${MS.esc(r.result || '—')}</span></td>
    </tr>
  `).join('');
  document.getElementById('auditInfo').textContent = State.audit.count
    ? `Showing ${(State.audit.page - 1) * 50 + 1}–${Math.min(State.audit.page * 50, State.audit.count)} of ${State.audit.count}`
    : 'No results';
  renderPager('auditPager', State.audit, (p) => { State.audit.page = p; fetchAudit(); });
}

// ═══════════════════════════════════════════════════════════════════
// Pagination + modal + drawer helpers
// ═══════════════════════════════════════════════════════════════════

function renderPager(elId, state, onChange) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = '';
  if (!state.totalPages || state.totalPages <= 1) return;
  const mk = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    if (!disabled && !active) b.addEventListener('click', () => onChange(page));
    return b;
  };
  el.appendChild(mk('‹', state.page - 1, state.page <= 1, false));
  el.appendChild(mk(String(state.page), state.page, false, true));
  el.appendChild(mk('›', state.page + 1, state.page >= state.totalPages, false));
}

function openDrawer({ title, sub, icon, body }) {
  document.getElementById('ddIcon').innerHTML = `<i class="fas ${icon || 'fa-file'}"></i>`;
  document.getElementById('ddTitle').textContent = title || 'Detail';
  document.getElementById('ddSub').textContent = sub || '';
  document.getElementById('ddBody').innerHTML = body || '';
  document.getElementById('detailDrawer').classList.add('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'false');
  document.getElementById('drawerScrim').classList.add('open');
  try { MS.lockScroll?.(); } catch (_) {}
}
function closeDrawer() {
  document.getElementById('detailDrawer').classList.remove('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'true');
  document.getElementById('drawerScrim').classList.remove('open');
  try { MS.unlockScroll?.(); } catch (_) {}
}

function openModal({ title, body, confirmText, cancelText, kind, onConfirm }) {
  const scrim = document.getElementById('modalScrim');
  document.getElementById('mTitle').textContent = title || 'Action';
  document.getElementById('mBody').innerHTML = body || '';
  const foot = document.getElementById('mFoot');
  foot.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.className = 'btn btn-ghost';
  cancel.type = 'button';
  cancel.textContent = cancelText || 'Cancel';
  cancel.addEventListener('click', () => closeModal());
  foot.appendChild(cancel);

  if (confirmText) {
    const ok = document.createElement('button');
    ok.className = 'btn ' + (kind === 'danger' ? 'btn-danger' : kind === 'success' ? 'btn-success' : 'btn-primary');
    ok.type = 'button';
    ok.textContent = confirmText;
    ok.addEventListener('click', async () => {
      ok.disabled = true;
      try {
        const close = await onConfirm?.();
        if (close !== false) closeModal();
      } finally {
        ok.disabled = false;
      }
    });
    foot.appendChild(ok);
  }

  scrim.classList.add('open');
  scrim.setAttribute('aria-hidden', 'false');
  try { MS.lockScroll?.(); } catch (_) {}
}
function closeModal() {
  const scrim = document.getElementById('modalScrim');
  scrim.classList.remove('open');
  scrim.setAttribute('aria-hidden', 'true');
  try { MS.unlockScroll?.(); } catch (_) {}
}

function confirmDialog({ title, body, confirmText = 'Confirm', cancelText = 'Cancel', kind = 'danger' }) {
  return new Promise((resolve) => {
    const scrim = document.getElementById('modalScrim');
    document.getElementById('mTitle').textContent = title || 'Confirm';
    document.getElementById('mBody').innerHTML = `<p style="font-size:13px;color:var(--text-dim);line-height:1.55">${MS.esc(body || '')}</p>`;
    const foot = document.getElementById('mFoot');
    foot.innerHTML = '';
    const cancel = document.createElement('button');
    cancel.className = 'btn btn-ghost';
    cancel.type = 'button';
    cancel.textContent = cancelText;
    cancel.addEventListener('click', () => { closeModal(); resolve(false); });
    foot.appendChild(cancel);
    const ok = document.createElement('button');
    ok.className = 'btn ' + (kind === 'danger' ? 'btn-danger' : 'btn-primary');
    ok.type = 'button';
    ok.textContent = confirmText;
    ok.addEventListener('click', () => { closeModal(); resolve(true); });
    foot.appendChild(ok);
    scrim.classList.add('open');
    scrim.setAttribute('aria-hidden', 'false');
    try { MS.lockScroll?.(); } catch (_) {}
  });
}
