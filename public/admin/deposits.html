<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Deposits — MilesSpace Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/css/admin-shell.css">
<script src="/js/admin-session.js?v=2026-deposits-v2"></script>
<script src="/js/admin-shell.js?v=2026-deposits-v2"></script>

<style>
/* Page-specific tweaks only. Design tokens live in admin-shell.css. */
</style>
</head>
<body>

<script>
// Theme before paint
(function() {
  try {
    if (localStorage.getItem('ms-theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    } else {
      document.documentElement.classList.add('light');
      document.documentElement.style.colorScheme = 'light';
    }
  } catch(_) {}
})();
</script>

<div class="app" id="appRoot"></div>

<!-- Detail drawer -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="dd-head">
    <div class="dd-ic" id="ddIcon"><i class="fas fa-circle-down"></i></div>
    <div class="dd-titles"><h2 id="ddTitle">Deposit</h2><div class="dd-sub" id="ddSub"></div></div>
    <button class="dd-close" id="ddClose" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="dd-body" id="ddBody"></div>
</aside>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
'use strict';

document.addEventListener('DOMContentLoaded', () => {
  if (!window.AdminSession?.getToken?.()) {
    return window.AdminSession?.redirectToLogin?.() || window.location.replace('/admin/index.html');
  }

  MS.init({
    activeKey: 'deposits',
    title: 'Deposits',
    breadcrumb: [
      { label: 'Home', href: '/admin/dashboard.html' },
      { label: 'Money' },
      { label: 'Deposits' }
    ]
  });

  renderContent();
  loadStats();
  loadList();
});

const API = {
  list:    '/api/admin/deposits',
  stats:   '/api/admin/deposits/stats',
  detail:  (source, id) => `/api/admin/deposits/${source}/${encodeURIComponent(id)}`,
  recheck: (source, id) => `/api/admin/reconciliation/recheck/${source}/${encodeURIComponent(id)}`,
  export:  '/api/admin/deposits/export'
};

const State = {
  page: 1,
  limit: 25,
  totalPages: 1,
  count: 0,
  source: 'all',
  filters: {},
};

function renderContent() {
  const root = document.getElementById('content');
  root.innerHTML = `
    <div class="page-header">
      <div>
        <h2>Deposits</h2>
        <div class="sub">How money enters MilesSpace. Every deposit shows the payment source, wallet credit, FX rate, provider reference, and webhook history.</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="reloadBtn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
        <button class="btn btn-primary" id="exportBtn" type="button"><i class="fas fa-download"></i> Export CSV</button>
      </div>
    </div>

    <div class="kpi-grid" id="statsRow"></div>

    <div class="filters-card">
      <div class="filters-bar">
        <select id="fSource" class="select-input" style="min-width:160px">
          <option value="all">All Sources</option>
          <option value="kora">Kora (Bank)</option>
          <option value="crypto">Crypto (NowPayments)</option>
        </select>
        <div class="search-input-wrap">
          <i class="fas fa-search"></i>
          <input type="search" id="fSearch" class="search-input" placeholder="Search reference, provider ref…" autocomplete="off">
        </div>
        <select id="fStatus" class="select-input">
          <option value="all">All Statuses</option>
          <option value="completed">Completed</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="failed">Failed</option>
          <option value="expired">Expired</option>
          <option value="manual_review">Manual Review</option>
          <option value="underpaid">Underpaid</option>
          <option value="overpaid">Overpaid</option>
          <option value="partially_paid">Partially Paid</option>
        </select>
        <select id="fWalletCurrency" class="select-input">
          <option value="all">All Currencies</option>
          <option value="NGN">NGN</option>
          <option value="USD">USD</option>
        </select>
        <input type="date" id="fFrom" class="date-input" aria-label="From date">
        <input type="date" id="fTo" class="date-input" aria-label="To date">
        <button class="btn btn-primary" id="applyBtn" type="button"><i class="fas fa-filter"></i> Apply</button>
        <button class="btn btn-ghost" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="applied-filters" id="appliedFilters"></div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Reference</th>
              <th>User</th>
              <th>Method</th>
              <th style="text-align:right">Customer Paid</th>
              <th style="text-align:right">Wallet Credit</th>
              <th style="text-align:right">Rate</th>
              <th style="text-align:right">Fee</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <div id="pageInfo">—</div>
        <div class="pagination" id="pagerControls"></div>
      </div>
    </div>`;

  document.getElementById('applyBtn').addEventListener('click', () => {
    readFilters(); State.page = 1; loadList();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    ['fSearch', 'fFrom', 'fTo'].forEach(id => document.getElementById(id).value = '');
    ['fSource', 'fStatus', 'fWalletCurrency'].forEach(id => document.getElementById(id).value = 'all');
    readFilters(); State.page = 1; loadList(); loadStats();
  });
  document.getElementById('reloadBtn').addEventListener('click', () => { loadList(); loadStats(); });
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('fSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { readFilters(); State.page = 1; loadList(); }
  });

  // Drawer close
  document.getElementById('ddClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerScrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
}

function readFilters() {
  State.source = document.getElementById('fSource').value;
  State.filters = {
    search: document.getElementById('fSearch').value.trim(),
    status: document.getElementById('fStatus').value,
    wallet_currency: document.getElementById('fWalletCurrency').value,
    from: document.getElementById('fFrom').value,
    to: document.getElementById('fTo').value,
  };
}

function statusBadge(s) {
  const t = String(s || '').toLowerCase();
  if (['completed', 'success'].includes(t)) return 'success';
  if (['failed', 'expired', 'cancelled'].includes(t)) return 'danger';
  if (['pending', 'processing', 'underpaid', 'partially_paid'].includes(t)) return 'warn';
  if (t === 'manual_review') return 'purple';
  if (t === 'overpaid') return 'info';
  return 'neutral';
}

async function loadStats() {
  const r = await MS.api(API.stats);
  const el = document.getElementById('statsRow');
  if (!el) return;
  if (!r.ok) {
    el.innerHTML = ['Kora Completed', 'Kora Pending', 'Kora Failed', 'Crypto Completed', 'Crypto Review']
      .map(l => `<div class="kpi-card"><div class="lbl">${l}</div><div class="val" style="font-size:13px;color:var(--text-faint)">Unavailable</div></div>`).join('');
    return;
  }
  const s = r.data.stats || r.data.data?.stats || {};
  const kora = s.kora || {};
  const crypto = s.crypto || {};
  const items = [
    { lbl: 'Kora Completed', val: kora.completed, color: 'var(--success)' },
    { lbl: 'Kora Pending',   val: kora.pending,   color: 'var(--warn)' },
    { lbl: 'Kora Failed',    val: kora.failed,    color: 'var(--danger)' },
    { lbl: 'Crypto Completed', val: crypto.completed, color: 'var(--success)' },
    { lbl: 'Crypto Review',  val: crypto.manual_review, color: 'var(--purple)' },
  ];
  el.innerHTML = items.map(i => `
    <div class="kpi-card">
      <div class="lbl">${i.lbl}</div>
      <div class="val" style="color:${i.color}">${MS.fmtInt(i.val) ?? '—'}</div>
    </div>`).join('');
}

function buildQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.page));
  q.set('limit', String(State.limit));
  if (State.source !== 'all') q.set('source', State.source);
  if (State.filters.search) q.set('search', State.filters.search);
  if (State.filters.status && State.filters.status !== 'all') q.set('status', State.filters.status);
  if (State.filters.wallet_currency && State.filters.wallet_currency !== 'all') q.set('wallet_currency', State.filters.wallet_currency);
  if (State.filters.from) q.set('from', State.filters.from);
  if (State.filters.to) q.set('to', State.filters.to);
  return q.toString();
}

async function loadList() {
  const tb = document.getElementById('tableBody');
  tb.innerHTML = Array.from({ length: 8 }).map(() => `
    <tr><td colspan="9"><span class="skel" style="width:${50 + Math.random() * 40}%;display:inline-block"></span></td></tr>`).join('');

  const r = await MS.api(API.list + '?' + buildQuery());

  if (!r.ok) {
    tb.innerHTML = `<tr><td colspan="9"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>Unable to load deposits.</div><button class="btn btn-ghost" onclick="loadList()" style="margin-top:10px"><i class="fas fa-rotate"></i> Retry</button></div></td></tr>`;
    return;
  }

  const data = r.data.data || r.data;
  const rows = data.deposits || [];
  State.totalPages = data.totalPages || 1;
  State.count = data.count || 0;

  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fas fa-inbox"></i><div class="title">No deposits</div><div class="sub">Try changing your filters.</div></div></td></tr>`;
    document.getElementById('pageInfo').textContent = 'No results';
    return;
  }

  tb.innerHTML = rows.map(d => {
    const user = d.user || { username: 'Unknown', email: '' };
    const payAmt = MS.fmtMoney(d.payment_amount, d.payment_currency) || '—';
    const wallAmt = MS.fmtMoney(d.wallet_amount, d.wallet_currency) || '—';
    const rate = d.customer_rate != null ? Number(d.customer_rate).toFixed(6) : (d.fx_rate != null ? Number(d.fx_rate).toFixed(6) : '—');
    const fee = MS.fmtMoney(d.fee_amount, d.fee_currency || d.wallet_currency) || '—';
    return `<tr data-source="${MS.esc(d.source)}" data-id="${MS.esc(d.id)}">
      <td data-cell="ref"><span class="mono" style="font-size:11px">${MS.esc(d.reference || '—')}</span></td>
      <td data-cell="user">
        <strong>${MS.esc(user.username || '—')}</strong>
        <span style="display:block;font-size:10.5px;color:var(--text-dim)">${MS.esc(user.email || '')}</span>
      </td>
      <td data-cell="method">${MS.esc(d.method || '—')}</td>
      <td data-cell="amount" style="text-align:right">${payAmt} <span style="font-size:10.5px;color:var(--text-faint)">${MS.esc(d.payment_currency || '')}</span></td>
      <td data-cell="amount" style="text-align:right;font-weight:700">${wallAmt} <span style="font-size:10.5px;color:var(--text-faint)">${MS.esc(d.wallet_currency || '')}</span></td>
      <td data-cell="rate" style="text-align:right"><span class="mono" style="font-size:11px">${MS.esc(rate)}</span></td>
      <td data-cell="fee" style="text-align:right">${fee}</td>
      <td data-cell="status"><span class="badge ${statusBadge(d.status)}">${MS.esc(d.status || '—')}</span></td>
      <td data-cell="date" title="${MS.esc(MS.fmtDateTime(d.created_at))}">${MS.esc(MS.timeAgo(d.created_at))}</td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openDetail(tr.dataset.source, tr.dataset.id));
  });

  document.getElementById('pageInfo').textContent = State.count
    ? `Showing ${(State.page - 1) * State.limit + 1}–${Math.min(State.page * State.limit, State.count)} of ${State.count}`
    : 'No results';
  renderPager();
}

function renderPager() {
  const c = document.getElementById('pagerControls');
  if (!c) return;
  c.innerHTML = '';
  if (State.totalPages <= 1) return;
  const mk = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener('click', () => { State.page = page; loadList(); });
    return b;
  };
  c.appendChild(mk('‹', State.page - 1, State.page <= 1, false));
  c.appendChild(mk(String(State.page), State.page, false, true));
  c.appendChild(mk('›', State.page + 1, State.page >= State.totalPages, false));
}

async function openDetail(source, id) {
  const drawer = document.getElementById('detailDrawer');
  const scrim = document.getElementById('drawerScrim');
  document.getElementById('ddIcon').innerHTML = source === 'crypto' ? '<i class="fab fa-bitcoin"></i>' : '<i class="fas fa-circle-down"></i>';
  document.getElementById('ddTitle').textContent = 'Loading…';
  document.getElementById('ddSub').textContent = '';
  document.getElementById('ddBody').innerHTML = '<div class="dd-empty">Loading deposit…</div>';
  drawer.classList.add('open');
  scrim.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  MS.lockScroll();

  const r = await MS.api(API.detail(source, id));
  if (!r.ok) {
    document.getElementById('ddBody').innerHTML = `<div class="dd-empty">${MS.esc(r.error || 'Unable to load deposit.')}</div>`;
    return;
  }
  renderDetail(source, r.data.data || r.data);
}

function closeDrawer() {
  document.getElementById('detailDrawer').classList.remove('open');
  document.getElementById('drawerScrim').classList.remove('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'true');
  MS.unlockScroll();
}

function renderDetail(source, data) {
  const d = data.deposit || {};
  const u = data.user || {};
  const wh = data.webhooks || [];
  const tx = data.transaction;

  document.getElementById('ddTitle').textContent = d.reference || d.id || 'Deposit';
  document.getElementById('ddSub').textContent = (d.method || '') + ' · ' + (u.username || u.email || '');

  const wallAmt = MS.fmtMoney(d.wallet_amount, d.wallet_currency) || '—';
  const payAmt = MS.fmtMoney(d.payment_amount, d.payment_currency) || '—';

  const hero = `
    <div class="dd-hero">
      <div>
        <div class="amount credit">+${MS.esc(wallAmt)}</div>
        <div class="meta">${MS.esc(d.wallet_currency || '')} credited</div>
      </div>
      <div style="text-align:right">
        <span class="badge ${statusBadge(d.status)}">${MS.esc(d.status || '—')}</span>
        <div class="meta" style="margin-top:6px">${MS.esc(MS.fmtDateTime(d.created_at))}</div>
      </div>
    </div>`;

  const fields = [
    ['Deposit ID', d.id],
    ['Reference', d.reference],
    ['User', u.username || u.email || '—'],
    ['Method', d.method],
    ['Provider Reference', d.provider_reference || '—'],
    ['Merchant Reference', d.merchant_reference || '—'],
    ['Payment Currency', d.payment_currency || '—'],
    ['Payment Amount', payAmt],
    ['Wallet Currency', d.wallet_currency || '—'],
    ['Wallet Amount', wallAmt],
    ['Customer Rate', d.customer_rate != null ? String(d.customer_rate) : '—'],
    ['Fee', MS.fmtMoney(d.fee_amount, d.fee_currency || d.wallet_currency) || '—'],
    ['Created', MS.fmtDateTime(d.created_at)],
    ['Completed', MS.fmtDateTime(d.completed_at)],
    ['Failure', d.failure_reason || '—'],
  ];
  if (source === 'crypto') {
    fields.push(['Network', d.pay_network || '—']);
    fields.push(['Crypto Currency', d.pay_currency || '—']);
    fields.push(['Requested USD', MS.fmtMoney(d.requested_usd, 'USD') || '—']);
    fields.push(['Actually Paid', d.actually_paid_crypto != null ? String(d.actually_paid_crypto) : '—']);
    fields.push(['Outcome USD', MS.fmtMoney(d.outcome_usd, 'USD') || '—']);
  }

  const detailHtml = `
    <div class="dd-section">
      <div class="dd-section-title">Deposit Detail</div>
      ${fields.map(([k, v]) => `<div class="dd-field"><span class="k">${MS.esc(k)}</span><span class="v">${MS.esc(String(v))}</span></div>`).join('')}
    </div>`;

  const whHtml = wh.length
    ? `<div class="dd-section">
        <div class="dd-section-title">Webhook Events (${wh.length})</div>
        ${wh.map(w => `
          <div class="dd-field" style="flex-direction:column;align-items:stretch;gap:4px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:600">${MS.esc(w.event_type || '—')}</span>
              <span class="badge ${w.signature_valid ? 'success' : 'danger'}">${w.signature_valid ? 'Verified' : 'Unverified'}</span>
            </div>
            <div style="font-size:11px;color:var(--text-dim)">${MS.esc(w.processing_status || '')} · ${MS.esc(MS.timeAgo(w.received_at))}</div>
          </div>`).join('')}
      </div>`
    : '';

  const actions = `
    <div class="dd-section">
      <div class="dd-section-title">Admin Actions</div>
      <button class="btn btn-ghost" id="recheckBtn" type="button" data-source="${MS.esc(source)}" data-id="${MS.esc(d.id)}">
        <i class="fas fa-rotate"></i> Verify with Provider
      </button>
    </div>`;

  document.getElementById('ddBody').innerHTML = hero + detailHtml + whHtml + actions;

  document.getElementById('recheckBtn')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const src = btn.dataset.source;
    const id = btn.dataset.id;
    const reason = await MS.reasonModal({
      title: 'Verify with provider',
      message: 'This will query the provider and report their status. It does NOT credit the wallet.',
      confirmText: 'Verify'
    });
    if (!reason) return;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';
    const r = await MS.api(API.recheck(src, id), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason })
    });
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-rotate"></i> Verify with Provider';

    if (r.ok) {
      MS.toast('Verification complete.', 'success');
      openDetail(src, id);
      loadList();
      loadStats();
    } else {
      MS.toast(r.error || 'Verification failed.', 'error');
    }
  });
}

async function exportCsv() {
  const q = new URLSearchParams();
  if (State.source !== 'all') q.set('source', State.source);
  if (State.filters.status && State.filters.status !== 'all') q.set('status', State.filters.status);
  if (State.filters.from) q.set('from', State.filters.from);
  if (State.filters.to) q.set('to', State.filters.to);
  await MS.downloadCsv(
    API.export + (q.toString() ? '?' + q.toString() : ''),
    { filename: `deposits_${Date.now()}.csv` }
  );
}

window.loadList = loadList;
</script>
</body>
</html>
