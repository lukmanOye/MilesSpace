<style>
/* 
   Minimal page-specific layout overrides. 
   All base UI, colors, sidebar, and table styles are handled by admin-shell.css.
   Do not duplicate the shell's CSS here or it breaks the sidebar.
*/
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
@media(max-width: 1100px) { .stats-row { grid-template-columns: repeat(3, 1fr); } }
@media(max-width: 768px) { .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
@media(max-width: 600px) { .stats-row { grid-template-columns: 1fr; } }

.stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 15px;
  min-width: 0;
  position: relative;
}
.stat .lbl {
  font-size: 10.5px; font-weight: 700; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
}
.stat .val {
  font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
  line-height: 1.2; overflow-wrap: anywhere;
}
.stat .val.is-unavail { font-size: 14px; font-weight: 600; color: var(--text-faint); }

/* Table tweaks */
.table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
tbody td[data-cell="ref"] { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); word-break: break-all; }
tbody td[data-cell="amount"] { text-align: right; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
tbody td[data-cell="fee"] { text-align: right; font-size: 11px; color: var(--text-faint); }
tbody td[data-cell="date"] { font-size: 11px; color: var(--text-faint); white-space: nowrap; }
tbody td[data-cell="status"], tbody td[data-cell="provider"] { text-align: center; }
tbody th { text-align: left; padding: 11px 14px; font-size: 10.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; background: var(--bg-alt); border-bottom: 1px solid var(--border); }

/* Mobile tweaks for table */
@media(max-width: 768px) {
  table { min-width: 0; display: block; }
  thead { display: none; }
  tbody { display: block; }
  tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 10px; border-bottom: 1px solid var(--border); min-height: 64px; }
  tbody td { display: block; padding: 0; border: 0; font-size: 12.5px; text-align: left !important; }
  tbody td[data-cell="ref"] { grid-column: 1; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); word-break: break-all; }
  tbody td[data-cell="amount"] { grid-column: 2; text-align: right !important; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  tbody td[data-cell="fee"] { grid-column: 2; text-align: right !important; font-size: 11px; color: var(--text-faint); }
  tbody td[data-cell="user"] { grid-column: 1; font-weight: 700; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody td[data-cell="type"] { grid-column: 1; font-size: 11.5px; color: var(--text-dim); }
  tbody td[data-cell="status"] { grid-column: 2; text-align: right !important; }
  tbody td[data-cell="date"] { grid-column: 2; text-align: right !important; font-size: 11px; color: var(--text-faint); }
  tbody td[data-cell="provider"] { display: none; }
}

/* Badge styling for the statuses */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 10.5px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; line-height: 1.4; }
.badge.success { background: var(--success-bg); color: var(--success); border-color: var(--success-bd); }
.badge.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-bd); }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
.badge.info { background: var(--info-bg); color: var(--info); border-color: var(--info-bd); }
.badge.purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-bd); }
.badge.neutral { background: var(--bg); color: var(--text-dim); border-color: var(--border); }

.amt-credit { color: var(--success); font-weight: 700; }
.amt-debit { color: var(--danger); font-weight: 700; }

/* Drawer detail styles */
.detail-drawer { z-index: 90; }
.dd-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; overflow-x: auto; scrollbar-width: none; }
.dd-tabs::-webkit-scrollbar { display: none; }
.dd-tab { padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; min-height: 36px; white-space: nowrap; }
.dd-tab.active { color: var(--navy); border-bottom-color: var(--gold); }
html.dark .dd-tab.active { color: #dff0f2; }
.dd-tab-content { display: none; }
.dd-tab-content.active { display: block; }
.dd-section { margin-bottom: 20px; }
.dd-section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.dd-field { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
.dd-field .k { color: var(--text-dim); font-weight: 600; flex-shrink: 0; min-width: 130px; }
.dd-field .v { font-weight: 700; text-align: right; word-break: break-word; overflow-wrap: anywhere; }
.dd-field .v.copyable { display: flex; align-items: center; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.copy-btn { border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; font-size: 10px; padding: 4px 8px; border-radius: 4px; min-height: 28px; font-family: inherit; }
.copy-btn:hover { background: var(--bg); color: var(--text); }
.dd-tx-list { display: flex; flex-direction: column; gap: 8px; }
.dd-tx-item { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); font-size: 12px; }
.dd-tx-item .row1 { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 10px; align-items: center; flex-wrap: wrap; }
.dd-tx-item .row2 { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
.dd-empty { text-align: center; color: var(--text-faint); padding: 24px 10px; font-size: 12.5px; }
.integrity-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.integrity-badge.ok { background: var(--success-bg); color: var(--success); }
.integrity-badge.warn { background: var(--warn-bg); color: var(--warn); }
.integrity-badge.unavail { background: var(--bg); color: var(--text-faint); border: 1px solid var(--border); }
.dd-hero { padding: 16px 18px; border-radius: var(--r-md); background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dd-hero .amount { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dd-hero .amount.credit { color: var(--success); }
.dd-hero .amount.debit { color: var(--danger); }
.dd-hero .meta { font-size: 11px; color: var(--text-faint); }
.dd-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px; border-radius: var(--r-md); background: var(--bg-card); border: 1px solid var(--border); }
/* ═══════════════════════════════════════════════════════════════════
   FIX: Sidebar Nav Group Headers (White Box Issue)
   ═══════════════════════════════════════════════════════════════════ */
.nav-group-head {
    background: transparent !important;
    border: none !important;
    color: rgba(255, 255, 255, 0.6) !important; /* Dimmed white for the label */
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px 6px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
}

.nav-group-head:hover {
    background: rgba(255, 255, 255, 0.05) !important;
}

.nav-group-head .nav-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 700;
    color: #6fa2ad; /* Muted teal/blue color from your theme */
}

/* Ensure the chevron icon is styled correctly */
.nav-group-head .chev {
    font-size: 10px;
    color: #6fa2ad;
    transition: transform 0.2s ease;
}

/* Rotate chevron when group is collapsed */
.nav-group.collapsed .chev {
    transform: rotate(-90deg);
}
</style>

<script>
'use strict';

const API = {
  list:    '/api/admin/transactions',
  summary: '/api/admin/transactions/summary',
  detail:  id => '/api/admin/transactions/' + encodeURIComponent(id),
  status:  id => '/api/admin/transactions/' + encodeURIComponent(id) + '/status',
  refund:  id => '/api/admin/transactions/' + encodeURIComponent(id) + '/refund',
  note:    id => '/api/admin/transactions/' + encodeURIComponent(id) + '/note',
  export:  '/api/admin/transactions/export',
  types:   '/api/admin/transactions/types'
};

const CURRENCY_SYMBOLS = { NGN: '₦', USD: '$', GHS: 'GH₵', KES: 'KSh', ZAR: 'R' };
const TIMEZONE = 'Africa/Lagos';
const APPROVAL_THRESHOLD_NGN = 100_000;
const APPROVAL_THRESHOLD_USD = 200;
const MAX_REFUND_AMOUNT = 10_000_000;

const State = {
  page: 1,
  limit: 25,
  totalPages: 1,
  count: 0,
  filters: {},
  currentTransaction: null,
  currentDetail: null,
  requestToken: 0,
  listAbortController: null,
  statsAbortController: null,
  typesLoaded: false,
  typeRegistry: null
};

const qs  = (s, r = document) => r.querySelector(s);
const qsa = (s, r = document) => Array.from(r.querySelectorAll(s));

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function fmtMoney(v, c) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!Number.isFinite(n)) return null;
  const ccy = String(c || '').toUpperCase();
  return (CURRENCY_SYMBOLS[ccy] || (ccy ? ccy + ' ' : ''))
    + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtNum(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!Number.isFinite(n)) return null;
  return n.toLocaleString('en-US');
}

function timeAgo(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (!Number.isFinite(s)) return '—';
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function fmtDateTimeWAT(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return new Intl.DateTimeFormat('en-GB', {
      timeZone: TIMEZONE,
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).format(d) + ' WAT';
  } catch (_) { return '—'; }
}

function statusBadge(s) {
  const t = String(s || '').toLowerCase();
  if (['completed','success','delivered'].includes(t)) return 'success';
  if (['failed','cancelled','reversed','expired'].includes(t)) return 'danger';
  if (['pending','processing','confirming','partially_paid'].includes(t)) return 'warn';
  if (t === 'manual_review') return 'purple';
  if (t === 'refunded') return 'info';
  return 'neutral';
}

function toast(msg, kind = 'info', duration = 3600) {
  const stack = qs('#toastStack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'warning' ? 'warn' : kind);
  const icons = { success:'fa-circle-check', error:'fa-circle-xmark', warn:'fa-triangle-exclamation', info:'fa-circle-info' };
  el.innerHTML = `<i class="fas ${icons[kind] || icons.info}" aria-hidden="true"></i><span>${esc(msg)}</span>`;
  stack.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    el.style.transition = 'all 200ms ease';
    setTimeout(() => el.remove(), 220);
  }, duration);
  while (stack.children.length > 5) stack.firstElementChild.remove();
}

function initials(name) {
  if (!name) return '—';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

async function apiFetch(url, opts = {}) {
  if (!window.AdminSession || typeof window.AdminSession.fetch !== 'function') {
    return { ok: false, status: 0, code: 'NO_SESSION_LAYER', error: 'Authentication layer not loaded.' };
  }
  try {
    const res = await AdminSession.fetch(url, opts);
    const ct = res.headers.get('content-type') || '';
    let json = null;
    if (ct.includes('application/json')) {
      try { json = await res.json(); } catch (_) { json = null; }
    }
    if (!res.ok) {
      return {
        ok: false,
        status: res.status,
        code: json?.code || ('HTTP_' + res.status),
        error: json?.error || 'Request failed',
        requestId: json?.requestId || res.headers.get('X-Request-Id'),
        extra: json || {}
      };
    }
    return { ok: true, status: res.status, data: json, raw: res };
  } catch (e) {
    if (e.name === 'AbortError') return { ok: false, aborted: true };
    return {
      ok: false, status: e.status || 0,
      code: e.code || 'NETWORK_ERROR',
      error: e.message || 'Network error',
      extra: e
    };
  }
}

function initSidebarToggle() {
  const sidebar = qs('#sidebar');
  const scrim = qs('#scrim');
  const hbg = qs('#hamburger');
  const collapse = qs('#sbCollapseBtn');
  const toggleDesktop = qs('#sbToggleDesktop');
  const app = qs('#appRoot');
  if (!sidebar) return;

  const openSidebar = () => {
    sidebar.classList.add('open');
    scrim.classList.add('show');
    hbg?.setAttribute('aria-expanded', 'true');
    document.body.classList.add('sb-open');
  };
  const closeSidebar = () => {
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
    hbg?.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('sb-open');
  };

  hbg?.addEventListener('click', openSidebar);
  scrim?.addEventListener('click', closeSidebar);

  sidebar.addEventListener('click', (e) => {
    const link = e.target.closest('.nav-item');
    if (link && window.matchMedia('(max-width:900px)').matches) closeSidebar();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
  });

  const applyCollapsed = (collapsed) => {
    app.classList.toggle('sb-collapsed', collapsed);
    try { localStorage.setItem('ms_sb_collapsed', collapsed ? '1' : '0'); } catch {}
  };
  try {
    if (localStorage.getItem('ms_sb_collapsed') === '1') app.classList.add('sb-collapsed');
  } catch {}
  collapse?.addEventListener('click', () => applyCollapsed(!app.classList.contains('sb-collapsed')));
  toggleDesktop?.addEventListener('click', () => applyCollapsed(!app.classList.contains('sb-collapsed')));
}

function initTheme() {
  const btn = qs('#themeToggle');
  const apply = (dark) => {
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.classList.toggle('light', !dark);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    if (btn) btn.innerHTML = `<i class="fas ${dark ? 'fa-sun' : 'fa-moon'}" aria-hidden="true"></i>`;
    try { localStorage.setItem('ms-theme', dark ? 'dark' : 'light'); } catch {}
  };
  let saved = 'light';
  try { saved = localStorage.getItem('ms-theme') || 'light'; } catch {}
  apply(saved === 'dark');
  btn?.addEventListener('click', () => {
    const dark = !document.documentElement.classList.contains('dark');
    apply(dark);
  });
}

async function loadTypes() {
  if (State.typesLoaded) return;
  const r = await apiFetch(API.types);
  if (!r.ok) return;
  const registry = r.data?.registry || r.data?.data?.registry;
  if (!registry) return;
  State.typeRegistry = registry;

  const sel = qs('#fType');
  if (!sel) return;
  const opts = ['<option value="">All Types</option>'];
  const byGroup = new Map();
  for (const t of registry.types || []) {
    if (!byGroup.has(t.group)) byGroup.set(t.group, []);
    byGroup.get(t.group).push(t);
  }
  for (const g of registry.groups || []) {
    const list = byGroup.get(g.key) || [];
    if (!list.length) continue;
    opts.push(`<optgroup label="${esc(g.label)}">`);
    for (const t of list) opts.push(`<option value="${esc(t.key)}">${esc(t.label)}</option>`);
    opts.push('</optgroup>');
  }
  sel.innerHTML = opts.join('');
  State.typesLoaded = true;
}

function syncUrlFromState({ replace = false } = {}) {
  const p = new URLSearchParams();
  const f = State.filters;
  if (f.search) p.set('search', f.search);
  if (f.type) p.set('type', f.type);
  if (f.status && f.status !== 'all') p.set('status', f.status);
  if (f.currency && f.currency !== 'all') p.set('currency', f.currency);
  if (f.feedback && f.feedback !== 'all') p.set('feedback', f.feedback);
  if (f.provider) p.set('provider', f.provider);
  if (f.user_id) p.set('user_id', f.user_id);
  if (f.from) p.set('from', f.from);
  if (f.to) p.set('to', f.to);
  if (f.limit !== '25') p.set('limit', f.limit);
  if (State.page > 1) p.set('page', String(State.page));
  if (f.sort) p.set('sort', f.sort);
  if (f.order) p.set('order', f.order);

  const hash = State.currentTransaction && State.currentTransaction.id
    ? '#tx=' + encodeURIComponent(State.currentTransaction.id)
    : '';
  const url = window.location.pathname
    + (p.toString() ? '?' + p.toString() : '')
    + hash;

  if (replace) window.history.replaceState(null, '', url);
  else window.history.pushState(null, '', url);
}

function transactionIdFromHash() {
  const m = window.location.hash.match(/#tx=([a-f0-9\-]{36})/i);
  return m ? m[1] : null;
}

function renderAppliedFilters() {

  if (f.currency && f.currency !== 'all') push('Currency: ' + f.currency, 'currency');

      else if (key === 'currency') qs('#fCurrency').value = 'all';
      else if (key === 'feedback') qs('#fFeedback').value = 'all';
      else if (key === 'provider') qs('#fProvider').value = '';
      else if (key === 'user_id') qs('#fUserId').value = '';
      else if (key === 'from') qs('#fFrom').value = '';
      else if (key === 'to') qs('#fTo').value = '';

function buildQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.page));
  q.set('limit', State.limit);
  const f = State.filters;
  if (f.search) q.set('search', f.search);
  if (f.type) q.set('type', f.type);
  if (f.status && f.status !== 'all') {
    const s = String(f.status).replace(/^group:/, '');
    q.set('status', s);
  }
  if (f.currency && f.currency !== 'all') q.set('currency', f.currency);
  if (f.feedback && f.feedback !== 'all') q.set('feedback', f.feedback);
  if (f.provider) q.set('provider', f.provider);
  if (f.user_id) q.set('user_id', f.user_id);
  if (f.from) q.set('from', f.from);
  if (f.to) q.set('to', f.to);
  if (f.sort) q.set('sort', f.sort);
  if (f.order) q.set('order', f.order);
  return q.toString();
}

async function loadList() {
  if (State.listAbortController) State.listAbortController.abort();
  State.listAbortController = new AbortController();
  const myToken = ++State.requestToken;

  renderSkeleton();
  renderAppliedFilters();

  const r = await apiFetch(API.list + '?' + buildQuery(), {
    signal: State.listAbortController.signal
  });
  if (r.aborted || myToken !== State.requestToken) return;

  if (!r.ok) {
    renderError(r.error);
    qs('#pageInfo').textContent = '—';
    qs('#pagerControls').innerHTML = '';
    return;
  }
  const p = r.data?.data || r.data || {};
  State.totalPages = p.totalPages || 1;
  State.count = p.count || 0;
  renderRows(p.transactions || []);

  const start = State.count ? (State.page - 1) * State.limit + 1 : 0;
  const end = Math.min(State.page * State.limit, State.count);
  qs('#pageInfo').textContent = State.count
    ? `Showing ${start}–${end} of ${State.count}`
    : 'No results';
  renderPager();
}

function renderPager() {
  const c = qs('#pagerControls');
  if (!c) return;
  c.innerHTML = '';
  if (State.totalPages <= 1) return;
  const mk = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    if (active) b.setAttribute('aria-current', 'page');
    b.addEventListener('click', () => {
      State.page = page;
      loadList();
      syncUrlFromState();
    });
    return b;
  };
  c.appendChild(mk('‹', State.page - 1, State.page <= 1, false));
  const pages = new Set([1, State.totalPages, State.page - 1, State.page, State.page + 1]);
  const arr = Array.from(pages).filter(p => p >= 1 && p <= State.totalPages).sort((a, b) => a - b);
  let last = 0;
  for (const p of arr) {
    if (p - last > 1) {
      const d = document.createElement('span');
      d.textContent = '…';
      d.style.padding = '0 4px';
      d.style.color = 'var(--text-faint)';
      c.appendChild(d);
    }
    c.appendChild(mk(String(p), p, false, p === State.page));
    last = p;
  }
  c.appendChild(mk('›', State.page + 1, State.page >= State.totalPages, false));
}

let _drawerReturnFocus = null;

function openDrawer() {
  _drawerReturnFocus = document.activeElement;
  const drawer = qs('#detailDrawer');
  const scrim = qs('#drawerScrim');
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  scrim.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const focusable = drawer.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable) focusable.focus();
    else qs('#ddClose')?.focus();
  }, 100);
  if (!drawer._trapBound) {
    drawer._trapBound = true;
    drawer.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const focusables = drawer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });
  }
}

function closeDrawer() {
  const drawer = qs('#detailDrawer');
  const scrim = qs('#drawerScrim');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  scrim.classList.remove('open');
  document.body.style.overflow = '';
  State.currentTransaction = null;
  State.currentDetail = null;
  if (_drawerReturnFocus && typeof _drawerReturnFocus.focus === 'function') {
    try { _drawerReturnFocus.focus(); } catch (_) {}
  }
  syncUrlFromState();
}

async function openDetail(id) {
  const token = ++State.requestToken;

  qs('#ddSub').textContent = '';
  qs('#ddBody').innerHTML = '<div class="dd-empty">Loading transaction…</div>';
  openDrawer();

  const r = await apiFetch(API.detail(id));
  if (token !== State.requestToken) return;

  if (!r.ok) {
    qs('#ddBody').innerHTML = `<div class="dd-empty">${esc(r.error || 'Unable to load transaction.')}</div>`;
    return;
  }
  const p = r.data?.data || r.data;
  State.currentTransaction = p.transaction;
  State.currentDetail = p;
  renderDetail(p);
}

function renderDetail(p) {
  const t = p.transaction;
  const u = p.user;
  const service = p.service_record;
  const serviceKind = p.service_kind;
  const led = p.ledger_entries || [];
  const ledAvail = p.ledger_available !== false;
  const audit = p.audit || [];
  const auditAvail = p.audit_available !== false;
  const refunds = p.refunds || [];
  const refundsAvail = p.refunds_available !== false;
  const refundPolicy = p.refund_policy;
  const allowedTransitions = Array.isArray(p.allowed_transitions) ? p.allowed_transitions : [];
  const canResolve = p.can_resolve === true;
  const canRefund = p.can_refund === true;
  const integrity = p.ledger_integrity;
  const feedback = p.feedback || null;
  const primaryRef = t.customer_reference || t.reference || t.id;

function buildActions(t, allowedTransitions, canResolve, canRefund, refundPolicy) {
  const buttons = [];
  if (canResolve && Array.isArray(allowedTransitions) && allowedTransitions.length) {
    buttons.push(`<button class="btn btn-ghost" id="btnChangeStatus" type="button"><i class="fas fa-exchange-alt" aria-hidden="true"></i> Change status</button>`);
  }
  // F: Refund button follows the server-computed refund_policy, not the
  // ledger's own status.
  if (canRefund && refundPolicy && refundPolicy.eligible) {
    const override = refundPolicy.override === true;
    const label = override ? 'Refund (override)' : 'Refund to wallet';
    buttons.push(`<button class="btn btn-danger" id="btnRefund" type="button"><i class="fas fa-undo" aria-hidden="true"></i> ${label}</button>`);
  }
  if (canResolve) {
    buttons.push(`<button class="btn btn-ghost" id="btnNote" type="button"><i class="fas fa-sticky-note" aria-hidden="true"></i> Add note</button>`);
  }
  if (!buttons.length) {
    return `<div class="dd-actions"><span style="font-size:12px;color:var(--text-faint)">No actions available for this transaction.</span></div>`;
  }
  return `<div class="dd-actions">${buttons.join('')}</div>`;
}

let _modalReturnFocus = null;
let _modalStack = [];

function openModal({ title, bodyHtml, confirmLabel = 'Confirm', onConfirm, confirmClass = 'btn-primary' }) {
  const scrim = qs('#modalScrim');
  _modalReturnFocus = document.activeElement;
  qs('#modalTitle').textContent = title;
  qs('#modalBody').innerHTML = bodyHtml;
  const confirmBtn = qs('#modalConfirm');
  confirmBtn.textContent = confirmLabel;
  confirmBtn.className = 'btn ' + confirmClass;
  confirmBtn.disabled = false;

  const close = () => {
    scrim.classList.remove('open');
    scrim.setAttribute('aria-hidden', 'true');
    _modalStack = _modalStack.filter(x => x !== close);
    confirmBtn.onclick = null;
    if (_modalReturnFocus && typeof _modalReturnFocus.focus === 'function') {
      try { _modalReturnFocus.focus(); } catch (_) {}
    }
  };
  _modalStack.push(close);

  qs('#modalCancel').onclick = close;
  qs('#modalClose').onclick = close;
  confirmBtn.onclick = async () => {
    confirmBtn.disabled = true;
    try {
      const ok = await onConfirm();
      if (ok) close();
    } finally {
      confirmBtn.disabled = false;
    }
  };
  scrim.classList.add('open');
  scrim.setAttribute('aria-hidden', 'false');
  setTimeout(() => {
    const firstInput = scrim.querySelector('select, input, textarea');
    if (firstInput) firstInput.focus();
    else confirmBtn.focus();
  }, 50);
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (_modalStack.length) {
    e.preventDefault();
    const close = _modalStack[_modalStack.length - 1];
    close();
    return;
  }
  if (qs('#detailDrawer').classList.contains('open')) {
    e.preventDefault();
    closeDrawer();
  }
});

qs('#modalScrim').addEventListener('click', (e) => {
  if (e.target.id === 'modalScrim') {
    const top = _modalStack[_modalStack.length - 1];
    if (top) top();
  }
});

function openStatusModal(t, allowed) {
  if (!Array.isArray(allowed) || !allowed.length) {
    toast('No operational transitions available.', 'info');
    return;
  }
  openModal({
    title: 'Change operational status',
    confirmLabel: 'Apply',
    bodyHtml: `
      <div class="notice info">This changes the operational status only. Setting "failed" does <strong>not</strong> refund the customer. Refunds are a separate operation.</div>
      <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">Current status: <strong>${esc((t.status || '').replace(/_/g, ' '))}</strong></div>
      <label for="statusNext">New status</label>
      <select id="statusNext">${allowed.map(s => `<option value="${esc(s)}">${esc(s.replace(/_/g, ' '))}</option>`).join('')}</select>
      <label for="statusReason">Reason (required, min 4 chars)</label>
      <textarea id="statusReason" rows="3" placeholder="Why is this changing?"></textarea>
    `,
    onConfirm: async () => {
      const next = qs('#statusNext').value;
      const reason = qs('#statusReason').value.trim();
      if (reason.length < 4) { toast('Reason required.', 'error'); return false; }
      const r = await apiFetch(API.status(t.id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: next, reason })
      });
      if (!r.ok) {
        if (r.code === 'TX_CHANGED' || r.code === 'STALE_VERSION') {
          toast('This transaction was modified by another admin. Reloading…', 'warn');
          closeDrawer();
          await loadList();
          return true;
        }
        toast(r.error || 'Status change failed.', 'error');
        return false;
      }
      toast('Status updated.', 'success');
      await loadList();
      await loadStats();
      openDetail(t.id);
      return true;
    }
  });
}

function openRefundModal(t, policy) {
  if (!policy || !policy.eligible) {
    toast(policy?.reason_label ? policy.reason_label : 'Refund not available.', 'info');
    return;
  }
  const isOverride = policy.override === true;
  const currency = String(t.currency || '').toUpperCase();
  const totalAmount = Number(t.absolute_amount) || 0;
  const threshold = currency === 'USD' ? APPROVAL_THRESHOLD_USD : APPROVAL_THRESHOLD_NGN;
  const remaining = totalAmount; // No prior refunds reduce it in this view.
  const userEmail = (State.currentDetail?.user?.email) || t.user?.email || '';
  const idempotencyKey = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'refund-' + t.id + '-' + Date.now();

  openModal({
    title: isOverride ? 'Refund (override)' : 'Refund to wallet',
    confirmLabel: 'Refund',
    confirmClass: isOverride ? 'btn-danger' : 'btn-primary',
    bodyHtml: `
      ${isOverride ? `<div class="notice warn"><strong>Override active.</strong> The linked service is not in a refundable state, but you hold the override permission. The reason will be audited.</div>` : ''}
      <div class="notice info">This credits the customer's wallet for the amount below and records the refund via refundService.</div>
      <div class="summary">
        <div class="row"><span class="k">Original</span><span>${esc(fmtMoney(totalAmount, currency) || '—')}</span></div>
        <div class="row"><span class="k">Remaining</span><span>${esc(fmtMoney(remaining, currency) || '0.00')}</span></div>
      </div>
      <label for="refundAmount">Amount (${esc(currency)})</label>
      <div style="display:flex;gap:6px;margin-bottom:4px">
        <input type="text" inputmode="decimal" id="refundAmount" placeholder="0.00" autocomplete="off">
        <button class="btn btn-ghost" type="button" id="fullAmountBtn" style="flex-shrink:0;min-height:40px">Full amount</button>
      </div>
      <label for="refundReason">Reason (required, min 4 chars)</label>
      <textarea id="refundReason" rows="3" placeholder="Why is this being refunded?"></textarea>
      <div class="notice danger" id="refundConfirm" style="display:none;margin-top:10px">
        <strong>Confirm:</strong> <span id="refundConfirmText"></span>
        <label for="refundTyped" style="margin-top:8px">Type <strong>REFUND</strong> to confirm</label>
        <input type="text" id="refundTyped" autocomplete="off" placeholder="REFUND">
      </div>
    `,
    onConfirm: async () => {
      const amountStr = qs('#refundAmount').value.trim();
      const reason = qs('#refundReason').value.trim();

      if (!/^\d+(\.\d{1,2})?$/.test(amountStr)) {
        toast('Amount must be a number with at most 2 decimal places.', 'error'); return false;
      }
      const amountNum = Number(amountStr);
      if (!Number.isFinite(amountNum) || amountNum <= 0) { toast('Enter a valid amount.', 'error'); return false; }
      if (amountNum > MAX_REFUND_AMOUNT) { toast(`Amount cannot exceed ${fmtMoney(MAX_REFUND_AMOUNT, currency)}.`, 'error'); return false; }
      if (amountNum > remaining + 1e-9) { toast('Amount exceeds the remaining refundable balance.', 'error'); return false; }
      if (reason.length < 4) { toast('Reason required (min 4 characters).', 'error'); return false; }

      const needsTyped = amountNum >= threshold;
      if (needsTyped) {
        const typed = qs('#refundTyped')?.value.trim() || '';
        if (typed !== 'REFUND') { toast('Type REFUND to confirm.', 'error'); return false; }
      }

      const body = JSON.stringify({ amount: amountStr, reason });
      const opts = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': idempotencyKey },
        body
      };

      let r = await apiFetch(API.refund(t.id), opts);

      if (!r.ok && (r.code === 'STEP_UP_EXPIRED' || r.code === 'MFA_REQUIRED')) {
        toast('Additional verification required. Complete MFA to retry.', 'warn');
        try {
          if (window.AdminSession && typeof window.AdminSession.verify === 'function') {
            await window.AdminSession.verify();
          }
        } catch (_) {
          toast('Verification failed. Please try again.', 'error');
          return false;
        }
        r = await apiFetch(API.refund(t.id), opts);
      }

      if (!r.ok) {
        if (r.code === 'REFUND_ALREADY_IN_FLIGHT') toast('A refund for this transaction is already in progress.', 'warn');
        else if (r.code === 'REFUND_PREVIOUSLY_FAILED') toast('A previous attempt failed. Close and reopen the refund form to retry.', 'error');
        else if (r.code === 'REFUND_EXCEEDS_REMAINING' || r.code === 'TX_NOT_REFUNDABLE') toast(r.error || 'Refund not available.', 'warn');
        else toast(r.error || 'Refund failed.', 'error');
        return false;
      }

      const refund = r.data?.refund || r.data?.data?.refund || {};
      if (refund.status === 'PENDING_APPROVAL') toast('Refund created — pending approval by a second admin.', 'success');
      else if (refund.status === 'PROCESSING') toast('Refund initiated.', 'success');
      else toast('Refund applied.', 'success');

      await loadList();
      await loadStats();
      openDetail(t.id);
      return true;
    }
  });

  setTimeout(() => {
    qs('#fullAmountBtn')?.addEventListener('click', () => {
      qs('#refundAmount').value = String(remaining.toFixed(2));
      maybeShowTypedConfirm();
    });
    qs('#refundAmount')?.addEventListener('input', maybeShowTypedConfirm);
    function maybeShowTypedConfirm() {
      const raw = qs('#refundAmount').value.trim();
      const n = Number(raw);
      if (Number.isFinite(n) && n >= threshold) {
        qs('#refundConfirm').style.display = 'block';
        qs('#refundConfirmText').textContent =
          'Credit ' + (fmtMoney(n, currency) || n) + ' to ' + (userEmail || 'customer') +
          ' — this will go to approval.';
      } else {
        qs('#refundConfirm').style.display = 'none';
        const el = qs('#refundTyped');
        if (el) el.value = '';
      }
    }
  }, 60);
}

function openNoteModal(t) {
  openModal({
    title: 'Add internal note',
    confirmLabel: 'Save note',
    bodyHtml: `
      <label for="noteText">Note (admins only, max 1000 chars)</label>
      <textarea id="noteText" rows="4" placeholder="Add context for other admins…" maxlength="1000"></textarea>
    `,
    onConfirm: async () => {
      const note = qs('#noteText').value.trim();
      if (note.length < 2) { toast('Note text is required.', 'error'); return false; }
      const r = await apiFetch(API.note(t.id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note })
      });
      if (!r.ok) { toast(r.error || 'Failed to add note.', 'error'); return false; }
      toast('Note added.', 'success');
      openDetail(t.id);
      return true;
    }
  });
}

function readFilters() {
  State.filters = {
    search:   qs('#fSearch').value.trim(),
    type:     qs('#fType').value,
    status:   qs('#fStatus').value,
    currency: qs('#fCurrency').value,
    feedback: qs('#fFeedback').value || 'all',
    provider: qs('#fProvider').value.trim(),
    user_id:  qs('#fUserId').value.trim(),
    from:     qs('#fFrom').value,
    to:       qs('#fTo').value,
    limit:    qs('#fLimit').value,
    sort:     State.filters.sort || '',
    order:    State.filters.order || ''
  };
  State.limit = parseInt(State.filters.limit, 10) || 25;
}

async function exportCsv() {
  const btn = qs('#exportBtn');
  const prevHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Preparing…';
  try {
    const q = new URLSearchParams();
    const f = State.filters;
    if (f.from) q.set('from', f.from);
    if (f.to) q.set('to', f.to);
    if (f.status && f.status !== 'all') q.set('status', String(f.status).replace(/^group:/, ''));
    if (f.currency && f.currency !== 'all') q.set('currency', f.currency);
    if (f.type) q.set('type', f.type);
    if (f.provider) q.set('provider', f.provider);
    if (f.user_id) q.set('user_id', f.user_id);
    if (f.search) q.set('search', f.search);

    const url = API.export + (q.toString() ? '?' + q.toString() : '');
    const res = await AdminSession.fetch(url);

    if (!res.ok) {
      let err = null;
      try { err = await res.json(); } catch (_) {}
      toast(err?.error || 'Export failed.', 'error');
      return;
    }
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      const body = await res.json().catch(() => null);
      toast(body?.error || 'Server returned an error instead of a CSV.', 'error');
      return;
    }
    const truncated = res.headers.get('X-Export-Truncated') === 'true';
    const rowCount = res.headers.get('X-Export-Row-Count') || '0';

    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = 'transactions_' + Date.now() + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(objUrl); } catch (_) {} }, 2000);

    toast(
      truncated
        ? `Exported first ${rowCount} rows (capped). Narrow your filters for a complete export.`
        : `Export ready (${rowCount} rows).`,
      truncated ? 'warn' : 'success'
    );
  } catch (e) {
    toast('Export failed: ' + (e.message || 'network error'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = prevHtml;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.AdminSession && typeof window.AdminSession.getToken === 'function') {
    if (!window.AdminSession.getToken()) {
      if (typeof window.AdminSession.redirectToLogin === 'function') {
        window.AdminSession.redirectToLogin();
      } else {
        window.location.replace('/admin/index.html');
      }
      return;
    }
  }

  initAdminIdentity();
  initSidebarToggle();
  initTheme();

  // If the external sidebar script failed, build it here.
  setTimeout(renderSidebarFallback, 50);

  qs('#applyBtn').addEventListener('click', () => {
    readFilters();
    State.page = 1;
    loadList();
    loadStats();
    syncUrlFromState();
  });
  qs('#clearBtn').addEventListener('click', () => {
    ['fSearch','fFrom','fTo','fProvider','fUserId'].forEach(id => { const el = qs('#' + id); if (el) el.value = ''; });
    qs('#fType').value = '';
    qs('#fStatus').value = 'all';
    qs('#fCurrency').value = 'all';
    qs('#fFeedback').value = 'all';
    qs('#fLimit').value = '25';
    State.filters.sort = '';
    State.filters.order = '';
    readFilters();
    State.page = 1;
    loadList();
    loadStats();
    syncUrlFromState();
  });
  qs('#fSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      readFilters();
      State.page = 1;
      loadList();
      loadStats();
      syncUrlFromState();
    }
  });

  qsa('th [data-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      const col = btn.dataset.sort;
      const th = btn.closest('th');
      const current = th.getAttribute('aria-sort') || 'none';
      let nextOrder = 'desc';
      if (current === 'descending') nextOrder = 'asc';
      qsa('th[aria-sort]').forEach(x => x.setAttribute('aria-sort', 'none'));
      th.setAttribute('aria-sort', nextOrder === 'asc' ? 'ascending' : 'descending');
      State.filters.sort = col;
      State.filters.order = nextOrder;
      State.page = 1;
      loadList();
      syncUrlFromState();
    });
  });

  qs('#refreshBtn').addEventListener('click', () => { loadList(); loadStats(); });
  qs('#exportBtn').addEventListener('click', exportCsv);
  qs('#ddClose').addEventListener('click', closeDrawer);
  qs('#drawerScrim').addEventListener('click', closeDrawer);

  window.addEventListener('popstate', () => {
    const f = filtersFromUrl();
    applyFiltersToForm(f);
    readFilters();
    State.page = f.page;
    loadList();
    loadStats();
    const hashId = transactionIdFromHash();
    if (hashId) openDetail(hashId);
    else if (qs('#detailDrawer').classList.contains('open')) closeDrawer();
  });

  const initialFilters = filtersFromUrl();
  applyFiltersToForm(initialFilters);
  readFilters();
  State.page = initialFilters.page;
  State.filters.sort = initialFilters.sort || '';
  State.filters.order = initialFilters.order || '';
  if (State.filters.sort) {
    const th = document.querySelector(`th [data-sort="${State.filters.sort}"]`)?.closest('th');
    if (th) th.setAttribute('aria-sort', State.filters.order === 'asc' ? 'ascending' : 'descending');
  }

  loadTypes();
  applyFiltersToForm(initialFilters);
  loadList();
  loadStats();

  const hashId = transactionIdFromHash();
  if (hashId) openDetail(hashId);
});
</script>
