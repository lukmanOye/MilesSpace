<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Refunds — MilesSpace Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/css/admin-shell.css">
<script src="/js/admin-session.js?v=2026-refunds-v2"></script>
<script src="/js/admin-shell.js?v=2026-refunds-v2"></script>
</head>
<body>

<script>
(function() {
  try {
    if (localStorage.getItem('ms-theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    } else {
      document.documentElement.classList.add('light');
      document.documentElement.style.colorScheme = 'light';
    }
  } catch(_) {}
})();
</script>

<div class="app" id="appRoot"></div>

<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="dd-head">
    <div class="dd-ic" id="ddIcon"><i class="fas fa-rotate-left"></i></div>
    <div class="dd-titles"><h2 id="ddTitle">Refund</h2><div class="dd-sub" id="ddSub"></div></div>
    <button class="dd-close" id="ddClose" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="dd-body" id="ddBody"></div>
</aside>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
'use strict';

document.addEventListener('DOMContentLoaded', () => {
  if (!window.AdminSession?.getToken?.()) return window.AdminSession?.redirectToLogin?.() || window.location.replace('/admin/index.html');
  MS.init({
    activeKey: 'refunds',
    title: 'Refunds',
    breadcrumb: [
      { label: 'Home', href: '/admin/dashboard.html' },
      { label: 'Money' },
      { label: 'Refunds' }
    ]
  });
  renderContent();
  loadStats();
  loadList();
});

const API = {
  list:    '/api/admin/refunds',
  summary: '/api/admin/refunds/summary',
  detail:  id => `/api/admin/refunds/${encodeURIComponent(id)}`,
  approve: id => `/api/admin/refunds/${encodeURIComponent(id)}/approve`,
  reject:  id => `/api/admin/refunds/${encodeURIComponent(id)}/reject`,
  cancel:  id => `/api/admin/refunds/${encodeURIComponent(id)}/cancel`,
  retry:   id => `/api/admin/refunds/${encodeURIComponent(id)}/retry`,
};

const State = { page: 1, limit: 25, totalPages: 1, count: 0, filters: {}, current: null };

function renderContent() {
  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <div>
        <h2>Refunds</h2>
        <div class="sub">Every refund attempt — wallet credits, provider-initiated refunds, and deposit reversals. Pending approval below shows age and SLA.</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="reloadBtn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
      </div>
    </div>

    <div class="kpi-grid" id="statsRow"></div>

    <div class="filters-card">
      <div class="filters-bar">
        <select id="fStatus" class="select-input">
          <option value="all">All Statuses</option>
          <option value="REQUESTED">Requested</option>
          <option value="PENDING_APPROVAL">Pending Approval</option>
          <option value="APPROVED">Approved</option>
          <option value="PROCESSING">Processing</option>
          <option value="COMPLETED">Completed</option>
          <option value="FAILED">Failed</option>
          <option value="REJECTED">Rejected</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
        <select id="fType" class="select-input">
          <option value="all">All Types</option>
          <option value="wallet">Wallet</option>
          <option value="provider">Provider</option>
          <option value="reversal">Reversal</option>
        </select>
        <select id="fCurrency" class="select-input">
          <option value="all">All Currencies</option>
          <option value="NGN">NGN</option>
          <option value="USD">USD</option>
        </select>
        <input type="date" id="fFrom" class="date-input">
        <input type="date" id="fTo" class="date-input">
        <button class="btn btn-primary" id="applyBtn" type="button"><i class="fas fa-filter"></i> Apply</button>
        <button class="btn btn-ghost" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Refund ID</th>
              <th>Type</th>
              <th>Original TX</th>
              <th>Customer</th>
              <th style="text-align:right">Amount</th>
              <th>Status</th>
              <th>Provider</th>
              <th>Requested</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <div id="pageInfo">—</div>
        <div class="pagination" id="pagerControls"></div>
      </div>
    </div>`;

  document.getElementById('applyBtn').addEventListener('click', () => { readFilters(); State.page = 1; loadList(); });
  document.getElementById('clearBtn').addEventListener('click', () => {
    $('#fStatus').value = 'all'; $('#fType').value = 'all'; $('#fCurrency').value = 'all';
    $('#fFrom').value = ''; $('#fTo').value = '';
    readFilters(); State.page = 1; loadList();
  });
  document.getElementById('reloadBtn').addEventListener('click', () => { loadList(); loadStats(); });

  document.getElementById('ddClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerScrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}

function $(id) { return document.getElementById(id); }

function readFilters() {
  State.filters = {
    status: $('#fStatus').value || 'all',
    refund_type: $('#fType').value || 'all',
    currency: $('#fCurrency').value || 'all',
    from: $('#fFrom').value,
    to: $('#fTo').value,
  };
}

function statusBadge(s) {
  const t = String(s || '').toUpperCase();
  if (t === 'COMPLETED') return 'success';
  if (t === 'FAILED' || t === 'CANCELLED' || t === 'REJECTED') return 'danger';
  if (t === 'PROCESSING') return 'warn';
  if (t === 'PENDING_APPROVAL') return 'purple';
  if (t === 'REQUESTED' || t === 'APPROVED') return 'info';
  return 'neutral';
}

function typeBadge(t) {
  const s = String(t || '').toLowerCase();
  if (s === 'wallet') return 'info';
  if (s === 'provider') return 'purple';
  if (s === 'reversal') return 'danger';
  return 'neutral';
}

async function loadStats() {
  const el = document.getElementById('statsRow');
  const r = await MS.api(API.summary);
  if (!r.ok) {
    el.innerHTML = ['Total', 'Requested', 'Pending Approval', 'Processing', 'Completed', 'Failed', 'Rejected']
      .map(l => `<div class="kpi-card"><div class="lbl">${l}</div><div class="val" style="font-size:13px;color:var(--text-faint)">Unavailable</div></div>`).join('');
    return;
  }
  const s = r.data.data?.summary || r.data.summary || {};
  const tiles = [
    { key: 'all',              lbl: 'Total',            val: s.total,             color: '' },
    { key: 'REQUESTED',        lbl: 'Requested',        val: s.requested,         color: 'var(--info)' },
    { key: 'PENDING_APPROVAL', lbl: 'Pending Approval', val: s.pending_approval,  color: 'var(--purple)' },
    { key: 'PROCESSING',       lbl: 'Processing',       val: s.processing,        color: 'var(--warn)' },
    { key: 'COMPLETED',        lbl: 'Completed',        val: s.completed,         color: 'var(--success)' },
    { key: 'FAILED',           lbl: 'Failed',           val: s.failed,            color: 'var(--danger)' },
    { key: 'REJECTED',         lbl: 'Rejected',         val: s.rejected,          color: 'var(--danger)' },
  ];
  el.innerHTML = tiles.map(t => `
    <div class="kpi-card">
      <div class="lbl">${t.lbl}</div>
      <div class="val" style="color:${t.color || 'inherit'}">${MS.fmtInt(t.val) ?? '—'}</div>
    </div>`).join('');
}

function buildQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.page));
  q.set('limit', String(State.limit));
  const f = State.filters;
  if (f.status && f.status !== 'all') q.set('status', f.status);
  if (f.refund_type && f.refund_type !== 'all') q.set('refund_type', f.refund_type);
  if (f.currency && f.currency !== 'all') q.set('currency', f.currency);
  if (f.from) q.set('from', f.from);
  if (f.to) q.set('to', f.to);
  return q.toString();
}

async function loadList() {
  const tb = document.getElementById('tableBody');
  tb.innerHTML = Array.from({ length: 8 }).map(() => `<tr><td colspan="8"><span class="skel" style="width:${50 + Math.random() * 40}%;display:inline-block"></span></td></tr>`).join('');

  const r = await MS.api(API.list + '?' + buildQuery());
  if (!r.ok) {
    tb.innerHTML = `<tr><td colspan="8"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>Unable to load refunds.</div><button class="btn btn-ghost" onclick="loadList()" style="margin-top:10px"><i class="fas fa-rotate"></i> Retry</button></div></td></tr>`;
    return;
  }

  const data = r.data.data || r.data;
  const rows = data.refunds || [];
  State.totalPages = data.totalPages || 1;
  State.count = data.count || 0;

  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><div class="title">No refunds</div><div class="sub">No refunds match your filters.</div></div></td></tr>`;
    document.getElementById('pageInfo').textContent = 'No results';
    return;
  }

  tb.innerHTML = rows.map(r => {
    const user = r.user || { username: '—', email: '' };
    const orig = r.original_transaction || {};
    return `<tr data-id="${MS.esc(r.id)}">
      <td data-cell="ref"><span class="mono" style="font-size:11px">${MS.esc(String(r.id).slice(0, 8))}…</span></td>
      <td data-cell="type"><span class="badge ${typeBadge(r.refund_type)}">${MS.esc(r.refund_type || '—')}</span></td>
      <td data-cell="ref"><span class="mono" style="font-size:11px">${MS.esc(orig.reference || '—')}</span></td>
      <td data-cell="user">
        <strong>${MS.esc(user.username || '—')}</strong>
        <span style="display:block;font-size:10.5px;color:var(--text-dim)">${MS.esc(user.email || '')}</span>
      </td>
      <td data-cell="amount" style="text-align:right;font-weight:700">${MS.fmtMoney(r.amount, r.currency) || '—'}</td>
      <td data-cell="status"><span class="badge ${statusBadge(r.status)}">${MS.esc(r.status || '—')}</span></td>
      <td data-cell="provider">${MS.esc(r.provider || '—')}</td>
      <td data-cell="date">${MS.esc(MS.timeAgo(r.created_at))}</td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openDetail(tr.dataset.id));
  });

  document.getElementById('pageInfo').textContent = State.count
    ? `Showing ${(State.page - 1) * State.limit + 1}–${Math.min(State.page * State.limit, State.count)} of ${State.count}`
    : 'No results';
  renderPager();
}

function renderPager() {
  const c = document.getElementById('pagerControls');
  if (!c) return;
  c.innerHTML = '';
  if (State.totalPages <= 1) return;
  const mk = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener('click', () => { State.page = page; loadList(); });
    return b;
  };
  c.appendChild(mk('‹', State.page - 1, State.page <= 1, false));
  c.appendChild(mk(String(State.page), State.page, false, true));
  c.appendChild(mk('›', State.page + 1, State.page >= State.totalPages, false));
}

async function openDetail(id) {
  document.getElementById('ddIcon').innerHTML = '<i class="fas fa-rotate-left"></i>';
  document.getElementById('ddTitle').textContent = 'Loading…';
  document.getElementById('ddSub').textContent = '';
  document.getElementById('ddBody').innerHTML = '<div class="dd-empty">Loading refund…</div>';
  document.getElementById('detailDrawer').classList.add('open');
  document.getElementById('drawerScrim').classList.add('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'false');
  MS.lockScroll();

  const r = await MS.api(API.detail(id));
  if (!r.ok) {
    document.getElementById('ddBody').innerHTML = `<div class="dd-empty">${MS.esc(r.error || 'Unable to load refund.')}</div>`;
    return;
  }
  const d = r.data.data || r.data;
  State.current = d;
  renderDetail(d);
}

function closeDrawer() {
  document.getElementById('detailDrawer').classList.remove('open');
  document.getElementById('drawerScrim').classList.remove('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'true');
  MS.unlockScroll();
  State.current = null;
}

function renderDetail(p) {
  const rf = p.refund || {};
  const user = p.user || {};
  const orig = p.original_transaction || {};
  const audit = p.audit || [];
  const approvals = p.approvals || [];
  const state = p.approval_state || {};

  document.getElementById('ddIcon').innerHTML = rf.refund_type === 'reversal'
    ? '<i class="fas fa-undo"></i>'
    : rf.refund_type === 'provider'
      ? '<i class="fas fa-building-columns"></i>'
      : '<i class="fas fa-wallet"></i>';
  document.getElementById('ddTitle').textContent = `${rf.refund_type || ''} refund`;
  document.getElementById('ddSub').textContent = `${user.username || user.email || ''} · ${rf.currency} ${rf.amount}`;

  const amt = MS.fmtMoney(rf.amount, rf.currency) || '—';

  const hero = `
    <div class="dd-hero">
      <div>
        <div class="amount">${MS.esc(amt)}</div>
        <div class="meta">${MS.esc(rf.currency || '')} · ${MS.esc(rf.refund_type || '')}</div>
      </div>
      <div style="text-align:right">
        <span class="badge ${statusBadge(rf.status)}">${MS.esc(rf.status || '—')}</span>
        <div class="meta" style="margin-top:6px">${MS.esc(MS.fmtDateTime(rf.created_at))}</div>
      </div>
    </div>`;

  const overview = `
    <div class="dd-section">
      <div class="dd-section-title">Refund</div>
      <div class="dd-field"><span class="k">ID</span><span class="v mono" style="font-size:11px">${MS.esc(rf.id || '—')}</span></div>
      <div class="dd-field"><span class="k">Amount</span><span class="v">${MS.esc(amt)}</span></div>
      <div class="dd-field"><span class="k">Reason</span><span class="v">${MS.esc(rf.reason || '—')}</span></div>
      <div class="dd-field"><span class="k">Requested by</span><span class="v">${MS.esc(rf.requested_by || '—')}</span></div>
      <div class="dd-field"><span class="k">Approvals</span><span class="v">${state.approvals_count || 0} / ${state.approvals_required || 1}</span></div>
      ${rf.failure_reason ? `<div class="dd-field"><span class="k">Failure</span><span class="v" style="color:var(--danger)">${MS.esc(rf.failure_reason)}</span></div>` : ''}
      <div class="dd-field"><span class="k">Created</span><span class="v">${MS.esc(MS.fmtDateTime(rf.created_at))}</span></div>
      ${rf.completed_at ? `<div class="dd-field"><span class="k">Completed</span><span class="v">${MS.esc(MS.fmtDateTime(rf.completed_at))}</span></div>` : ''}
    </div>
    <div class="dd-section">
      <div class="dd-section-title">Original Transaction</div>
      ${orig.id ? `
        <div class="dd-field"><span class="k">Reference</span><span class="v mono" style="font-size:11px">${MS.esc(orig.reference || '—')}</span></div>
        <div class="dd-field"><span class="k">Type</span><span class="v">${MS.esc(orig.type || '—')}</span></div>
        <div class="dd-field"><span class="k">Amount</span><span class="v">${MS.fmtMoney(orig.amount, orig.currency) || '—'}</span></div>
        <div class="dd-field"><span class="k">Status</span><span class="v">${MS.esc(orig.status || '—')}</span></div>
      ` : '<div class="dd-empty">Not found.</div>'}
    </div>
    <div class="dd-section">
      <div class="dd-section-title">Customer</div>
      <div class="dd-field"><span class="k">Username</span><span class="v">${MS.esc(user.username || '—')}</span></div>
      <div class="dd-field"><span class="k">Email</span><span class="v">${MS.esc(user.email || '—')}</span></div>
    </div>`;

  // Actions
  const buttons = [];
  const st = String(rf.status || '').toUpperCase();
  const canApprove = state.can_approve === true;
  const blocked = state.blocked_reason;

  if (st === 'PENDING_APPROVAL') {
    if (canApprove) {
      buttons.push(`<button class="btn btn-success" id="btnApprove" type="button"><i class="fas fa-check"></i> Approve</button>`);
      buttons.push(`<button class="btn btn-danger" id="btnReject" type="button"><i class="fas fa-xmark"></i> Reject</button>`);
    } else if (blocked) {
      buttons.push(`<div style="font-size:11.5px;color:var(--text-faint);padding:4px 0"><i class="fas fa-lock"></i> ${MS.esc(blocked)}</div>`);
    }
  }
  if (st === 'REQUESTED' || st === 'PENDING_APPROVAL') {
    buttons.push(`<button class="btn btn-ghost" id="btnCancel" type="button"><i class="fas fa-xmark"></i> Cancel</button>`);
  }

  const actions = buttons.length ? `<div class="dd-section"><div class="dd-section-title">Actions</div><div class="flex-gap">${buttons.join('')}</div></div>` : '';

  document.getElementById('ddBody').innerHTML = hero + actions + overview;

  // Wire actions
  document.getElementById('btnApprove')?.addEventListener('click', () => {
    doDecision('approve', rf.id);
  });
  document.getElementById('btnReject')?.addEventListener('click', () => {
    doDecision('reject', rf.id);
  });
  document.getElementById('btnCancel')?.addEventListener('click', () => {
    doCancel(rf.id);
  });
}

async function doDecision(action, id) {
  const reason = await MS.reasonModal({
    title: action === 'approve' ? 'Approve refund' : 'Reject refund',
    message: action === 'approve'
      ? 'This will execute the refund once approvals are complete. It cannot be undone.'
      : 'This will mark the refund as REJECTED. No money moves.',
    confirmText: action === 'approve' ? 'Approve' : 'Reject',
    kind: action === 'approve' ? 'success' : 'danger'
  });
  if (!reason) return;

  const endpoint = action === 'approve' ? API.approve(id) : API.reject(id);
  const idempotencyKey = (crypto.randomUUID && crypto.randomUUID()) || ('refund-' + id + '-' + Date.now());

  const r = await MS.api(endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Idempotency-Key': idempotencyKey,
    },
    body: JSON.stringify({ reason })
  });

  if (r.ok) {
    MS.toast(`Refund ${action === 'approve' ? 'approved' : 'rejected'}.`, 'success');
    closeDrawer();
    loadList();
    loadStats();
  } else {
    MS.toast(r.error || 'Action failed.', 'error');
  }
}

async function doCancel(id) {
  const reason = await MS.reasonModal({
    title: 'Cancel refund',
    message: 'This will mark the refund as CANCELLED. No money moves.',
    confirmText: 'Cancel refund',
    kind: 'danger'
  });
  if (!reason) return;

  const idempotencyKey = (crypto.randomUUID && crypto.randomUUID()) || ('refund-' + id + '-' + Date.now());

  const r = await MS.api(API.cancel(id), {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Idempotency-Key': idempotencyKey,
    },
    body: JSON.stringify({ reason })
  });

  if (r.ok) {
    MS.toast('Refund cancelled.', 'success');
    closeDrawer();
    loadList();
    loadStats();
  } else {
    MS.toast(r.error || 'Failed to cancel.', 'error');
  }
}

window.loadList = loadList;
window.loadStats = loadStats;
</script>
</body>
</html>
