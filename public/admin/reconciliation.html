<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
//  MODAL HELPERS — one-shot prompts that resolve with a string or null
// ═══════════════════════════════════════════════════════════════════
function uiModal({ title, bodyHtml, confirmText = 'Confirm', cancelText = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--card,#fff);color:var(--text,#111);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.35);border:1px solid var(--border,#e5e5e5)';
    card.innerHTML = `
      <div style="font-size:16px;font-weight:700;margin-bottom:10px">${MS.esc(title)}</div>
      <div style="font-size:13px;color:var(--text-dim,#666);line-height:1.55;margin-bottom:14px">${bodyHtml}</div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" data-act="cancel" class="btn btn-ghost">${MS.esc(cancelText)}</button>
        <button type="button" data-act="ok" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${MS.esc(confirmText)}</button>
      </div>`;
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    const close = (val) => { overlay.remove(); resolve(val); };
    overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
    card.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
    card.querySelector('[data-act="ok"]').addEventListener('click', () => close(true));
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', esc); close(null); }
    });
  });
}

/**
 * Multi-field resolve modal.
 * Returns { notes, ledgerId, moneyImpact } or null.
 */
function resolveModal(issue) {
  return new Promise(resolve => {
    const isMoneyImpact = ['PROVIDER_SUCCESS_INTERNAL_INCOMPLETE','PROVIDER_FAILURE_NOT_REFUNDED',
                           'AMOUNT_MISMATCH','DUPLICATE','LEDGER_MISMATCH'].includes(issue.issue_type);

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--card,#fff);color:var(--text,#111);border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.35);border:1px solid var(--border,#e5e5e5)';

    card.innerHTML = `
      <div style="font-size:16px;font-weight:700;margin-bottom:6px">Resolve issue</div>
      <div style="font-size:12px;color:var(--text-dim,#666);line-height:1.55;margin-bottom:14px">
        Closes the issue on the queue. Does NOT credit or refund — use the refund flow first if money needs to move.
        ${isMoneyImpact
          ? '<br><strong style="color:var(--danger,#c0392b)">This issue is money-impacting. Provide a completed ledger transaction ID, or tick "no money impact" to acknowledge nothing moved.</strong>'
          : ''}
      </div>
      <label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Resolution notes <span style="color:var(--danger)">*</span></label>
      <textarea id="rmNotes" rows="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border,#e5e5e5);font-size:13px;font-family:inherit;resize:vertical;margin-bottom:12px" placeholder="Minimum 4 characters — what did you find and do?"></textarea>

      <label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Ledger transaction ID ${isMoneyImpact ? '(required unless no money impact)' : '(optional)'}</label>
      <input id="rmLedger" type="text" placeholder="UUID of the completed transaction row"
        style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border,#e5e5e5);font-size:13px;font-family:'JetBrains Mono',monospace;margin-bottom:10px">

      ${isMoneyImpact ? `
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim,#666);margin-bottom:14px">
          <input id="rmNoImpact" type="checkbox" style="width:16px;height:16px">
          <span>No money impact — I confirm no credit or refund was required to close this issue.</span>
        </label>` : ''}

      <div id="rmErr" style="display:none;font-size:12px;color:var(--danger,#c0392b);margin-bottom:12px"></div>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" data-act="cancel" class="btn btn-ghost">Cancel</button>
        <button type="button" data-act="ok" class="btn btn-primary">Resolve</button>
      </div>`;
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    const close = (val) => { overlay.remove(); resolve(val); };
    overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
    card.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
    card.querySelector('[data-act="ok"]').addEventListener('click', () => {
      const notes = card.querySelector('#rmNotes').value.trim();
      const ledgerId = card.querySelector('#rmLedger').value.trim();
      const noImpactBox = card.querySelector('#rmNoImpact');
      const moneyImpact = noImpactBox && noImpactBox.checked ? false : (isMoneyImpact ? null : undefined);
      const errEl = card.querySelector('#rmErr');

      if (notes.length < 4) {
        errEl.textContent = 'Resolution notes must be at least 4 characters.';
        errEl.style.display = 'block';
        return;
      }
      if (isMoneyImpact && !ledgerId && !(noImpactBox && noImpactBox.checked)) {
        errEl.textContent = 'Provide a completed ledger transaction ID, or tick "no money impact".';
        errEl.style.display = 'block';
        return;
      }
      const payload = { resolution_notes: notes };
      if (ledgerId) payload.resolved_ledger_transaction_id = ledgerId;
      if (moneyImpact !== undefined && moneyImpact !== null) payload.money_impact = moneyImpact;
      close(payload);
    });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', esc); close(null); }
    });
    setTimeout(() => { const el = card.querySelector('#rmNotes'); if (el) el.focus(); }, 50);
  });
}

// ═══════════════════════════════════════════════════════════════════
//  PAGE BOOTSTRAP
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  if (!window.AdminSession?.getToken?.()) {
    return window.AdminSession?.redirectToLogin?.() || window.location.replace('/admin/index.html');
  }
  try {
    if (typeof window.AdminSession.verify === 'function') {
      await window.AdminSession.verify();
    }
  } catch (_) { /* verify handles redirects */ }

  MS.init({
    activeKey: 'reconciliation',
    title: 'Reconciliation',
    breadcrumb: [
      { label: 'Home', href: '/admin/dashboard.html' },
      { label: 'Money' },
      { label: 'Reconciliation' }
    ]
  });
  renderContent();
  await Promise.allSettled([loadSummary(), loadIssues(), loadRuns()]);
});

const API = {
  summary:  '/api/admin/reconciliation/issues/summary',
  issues:   '/api/admin/reconciliation/issues',
  runs:     '/api/admin/reconciliation/runs',
  run:      '/api/admin/reconciliation/run',
  services: '/api/admin/reconciliation/services'
};

const State = {
  page: 1, limit: 50, totalPages: 1,
  service: '', provider: '', status: 'open', severity: '',
  search: '', issueId: null,
  servicesList: []
};

// ═══════════════════════════════════════════════════════════════════
//  CONTENT
// ═══════════════════════════════════════════════════════════════════
function renderContent() {
  document.getElementById('content').innerHTML = `
    <div class="page-header">

        <div class="sub">Unified queue of anomalies across Korapay, NowPayments, airtime, bills, eSIM, and gift cards. Recheck a service to verify with the provider — resolve to close an issue after confirming the ledger.</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="runAllBtn" type="button"><i class="fas fa-play"></i> Run all</button>
        <button class="btn btn-primary" id="reloadBtn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
      </div>
    </div>

    <div class="kpi-grid" id="summaryRow"></div>

    <div class="filters-card" style="margin-bottom:18px">
      <div class="filters-bar" style="border:none">
        <select id="fService" class="select-input" style="min-width:180px">
          <option value="">All Services</option>
          <option value="kora">Korapay</option>
          <option value="nowpayments">NowPayments</option>
          <option value="airtime">Airtime / Data</option>
          <option value="bills">Bills & Utilities</option>
          <option value="esim">eSIM</option>
          <option value="giftcard">Gift Cards</option>
        </select>
        <select id="fStatus" class="select-input">
          <option value="open">Open</option>
          <option value="assigned">Assigned</option>
          <option value="investigating">Investigating</option>
          <option value="resolved">Resolved</option>
          <option value="ignored">Ignored</option>
          <option value="all">All statuses</option>
        </select>
        <select id="fSeverity" class="select-input">
          <option value="">Any severity</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <div class="search-input-wrap">
          <i class="fas fa-search"></i>
          <input type="search" id="fSearch" class="search-input" placeholder="Search reference, reason…" autocomplete="off">
        </div>

        <button class="btn btn-ghost" id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px">

        <span>Issues</span>
        <span id="pendingApprovalsBadge" style="display:none;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg,rgba(245,166,35,.12));padding:4px 10px;border-radius:20px"></span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Severity</th>
              <th>Service</th>
              <th>Type</th>
              <th>Internal Ref</th>
              <th>Provider Ref</th>

              <th>Status</th>

            </tr>

        </table>
      </div>
      <div class="table-foot">

        <div class="pagination" id="pagerControls"></div>
      </div>

    <div class="card">
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700">Recent runs</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Service</th>
              <th>Type</th>
              <th>Status</th>
              <th>Scanned</th>
              <th>Settled</th>
              <th>Failed</th>
              <th>Manual</th>
              <th>Rate limited</th>
              <th>Started</th>

  document.getElementById('fService').addEventListener('change', e => { State.service = e.target.value; State.page = 1; loadIssues(); });
  document.getElementById('fStatus').addEventListener('change', e => { State.status = e.target.value; State.page = 1; loadIssues(); });
  document.getElementById('fSeverity').addEventListener('change', e => { State.severity = e.target.value; State.page = 1; loadIssues(); });

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

    else MS.toast(r.error || 'Run failed.', 'error');

  document.getElementById('drawerScrim').addEventListener('click', closeDrawer);

}

// ═══════════════════════════════════════════════════════════════════
//  BADGES
// ═══════════════════════════════════════════════════════════════════
function badgeSeverity(s) {
  if (s === 'critical') return 'danger';
  if (s === 'high') return 'warn';
  if (s === 'medium') return 'info';
  return 'neutral';
}
function badgeIssueStatus(s) {
  if (s === 'resolved') return 'success';
  if (s === 'ignored') return 'neutral';
  if (s === 'assigned') return 'info';
  if (s === 'investigating') return 'warn';
  return 'danger';
}
function slaBadge(issue) {
  const now = Date.now();
  const due = issue.sla_due_at ? new Date(issue.sla_due_at).getTime() : null;
  if (!due) return { tone: 'neutral', label: '—' };
  if (due < now) {
    const overMin = Math.round((now - due) / 60000);
    const lbl = overMin < 60 ? `+${overMin}m overdue` : `+${Math.round(overMin / 60)}h overdue`;
    return { tone: 'danger', label: lbl };
  }
  const leftMin = Math.round((due - now) / 60000);
  if (leftMin < 60) return { tone: 'warn', label: `${leftMin}m left` };
  if (leftMin < 24 * 60) return { tone: 'info', label: `${Math.round(leftMin / 60)}h left` };
  return { tone: 'neutral', label: `${Math.round(leftMin / (60 * 24))}d left` };
}

// ═══════════════════════════════════════════════════════════════════
//  SUMMARY
// ═══════════════════════════════════════════════════════════════════
async function loadSummary() {
  const el = document.getElementById('summaryRow');
  if (!el) return;
  const r = await MS.api(API.summary);
  if (!r.ok) {
    el.innerHTML = `<div class="kpi-card"><div class="lbl">Unavailable</div><div class="val" style="font-size:13px;color:var(--text-faint)">${MS.esc(r.error || 'Error')}</div></div>`;
    return;
  }
  const s = r.data.data?.summary || r.data.summary || {};
  const cards = [
    { lbl: 'Open',            val: s.open,             color: 'var(--warn)' },
    { lbl: 'Assigned',        val: s.assigned,         color: 'var(--info)' },
    { lbl: 'Investigating',   val: s.investigating,    color: 'var(--warn)' },
    { lbl: 'Critical',        val: s.critical,         color: 'var(--danger)' },
    { lbl: 'SLA breached',    val: s.sla_breached,     color: 'var(--danger)' },
    { lbl: 'Due in 30m',      val: s.due_soon,         color: 'var(--warn)' },
    { lbl: 'Oldest',          val: s.oldest_open_age_seconds != null
                                  ? Math.round(s.oldest_open_age_seconds / 60) + 'm'
                                  : '—',              color: 'var(--text-dim)' }
  ];
  el.innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="lbl">${MS.esc(c.lbl)}</div>
      <div class="val" style="color:${c.color || 'inherit'}">${MS.esc(String(c.val ?? '—'))}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════
//  ISSUES LIST
// ═══════════════════════════════════════════════════════════════════
async function loadIssues() {
  const tb = document.getElementById('tableBody');
  if (!tb) return;
  tb.innerHTML = `<tr><td colspan="9"><span class="skel" style="width:60%;display:inline-block"></span></td></tr>`;
  const q = new URLSearchParams();
  q.set('page', State.page);
  q.set('limit', State.limit);
  if (State.service) q.set('service', State.service);
  if (State.status && State.status !== 'all') q.set('status', State.status);
  if (State.severity) q.set('severity', State.severity);
  if (State.search) q.set('search', State.search);

  const r = await MS.api(API.issues + '?' + q.toString());
  if (!r.ok) {
    tb.innerHTML = `<tr><td colspan="9"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>${MS.esc(r.error || 'Failed to load')}</div></div></td></tr>`;
    return;
  }
  const data = r.data.data || r.data;
  const issues = data.issues || [];
  State.totalPages = data.totalPages || 1;

  if (!issues.length) {
    tb.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fas fa-check-circle" style="color:var(--success)"></i><div class="title">No issues</div><div class="sub">Nothing to reconcile for these filters.</div></div></td></tr>`;
    document.getElementById('pageInfo').textContent = 'No results';
    document.getElementById('pagerControls').innerHTML = '';
    return;
  }

  tb.innerHTML = issues.map(i => {
    const sla = slaBadge(i);
    return `
    <tr data-id="${MS.esc(i.id)}">
      <td><span class="badge ${badgeSeverity(i.severity)}">${MS.esc(i.severity)}</span></td>
      <td>${MS.esc(i.service)}</td>
      <td>${MS.esc(i.issue_type)}</td>
      <td><span class="mono" style="font-size:11px">${MS.esc(i.internal_ref || '—')}</span></td>
      <td><span class="mono" style="font-size:11px">${MS.esc(i.provider_ref || '—')}</span></td>
      <td style="text-align:right">${MS.fmtMoney(i.amount, i.currency) || '—'}</td>
      <td><span class="badge ${badgeIssueStatus(i.status)}">${MS.esc(i.status)}</span></td>
      <td><span class="badge ${sla.tone}">${MS.esc(sla.label)}</span></td>
      <td>${MS.esc(MS.timeAgo(i.created_at))}</td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openIssue(tr.dataset.id));
  });

  document.getElementById('pageInfo').textContent = `Page ${State.page} of ${State.totalPages}`;
  renderPager();
}

function renderPager() {
  const c = document.getElementById('pagerControls');
  if (!c) return;
  c.innerHTML = '';
  if (State.totalPages <= 1) return;
  const mk = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener('click', () => { State.page = page; loadIssues(); });
    return b;
  };
  c.appendChild(mk('‹', State.page - 1, State.page <= 1, false));
  c.appendChild(mk(String(State.page), State.page, false, true));
  c.appendChild(mk('›', State.page + 1, State.page >= State.totalPages, false));
}

// ═══════════════════════════════════════════════════════════════════
//  RUNS
// ═══════════════════════════════════════════════════════════════════
async function loadRuns() {
  const tb = document.getElementById('runsBody');
  if (!tb) return;
  const r = await MS.api(API.runs + '?limit=20');
  if (!r.ok) { tb.innerHTML = `<tr><td colspan="9"><div class="empty-state"><strong>Could not load runs</strong></div></td></tr>`; return; }
  const runs = r.data.data?.runs || r.data.runs || [];
  if (!runs.length) { tb.innerHTML = `<tr><td colspan="9"><div class="empty-state"><strong>No runs yet</strong></div></td></tr>`; return; }
  tb.innerHTML = runs.map(rn => `
    <tr>
      <td>${MS.esc(rn.service)}</td>
      <td><span class="badge ${rn.type === 'audit' ? 'info' : 'neutral'}">${MS.esc(rn.type || 'sweep')}</span></td>
      <td><span class="badge ${rn.status === 'completed' ? 'success'
                        : rn.status === 'failed'   ? 'danger'
                        : rn.status === 'rate_limited' ? 'warn'
                        : rn.status === 'skipped' ? 'neutral' : 'info'}">${MS.esc(rn.status)}</span></td>
      <td>${MS.fmtInt(rn.scanned) ?? 0}</td>
      <td>${MS.fmtInt(rn.settled) ?? 0}</td>
      <td>${MS.fmtInt(rn.failed) ?? 0}</td>
      <td>${MS.fmtInt(rn.manual_review) ?? 0}</td>
      <td>${MS.fmtInt(rn.rate_limited) ?? 0}</td>
      <td>${MS.esc(MS.timeAgo(rn.started_at))}</td>
    </tr>`).join('');
}

// ═══════════════════════════════════════════════════════════════════
//  DRAWER
// ═══════════════════════════════════════════════════════════════════
async function openIssue(id) {
  State.issueId = id;
  document.getElementById('ddTitle').textContent = 'Loading…';
  document.getElementById('ddSub').textContent = '';
  document.getElementById('ddBody').innerHTML = '<div class="dd-empty">Loading issue…</div>';
  document.getElementById('detailDrawer').classList.add('open');
  document.getElementById('drawerScrim').classList.add('open');
  MS.lockScroll();

  const r = await MS.api(API.issues + '/' + id);
  if (!r.ok) {
    document.getElementById('ddBody').innerHTML = `<div class="dd-empty">${MS.esc(r.error || 'Failed')}</div>`;
    return;
  }
  const p = r.data.data || r.data;
  renderIssue(p);
}

function closeDrawer() {
  document.getElementById('detailDrawer').classList.remove('open');
  document.getElementById('drawerScrim').classList.remove('open');
  MS.unlockScroll();
  State.issueId = null;
}

function renderIssue(p) {
  const i = p.issue || {};
  const user = p.user || {};
  const notes = p.notes || [];
  const approvals = p.pending_approvals || [];

  document.getElementById('ddTitle').textContent = i.issue_type;
  document.getElementById('ddSub').textContent = `${i.service} · ${i.internal_ref || ''}`;

  const sla = slaBadge(i);

  const hero = `
    <div class="dd-hero">
      <div>
        <div class="amount">${MS.fmtMoney(i.amount, i.currency) || '—'}</div>
        <div class="meta">${MS.esc(i.currency || '')} · ${MS.esc(i.issue_type)}</div>
      </div>
      <div style="text-align:right">
        <span class="badge ${badgeSeverity(i.severity)}">${MS.esc(i.severity)}</span>
        <span class="badge ${sla.tone}" style="margin-left:6px">${MS.esc(sla.label)}</span>
        <div class="meta" style="margin-top:6px">${MS.esc(MS.fmtDateTime(i.created_at))}</div>
      </div>
    </div>`;

  const approvalBanner = approvals.length ? `
    <div class="dd-section" style="background:rgba(245,166,35,.1);border-radius:10px;padding:14px;margin-bottom:12px">
      <div class="dd-section-title" style="margin-bottom:8px"><i class="fas fa-user-shield"></i> Awaiting second-admin approval</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">
        Requested by <strong>${MS.esc(approvals[0].requested_by_email || 'another admin')}</strong>
        · ${MS.esc(MS.timeAgo(approvals[0].created_at))}
      </div>
      ${approvals[0].reason ? `<div style="font-size:12px;margin-bottom:10px"><em>"${MS.esc(approvals[0].reason)}"</em></div>` : ''}
      <div class="flex-gap">
        <button class="btn btn-primary" data-approval="approve" data-id="${MS.esc(approvals[0].id)}" type="button">
          <i class="fas fa-check"></i> Approve
        </button>
        <button class="btn btn-ghost" data-approval="reject" data-id="${MS.esc(approvals[0].id)}" type="button">
          <i class="fas fa-xmark"></i> Reject
        </button>
      </div>
    </div>` : '';

  const details = `
    <div class="dd-section">
      <div class="dd-section-title">Internal</div>
      <div class="dd-field"><span class="k">Status</span><span class="v">${MS.esc(i.internal_status || '—')}</span></div>
      <div class="dd-field"><span class="k">Reference</span><span class="v mono">${MS.esc(i.internal_ref || '—')}</span></div>
      <div class="dd-field"><span class="k">Table</span><span class="v">${MS.esc(i.internal_table || '—')}</span></div>
      <div class="dd-field"><span class="k">Reason</span><span class="v">${MS.esc(i.reason || '—')}</span></div>
    </div>
    <div class="dd-section">
      <div class="dd-section-title">Provider</div>
      <div class="dd-field"><span class="k">Provider</span><span class="v">${MS.esc(i.provider)}</span></div>
      <div class="dd-field"><span class="k">Status</span><span class="v">${MS.esc(i.provider_status || '—')}</span></div>
      <div class="dd-field"><span class="k">Reference</span><span class="v mono">${MS.esc(i.provider_ref || '—')}</span></div>
      <div class="dd-field"><span class="k">Attempts</span><span class="v">${MS.fmtInt(i.reconciliation_attempts) || 0}</span></div>
      <div class="dd-field"><span class="k">Last verified</span><span class="v">${MS.esc(MS.timeAgo(i.last_verified_at))}</span></div>
    </div>
    ${user.id ? `<div class="dd-section">
      <div class="dd-section-title">Customer</div>
      <div class="dd-field"><span class="k">Username</span><span class="v">${MS.esc(user.username || '—')}</span></div>
      <div class="dd-field"><span class="k">Email</span><span class="v">${MS.esc(user.email || '—')}</span></div>
    </div>` : ''}`;

  const notesHtml = notes.length
    ? `<div class="dd-section"><div class="dd-section-title">Notes</div>
        ${notes.map(n => `
          <div class="dd-field" style="flex-direction:column;align-items:stretch;gap:2px">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim)">
              <span>${MS.esc(n.author_email || 'admin')}</span>
              <span>${MS.esc(MS.timeAgo(n.created_at))}</span>
            </div>
            <div style="white-space:pre-wrap">${MS.esc(n.note)}</div>
          </div>`).join('')}
      </div>`
    : '';

  const isOpen = ['open','assigned','investigating'].includes(i.status);
  const hasPendingApproval = approvals.length > 0;

  const actions = isOpen && !hasPendingApproval ? `
    <div class="dd-section">
      <div class="dd-section-title">Actions</div>
      <div class="flex-gap">
        <button class="btn btn-ghost" data-action="note" type="button"><i class="fas fa-sticky-note"></i> Add note</button>
        <button class="btn btn-ghost" data-action="assign" type="button"><i class="fas fa-user-check"></i> Assign to me</button>
        <button class="btn btn-ghost" data-action="recheck" type="button"><i class="fas fa-rotate"></i> Recheck</button>
        <button class="btn btn-primary" data-action="resolve" type="button"><i class="fas fa-check"></i> Resolve</button>
      </div>
    </div>` : '';

  const resolutionView = !isOpen ? `
    <div class="dd-section">
      <div class="dd-section-title">Resolution</div>
      <div class="dd-field"><span class="k">Notes</span><span class="v">${MS.esc(i.resolution_notes || '—')}</span></div>
      <div class="dd-field"><span class="k">Resolved</span><span class="v">${MS.esc(MS.fmtDateTime(i.resolved_at))}</span></div>
      ${i.resolved_ledger_transaction_id
        ? `<div class="dd-field"><span class="k">Ledger</span><span class="v mono">${MS.esc(i.resolved_ledger_transaction_id)}</span></div>`
        : ''}
    </div>` : '';

  document.getElementById('ddBody').innerHTML =
    hero + approvalBanner + actions + resolutionView + details + notesHtml;

  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => onIssueAction(btn.dataset.action, i.id, i));
  });
  document.querySelectorAll('[data-approval]').forEach(btn => {
    btn.addEventListener('click', () => onApprovalAction(btn.dataset.approval, btn.dataset.id));
  });
}

// ═══════════════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════════════
async function onIssueAction(action, id, issue) {
  if (action === 'note') {
    const note = await MS.reasonModal({ title: 'Add note', message: 'Internal note visible to other admins.', confirmText: 'Save', minLength: 2 });
    if (!note) return;
    const r = await MS.api(`${API.issues}/${id}/note`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ note }) });
    if (r.ok) { MS.toast('Note added.', 'success'); openIssue(id); } else MS.toast(r.error || 'Failed.', 'error');
    return;
  }
  if (action === 'assign') {
    const r = await MS.api(`${API.issues}/${id}/assign`, { method: 'POST' });
    if (r.ok) { MS.toast('Assigned to you.', 'success'); openIssue(id); loadIssues(); } else MS.toast(r.error || 'Failed.', 'error');
    return;
  }
  if (action === 'recheck') {
    const reason = await MS.reasonModal({ title: 'Recheck provider', message: 'Runs a fresh sweep for this service. Requires step-up.', confirmText: 'Recheck' });
    if (!reason) return;
    const r = await MS.api(`${API.issues}/${id}/recheck`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason }) });
    if (r.ok) { MS.toast('Recheck complete.', 'success'); openIssue(id); loadSummary(); loadIssues(); loadRuns(); }
    else MS.toast(r.error || 'Failed.', 'error');
    return;
  }
  if (action === 'resolve') {
    const payload = await resolveModal(issue);
    if (!payload) return;
    const r = await MS.api(`${API.issues}/${id}/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (r.ok) {
      // 202 = approval requested, 200 = closed directly.
      if (r.status === 202) {
        MS.toast('Approval requested. A second admin must approve.', 'success');
        openIssue(id);
      } else {
        MS.toast('Issue resolved.', 'success');
        closeDrawer();
        loadSummary();
        loadIssues();
      }
    } else {
      MS.toast(r.error || 'Failed.', 'error');
    }
    return;
  }
}

async function onApprovalAction(action, approvalId) {
  if (action === 'approve') {
    const reason = await MS.reasonModal({
      title: 'Approve resolution',
      message: 'This will close the issue with your admin identity as the resolver. Requires step-up.',
      confirmText: 'Approve',
      minLength: 2
    });
    if (!reason) return;
    const r = await MS.api(`/api/admin/reconciliation/approvals/${approvalId}/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason })
    });
    if (r.ok) {
      MS.toast('Issue resolved.', 'success');
      closeDrawer();
      loadSummary();
      loadIssues();
      loadRuns();
    } else {
      MS.toast(r.error || 'Approval failed.', 'error');
    }
    return;
  }
  if (action === 'reject') {
    const reason = await MS.reasonModal({
      title: 'Reject resolution',
      message: 'The issue stays open. The requester can start a new request later.',
      confirmText: 'Reject',
      minLength: 2
    });
    if (!reason) return;
    const r = await MS.api(`/api/admin/reconciliation/approvals/${approvalId}/reject`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason })
    });
    if (r.ok) {
      MS.toast('Approval rejected.', 'success');
      openIssue(State.issueId);
      loadIssues();
    } else {
      MS.toast(r.error || 'Rejection failed.', 'error');
    }
  }
}
</script>
