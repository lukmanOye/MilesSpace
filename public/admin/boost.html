<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Boost · MilesSpace Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ═════════════════════════════════════════════════════════════════
   BOOST ADMIN — page-specific CSS. Additive on admin-shell.css.
   ═════════════════════════════════════════════════════════════════ */

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:11px 16px;border:none;background:none;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px;transition:color .15s,border-color .15s;font-family:inherit}
.tab:hover{color:var(--text)}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
.tab .cnt{display:inline-block;margin-left:6px;background:var(--bg-alt);color:var(--text-dim);border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:700}
.tab.active .cnt{background:var(--navy);color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}

.dry-banner,.provider-warn{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dry-banner{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger)}
.provider-warn{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);justify-content:space-between}
.provider-warn .btn{background:var(--danger);color:#fff;border-color:var(--danger);padding:6px 10px;font-size:12px;min-height:32px;flex-shrink:0}
.provider-warn .btn:hover{background:#a01717;border-color:#a01717}

.provider-card{display:flex;flex-wrap:wrap;gap:14px;padding:12px 14px;background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;font-size:12.5px;margin-bottom:16px;align-items:center}
.provider-card .pr{display:flex;align-items:center;gap:6px;min-width:0}
.provider-card strong{color:var(--text)}
.provider-card .balance{font-variant-numeric:tabular-nums;font-weight:700}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .lbl{font-size:10.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .sub{font-size:11px;color:var(--text-faint);margin-top:3px}

.alerts-card{margin-bottom:16px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px}
.alerts-card h3{font-size:14px;font-weight:800;margin:0 0 10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;font-size:12.5px;line-height:1.5;margin-bottom:6px}
.alert:last-child{margin-bottom:0}
.alert-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn)}
.alert-danger{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger)}
.alert-info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info)}
.alert .ic{flex-shrink:0;margin-top:1px}
.alert .body{flex:1;min-width:0}
.alert .body strong{display:block;margin-bottom:2px;font-weight:700}
.alert .body .meta{font-size:11.5px;opacity:.85}

.range-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.range-pill{padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;min-height:38px;transition:all .15s;font-family:inherit}
.range-pill:hover{border-color:var(--border-strong);color:var(--text)}
.range-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.svc-row-list{display:flex;flex-direction:column;gap:6px}
.svc-row{background:var(--bg-card);border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:grid;grid-template-columns:24px 1fr auto auto;gap:12px;align-items:center;min-width:0}
.svc-row:hover{border-color:var(--border-strong)}
.svc-row-cb{width:18px;height:18px;accent-color:var(--navy);cursor:pointer;margin-top:2px}
.svc-row-main{min-width:0}
.svc-row-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.35;word-break:break-word}
.svc-row-meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--text-dim);margin-top:4px}
.svc-row-meta span{white-space:nowrap}
.svc-row-meta strong{color:var(--text)}
.svc-row-right{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.price-info{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--text-dim);min-width:0;text-align:right}
.price-info .big{font-size:13px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.badge-src{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em}
.src-custom{background:var(--purple-bg);color:var(--purple)}
.src-service{background:var(--info-bg);color:var(--info)}
.src-global{background:var(--bg-alt);color:var(--text-dim)}
.warn-chip{background:var(--danger-bg);color:var(--danger);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase}

.toggle{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-dim);cursor:pointer;min-height:36px;padding:0 4px;user-select:none}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .tk{width:32px;height:18px;background:var(--border-strong);border-radius:99px;position:relative;transition:background .15s;flex-shrink:0}
.toggle .tk::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .15s}
.toggle input:checked + .tk{background:var(--success)}
.toggle input:checked + .tk::after{transform:translateX(14px)}
.toggle input:disabled + .tk{opacity:.5;cursor:not-allowed}

.bulk-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--info-bg);border:1px solid var(--info-bd);border-radius:11px;margin-bottom:12px;font-size:12.5px}
.bulk-bar:empty{display:none}
.bulk-bar strong{color:var(--info)}
.bulk-bar .btn{flex:0 0 auto}

.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px 0;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap}
.pager .btns{display:flex;gap:6px;flex-wrap:wrap}

.cfg-form{display:grid;gap:14px;max-width:560px}
.cfg-form label{display:block;font-size:12.5px;font-weight:600;color:var(--text)}
.cfg-form input[type="number"]{margin-top:6px;width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:14px;background:var(--bg-card);color:var(--text);min-height:42px}
.cfg-form .row-inline{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--border);flex-wrap:wrap}
.cfg-form .row-inline input[type="checkbox"]{width:18px;height:18px;accent-color:var(--navy);cursor:pointer;flex-shrink:0}
.cfg-form .row-inline span{font-size:13px;font-weight:500}
.cfg-missing{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn);padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.5;margin-bottom:12px}

.save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-top:16px;box-shadow:var(--sh-md);display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:5}
.save-bar .state{flex:1;min-width:0;font-size:12px;color:var(--text-dim)}
.save-bar .state strong{color:var(--warn)}
.save-bar .btn{flex:0 0 auto}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-row input[type="search"]{flex:1 1 220px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:13px;background:var(--bg-card);color:var(--text);min-height:44px;min-width:0}
.filter-row select{padding:9px 30px 9px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:13px;background-color:var(--bg-card);color:var(--text);min-height:44px;cursor:pointer;min-width:0}
.filter-row input[type="date"]{padding:9px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:13px;background:var(--bg-card);color:var(--text);min-height:44px;min-width:0;-webkit-appearance:none;appearance:none}

.orders-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:880px}
.orders-table thead tr{text-align:left;color:var(--text-faint);font-size:11px;text-transform:uppercase}
.orders-table th{padding:10px;font-weight:700;white-space:nowrap}
.orders-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
.orders-table tbody tr{cursor:pointer}
.orders-table tbody tr:hover{background:var(--bg-alt)}

.attention-card{background:var(--purple-bg);border:1px solid var(--purple-bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:12.5px}
.attention-card .r1{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.attention-card .ref{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--purple);flex:1;min-width:0;word-break:break-all}
.attention-card .svc{font-weight:700;margin-bottom:4px}
.attention-card .meta{font-size:11.5px;color:var(--purple);opacity:.9;margin-bottom:8px;line-height:1.5}
.attention-card button{width:100%;padding:9px;border-radius:8px;background:var(--purple);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;min-height:40px}

.verify-block{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--warn);line-height:1.5;margin-bottom:10px}
.verify-block label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:500}
.verify-block input[type="checkbox"]{width:16px;height:16px;margin-top:1px;flex-shrink:0;accent-color:var(--warn);cursor:pointer}

.stale-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-faint);margin-bottom:8px;opacity:0;transition:opacity .2s}
.stale-hint.show{opacity:1}

@media (max-width:900px){
  .svc-row{grid-template-columns:24px 1fr;gap:8px 12px}
  .svc-row-meta{grid-column:2}
  .price-info{grid-column:2;align-items:flex-start;text-align:left}
  .svc-row-right{grid-column:1 / -1;justify-content:flex-start;border-top:1px solid var(--border);padding-top:8px;margin-top:2px;gap:6px}
  .svc-row-right .btn{min-height:38px}
}
@media (max-width:768px){
  .orders-table{min-width:0}
  .orders-table thead{display:none}
  .orders-table,
  .orders-table tbody,
  .orders-table tr,
  .orders-table td{display:block;width:100%}
  .orders-table tbody tr{border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:8px;background:var(--bg-card);cursor:pointer}
  .orders-table tbody tr:last-child{margin-bottom:0}
  .orders-table tbody td{padding:4px 0;border:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12.5px;min-width:0;word-break:break-word}
  .orders-table tbody td[data-cell]::before{content:attr(data-cell);color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;flex-shrink:0;min-width:74px}
  .orders-table tbody td[colspan]::before{display:none}
  .orders-table tbody td[colspan]{display:block;text-align:center;padding:20px 8px;font-size:12.5px}
}
@media (max-width:640px){
  .tab{padding:10px 12px;font-size:12.5px;min-height:42px}
  .tab .cnt{font-size:10px;padding:1px 6px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px}
  .kpi .val{font-size:16px}
  .kpi .lbl{font-size:9.5px}
  .alerts-card{padding:12px}
  .alert{padding:8px 10px;font-size:12px}
  .alert .body .meta{font-size:11px;opacity:1}
  .provider-card{gap:8px}
  .provider-card .pr{flex-basis:100%}
  .filter-row input[type="search"],.filter-row select,.filter-row input[type="date"],.filter-row > .btn{width:100%;flex:1 1 100%}
  .pager{flex-direction:column;align-items:stretch}
  .pager .btns{width:100%}
  .pager .btns .btn{flex:1;min-height:42px}
  .save-bar{flex-direction:column;align-items:stretch}
  .save-bar .btn{width:100%;min-height:44px}
  .svc-row{padding:12px}
  .price-info{align-items:flex-start;text-align:left}
  .price-info .big{font-size:14px}
  .attention-card button{min-height:44px}
  .form-row input,.form-row select,.form-row textarea{min-height:44px}
  .verify-block input[type="checkbox"]{width:20px;height:20px}
}
@media (max-width:359px){.kpi-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .detail-drawer{width:100vw !important;max-width:100vw !important;border-radius:0 !important;border-left:none !important}
  .detail-drawer .dd-body{-webkit-overflow-scrolling:touch;padding-bottom:90px}
  .detail-drawer .dd-actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);z-index:2;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)) !important}
  .detail-drawer .dd-actions .btn{flex:1 1 auto;min-width:130px;min-height:44px}
}
@media (max-width:640px){body,.content{overflow-x:hidden}}
</style>

<body>
<div class="app" id="appRoot"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
'use strict';

/* ═════════════════════════════════════════════════════════════════
   PRIMITIVES — defined before anything below uses them.
   ═════════════════════════════════════════════════════════════════ */

function debounce(fn, ms) {
  let t;
  return function () {
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(ctx, args), ms || 250);
  };
}

function perf(label, startedAt) {
  if (!startedAt) return () => {};
  return () => {
    const ms = Date.now() - startedAt;
    if (ms > 2500) console.warn('[boost-slow] ' + label + ' took ' + ms + 'ms');
  };
}

function _ensureToastFallback() {
  if (typeof window.MS === 'object' && typeof window.MS.toast === 'function') return;
  window.MS = window.MS || {};
  window.MS.toast = function (msg, kind) {
    const stack = document.getElementById('toastStack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (kind === 'success' ? 'success' : kind === 'error' ? 'error' : kind === 'warn' ? 'warn' : 'info');
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  };
  window.MS.confirmModal = window.MS.confirmModal || async function (o) {
    return window.confirm((o && o.title ? o.title + '\n\n' : '') + ((o && o.message) || 'Are you sure?'));
  };
  window.MS.reasonModal = window.MS.reasonModal || async function (o) {
    const r = prompt((o && o.title ? o.title + '\n\n' : '') + ((o && o.message) || 'Reason:'));
    return r && r.trim().length >= 4 ? r.trim() : null;
  };
}
_ensureToastFallback();

/* ═════════════════════════════════════════════════════════════════
   Utility
   ═════════════════════════════════════════════════════════════════ */

const U = {
  esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  },
  money(v, c) {
    if (v == null || v === '') return '—';
    const n = Number(v);
    if (!isFinite(n)) return '—';
    const sym = String(c || '').toUpperCase() === 'USD' ? '$' : '₦';
    return sym + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  int(v) {
    if (v == null) return '—';
    const n = Number(v);
    return isFinite(n) ? n.toLocaleString('en-US') : '—';
  },
  dt(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? '—'
      : d.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  },
  ago(iso) {
    if (!iso) return '—';
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  },
  statusClass(s) {
    s = String(s || '').toLowerCase();
    if (s === 'completed') return 'success';
    if (s === 'failed' || s === 'cancelled') return 'danger';
    if (s === 'refunded' || s === 'partial_refunded') return 'info';
    if (s === 'provider_unknown' || s === 'manual_review') return 'purple';
    if (['pending', 'processing', 'in_progress', 'partial', 'awaiting_payment'].includes(s)) return 'warn';
    return 'neutral';
  }
};

/* ═════════════════════════════════════════════════════════════════
   State
   ═════════════════════════════════════════════════════════════════ */

const State = {
  tab: 'overview',
  range: 'today',
  overview: null,
  overviewSig: null,
  overviewFetchedAt: 0,
  orders: { page: 1, limit: 25, totalPages: 1, count: 0, filters: {}, list: [], sig: null, fetchedAt: 0 },
  services: { page: 1, limit: 50, totalPages: 1, count: 0, filters: {}, list: [], selected: new Set(), sig: null, fetchedAt: 0 },
  config: null,
  originalConfig: null,
  pendingConfigChanges: {},
  provider: { balance: null, currency: null, configured: false, dry_run: false, loading: true },
  alerts: null,
  alertsLoadedAt: 0,
  recentOrders: [],
  attentionOrders: [],
  orderCache: new Map()
};

const API = {
  overview:      '/api/admin/boost/overview',
  orders:        '/api/admin/boost/orders',
  order:         id => '/api/admin/boost/orders/' + encodeURIComponent(id),
  orderStatus:   id => '/api/admin/boost/orders/' + encodeURIComponent(id) + '/status',
  orderRefund:   id => '/api/admin/boost/orders/' + encodeURIComponent(id) + '/refund',
  orderNote:     id => '/api/admin/boost/orders/' + encodeURIComponent(id) + '/note',
  orderRecheck:  id => '/api/admin/boost/orders/' + encodeURIComponent(id) + '/recheck',
  sync:          '/api/admin/boost/sync',
  services:      '/api/admin/boost/services',
  service:       id => '/api/admin/boost/services/' + encodeURIComponent(id),
  servicesBulk:  '/api/admin/boost/services/bulk',
  servicesSync:  '/api/admin/boost/services/sync',
  provider:      '/api/admin/boost/provider',
  alerts:        '/api/admin/boost/alerts',
  config:        '/api/admin/boost/config'
};

/* ═════════════════════════════════════════════════════════════════
   Network
   ═════════════════════════════════════════════════════════════════ */

async function call(url, opts) {
  try {
    const fetcher = (window.AdminSession && typeof AdminSession.fetch === 'function')
      ? AdminSession.fetch
      : function (u, o) { return fetch(u, Object.assign({ credentials: 'include' }, o)); };
    const res = await fetcher(url, opts || {});
    let json = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) { try { json = await res.json(); } catch (_) {} }
    if (res.ok) return { ok: true, status: res.status, body: json };
    return {
      ok: false, status: res.status,
      code: json && json.code,
      error: (json && (json.error || json.message)) || ('HTTP ' + res.status),
      body: json
    };
  } catch (e) {
    return { ok: false, status: 0, code: 'NETWORK_ERROR', error: 'Network error', body: null };
  }
}

/* ═════════════════════════════════════════════════════════════════
   Shell
   ═════════════════════════════════════════════════════════════════ */

function renderShell() {
  const content = document.getElementById('content');
  if (!content) return;
  content.innerHTML = `
    <div class="page-header">
      <div>
        <h2>Boost</h2>
        <p class="sub">Social boosting operations across SMMWiz.</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
        <button class="btn btn-primary" id="syncBtn"><i class="fas fa-arrows-rotate"></i> Sync now</button>
      </div>
    </div>
    <div id="bannerHost"></div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="overview" role="tab">Overview</button>
      <button class="tab" data-tab="orders" role="tab">Orders <span class="cnt" id="tabOrdersCnt">—</span></button>
      <button class="tab" data-tab="services" role="tab">Services <span class="cnt" id="tabServicesCnt">—</span></button>
      <button class="tab" data-tab="settings" role="tab">Settings</button>
    </div>
    <section class="tab-panel active" id="panel-overview"></section>
    <section class="tab-panel" id="panel-orders"></section>
    <section class="tab-panel" id="panel-services"></section>
    <section class="tab-panel" id="panel-settings"></section>
  `;
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  document.getElementById('refreshBtn').addEventListener('click', () => refreshCurrent(true));
  document.getElementById('syncBtn').addEventListener('click', doSync);
  renderBanners();
  switchTab(State.tab);
}

function renderBanners() {
  const host = document.getElementById('bannerHost');
  if (!host) return;
  const parts = [];
  if (State.provider.dry_run) {
    parts.push('<div class="dry-banner"><i class="fas fa-triangle-exclamation"></i> Provider DRY-RUN is ON. No real orders will be sent to SMMWiz.</div>');
  }
  if (State.provider.loading) {
    // no banner while loading
  } else if (!State.provider.configured) {
    parts.push('<div class="provider-warn"><span><i class="fas fa-triangle-exclamation"></i> SMMWiz is not configured. Boosting cannot submit orders.</span></div>');
  } else if (State.provider.balance === null) {
    parts.push('<div class="provider-warn"><span><i class="fas fa-plug-circle-xmark"></i> Provider balance is unreachable. Check the API key or SMMWiz status.</span><button class="btn" id="retryProviderBtn"><i class="fas fa-rotate"></i> Retry</button></div>');
  } else if (State.provider.balance < 20) {
    parts.push(`<div class="provider-warn"><span><i class="fas fa-triangle-exclamation"></i> Low provider balance: <strong>$${Number(State.provider.balance).toFixed(2)}</strong>. Top up SMMWiz to keep filling orders.</span><button class="btn" id="retryProviderBtn"><i class="fas fa-rotate"></i> Retry</button></div>`);
  }
  host.innerHTML = parts.join('');
  document.getElementById('retryProviderBtn')?.addEventListener('click', () => loadProvider(true));
}

function switchTab(tab) {
  State.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'overview') renderOverviewPanel();
  if (tab === 'orders')   renderOrdersPanel();
  if (tab === 'services') renderServicesPanel();
  if (tab === 'settings') renderSettingsPanel();
  if (history.replaceState) history.replaceState(null, '', '#' + tab);
}

function refreshCurrent(force) {
  if (State.tab === 'overview') { loadOverview(force); loadAlerts(force); }
  else if (State.tab === 'orders') loadOrders(force);
  else if (State.tab === 'services') loadServices(force);
  else if (State.tab === 'settings') loadConfig(force);
}

async function doSync() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  const r = await call(API.sync, { method: 'POST' });
  btn.disabled = false;
  if (!r.ok) {
    const msg = r.code === 'PROVIDER_NOT_CONFIGURED' ? 'SMMWiz is not configured. Set SMMWIZ_API_KEY.' : (r.error || 'Sync failed');
    window.MS.toast(msg, 'error'); return;
  }
  const sub = (r.body.submit && r.body.submit.submitted) || 0;
  const sw = (r.body.sweep && r.body.sweep.updated) || 0;
  window.MS.toast('Sync: ' + sub + ' submitted, ' + sw + ' updated', 'success');
  State.overviewSig = null;
  State.orders.sig = null;
  State.services.sig = null;
  State.orderCache.clear();
  refreshCurrent(true);
}

let _providerInFlight = null;
async function loadProvider(force) {
  if (_providerInFlight && !force) return _providerInFlight;
  State.provider.loading = true;
  renderBanners();
  _providerInFlight = (async () => {
    const r = await call(API.provider);
    if (r.ok && r.body) {
      const b = r.body.balance || {};
      State.provider = {
        configured: !!r.body.configured,
        dry_run: !!r.body.dry_run,
        balance: (b && typeof b.balance === 'number') ? b.balance : null,
        currency: (b && b.currency) || 'USD',
        loading: false
      };
    } else {
      State.provider.loading = false;
    }
    renderBanners();
  })().finally(() => { _providerInFlight = null; });
  return _providerInFlight;
}

async function loadAlerts(force) {
  const fresh = State.alerts && (Date.now() - State.alertsLoadedAt) < 30000;
  if (fresh && !force) { renderAlerts(); return; }
  const r = await call(API.alerts);
  if (r.ok && r.body && r.body.alerts) {
    State.alerts = r.body.alerts;
    State.alertsLoadedAt = Date.now();
  }
  renderAlerts();
}

const RANGE_PRESETS = {
  today: { label: 'Today' },
  '7d':  { label: '7 days' },
  '30d': { label: '30 days' },
  all:   { label: 'All' }
};

function rangeToDates(range) {
  if (range === 'all') return { from: null, to: null };
  const to = new Date();
  const from = new Date();
  if (range === 'today') from.setUTCHours(0, 0, 0, 0);
  else if (range === '7d')  from.setUTCDate(from.getUTCDate() - 7);
  else if (range === '30d') from.setUTCDate(from.getUTCDate() - 30);
  return { from: from.toISOString(), to: to.toISOString() };
}

  if (a.provider_unknown_old && a.provider_unknown_old.warn)
    rows.push({ cls: 'danger', icon: 'fa-triangle-exclamation', title: 'Orders stuck at provider_unknown', meta: `${a.provider_unknown_old.count} order(s) waiting >10 min. Verify at SMMWiz before refunding.` });

    rows.push({ cls: 'warn', icon: 'fa-dollar-sign', title: 'Services priced below cost', meta: `${a.services_below_cost.count} active service(s) with price < provider cost.` });

async function loadOverview(force) {
  const { from, to } = rangeToDates(State.range);
  const sig = JSON.stringify({ range: State.range });
  const fresh = State.overview && State.overviewSig === sig &&
                (Date.now() - State.overviewFetchedAt) < OVERVIEW_FRESH_MS;

  if (!force && fresh) {
    paintOverviewKpis(State.overview);
    paintRecentOrders(State.recentOrders);
    paintAttention(State.attentionOrders);
    return;
  }

  const qs = new URLSearchParams();
  qs.set('range', State.range);
  if (from) qs.set('from', from);
  if (to)   qs.set('to', to);

  const done = perf('loadOverview', Date.now());
  const [ro, rr, ra] = await Promise.all([
    call(API.overview + '?' + qs.toString()),
    call(API.orders + '?limit=8&withCount=false'),
    call(API.orders + '?status=provider_unknown&limit=20&withCount=false')
  ]);
  done();

  if (!ro.ok) {
    const kp = document.getElementById('overviewKpis');
    if (kp) kp.innerHTML = '<div class="kpi"><div class="lbl">Error</div><div class="val" style="font-size:14px;color:var(--danger)">' + U.esc(ro.error || 'Failed') + '</div></div>';
    return;
  }
  State.overview = ro.body.overview || {};
  State.overviewSig = sig;
  State.overviewFetchedAt = Date.now();
  paintOverviewKpis(State.overview);

  State.recentOrders = (rr.ok && rr.body && rr.body.orders) || [];
  paintRecentOrders(State.recentOrders);

  State.attentionOrders = (ra.ok && ra.body && ra.body.orders) || [];
  paintAttention(State.attentionOrders);
}

async function loadOrders(force) {
  const qs = new URLSearchParams({ page: State.orders.page, limit: State.orders.limit, withCount: 'true' });
  const f = State.orders.filters;
  if (f.search)   qs.set('search', f.search);
  if (f.status && f.status !== 'all')     qs.set('status', f.status);
  if (f.currency && f.currency !== 'all') qs.set('currency', f.currency);
  if (f.from) qs.set('from', f.from);
  if (f.to)   qs.set('to', f.to);
  const sig = qs.toString();

  const fresh = State.orders.sig === sig && State.orders.list.length &&
                (Date.now() - State.orders.fetchedAt) < ORDERS_FRESH_MS;

  if (!force && fresh) {
    paintOrdersRows(State.orders.list, State.orders.count, State.orders.totalPages);
    return;
  }

  const tb = document.getElementById('ordersBody');
  if (tb) tb.innerHTML = '<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--text-faint)">Loading…</td></tr>';
  const done = perf('loadOrders', Date.now());
  const r = await call(API.orders + '?' + sig);
  done();
  if (!r.ok) {
    if (tb) tb.innerHTML = '<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--danger)">' + U.esc(r.error || 'Failed') + '</td></tr>';
    return;
  }
  State.orders.totalPages = r.body.totalPages || 1;
  State.orders.count = r.body.count || 0;
  State.orders.list = r.body.orders || [];
  State.orders.sig = sig;
  State.orders.fetchedAt = Date.now();
  State.orders.list.forEach(o => State.orderCache.set(String(o.id), o));
  paintOrdersRows(State.orders.list, State.orders.count, State.orders.totalPages);
  const cnt = document.getElementById('tabOrdersCnt');
  if (cnt) cnt.textContent = String(State.orders.count);
}

  const tb = document.getElementById('ordersBody');
  if (!tb) return;
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="9" style="padding:24px;text-align:center;color:var(--text-faint)">No orders match your filters</td></tr>';
    document.getElementById('pageInfo').textContent = 'No results';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  tb.innerHTML = rows.map(o => `
    <tr data-order-id="${U.esc(o.id)}">
      <td data-cell="Order">${U.esc(o.order_ref)}</td>
      <td data-cell="Customer">${U.esc(o.user && o.user.username || '—')}</td>
      <td data-cell="Service">${U.esc(o.service_name || '—')}</td>
      <td data-cell="Qty">${U.int(o.quantity)}</td>
      <td data-cell="Amount">${U.money(o.total_amount, o.currency)}</td>
      <td data-cell="Cost">${U.money(o.provider_cost, o.currency)}</td>
      <td data-cell="Profit">${U.money(o.profit_amount, o.currency)}</td>
      <td data-cell="Status"><span class="badge ${U.statusClass(o.status)}">${U.esc(o.status)}</span></td>
      <td data-cell="Created">${U.ago(o.created_at)}</td>
    </tr>
  `).join('');
  tb.querySelectorAll('[data-order-id]').forEach(tr =>
    tr.addEventListener('click', () => {
      const row = rows.find(o => String(o.id) === String(tr.dataset.orderId));
      if (row) State.orderCache.set(String(row.id), row);
      openOrderDrawer(tr.dataset.orderId);
    })
  );
  document.getElementById('pageInfo').textContent =
    `Showing ${(State.orders.page - 1) * State.orders.limit + 1}–${Math.min(State.orders.page * State.orders.limit, count)} of ${count}`;
  document.getElementById('prevBtn').disabled = State.orders.page <= 1;
  document.getElementById('nextBtn').disabled = State.orders.page >= totalPages;
}

/* ═════════════════════════════════════════════════════════════════
   Order drawer
   ═════════════════════════════════════════════════════════════════ */

async function openOrderDrawer(id) {
  const key = String(id);
  const cached = State.orderCache.get(key);

  const d = document.createElement('div');
  d.className = 'drawer-scrim open';
  d.innerHTML = `
    <div class="detail-drawer open" role="dialog" aria-modal="true" style="display:flex;flex-direction:column">
      <div class="dd-head">
        <div class="dd-ic"><i class="fas fa-receipt"></i></div>
        <div class="dd-titles">
          <h2 id="drawerTitle">${cached ? U.esc(cached.order_ref || 'Order') : 'Loading…'}</h2>
          <div class="dd-sub" id="drawerSub">${cached ? U.esc((cached.service_name || '') + ' · ' + (cached.user && cached.user.username || '')) : ''}</div>
        </div>
        <button class="dd-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="dd-body" id="drawerBody">
        <div class="stale-hint" id="drawerHint"><i class="fas fa-spinner fa-spin"></i> Refreshing details…</div>
        ${cached ? renderOrderBody(cached, true) : '<div class="empty-state" style="padding:40px"><div class="sk" style="height:120px"></div></div>'}
      </div>
      <div class="dd-actions" id="drawerActions" style="padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0">
        ${cached ? renderOrderActions(cached) : '<span style="color:var(--text-faint);font-size:12.5px">Loading…</span>'}
      </div>
    </div>
  `;
  document.body.appendChild(d);
  document.body.style.overflow = 'hidden';

  const close = () => { d.remove(); document.body.style.overflow = ''; };
  d.querySelector('.dd-close').addEventListener('click', close);
  d.addEventListener('click', e => { if (e.target === d) close(); });

  const attachActionHandlers = (order) => {
    d.querySelector('#btnRecheck')?.addEventListener('click', async () => {
      const btn = d.querySelector('#btnRecheck');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking…';
      const rr = await call(API.orderRecheck(id), { method: 'POST' });
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-arrows-rotate"></i> Check provider';
      if (!rr.ok) { window.MS.toast(rr.error || 'Failed', 'error'); return; }
      window.MS.toast(rr.body.refreshed ? 'Updated' : 'No change', 'success');
      if (rr.body.order) {
        State.orderCache.set(key, rr.body.order);
        paintDrawerInPlace(d, rr.body.order, false);
        attachActionHandlers(rr.body.order);
      }
    });

    d.querySelector('#btnNote')?.addEventListener('click', async () => {
      const note = await window.MS.reasonModal({ title: 'Add note', message: 'Internal note for this order.', min: 2 });
      if (!note) return;
      const rr = await call(API.orderNote(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note })
      });
      if (!rr.ok) { window.MS.toast(rr.error || 'Failed', 'error'); return; }
      window.MS.toast('Note saved', 'success');
      if (rr.body.order) {
        State.orderCache.set(key, rr.body.order);
        paintDrawerInPlace(d, rr.body.order, false);
        attachActionHandlers(rr.body.order);
      }
    });

    d.querySelector('#btnStatus')?.addEventListener('click', async () => {
      const allowed = order.allowed_transitions || [];
      if (!allowed.length) { window.MS.toast('No valid transitions for this status.', 'info'); return; }
      const currentStatus = String(order.status).toLowerCase();
      const next = prompt('New status (' + allowed.join(', ') + '):', allowed[0]);
      if (!next || !allowed.includes(next)) return;
      const reason = await window.MS.reasonModal({ title: 'Change status', message: 'Reason is required.', min: 4 });
      if (!reason) return;
      let verified_at_provider = false;
      if (['provider_unknown', 'manual_review'].includes(currentStatus) && next === 'refunded') {
        const confirmed = await window.MS.confirmModal({
          title: 'Verify at provider',
          message: 'Confirm you have checked SMMWiz and the order was NOT fulfilled. This cannot be undone.',
          confirmText: 'Verified'
        });
        if (!confirmed) { window.MS.toast('Cancelled', 'info'); return; }
        verified_at_provider = true;
      }
      const rr = await call(API.orderStatus(id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: next, note: reason, verified_at_provider })
      });
      if (!rr.ok) { window.MS.toast(rr.error || 'Failed', 'error'); return; }
      window.MS.toast('Status updated', 'success');
      if (rr.body.order) {
        State.orderCache.set(key, rr.body.order);
        paintDrawerInPlace(d, rr.body.order, false);
        attachActionHandlers(rr.body.order);
      }
      State.orders.sig = null;
      State.overviewSig = null;
    });

    d.querySelector('#btnRefund')?.addEventListener('click', async () => {
      const status = String(order.status).toLowerCase();
      const allowNonFailed = ['provider_unknown', 'manual_review', 'partial'].includes(status);
      const needsVerify = ['provider_unknown', 'manual_review'].includes(status);

      const w = document.createElement('div');
      w.className = 'drawer-scrim open';
      w.innerHTML = `
        <div class="detail-drawer open" role="dialog" aria-modal="true" style="max-width:480px">
          <div class="dd-head">
            <div class="dd-ic" style="background:rgba(255,255,255,.18)"><i class="fas fa-rotate-left"></i></div>
            <div class="dd-titles">
              <h2>Refund order</h2>
              <div class="dd-sub">${U.esc(order.order_ref)} · ${U.money(order.total_amount, order.currency)}</div>
            </div>
            <button class="dd-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
          </div>
          <div class="dd-body">
            ${allowNonFailed
              ? `<div class="verify-block">This order is <strong>${U.esc(status)}</strong>. Refunding will credit the customer immediately. ${needsVerify ? 'You <strong>must</strong> verify at SMMWiz first.' : ''}</div>`
              : `<div class="verify-block" style="background:var(--info-bg);border-color:var(--info-bd);color:var(--info)">This will credit the customer wallet and mark the order refunded.</div>`}
            ${needsVerify ? `<div class="verify-block"><label><input type="checkbox" id="verifyCheck"> I have checked the SMMWiz panel and this order was <strong>not</strong> fulfilled.</label></div>` : ''}
            <div class="form-row"><label>Reason (required)</label><textarea id="refundReason" rows="3" style="width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:9px;font-size:14px"></textarea></div>
          </div>
          <div class="dd-actions" style="padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0">
            <button class="btn btn-ghost" id="refundCancel">Cancel</button>
            <button class="btn btn-danger" id="refundGo" ${needsVerify ? 'disabled' : ''}><i class="fas fa-rotate-left"></i> Refund</button>
          </div>
        </div>
      `;
      document.body.appendChild(w);
      const wClose = () => w.remove();
      w.querySelector('.dd-close').addEventListener('click', wClose);
      w.querySelector('#refundCancel').addEventListener('click', wClose);
      const verify = w.querySelector('#verifyCheck');
      const go = w.querySelector('#refundGo');
      if (verify) verify.addEventListener('change', () => { go.disabled = !verify.checked; });
      go.addEventListener('click', async () => {
        const reason = (w.querySelector('#refundReason').value || '').trim();
        if (reason.length < 4) { window.MS.toast('Reason must be at least 4 characters', 'error'); return; }
        const verified_at_provider = verify ? !!verify.checked : false;
        if (needsVerify && !verified_at_provider) { window.MS.toast('Verification is required for this status.', 'error'); return; }
        go.disabled = true;
        go.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Refunding…';
        const rr = await call(API.orderRefund(id), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason, allow_non_failed: allowNonFailed, verified_at_provider })
        });
        go.disabled = false;
        go.innerHTML = '<i class="fas fa-rotate-left"></i> Refund';
        if (!rr.ok) {
          if (rr.code === 'REFUND_PENDING_RECONCILE') {
            window.MS.toast('Refund recorded. Wallet credit will be reconciled by the worker.', 'warn');
            wClose();
            const patched = { ...order, status: 'refunded', refund_status: 'refunded', refund_processed_at: new Date().toISOString() };
            State.orderCache.set(key, patched);
            paintDrawerInPlace(d, patched, false);
            attachActionHandlers(patched);
            State.orders.sig = null;
            return;
          }
          window.MS.toast(rr.error || 'Refund failed', 'error'); return;
        }
        window.MS.toast('Refund applied', 'success');
        wClose();
        const patched = { ...order, status: 'refunded', refund_status: 'refunded', refund_processed_at: new Date().toISOString() };
        State.orderCache.set(key, patched);
        paintDrawerInPlace(d, patched, false);
        attachActionHandlers(patched);
        State.orders.sig = null;
        State.overviewSig = null;
      });
    });
  };

  if (cached) attachActionHandlers(cached);

  const hint = d.querySelector('#drawerHint');
  if (hint) hint.classList.add('show');
  const r = await call(API.order(id));
  if (hint) hint.classList.remove('show');
  if (!r.ok) {
    if (!cached) {
      const body = d.querySelector('#drawerBody');
      body.innerHTML = '<div class="empty-state" style="padding:30px;color:var(--text-faint)">' + U.esc(r.error || 'Could not load order.') + '</div>';
    }
    return;
  }
  const fresh = r.body.order;
  State.orderCache.set(key, fresh);
  paintDrawerInPlace(d, fresh, false);
  attachActionHandlers(fresh);
}

function paintDrawerInPlace(d, o, isCached) {
  const titleEl = d.querySelector('#drawerTitle');
  const subEl   = d.querySelector('#drawerSub');
  const bodyEl  = d.querySelector('#drawerBody');
  const actEl   = d.querySelector('#drawerActions');
  if (titleEl) titleEl.textContent = o.order_ref || 'Order';
  if (subEl)   subEl.textContent   = (o.service_name || '') + ' · ' + (o.user && o.user.username || '');
  if (bodyEl) {
    const hint = bodyEl.querySelector('#drawerHint');
    bodyEl.innerHTML = '';
    if (hint) bodyEl.appendChild(hint);
    const wrap = document.createElement('div');
    wrap.innerHTML = renderOrderBody(o, isCached);
    bodyEl.appendChild(wrap);
  }
  if (actEl) actEl.innerHTML = renderOrderActions(o);
}

      <div class="dd-field"><span class="k">Quantity</span><span class="v">${U.int(o.quantity)}</span></div>

      <div class="dd-field"><span class="k">Profit</span><span class="v" style="color:var(--success)">${U.money(o.profit_amount, o.currency)}</span></div>

    <div class="dd-section">
      <h4>Provider</h4>
      <div class="dd-field"><span class="k">Provider</span><span class="v">${U.esc(o.provider || '—')}</span></div>
      <div class="dd-field"><span class="k">API order ID</span><span class="v mono">${U.esc(o.api_order_id || '—')}</span></div>
      <div class="dd-field"><span class="k">Provider status</span><span class="v">${U.esc(o.provider_status || '—')}</span></div>
      <div class="dd-field"><span class="k">Last checked</span><span class="v">${U.dt(o.provider_last_checked_at)}</span></div>
      ${o.verified_at_provider ? `<div class="dd-field"><span class="k">Verified at provider</span><span class="v" style="color:var(--success)">${U.dt(o.verified_at_provider_at)}</span></div>` : ''}
    </div>

      <h4>Refund</h4>

      <div class="dd-field"><span class="k">Reference</span><span class="v mono">${U.esc(o.refund_reference || '—')}</span></div>
      <div class="dd-field"><span class="k">Processed</span><span class="v">${U.dt(o.refund_processed_at)}</span></div>
    </div>
    <div class="dd-section">
      <h4>Admin</h4>
      <div class="dd-field"><span class="k">Note</span><span class="v">${U.esc(o.admin_note || '—')}</span></div>

function renderOrderActions(o) {
  const allowed = o.allowed_transitions || [];
  return `
    ${allowed.length ? '<button class="btn btn-ghost" id="btnStatus"><i class="fas fa-exchange-alt"></i> Change status</button>' : ''}
    ${['failed', 'cancelled', 'provider_unknown', 'manual_review', 'partial'].includes(String(o.status).toLowerCase()) ? '<button class="btn btn-danger" id="btnRefund"><i class="fas fa-rotate-left"></i> Refund</button>' : ''}
    <button class="btn btn-ghost" id="btnRecheck"><i class="fas fa-arrows-rotate"></i> Check provider</button>
    <button class="btn btn-ghost" id="btnNote"><i class="fas fa-sticky-note"></i> Note</button>
  `;
}

const SERVICES_FRESH_MS = 30_000;

function renderServicesPanel() {
  const panel = document.getElementById('panel-services');
  if (!panel.querySelector('#svcRowList')) {
    panel.innerHTML = `
      <div class="card panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap">
          <h3 style="margin:0;font-size:14px;font-weight:800">Boost services</h3>
          <button class="btn btn-primary" id="syncSvcBtn"><i class="fas fa-arrows-rotate"></i> Import from SMMWiz</button>
        </div>
        <p style="font-size:11.5px;color:var(--text-faint);margin-bottom:12px;line-height:1.5">Only <strong>active</strong> and <strong>visible</strong> services are shown to customers. New imports come in inactive — toggle on the ones you want to sell.</p>
        <div class="filter-row">
          <input type="search" id="sSearch" placeholder="Search services…">
          <select id="sPlatform">
            <option value="all">All platforms</option>
            <option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="youtube">YouTube</option>
            <option value="facebook">Facebook</option><option value="twitter">Twitter/X</option><option value="telegram">Telegram</option>
            <option value="whatsapp">WhatsApp</option><option value="discord">Discord</option><option value="spotify">Spotify</option><option value="other">Other</option>
          </select>
          <select id="sLive">
            <option value="all">All</option>
            <option value="on">Active only</option>
            <option value="off">Inactive only</option>
          </select>
          <select id="sLimit">
            <option value="50">50 / page</option>
            <option value="100">100 / page</option>
            <option value="200">200 / page</option>
          </select>
        </div>
        <div class="bulk-bar" id="bulkBar"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:6px 8px"><input type="checkbox" id="selAll" style="width:16px;height:16px;accent-color:var(--navy)"> Select this page</label>
          <button class="btn btn-ghost btn-sm" id="bulkOn"><i class="fas fa-toggle-on"></i> Turn on selected</button>
          <button class="btn btn-ghost btn-sm" id="bulkOff"><i class="fas fa-toggle-off"></i> Turn off selected</button>
          <button class="btn btn-ghost btn-sm" id="bulkMarkup"><i class="fas fa-percent"></i> Set markup…</button>
          <button class="btn btn-ghost btn-sm" id="bulkReset"><i class="fas fa-rotate-left"></i> Reset to global</button>
        </div>
        <div class="svc-row-list" id="svcRowList">
          <div style="padding:30px;text-align:center;color:var(--text-faint)">Loading…</div>
        </div>
        <div class="pager">
          <div id="svcPageInfo">—</div>
          <div class="btns">
            <button class="btn btn-ghost" id="svcPrev" disabled>Previous</button>
            <button class="btn btn-ghost" id="svcNext" disabled>Next</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('syncSvcBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncSvcBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing…';
      const r = await call(API.servicesSync, { method: 'POST' });
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-arrows-rotate"></i> Import from SMMWiz';
      if (!r.ok) {
        const msg = r.code === 'PROVIDER_NOT_CONFIGURED' ? 'SMMWiz is not configured. Set SMMWIZ_API_KEY.' : (r.error || 'Import failed');
        window.MS.toast(msg, 'error'); return;
      }
      const d = r.body || {};
      window.MS.toast('Import complete: ' + d.created + ' new, ' + d.updated + ' updated, ' + d.deactivated + ' off' + (d.rate_changes ? ' (' + d.rate_changes + ' rate changes)' : '') + (d.skipped_non_default ? ' · ' + d.skipped_non_default + ' non-Default skipped' : ''), 'success');
      State.services.page = 1;
      State.services.sig = null;
      loadServices(true);
    });
    document.getElementById('sSearch').addEventListener('input', debounce(() => {
      State.services.filters.search = document.getElementById('sSearch').value.trim();
      State.services.page = 1; State.services.sig = null; loadServices(true);
    }, 250));
    document.getElementById('sPlatform').addEventListener('change', () => {
      State.services.filters.platform = document.getElementById('sPlatform').value;
      State.services.page = 1; State.services.sig = null; loadServices(true);
    });
    document.getElementById('sLive').addEventListener('change', () => {
      const v = document.getElementById('sLive').value;
      State.services.filters.active = v === 'on' ? 'true' : v === 'off' ? 'false' : undefined;
      State.services.page = 1; State.services.sig = null; loadServices(true);
    });
    document.getElementById('sLimit').addEventListener('change', () => {
      State.services.limit = parseInt(document.getElementById('sLimit').value, 10) || 50;
      State.services.page = 1; State.services.sig = null; loadServices(true);
    });
    document.getElementById('selAll').addEventListener('change', e => {
      if (e.target.checked) State.services.list.forEach(s => State.services.selected.add(s.id));
      else State.services.selected.clear();
      paintServiceList();
      updateBulkBar();
    });
    document.getElementById('bulkOn').addEventListener('click', () => bulkToggle('active', true));
    document.getElementById('bulkOff').addEventListener('click', () => bulkToggle('active', false));
    document.getElementById('bulkReset').addEventListener('click', bulkReset);
    document.getElementById('bulkMarkup').addEventListener('click', bulkMarkup);
    document.getElementById('svcPrev').addEventListener('click', () => {
      if (State.services.page > 1) { State.services.page--; State.services.sig = null; loadServices(true); }
    });
    document.getElementById('svcNext').addEventListener('click', () => {
      if (State.services.page < State.services.totalPages) { State.services.page++; State.services.sig = null; loadServices(true); }
    });
  }
  loadServices(false);
}

async function loadServices(force) {
  const qs = new URLSearchParams({ page: State.services.page, limit: State.services.limit });
  const f = State.services.filters;
  if (f.search) qs.set('search', f.search);
  if (f.platform && f.platform !== 'all') qs.set('platform', f.platform);
  if (f.active !== undefined) qs.set('active', f.active);
  const sig = qs.toString();

  const fresh = State.services.sig === sig && State.services.list.length &&
                (Date.now() - State.services.fetchedAt) < SERVICES_FRESH_MS;

  if (!force && fresh) {
    paintServiceList();
    return;
  }

  const list = document.getElementById('svcRowList');
  if (list) list.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-faint)">Loading…</div>';
  const done = perf('loadServices', Date.now());
  const r = await call(API.services + '?' + sig);
  done();
  if (!r.ok) {
    if (list) list.innerHTML = '<div style="padding:30px;text-align:center;color:var(--danger)">' + U.esc(r.error || 'Failed') + '</div>';
    return;
  }
  State.services.list = r.body.services || [];
  State.services.totalPages = r.body.totalPages || 1;
  State.services.count = r.body.count || State.services.list.length;
  State.services.sig = sig;
  State.services.fetchedAt = Date.now();
  const cnt = document.getElementById('tabServicesCnt');
  if (cnt) cnt.textContent = String(State.services.count);
  const pageIds = new Set(State.services.list.map(s => s.id));
  [...State.services.selected].forEach(id => { if (!pageIds.has(id)) State.services.selected.delete(id); });
  paintServiceList();
  updateBulkBar();
  const info = document.getElementById('svcPageInfo');
  if (info) {
    const from = (State.services.page - 1) * State.services.limit + 1;
    const to = Math.min(State.services.page * State.services.limit, State.services.count);
    info.textContent = State.services.count ? `Showing ${from}–${to} of ${State.services.count}` : 'No services';
  }
  document.getElementById('svcPrev').disabled = State.services.page <= 1;
  document.getElementById('svcNext').disabled = State.services.page >= State.services.totalPages;
}

function paintServiceList() {
  const list = document.getElementById('svcRowList');
  if (!list) return;
  if (!State.services.list.length) {
    list.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-faint)"><i class="fas fa-box" style="font-size:1.5rem;display:block;margin-bottom:8px;color:var(--border)"></i>No services. Click "Import from SMMWiz".</div>';
    return;
  }
  list.innerHTML = State.services.list.map(s => {
    const eff = s.effective || {};
    const src = eff.source || 'global';
    const usd = eff.usd_per_1k;
    const ngn = eff.ngn_per_1k;
    const margin = eff.margin_pct;
    const below = eff.below_cost;
    const cb = State.services.selected.has(s.id) ? 'checked' : '';
    const usdStr = usd != null ? '$' + Number(usd).toFixed(4) : '—';
    const ngnStr = ngn != null ? '₦' + Number(ngn).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—';
    const marginStr = margin != null ? Number(margin).toFixed(1) + '%' : '—';
    return `
      <div class="svc-row" data-id="${U.esc(s.id)}">
        <input type="checkbox" class="svc-row-cb" data-id="${U.esc(s.id)}" ${cb}>
        <div class="svc-row-main">
          <div class="svc-row-name">${U.esc(s.name || '—')}</div>
          <div class="svc-row-meta">
            <span>${U.esc(s.provider_service_id)}</span><span>·</span>
            <span>${U.esc(s.platform || 'other')}</span><span>·</span>
            <span>${U.esc(s.category || 'other')}</span><span>·</span>
            <span>Min ${U.int(s.min_quantity)} · Max ${U.int(s.max_quantity)}</span>
          </div>
        </div>
        <div class="price-info">
          <span class="big">${ngnStr} <span style="font-weight:500;color:var(--text-dim);font-size:10px">/ 1k</span></span>
          <span>${usdStr} · margin ${marginStr}</span>
          <span style="display:inline-flex;gap:4px;margin-top:2px">
            <span class="badge-src src-${src}">${src}</span>
            ${below ? '<span class="warn-chip">Below cost</span>' : ''}
          </span>
        </div>
        <div class="svc-row-right">
          <label class="toggle"><input type="checkbox" data-toggle="active" data-id="${U.esc(s.id)}" ${s.active ? 'checked' : ''}><span class="tk"></span>Active</label>
          <label class="toggle"><input type="checkbox" data-toggle="visible" data-id="${U.esc(s.id)}" ${s.visible_to_users ? 'checked' : ''}><span class="tk"></span>Visible</label>
          <button class="btn btn-ghost btn-sm" data-edit="${U.esc(s.id)}"><i class="fas fa-pen"></i> Edit</button>
        </div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.svc-row-cb').forEach(cb => cb.addEventListener('change', e => {
    const id = e.target.dataset.id;
    if (e.target.checked) State.services.selected.add(id); else State.services.selected.delete(id);
    updateBulkBar();
  }));
  list.querySelectorAll('[data-toggle]').forEach(inp => inp.addEventListener('change', async e => {
    const id = e.target.dataset.id;
    const field = e.target.dataset.toggle === 'active' ? 'active' : 'visible_to_users';
    const value = e.target.checked;
    // Optimistic UI
    const row = State.services.list.find(x => x.id === id);
    if (row) { row[field] = value; if (field === 'active' && value) row.visible_to_users = true; }
    e.target.disabled = true;
    const patch = {}; patch[field] = value;
    if (field === 'active' && value) patch.visible_to_users = true;
    const r = await call(API.service(id), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
    });
    e.target.disabled = false;
    if (!r.ok) {
      e.target.checked = !value;
      if (row) { row[field] = !value; if (field === 'active' && !value) row.visible_to_users = false; }
      if (r.code === 'NO_PROVIDER_RATE') window.MS.toast('Cannot activate — no provider rate.', 'error');
      else window.MS.toast(r.error || 'Failed', 'error');
      return;
    }
    window.MS.toast('Saved', 'success');
    // If we flipped Active on, also flip the Visible checkbox in the DOM.
    if (field === 'active' && value) {
      const v = list.querySelector(`[data-toggle="visible"][data-id="${CSS.escape(id)}"]`);
      if (v) v.checked = true;
    }
  }));
  list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openServiceEdit(b.dataset.edit)));
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  if (!bar) return;
  const n = State.services.selected.size;
  if (!n) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<strong>${n} selected</strong><span style="flex:1"></span><button class="btn btn-ghost btn-sm" id="bulkClear">Clear</button>`;
  document.getElementById('bulkClear').addEventListener('click', () => {
    State.services.selected.clear();
    document.getElementById('selAll').checked = false;
    paintServiceList(); updateBulkBar();
  });
}

async function bulkToggle(field, value) {
  if (!State.services.selected.size) { window.MS.toast('Select services first', 'warn'); return; }
  const patch = {}; patch[field] = value;
  if (field === 'active' && value) patch.visible_to_users = true;
  const r = await call(API.servicesBulk, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: [...State.services.selected], patch })
  });
  if (!r.ok) { window.MS.toast(r.error || 'Failed', 'error'); return; }
  window.MS.toast('Updated ' + r.body.updated + ' services', 'success');
  State.services.selected.clear();
  document.getElementById('selAll').checked = false;
  State.services.sig = null;
  loadServices(true);
}

async function bulkReset() {
  if (!State.services.selected.size) { window.MS.toast('Select services first', 'warn'); return; }
  const r = await call(API.servicesBulk, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: [...State.services.selected], patch: { markup_percent: null, custom_price: null } })
  });
  if (!r.ok) { window.MS.toast(r.error || 'Failed', 'error'); return; }
  window.MS.toast('Reset to global markup', 'success');
  State.services.selected.clear();
  document.getElementById('selAll').checked = false;
  State.services.sig = null;
  loadServices(true);
}

async function bulkMarkup() {
  if (!State.services.selected.size) { window.MS.toast('Select services first', 'warn'); return; }
  const input = prompt('New markup percent (0–2000). Leave blank to skip:');
  if (input == null || input.trim() === '') return;
  const n = Number(input);
  if (!isFinite(n) || n < 0 || n > 2000) { window.MS.toast('Invalid markup', 'error'); return; }
  const r = await call(API.servicesBulk, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: [...State.services.selected], patch: { markup_percent: n / 100, custom_price: null } })
  });
  if (!r.ok) { window.MS.toast(r.error || 'Failed', 'error'); return; }
  window.MS.toast('Markup set on ' + r.body.updated + ' services', 'success');
  State.services.selected.clear();
  document.getElementById('selAll').checked = false;
  State.services.sig = null;
  loadServices(true);
}

async function openServiceEdit(id) {
  const s = State.services.list.find(x => x.id === id);
  if (!s) return;
  const markupDisplay = s.markup_percent != null ? Number((Number(s.markup_percent) * 100).toFixed(2)) : '';
  const d = document.createElement('div');
  d.className = 'drawer-scrim open';
  d.innerHTML = `
    <div class="detail-drawer open" role="dialog" aria-modal="true" style="display:flex;flex-direction:column">
      <div class="dd-head">
        <div class="dd-ic"><i class="fas fa-pen"></i></div>
        <div class="dd-titles">
          <h2>Edit service</h2>
          <div class="dd-sub">${U.esc(s.name || '')}</div>
        </div>
        <button class="dd-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="dd-body">
        <div class="form-row"><label>Name</label><input type="text" id="edName" value="${U.esc(s.name || '')}"></div>
        <div class="form-row"><label>Description (leave blank to auto-generate)</label><textarea id="edDesc" rows="3">${U.esc(s.description || '')}</textarea></div>
        <div class="form-row"><label>Platform</label>
          <select id="edPlatform">${['instagram', 'tiktok', 'youtube', 'facebook', 'twitter', 'telegram', 'whatsapp', 'discord', 'spotify', 'other'].map(p => `<option value="${p}" ${s.platform === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Category</label>
          <select id="edCat">${['followers', 'likes', 'views', 'comments', 'shares', 'subscribers', 'members', 'streams', 'plays', 'other'].map(c => `<option value="${c}" ${s.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Average delivery time (optional, e.g. "1–24 hrs")</label><input type="text" id="edAvg" value="${U.esc(s.average_time || '')}" placeholder="Leave blank if unknown"></div>
        <div class="form-row"><label>Markup % (blank = use global)</label><input type="number" id="edMarkup" step="0.01" min="0" max="2000" value="${markupDisplay}"><div class="help">Current source: <strong>${U.esc(s.effective?.source || 'global')}</strong></div></div>
        <div class="form-row"><label>Custom price USD/1k (overrides markup — blank to disable)</label><input type="number" id="edCustom" step="0.0001" min="0" value="${s.custom_price != null ? Number(s.custom_price) : ''}"></div>
        <div class="form-row"><label>Min quantity</label><input type="number" id="edMin" min="1" value="${s.min_quantity ?? ''}"></div>
        <div class="form-row"><label>Max quantity</label><input type="number" id="edMax" min="1" value="${s.max_quantity ?? ''}"></div>
        <div class="form-row"><label class="toggle" style="text-transform:none;font-size:13px"><input type="checkbox" id="edActive" ${s.active ? 'checked' : ''}><span class="tk"></span>Active</label></div>
        <div class="form-row"><label class="toggle" style="text-transform:none;font-size:13px"><input type="checkbox" id="edVisible" ${s.visible_to_users ? 'checked' : ''}><span class="tk"></span>Visible to users</label></div>
        <div class="form-row"><label class="toggle" style="text-transform:none;font-size:13px"><input type="checkbox" id="edRefill" ${s.refill_allowed ? 'checked' : ''}><span class="tk"></span>Refill available</label></div>
        <div class="form-row"><label>Refill days (if applicable)</label><input type="number" id="edRefillDays" min="0" value="${s.refill_days ?? ''}"></div>
      </div>
      <div class="dd-actions" style="padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0">
        <button class="btn btn-ghost" id="edCancel">Cancel</button>
        <button class="btn btn-primary" id="edSave"><i class="fas fa-save"></i> Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(d);
  document.body.style.overflow = 'hidden';
  const close = () => { d.remove(); document.body.style.overflow = ''; };
  d.querySelector('.dd-close').addEventListener('click', close);
  d.querySelector('#edCancel').addEventListener('click', close);
  d.addEventListener('click', e => { if (e.target === d) close(); });
  d.querySelector('#edSave').addEventListener('click', async () => {
    const patch = {
      name: d.querySelector('#edName').value.trim(),
      description: (d.querySelector('#edDesc').value || '').trim() || null,
      platform: d.querySelector('#edPlatform').value,
      category: d.querySelector('#edCat').value,
      average_time: (d.querySelector('#edAvg').value || '').trim() || null,
      active: d.querySelector('#edActive').checked,
      visible_to_users: d.querySelector('#edVisible').checked,
      refill_allowed: d.querySelector('#edRefill').checked
    };
    const m = d.querySelector('#edMarkup').value;
    patch.markup_percent = m === '' ? null : Number(m) / 100;
    const c = d.querySelector('#edCustom').value;
    patch.custom_price = c === '' ? null : Number(c);
    const mn = d.querySelector('#edMin').value;
    patch.min_quantity = mn === '' ? null : Number(mn);
    const mx = d.querySelector('#edMax').value;
    patch.max_quantity = mx === '' ? null : Number(mx);
    const rd = d.querySelector('#edRefillDays').value;
    patch.refill_days = rd === '' ? null : Number(rd);
    const btn = d.querySelector('#edSave');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
    const r = await call(API.service(id), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
    });
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Save';
    if (!r.ok) {
      if (r.code === 'NO_PROVIDER_RATE') window.MS.toast('Cannot activate — no provider rate.', 'error');
      else window.MS.toast(r.error || 'Save failed', 'error');
      return;
    }
    window.MS.toast('Saved', 'success');
    close();
    State.services.sig = null;
    loadServices(true);
  });
}

/* ═════════════════════════════════════════════════════════════════
   Settings
   ═════════════════════════════════════════════════════════════════ */

function renderSettingsPanel() {
  const panel = document.getElementById('panel-settings');
  if (!panel.querySelector('#cfgRate')) {
    panel.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-faint)">Loading config…</div>';
  }
  loadConfig(false);
}

async function loadConfig(force) {
  if (State.config && !force) { renderSettings(); return; }
  const r = await call(API.config);
  const panel = document.getElementById('panel-settings');
  if (!r.ok) {
    panel.innerHTML = '<div class="card panel" style="padding:20px;color:var(--danger)">Failed: ' + U.esc(r.error || '—') + '</div>';
    return;
  }
  State.config = r.body.config || {};
  State.provider.dry_run = !!State.config.dry_run;
  State.provider.configured = !!State.config.smmwiz_configured;
  State.originalConfig = JSON.parse(JSON.stringify(State.config));
  State.pendingConfigChanges = {};
  renderSettings();
  renderBanners();
}

function renderSettings() {
  const c = State.config;
  const missing = c.missing_settings || [];
  const dry = c.dry_run === true;
  const panel = document.getElementById('panel-settings');
  panel.innerHTML = `
    <div class="card panel">
      <h3 style="margin:0 0 12px;font-size:14px;font-weight:800">Boost configuration</h3>
      <p style="font-size:11.5px;color:var(--text-faint);margin-bottom:12px;line-height:1.5">These values affect every new order. Existing orders keep their snapshot.</p>
      ${missing.length ? `<div class="cfg-missing"><strong>Missing registry keys:</strong> ${missing.map(U.esc).join(', ')} — add these to adminSettingsService KEY_REGISTRY before using those fields.</div>` : ''}
      ${dry ? '<div class="dry-banner"><i class="fas fa-triangle-exclamation"></i> DRY-RUN is ON. New orders will not hit SMMWiz.</div>' : ''}
      <div class="provider-card">
        <div class="pr"><strong>Provider:</strong> SMMWiz — ${c.smmwiz_configured ? 'Configured ✓' : 'Not configured'}</div>
        <div class="pr"><strong>Balance:</strong> ${State.provider.balance === null ? 'unreachable' : ('$' + Number(State.provider.balance).toFixed(2))}</div>
        <div class="pr"><strong>Dry-run:</strong> ${dry ? 'ON' : 'off'}</div>
        ${c.version != null ? `<div class="pr"><strong>Config version:</strong> ${c.version}</div>` : ''}
      </div>
      <div class="cfg-form">
        <label>USD → NGN rate<input type="number" id="cfgRate" step="0.01" min="1" value="${c.usd_to_ngn ?? ''}"></label>
        <label>Global markup %<input type="number" id="cfgMarkup" step="0.01" min="0" max="2000" value="${c.markup_percent ?? ''}"></label>
        <label>Min order (₦)<input type="number" id="cfgMin" step="0.01" min="0" value="${c.min_ngn ?? ''}" ${missing.includes('boost_min_ngn') ? 'disabled' : ''}></label>
        <label>Max order (₦)<input type="number" id="cfgMax" step="0.01" min="0" value="${c.max_ngn ?? ''}" ${missing.includes('boost_max_ngn') ? 'disabled' : ''}></label>
        <div class="row-inline"><input type="checkbox" id="cfgEnabled" ${c.enabled ? 'checked' : ''}><span>Boost system enabled</span></div>
        <div class="row-inline"><input type="checkbox" id="cfgAllowNgn" ${c.allow_ngn ? 'checked' : ''} ${missing.includes('boost_allow_ngn') ? 'disabled' : ''}><span>Allow NGN payments</span></div>
        <div class="row-inline"><input type="checkbox" id="cfgAllowUsd" ${c.allow_usd ? 'checked' : ''} ${missing.includes('boost_allow_usd') ? 'disabled' : ''}><span>Allow USD payments</span></div>
      </div>
      <div class="save-bar">
        <div class="state" id="saveState">No changes</div>
        <button class="btn btn-primary" id="saveCfgBtn"><i class="fas fa-save"></i> Save changes</button>
      </div>
    </div>
  `;
  ['cfgRate', 'cfgMarkup', 'cfgMin', 'cfgMax', 'cfgEnabled', 'cfgAllowNgn', 'cfgAllowUsd'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', collectChanges);
    el.addEventListener('change', collectChanges);
  });
  document.getElementById('saveCfgBtn').addEventListener('click', saveConfig);
}

function collectChanges() {
  const c = State.originalConfig;
  const changes = {};
  const v = id => { const el = document.getElementById(id); if (!el) return null; return el.type === 'checkbox' ? el.checked : el.value; };
  const rate = v('cfgRate');   if (rate !== '' && Number(rate) !== Number(c.usd_to_ngn)) changes.usd_to_ngn = Number(rate);
  const markup = v('cfgMarkup'); if (markup !== '' && Number(markup) !== Number(c.markup_percent)) changes.markup_percent = Number(markup);
  const minN = v('cfgMin');    if (minN !== '' && Number(minN) !== Number(c.min_ngn)) changes.min_ngn = Number(minN);
  const maxN = v('cfgMax');    if (maxN !== '' && Number(maxN) !== Number(c.max_ngn)) changes.max_ngn = Number(maxN);
  if (v('cfgEnabled')  !== c.enabled)   changes.enabled = v('cfgEnabled');
  if (v('cfgAllowNgn') !== c.allow_ngn) changes.allow_ngn = v('cfgAllowNgn');
  if (v('cfgAllowUsd') !== c.allow_usd) changes.allow_usd = v('cfgAllowUsd');
  State.pendingConfigChanges = changes;
  const count = Object.keys(changes).length;
  const st = document.getElementById('saveState');
  if (st) {
    if (count === 0) st.innerHTML = 'No changes';
    else st.innerHTML = '<strong>' + count + ' change' + (count > 1 ? 's' : '') + '</strong> pending';
  }
}

async function saveConfig() {
  const changes = State.pendingConfigChanges;
  if (!Object.keys(changes).length) { window.MS.toast('No changes to save', 'info'); return; }
  const reason = await window.MS.reasonModal({ title: 'Save boost config', message: 'A reason is required and will be recorded.', min: 4 });
  if (!reason) return;
  const btn = document.getElementById('saveCfgBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
  try {
    const body = { changes, reason, expected_version: State.config.version, confirm_large_change: false };
    let r = await call(API.config, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok && r.code === 'LARGE_CHANGE_REQUIRES_CONFIRMATION') {
      const oldV = r.body && r.body.old_value;
      const newV = r.body && r.body.new_value;
      const key = r.body && r.body.key;
      const ok = await window.MS.confirmModal({
        title: 'Confirm large change',
        message: 'Change to ' + key + ' is more than 10% (' + oldV + ' → ' + newV + '). Proceed?',
        confirmText: 'Confirm'
      });
      if (!ok) { window.MS.toast('Cancelled', 'info'); return; }
      body.confirm_large_change = true;
      r = await call(API.config, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }
    if (!r.ok) {
      if (r.code === 'CONFIG_VERSION_CONFLICT') { window.MS.toast('Another admin saved first. Reloading…', 'warn'); State.config = null; loadConfig(true); return; }
      window.MS.toast(r.error || 'Save failed', 'error');
      return;
    }
    window.MS.toast('Saved', 'success');
    State.overviewSig = null;
    State.orders.sig = null;
    State.services.sig = null;
    if (State.config) {
      if (changes.usd_to_ngn !== undefined) State.config.usd_to_ngn = changes.usd_to_ngn;
      if (changes.markup_percent !== undefined) State.config.markup_percent = changes.markup_percent;
      if (changes.min_ngn !== undefined) State.config.min_ngn = changes.min_ngn;
      if (changes.max_ngn !== undefined) State.config.max_ngn = changes.max_ngn;
      if (changes.enabled !== undefined) State.config.enabled = changes.enabled;
      if (changes.allow_ngn !== undefined) State.config.allow_ngn = changes.allow_ngn;
      if (changes.allow_usd !== undefined) State.config.allow_usd = changes.allow_usd;
      if (r.body && r.body.result && r.body.result.version != null) State.config.version = r.body.result.version;
      State.originalConfig = JSON.parse(JSON.stringify(State.config));
      State.pendingConfigChanges = {};
      renderSettings();
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Save changes';
  }
}

/* ═════════════════════════════════════════════════════════════════
   Init
   ═════════════════════════════════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', async function () {
  if (!window.AdminSession || !AdminSession.getToken()) { AdminSession.redirectToLogin(); return; }

  loadProvider(false);
  loadConfig(false).catch(() => {});

  if (typeof window.MS !== 'undefined' && typeof window.MS.init === 'function') {
    window.MS.init({
      activeKey: 'boost',
      title: 'Boost',
      breadcrumb: [
        { label: 'Admin', href: '/admin/dashboard.html' },
        { label: 'Boost' }
      ]
    });
  } else {
    document.getElementById('appRoot').innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger)">admin-shell.js not loaded</div>';
    return;
  }

  const hash = (location.hash || '').replace('#', '');
  if (['overview', 'orders', 'services', 'settings'].includes(hash)) State.tab = hash;
  renderShell();
});
