<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Audit Log · MilesSpace Admin</title>

<!-- Theme first, synchronously, so there is no light→dark flash. -->
<script src="/js/theme-init.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Same shell CSS the boost page uses. Provides sidebar, topbar, cards, badges, tables, drawers, toasts, KPIs, pagination, mobile breakpoints. -->
<link rel="stylesheet" href="/css/admin-shell.css?v=1">

<script src="/js/admin-session.js?v=2026-mfa-v1"></script>
<script src="/js/admin-permissions.js?v=2026-mfa-v1"></script>
<script src="/js/admin-shell.js" defer></script>

<style>
/* ════════════════════════════════════════════════════════════════
   Audit-page-only styles. Everything else — sidebar, topbar, cards,
   badges, tables, drawers, toasts, KPIs, pagination, skeletons,
   empty states — comes from /css/admin-shell.css.
   ════════════════════════════════════════════════════════════════ */

/* ─── Quick filter pills ─────────────────────────────────────── */
.quick{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;margin-bottom:12px}
.quick button{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;min-height:40px;border-radius:99px;
  border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-dim);font-size:12px;font-weight:600;
  font-family:inherit;white-space:nowrap;cursor:pointer;
  transition:background 150ms,color 150ms,border-color 150ms;
}
.quick button:hover{background:var(--bg);color:var(--text)}
.quick button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.quick button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ─── Filters toggle ─────────────────────────────────────────── */
.filters-toggle{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;min-height:40px;border-radius:99px;
  border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-dim);font-size:12px;font-weight:600;
  font-family:inherit;white-space:nowrap;cursor:pointer;flex-shrink:0;
  margin-bottom:12px;
}
.filters-toggle:hover{background:var(--bg);color:var(--text)}
.filters-toggle .chev{transition:transform 150ms;font-size:10px}
.filters-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* ─── Filters panel ──────────────────────────────────────────── */
.filters-panel{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;
  box-shadow:var(--sh-xs);
}
.filters-panel[hidden]{display:none}
.filters-grid{
  display:grid;grid-template-columns:repeat(6, minmax(0,1fr));gap:10px;
}
.ff{display:flex;flex-direction:column;gap:5px;min-width:0}
.ff label{
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--text-dim);
}
.ff input,.ff select{
  padding:8px 11px;min-height:40px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg-card);color:var(--text);
  font-size:12.5px;font-family:inherit;
}
.ff input:focus,.ff select:focus{
  outline:none;border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(15,76,92,.08);
}
.filter-actions{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
}
.filter-actions .hint{font-size:11px;color:var(--text-faint);margin-left:auto}

/* ─── Workspace (list + rail) ────────────────────────────────── */
.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:14px;
  align-items:start;
}
.workspace > *{min-width:0}

/* ─── Audit table ────────────────────────────────────────────── */
.audit-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1000px}
.audit-tbl thead th{
  position:sticky;top:0;z-index:1;
  text-align:left;padding:10px 12px;
  background:var(--bg-alt);color:var(--text-faint);
  font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.audit-tbl tbody td{
  padding:11px 12px;border-bottom:1px solid var(--border);
  vertical-align:middle;word-break:break-word;
}
.audit-tbl tbody tr:last-child td{border-bottom:none}
.audit-tbl tbody tr{cursor:pointer;transition:background 120ms;outline:none}
.audit-tbl tbody tr:hover{background:rgba(245,166,35,.04)}
.audit-tbl tbody tr:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.audit-tbl .cell-main{font-weight:600}
.audit-tbl .cell-dim{color:var(--text-dim);font-size:11px;margin-top:2px}

/* Reason clamp. Standard property alongside -webkit- for Firefox
   and future Chrome. */
.audit-tbl .cell-reason{
  max-width:260px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
  color:var(--text-dim);font-size:11.5px;line-height:1.45;
}

/* Anchor inside the row — full-row tap target, correct semantics. */
.audit-tbl a.row-link{
  display:block;color:inherit;text-decoration:none;
  margin:-11px -12px;padding:11px 12px;
}
.audit-tbl a.row-link:hover{text-decoration:none}

/* Severity dot */
.sev-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:middle;
}
.sev-dot.low{background:var(--success)}
.sev-dot.medium{background:var(--warn)}
.sev-dot.high{background:var(--info)}
.sev-dot.critical{background:var(--danger)}

/* ─── Rail: timeline + tips ─────────────────────────────────── */
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}

.timeline{list-style:none;display:flex;flex-direction:column;gap:2px;padding:0;margin:0}
.tl-item{
  display:grid;grid-template-columns:auto 1fr;gap:10px;
  padding:10px 8px;border-radius:10px;cursor:pointer;
  border-bottom:1px solid var(--border);outline:none;
  transition:background 120ms;
}
.tl-item:last-child{border-bottom:none}
.tl-item:hover,.tl-item:focus-visible{background:var(--bg-alt)}
.tl-dot{
  width:9px;height:9px;border-radius:50%;background:var(--navy);
  margin-top:6px;position:relative;flex-shrink:0;
}
.tl-dot.low{background:var(--success)}
.tl-dot.medium{background:var(--warn)}
.tl-dot.high{background:var(--info)}
.tl-dot.critical{background:var(--danger)}
.tl-dot::after{
  content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);
  width:1px;height:calc(100% + 8px);background:var(--border);
}
.tl-item:last-child .tl-dot::after{display:none}
.tl-body{min-width:0}
.tl-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.tl-action{
  font-weight:700;font-family:'JetBrains Mono',monospace;
  font-size:11.5px;word-break:break-all;color:var(--text);
}
.tl-result{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px}
.tl-result.success{background:var(--success-bg);color:var(--success)}
.tl-result.failure{background:var(--danger-bg);color:var(--danger)}
.tl-result.partial{background:var(--warn-bg);color:var(--warn)}
.tl-time{color:var(--text-faint);font-size:11px;margin-left:auto;white-space:nowrap}
.tl-meta{
  font-size:11.5px;color:var(--text-dim);margin-top:3px;
  display:flex;gap:8px;flex-wrap:wrap;
}
.tl-actor{font-weight:600}

.tips{font-size:12.5px;color:var(--text-dim);line-height:1.6}
.tips p + p{margin-top:8px}
.tips ul{margin-left:16px;margin-top:6px}
.tips li{margin-bottom:4px}
.tips .mono{font-size:11.5px;color:var(--text)}

/* ─── Drawer chrome — uses .detail-drawer base from shell CSS ── */
.dhead .dd-btn{
  height:38px;min-width:38px;padding:0 10px;border-radius:8px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  color:#fff;font-size:12px;font-weight:600;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  flex-shrink:0;
}
.dhead .dd-btn:hover{background:rgba(255,255,255,.24)}
.dhead .dd-btn[disabled]{opacity:.4;cursor:not-allowed}
.dhead .dd-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}

/* Diff rendering */
.diff-box{
  background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  white-space:pre-wrap;word-break:break-word;color:var(--text-dim);
  max-height:300px;overflow-y:auto;line-height:1.55;
}
.diff-row{padding:2px 0}
.diff-row.added{color:var(--success)}
.diff-row.removed{color:var(--danger)}
.diff-row.changed{color:var(--text)}

/* Chain */
.chain{list-style:none;display:flex;flex-direction:column;gap:6px;padding:0;margin:0}
.chain-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;
  padding:9px 11px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg-card);cursor:pointer;font-size:12px;outline:none;
}
.chain-item:hover,.chain-item:focus-visible{background:var(--bg-alt)}
.chain-item .dot{width:8px;height:8px;border-radius:50%;background:var(--navy);margin-top:5px}
.chain-item .dot.critical{background:var(--danger)}
.chain-item .dot.high{background:var(--info)}
.chain-item .dot.medium{background:var(--warn)}
.chain-item .dot.low{background:var(--success)}
.chain-item .a{font-weight:700;font-family:'JetBrains Mono',monospace;font-size:11.4px;word-break:break-all}
.chain-item .t{color:var(--text-faint);font-size:10.5px;white-space:nowrap}

/* Copy-to-clipboard */
.copy-btn{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--text-dim);font-size:10px;padding:1px 6px;
  cursor:pointer;margin-left:6px;font-family:inherit;
}
.copy-btn:hover{background:var(--bg-alt);color:var(--text)}

/* ─── New-events banner (live tail) ──────────────────────────── */
.new-events-banner{
  display:none;position:sticky;top:calc(var(--topbar-h) + 8px);z-index:20;
  margin:0 auto 12px;width:fit-content;
  padding:8px 16px;border-radius:99px;
  background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:600;font-family:inherit;
  box-shadow:var(--sh-md);border:none;cursor:pointer;
  align-items:center;gap:8px;
}
.new-events-banner.show{display:inline-flex}
.new-events-banner:hover{background:var(--navy-deep)}

/* ─── Responsive ─────────────────────────────────────────────── */
@media (max-width:1180px){
  .filters-grid{grid-template-columns:repeat(3, minmax(0,1fr))}
  .workspace{grid-template-columns:minmax(0,1fr) 300px}
}
@media (max-width:1000px){
  .workspace{grid-template-columns:1fr}
  .rail{display:grid;grid-template-columns:1fr;gap:12px}
}
@media (max-width:900px){
  .filters-grid{grid-template-columns:repeat(2, minmax(0,1fr))}
  /* Table becomes stacked cards */
  .table-container{overflow:visible}
  .audit-tbl{display:block;min-width:0}
  .audit-tbl thead{display:none}
  .audit-tbl tbody{display:block}
  .audit-tbl tbody tr{
    display:block;
    border:1px solid var(--border);border-radius:12px;
    margin-bottom:10px;padding:12px 14px;
    background:var(--bg-card);
  }
  .audit-tbl tbody tr:last-child{margin-bottom:0}
  .audit-tbl tbody td{
    display:flex;justify-content:space-between;gap:10px;
    padding:5px 0;border:none;font-size:12.5px;align-items:flex-start;
  }
  .audit-tbl tbody td::before{
    content:attr(data-cell);
    color:var(--text-faint);font-size:10.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;
    flex-shrink:0;min-width:76px;padding-top:1px;
  }
  .audit-tbl tbody td[data-cell=""]::before{display:none}
  .audit-tbl a.row-link{margin:-12px -14px;padding:12px 14px;display:block}
  .audit-tbl .cell-reason{-webkit-line-clamp:2;line-clamp:2}
}
@media (max-width:560px){
  .filters-grid{grid-template-columns:1fr}
  .tl-time{margin-left:0;width:100%;text-align:left}
  .dhead .dd-btn span{display:none}
  .dhead .dd-btn{padding:0;width:38px;justify-content:center}
  .quick button{flex:1;justify-content:center;min-width:calc(50% - 3px)}
  .filter-actions .hint{margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<!-- admin-shell.js fills this with sidebar + topbar + #content. -->
<div class="app" id="appRoot"></div>

<!-- Drawer + toast container live at body level so they can overlay the shell. -->
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="detail-drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true" hidden>
  <div class="dd-head dhead">
    <div class="dd-ic"><i class="fas fa-scroll"></i></div>
    <div class="dd-titles">
      <h2 id="dTitle">Audit entry</h2>
      <div class="dd-sub" id="dSub">—</div>
    </div>
    <div class="dd-actions">
      <button class="dd-btn" id="dPrev" aria-label="Previous entry" title="Previous entry" type="button" disabled>
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="dd-btn" id="dNext" aria-label="Next entry" title="Next entry" type="button" disabled>
        <i class="fas fa-chevron-right"></i>
      </button>
      <button class="dd-btn" id="dCopy" aria-label="Copy link" title="Copy link to this entry" type="button">
        <i class="fas fa-link"></i>
      </button>
      <button class="dd-btn" id="dClose" aria-label="Close" title="Close" type="button">
        <i class="fas fa-xmark"></i>
      </button>
    </div>
  </div>
  <div class="dd-body" id="dBody">
    <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i>Loading…</div>
  </div>
</aside>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
// Audit page logic. Uses window.MS (from admin-shell.js) for the
// shell, toast, modals, API, CSV, escape, and debounce. Everything
// below is audit-page-specific.
// ════════════════════════════════════════════════════════════════

const API = {
  bootstrap: '/api/admin/audit/bootstrap',
  summary:   '/api/admin/audit/summary',
  facets:    '/api/admin/audit/facets',
  admins:    '/api/admin/audit/admins',
  recent:    '/api/admin/audit/recent',
  integrity: '/api/admin/audit/integrity',
  export:    '/api/admin/audit/export',
  list:      '/api/admin/audit',
  detail:    (id) => `/api/admin/audit/${encodeURIComponent(id)}`
};

const FINANCIAL_CATEGORIES = ['wallets','transactions','refunds','payments','deposits'];

const state = {
  page: 1,
  limit: 50,
  totalPages: null,
  count: null,
  filters: {
    search: '', adminId: 'all', category: 'all', action: 'all',
    severity: 'all', result: 'all', actorType: 'all', provider: 'all',
    from: null, to: null, quick: 'all'
  },
  bootstrapped: false,   // facets + admins loaded once
  lastRecentAt: null,    // for live tail
  lastTopIds: [],        // for "N new events" banner diff
  pollTimer: null,
  abortList: null,
  abortBootstrap: null,
  abortDetail: null
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

// ════════════════════════════════════════════════════════════════
// Utilities (MS handles esc, fmt, debounce, api, toast, csv)
// ════════════════════════════════════════════════════════════════

function fmtUtc(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toISOString().slice(0, 19).replace('T', ' ') + ' UTC';
}

function relTime(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (!Number.isFinite(s) || s < 0) return '—';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(iso).toISOString().slice(0, 10);
}

function shortId(id) {
  if (!id) return '—';
  const s = String(id);
  if (s.length <= 12) return s;
  return s.slice(0, 8) + '…' + s.slice(-4);
}

// Show a message using MS.toast — the shell's toast UI lives in
// the shared .toast-stack stylesheet rules.
function notify(msg, kind = 'info') {
  if (window.MS && typeof MS.toast === 'function') return MS.toast(msg, kind);
  console.log('[audit]', kind, msg);
}

// The single api wrapper — all requests go through MS.api so
// permission 401/403 step-up challenges, network failures, and
// abort signals work uniformly.
async function api(url, opts = {}) {
  if (!window.MS || typeof MS.api !== 'function') {
    return { ok: false, code: 'NO_SHELL', error: 'Admin shell not loaded' };
  }
  return MS.api(url, opts);
}

// ════════════════════════════════════════════════════════════════
// URL sync — filters and ?id
// ════════════════════════════════════════════════════════════════

function readFiltersFromUrl() {
  const u = new URLSearchParams(location.search);
  const out = { ...state.filters };

  if (u.get('q'))          out.search   = u.get('q');
  if (u.get('admin'))      out.adminId  = u.get('admin');
  if (u.get('category'))   out.category = u.get('category');
  if (u.get('action'))     out.action   = u.get('action');
  if (u.get('severity'))   out.severity = u.get('severity');
  if (u.get('result'))     out.result   = u.get('result');
  if (u.get('actor'))      out.actorType = u.get('actor');
  if (u.get('provider'))   out.provider = u.get('provider');
  if (u.get('from'))       out.from     = u.get('from');
  if (u.get('to'))         out.to       = u.get('to');
  if (u.get('quick'))      out.quick    = u.get('quick');
  if (u.get('page')) {
    const n = parseInt(u.get('page'), 10);
    if (Number.isFinite(n) && n > 0) state.page = n;
  }
  if (u.get('limit')) {
    const n = parseInt(u.get('limit'), 10);
    if (Number.isFinite(n) && n > 0 && n <= 200) state.limit = n;
  }
  return out;
}

function writeFiltersToUrl({ replace = true, keepId = false } = {}) {
  const u = new URLSearchParams();
  const f = state.filters;
  if (f.search)                u.set('q', f.search);
  if (f.adminId && f.adminId !== 'all')     u.set('admin', f.adminId);
  if (f.category && f.category !== 'all')   u.set('category', f.category);
  if (f.action && f.action !== 'all')       u.set('action', f.action);
  if (f.severity && f.severity !== 'all')   u.set('severity', f.severity);
  if (f.result && f.result !== 'all')       u.set('result', f.result);
  if (f.actorType && f.actorType !== 'all') u.set('actor', f.actorType);
  if (f.provider && f.provider !== 'all')   u.set('provider', f.provider);
  if (f.from) u.set('from', f.from);
  if (f.to)   u.set('to', f.to);
  if (f.quick && f.quick !== 'all') u.set('quick', f.quick);
  if (state.page > 1) u.set('page', String(state.page));
  if (state.limit !== 50) u.set('limit', String(state.limit));
  if (keepId) {
    const id = new URLSearchParams(location.search).get('id');
    if (id) u.set('id', id);
  }
  const url = location.pathname + (u.toString() ? '?' + u.toString() : '');
  if (replace) history.replaceState(null, '', url);
  else history.pushState(null, '', url);
}

// ════════════════════════════════════════════════════════════════
// Render KPI row
// ════════════════════════════════════════════════════════════════

function renderKpis(summary) {
  const el = $('#kpis');
  if (!el) return;
  const n = (v) => v == null ? '—' : Number(v).toLocaleString();
  el.innerHTML = `
    <div class="kpi-card">
      <div class="lbl">Total events</div>
      <div class="val">${n(summary && summary.total)}</div>
      <div class="sub">all time</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Today</div>
      <div class="val">${n(summary && summary.today)}</div>
      <div class="sub">since 00:00 UTC</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Critical</div>
      <div class="val" style="color:var(--danger)">${n(summary && summary.critical)}</div>
      <div class="sub">needs attention</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Failed</div>
      <div class="val" style="color:var(--warn)">${n(summary && summary.failed)}</div>
      <div class="sub">did not succeed</div>
    </div>
    <div class="kpi-card">
      <div class="lbl">Security</div>

// ════════════════════════════════════════════════════════════════
// Content wiring
// ════════════════════════════════════════════════════════════════

function wireContentEvents() {
  // Quick filters
  $$('#quickFilters button').forEach(b => {
    b.addEventListener('click', () => applyQuick(b.dataset.quick));
  });

  // Filters toggle — drives chevron via aria-expanded
  const toggle = $('#filtersToggle');
  const panel = $('#filtersPanel');
  toggle.addEventListener('click', () => {
    const open = panel.hidden;
    panel.hidden = !open;
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Search debounce
  const fSearch = $('#fSearch');
  fSearch.addEventListener('input', MS.debounce(() => {
    state.filters.search = fSearch.value.trim();
    state.filters.quick = 'all';
    setActiveQuick('all');
    state.page = 1;
    writeFiltersToUrl();
    loadSummary();
    loadList();
  }, 350));
  fSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); applyFilters(); }
  });

  // Filter dropdowns
  $('#applyBtn').addEventListener('click', applyFilters);
  $('#clearBtn').addEventListener('click', clearFilters);
  $('#fRange').addEventListener('change', (e) => {
    const v = e.target.value;
    if (v === 'custom') {
      $('#fromWrap').hidden = false;
      $('#toWrap').hidden = false;
    } else {
      applyRangeToState(v);
    }
  });

  // Reload
  $('#reloadBtn').addEventListener('click', () => {
    loadSummary();
    loadList();
    loadRecent();
    notify('Reloaded', 'success');
  });

  // Export
  const exportBtn = $('#exportBtn');
  if (exportBtn) {
    exportBtn.addEventListener('click', handleExport);
  }

  // New events banner
  $('#newEventsBanner').addEventListener('click', () => {
    hideNewEventsBanner();
    loadList();
    loadRecent();
    loadSummary();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function hydrateFormFromFilters() {
  const f = state.filters;
  if ($('#fSearch'))     $('#fSearch').value = f.search || '';
  if ($('#fAdmin'))      $('#fAdmin').value = f.adminId || 'all';
  if ($('#fCategory'))   $('#fCategory').value = f.category || 'all';
  if ($('#fAction'))     $('#fAction').value = f.action || 'all';
  if ($('#fSeverity'))   $('#fSeverity').value = f.severity || 'all';
  if ($('#fResult'))     $('#fResult').value = f.result || 'all';
  if ($('#fActor'))      $('#fActor').value = f.actorType || 'all';
  if ($('#fProvider'))   $('#fProvider').value = f.provider || 'all';
  if (f.from || f.to) {
    if ($('#fRange')) $('#fRange').value = 'custom';
    if ($('#fromWrap')) $('#fromWrap').hidden = false;
    if ($('#toWrap'))   $('#toWrap').hidden = false;
    if ($('#fFrom') && f.from) $('#fFrom').value = toLocalInputValue(f.from);
    if ($('#fTo') && f.to)     $('#fTo').value   = toLocalInputValue(f.to);
  }
  setActiveQuick(f.quick || 'all');
}

// datetime-local needs 'YYYY-MM-DDTHH:mm'. We treat input as UTC
// (label says UTC), so a UTC ISO string can be sliced directly.
function toLocalInputValue(iso) {
  if (!iso) return '';
  return new Date(iso).toISOString().slice(0, 16);
}
// Reverse: value from datetime-local, append 'Z' so it's parsed as UTC.
function fromLocalInputValue(v) {
  if (!v) return null;
  // 'YYYY-MM-DDTHH:mm' → append seconds + Z
  const s = v.length === 16 ? v + ':00Z' : v + 'Z';
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

// ════════════════════════════════════════════════════════════════
// Quick filters
// ════════════════════════════════════════════════════════════════

function setActiveQuick(name) {
  $$('#quickFilters button').forEach(b => {
    b.classList.toggle('active', b.dataset.quick === name);
  });
}

function applyQuick(name) {
  // Reset everything that a quick filter controls
  state.filters.severity = 'all';
  state.filters.result   = 'all';
  state.filters.category = 'all';
  state.filters.from     = null;
  state.filters.to       = null;

  if (name === 'critical')       state.filters.severity = 'critical';
  else if (name === 'failed')    state.filters.result   = 'failure';
  else if (name === 'security')  state.filters.category = 'security';
  else if (name === 'financial') state.filters.category = FINANCIAL_CATEGORIES.join(',');
  else if (name === 'today') {
    const start = new Date();
    start.setUTCHours(0, 0, 0, 0);
    state.filters.from = start.toISOString();
  }

  state.filters.quick = name;
  state.page = 1;

  // Reflect into the dropdowns
  if ($('#fSeverity')) $('#fSeverity').value = state.filters.severity;
  if ($('#fResult'))   $('#fResult').value   = state.filters.result;
  if ($('#fCategory')) $('#fCategory').value = state.filters.category;
  if ($('#fRange'))    $('#fRange').value    = name === 'today' ? 'today' : 'all';
  if ($('#fromWrap'))  $('#fromWrap').hidden = !state.filters.from;
  if ($('#toWrap'))    $('#toWrap').hidden   = !state.filters.to;

  setActiveQuick(name);
  writeFiltersToUrl();
  loadSummary();
  loadList();
}

// ════════════════════════════════════════════════════════════════
// Apply / Clear / Range
// ════════════════════════════════════════════════════════════════

function applyFilters() {
  state.filters.search    = ($('#fSearch')   && $('#fSearch').value.trim())   || '';
  state.filters.adminId   = ($('#fAdmin')    && $('#fAdmin').value)    || 'all';
  state.filters.category  = ($('#fCategory') && $('#fCategory').value) || 'all';
  state.filters.action    = ($('#fAction')   && $('#fAction').value)   || 'all';
  state.filters.severity  = ($('#fSeverity') && $('#fSeverity').value) || 'all';
  state.filters.result    = ($('#fResult')   && $('#fResult').value)   || 'all';
  state.filters.actorType = ($('#fActor')    && $('#fActor').value)    || 'all';
  state.filters.provider  = ($('#fProvider') && $('#fProvider').value) || 'all';

  const range = $('#fRange') ? $('#fRange').value : 'all';
  if (range === 'custom') {
    state.filters.from = fromLocalInputValue($('#fFrom') && $('#fFrom').value);
    state.filters.to   = fromLocalInputValue($('#fTo')   && $('#fTo').value);
  } else {
    applyRangeToState(range);
  }

  state.filters.quick = 'all';
  setActiveQuick('all');
  state.page = 1;
  writeFiltersToUrl();
  loadSummary();
  loadList();
}

function clearFilters() {
  if ($('#fSearch'))   $('#fSearch').value   = '';
  if ($('#fAdmin'))    $('#fAdmin').value    = 'all';
  if ($('#fCategory')) $('#fCategory').value = 'all';
  if ($('#fAction'))   $('#fAction').value   = 'all';
  if ($('#fSeverity')) $('#fSeverity').value = 'all';
  if ($('#fResult'))   $('#fResult').value   = 'all';
  if ($('#fActor'))    $('#fActor').value    = 'all';
  if ($('#fProvider')) $('#fProvider').value = 'all';
  if ($('#fRange'))    $('#fRange').value    = 'all';
  if ($('#fFrom'))     $('#fFrom').value     = '';
  if ($('#fTo'))       $('#fTo').value       = '';
  if ($('#fromWrap'))  $('#fromWrap').hidden = true;
  if ($('#toWrap'))    $('#toWrap').hidden   = true;

  state.filters = {
    search: '', adminId: 'all', category: 'all', action: 'all',
    severity: 'all', result: 'all', actorType: 'all', provider: 'all',
    from: null, to: null, quick: 'all'
  };
  state.page = 1;
  setActiveQuick('all');
  writeFiltersToUrl();
  loadSummary();
  loadList();
}

function applyRangeToState(kind) {
  const startOfToday = () => { const d = new Date(); d.setUTCHours(0,0,0,0); return d; };
  const endOfToday   = () => { const d = new Date(); d.setUTCHours(23,59,59,999); return d; };

  state.filters.from = null;
  state.filters.to   = null;
  if ($('#fromWrap')) $('#fromWrap').hidden = true;
  if ($('#toWrap'))   $('#toWrap').hidden   = true;

  if (kind === 'today') {
    state.filters.from = startOfToday().toISOString();
    state.filters.to   = endOfToday().toISOString();
  } else if (kind === 'yesterday') {
    const y = new Date(Date.now() - 24*3600*1000);
    y.setUTCHours(0,0,0,0);
    const e = new Date(y.getTime()); e.setUTCHours(23,59,59,999);
    state.filters.from = y.toISOString();
    state.filters.to   = e.toISOString();
  } else if (kind === '7d') {
    state.filters.from = new Date(Date.now() - 7*24*3600*1000).toISOString();
  } else if (kind === '30d') {
    state.filters.from = new Date(Date.now() - 30*24*3600*1000).toISOString();
  } else if (kind === 'custom') {
    if ($('#fromWrap')) $('#fromWrap').hidden = false;
    if ($('#toWrap'))   $('#toWrap').hidden   = false;
  }
}

// ════════════════════════════════════════════════════════════════
// Query building
// ════════════════════════════════════════════════════════════════

function buildQuery(includePaging = true) {
  const q = new URLSearchParams();
  const f = state.filters;
  if (includePaging) {
    q.set('page', state.page);
    q.set('limit', state.limit);
  }
  if (f.search)                 q.set('search', f.search);
  if (f.adminId   !== 'all')    q.set('admin_id', f.adminId);
  if (f.category  !== 'all')    q.set('category', f.category);
  if (f.action    !== 'all')    q.set('action', f.action);
  if (f.severity  !== 'all')    q.set('severity', f.severity);
  if (f.result    !== 'all')    q.set('result', f.result);
  if (f.actorType !== 'all')    q.set('actor_type', f.actorType);
  if (f.provider  !== 'all')    q.set('provider', f.provider);
  if (f.from)                   q.set('from', f.from);
  if (f.to)                     q.set('to', f.to);
  return q.toString();
}

// ════════════════════════════════════════════════════════════════
// Loaders
// ════════════════════════════════════════════════════════════════

async function loadBootstrapOnce() {
  if (state.bootstrapped) return true;
  if (state.abortBootstrap) state.abortBootstrap.abort();
  state.abortBootstrap = new AbortController();
  const r = await api(API.bootstrap + '?' + buildQuery(false), { signal: state.abortBootstrap.signal });
  if (!r.ok) {
    if (r.aborted) return false;
    const msg = r.status === 403 ? 'You do not have permission to view the audit log.'
              : r.status === 401 ? 'Your session has expired.'
              : r.error || 'Could not load audit data.';
    notify(msg, 'error');
    return false;
  }
  const data = r.data || {};
  renderKpis(data.summary || {});
  applyFacets(data.facets || {});
  applyAdmins(data.admins || []);
  state.bootstrapped = true;
  return true;
}

async function loadSummary() {
  const r = await api(API.summary + '?' + buildQuery(false));
  if (r.ok && r.data && r.data.summary) {
    renderKpis(r.data.summary);
  }
}

async function loadList() {
  // Abort any previous list request so rapid filter changes don't
  // render stale results.
  if (state.abortList) state.abortList.abort();
  state.abortList = new AbortController();

  const tbody = $('#rows');
  if (tbody) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i><div class="title">Loading…</div></div></td></tr>`;
  }

  const r = await api(API.list + '?' + buildQuery(true), { signal: state.abortList.signal });
  if (!r.ok) {
    if (r.aborted) return;
    const msg = r.status === 403 ? 'You do not have permission to view the audit log.'
              : r.status === 401 ? 'Your session has expired.'
              : r.error || 'Could not load audit log.';
    if (tbody) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fas fa-triangle-exclamation" style="color:var(--danger)"></i><div class="title">${MS.esc(msg)}</div><div class="sub"><button class="btn btn-ghost btn-sm" id="retryBtn" style="margin-top:10px"><i class="fas fa-rotate-right"></i> Retry</button></div></div></td></tr>`;
      $('#retryBtn')?.addEventListener('click', () => loadList());
    }
    return;
  }

  const data = r.data || {};
  state.count      = data.count != null ? data.count : null;
  state.totalPages = data.totalPages != null ? data.totalPages : null;

  renderRows(data.entries || []);
  updatePagerInfo();
  renderPagination();

  // If the URL had ?id=..., open the drawer once the page has
  // rendered so prev/next work.
  const deepId = new URLSearchParams(location.search).get('id');
  if (deepId && !$('#drawer').classList.contains('open')) {
    openEntry(deepId, { fromDeepLink: true });
  }
}

async function loadRecent() {
  const params = new URLSearchParams();
  params.set('limit', '20');
  const f = state.filters;
  if (f.adminId !== 'all')    params.set('admin_id', f.adminId);
  if (f.category !== 'all')   params.set('category', f.category);
  if (f.severity !== 'all')   params.set('severity', f.severity);
  if (f.result !== 'all')     params.set('result', f.result);
  if (f.actorType !== 'all')  params.set('actor_type', f.actorType);
  if (f.provider !== 'all')   params.set('provider', f.provider);
  if (f.search)               params.set('search', f.search);
  if (f.from)                 params.set('from', f.from);
  if (f.to)                   params.set('to', f.to);
  if (state.lastRecentAt)     params.set('since', state.lastRecentAt);

  const r = await api(API.recent + '?' + params.toString());
  if (!r.ok) return;
  const entries = (r.data && r.data.entries) || [];

  if (state.lastRecentAt && entries.length) {
    // Live-tail: banner instead of auto-shifting rows.
    showNewEventsBanner(entries.length);
    return;
  }
  renderTimeline(entries);
  if (entries.length) state.lastRecentAt = entries[0].created_at;
}

function pollRecent() {
  if (document.hidden) return;    // pause when tab hidden
  loadRecent().catch(() => {});
}

function startLiveTail() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(pollRecent, 15000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) pollRecent();
  });
}

function showNewEventsBanner(n) {
  const b = $('#newEventsBanner');
  if (!b) return;
  b.textContent = `${n} new event${n === 1 ? '' : 's'} — click to load`;
  b.classList.add('show');
}
function hideNewEventsBanner() {
  const b = $('#newEventsBanner');
  if (!b) return;
  b.classList.remove('show');
  state.lastRecentAt = null;
}

// ════════════════════════════════════════════════════════════════
// Facets / admins
// ════════════════════════════════════════════════════════════════

function applyFacets(facets) {
  const cat = $('#fCategory');
  if (cat) {
    const cur = cat.value;
    cat.innerHTML = '<option value="all">All categories</option>' +
      (facets.categories || []).map(c => `<option value="${MS.esc(c)}">${MS.esc(c)}</option>`).join('');
    cat.value = cur || 'all';
  }
  const act = $('#fAction');
  if (act) {
    const cur = act.value;
    act.innerHTML = '<option value="all">All actions</option>' +
      (facets.actions || []).slice().sort().map(c => `<option value="${MS.esc(c)}">${MS.esc(c)}</option>`).join('');
    act.value = cur || 'all';
  }
  const prov = $('#fProvider');
  if (prov && Array.isArray(facets.providers) && facets.providers.length) {
    const cur = prov.value;
    prov.innerHTML = '<option value="all">All providers</option>' +
      facets.providers.map(p => `<option value="${MS.esc(p)}">${MS.esc(p)}</option>`).join('');
    prov.value = cur || 'all';
  }
}

function applyAdmins(admins) {
  const el = $('#fAdmin');
  if (!el) return;
  const cur = el.value;
  el.innerHTML = '<option value="all">All admins</option>' +
    (admins || []).map(x => `<option value="${MS.esc(x.admin_id)}">${MS.esc(x.admin_email || x.admin_id)}</option>`).join('');
  el.value = cur || 'all';
}

// ════════════════════════════════════════════════════════════════
// Render rows
// ════════════════════════════════════════════════════════════════

function actorLabel(e) {
  const t = e.actor_type || 'admin';
  if (t === 'admin')     return '👤 ' + MS.esc(e.admin_display || e.admin_email || 'Admin');
  if (t === 'system')    return '⚙ System';
  if (t === 'scheduler') return '🕒 Scheduler';
  if (t === 'webhook')   return '🪝 ' + MS.esc(e.provider || 'Webhook');
  if (t === 'provider')  return '🔌 ' + MS.esc(e.provider || 'Provider');
  if (t === 'customer')  return '🙋 Customer';
  return '👤 ' + MS.esc(e.admin_display || 'Actor');
}

function statusClass(s) {
  const k = String(s || '').toLowerCase();
  if (k === 'completed') return 'success';
  if (k === 'failed' || k === 'cancelled') return 'danger';
  if (k === 'refunded')  return 'info';
  if (k === 'provider_unknown' || k === 'manual_review') return 'purple';
  if (['pending','processing','in_progress','partial'].includes(k)) return 'warn';
  return 'neutral';
}

function renderRows(entries) {
  const tbody = $('#rows');
  if (!tbody) return;

  if (!entries.length) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">
      <i class="fas fa-inbox"></i>
      <div class="title">No audit entries match those filters</div>
      <div class="sub">Try widening the time range or clearing filters.</div>
    </div></td></tr>`;
    return;
  }

  tbody.innerHTML = entries.map(e => {
    const reason = (e.reason || '').trim();
    const hasReason = reason.length > 0;
    return `<tr tabindex="0" role="button" data-id="${MS.esc(e.id)}" aria-label="Open audit entry ${MS.esc(e.action)}">
      <td data-cell="Time">
        <div class="cell-main">${MS.esc(relTime(e.created_at))}</div>
        <div class="cell-dim mono">${MS.esc(fmtUtc(e.created_at))}</div>
      </td>
      <td data-cell="Actor">
        <div class="cell-main">${MS.esc(e.admin_display || e.admin_email || '—')}</div>
        <div class="cell-dim">${MS.esc(e.actor_type || 'admin')}${e.admin_role ? ' · ' + MS.esc(e.admin_role) : ''}</div>
      </td>
      <td data-cell="Action"><span class="mono" style="font-size:11.5px">${MS.esc(e.action)}</span></td>
      <td data-cell="Category"><span class="badge neutral">${MS.esc(e.category)}</span></td>
      <td data-cell="Target">
        <div class="cell-main">${MS.esc(e.target_type || '—')}</div>
        <div class="cell-dim mono">${MS.esc(shortId(e.target_id))}</div>
      </td>
      <td data-cell="Reason">
        <div class="cell-reason" title="${MS.esc(reason)}">${hasReason ? MS.esc(reason) : '—'}</div>
      </td>
      <td data-cell="Severity">
        <span class="sev-dot ${MS.esc(e.severity)}"></span>
        <span class="badge ${e.severity}">${MS.esc(e.severity)}</span>
      </td>
      <td data-cell="Result">
        <span class="badge ${e.result}">${MS.esc(e.result)}</span>
        ${e.failure_code ? `<div class="cell-dim mono" style="margin-top:2px">${MS.esc(e.failure_code)}</div>` : ''}
      </td>
      <td data-cell="Duration" class="mono" style="font-size:11px">
        ${e.duration_ms != null ? MS.esc(String(e.duration_ms)) + ' ms' : '—'}
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr[data-id]').forEach(tr => {
    const open = () => openEntry(tr.dataset.id);
    tr.addEventListener('click', (ev) => {
      // Don't trigger when the click was on an inner interactive element
      // (there are none today, but this keeps the pattern safe).
      if (ev.target.closest('a,button')) return;
      open();
    });
    tr.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });
  });

  // Remember top ids so we can diff the poll later
  state.lastTopIds = entries.slice(0, 5).map(e => e.id);
}

function updatePagerInfo() {
  const info = $('#pagerInfo');
  if (!info) return;
  if (state.count == null) {
    info.textContent = state.page > 1 ? `Page ${state.page}` : '—';
    return;
  }
  const from = (state.page - 1) * state.limit + 1;
  const to = Math.min(state.page * state.limit, state.count);
  info.textContent = state.count
    ? `Showing ${from.toLocaleString()}–${to.toLocaleString()} of ${state.count.toLocaleString()}`
    : 'No results';
}

function renderPagination() {
  const el = $('#pagerButtons');
  if (!el) return;
  if (!state.totalPages || state.totalPages <= 1) {
    el.innerHTML = '';
    return;
  }
  let html = '';
  const start = Math.max(1, state.page - 2);
  const end = Math.min(state.totalPages, state.page + 2);

  if (start > 1)              html += `<button class="pg-btn" data-page="1">1</button>`;
  if (start > 2)              html += `<span style="padding:0 4px;color:var(--text-faint)">…</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="pg-btn ${i === state.page ? 'active' : ''}" data-page="${i}">${i}</button>`;
  }
  if (end < state.totalPages - 1) html += `<span style="padding:0 4px;color:var(--text-faint)">…</span>`;
  if (end < state.totalPages)     html += `<button class="pg-btn" data-page="${state.totalPages}">${state.totalPages}</button>`;

  el.innerHTML = html;
  el.querySelectorAll('[data-page]').forEach(b => {
    b.addEventListener('click', () => {
      state.page = Number(b.dataset.page);
      writeFiltersToUrl();
      loadList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

// ════════════════════════════════════════════════════════════════
// Timeline
// ════════════════════════════════════════════════════════════════

function renderTimeline(entries) {
  const el = $('#timeline');
  if (!el) return;
  if (!entries.length) {
    el.innerHTML = `<li><div class="empty-state" style="padding:24px 8px"><i class="fas fa-inbox"></i><div class="title">No recent activity</div></div></li>`;
    return;
  }
  el.innerHTML = entries.slice(0, 20).map(e => {
    const targetBits = [e.target_type, e.target_id].filter(Boolean).join(' ');
    return `<li class="tl-item" tabindex="0" role="button" data-id="${MS.esc(e.id)}">
      <span class="tl-dot ${MS.esc(e.severity || 'low')}"></span>
      <div class="tl-body">
        <div class="tl-line">
          <span class="tl-action">${MS.esc(e.action)}</span>
          <span class="tl-result ${MS.esc(e.result)}">${MS.esc(e.result)}</span>
          <span class="tl-time">${MS.esc(relTime(e.created_at))}</span>
        </div>
        <div class="tl-meta">
          <span class="tl-actor">${actorLabel(e)}</span>
          ${targetBits ? `<span class="mono">${MS.esc(targetBits)}</span>` : ''}
        </div>
      </div>
    </li>`;

  el.querySelectorAll('.tl-item').forEach(li => {

    li.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });
  });
}

// ════════════════════════════════════════════════════════════════
// Drawer
// ════════════════════════════════════════════════════════════════

function openDrawer() {
  const d = $('#drawer');
  const s = $('#drawerScrim');
  if (!d || !s) return;
  d.hidden = false;
  d.classList.add('open');
  d.setAttribute('aria-hidden', 'false');
  s.hidden = false;
  s.classList.add('open');
  MS.lockScroll();
  setTimeout(() => $('#dClose')?.focus(), 60);
}

function closeDrawer() {
  const d = $('#drawer');
  const s = $('#drawerScrim');
  if (!d || !s) return;
  d.classList.remove('open');
  d.setAttribute('aria-hidden', 'true');
  s.classList.remove('open');
  MS.unlockScroll();
  setTimeout(() => { d.hidden = true; s.hidden = true; }, 260);
  // Remove ?id from the URL
  const u = new URLSearchParams(location.search);
  if (u.has('id')) {
    u.delete('id');
    const url = location.pathname + (u.toString() ? '?' + u.toString() : '');
    history.replaceState(null, '', url);
  }
}

function idField(label, value, opts = {}) {
  const { showCopy = true } = opts;
  if (!value) return `<div class="dd-field"><span class="k">${MS.esc(label)}</span><span class="v">—</span></div>`;
  const short = MS.esc(shortId(value));
  const full  = MS.esc(value);
  const copyBtn = showCopy ? `<button type="button" class="copy-btn" data-copy="${full}">copy</button>` : '';
  return `<div class="dd-field"><span class="k">${MS.esc(label)}</span><span class="v" title="${full}">${short}${copyBtn}</span></div>`;
}

async function openEntry(id, opts = {}) {
  if (!id) return;
  if (!opts.fromDeepLink) {
    const u = new URLSearchParams(location.search);
    u.set('id', id);
    history.replaceState(null, '', location.pathname + '?' + u.toString());
  }
  openDrawer();

  $('#dTitle').textContent = 'Loading…';
  $('#dSub').textContent = '';
  $('#dBody').innerHTML = `<div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i>Loading…</div>`;
  $('#dPrev').disabled = true;
  $('#dNext').disabled = true;

  if (state.abortDetail) state.abortDetail.abort();
  state.abortDetail = new AbortController();

  const r = await api(API.detail(id), { signal: state.abortDetail.signal });
  if (!r.ok) {
    if (r.aborted) return;
    $('#dTitle').textContent = 'Error';
    $('#dBody').innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation" style="color:var(--danger)"></i><div class="title">Unable to load entry</div><div class="sub">${MS.esc(r.error || 'Please try again.')}</div></div>`;
    return;
  }

  const data = r.data || {};
  const e = data.entry || {};
  const admin = data.admin || {};
  const target = data.target || null;
  const chain = Array.isArray(data.chain) ? data.chain : [];

  // Prev/next ids come from list() when the entry was opened from
  // the list and the endpoint returned neighbours. Otherwise, use
  // the local list cache.
  const localIdx = (window.__auditRows || []).findIndex(x => x.id === id);
  const localPrev = localIdx > 0 ? (window.__auditRows[localIdx - 1] || {}).id : null;
  const localNext = localIdx >= 0 && localIdx < ((window.__auditRows || []).length - 1)
    ? (window.__auditRows[localIdx + 1] || {}).id
    : null;

  const prevId = localPrev;
  const nextId = localNext;
  $('#dPrev').disabled = !prevId;
  $('#dNext').disabled = !nextId;
  $('#dPrev').onclick = prevId ? () => openEntry(prevId) : null;
  $('#dNext').onclick = nextId ? () => openEntry(nextId) : null;

  $('#dTitle').textContent = e.action || 'Audit entry';
  $('#dSub').textContent = fmtUtc(e.created_at);

  let diffBlock = '';
  if (e.before != null || e.after != null) {
    const beforeJson = JSON.stringify(e.before || {}, null, 2);
    const afterJson  = JSON.stringify(e.after  || {}, null, 2);
    diffBlock = `
      <div class="dd-section">
        <div class="dd-section-title">Change</div>
        <div class="diff-box">${MS.esc(beforeJson)}
→
${MS.esc(afterJson)}</div>
      </div>`;
  }

  let targetBlock = '';
  if (target && typeof target === 'object' && Object.keys(target).length) {
    const rows = Object.entries(target).map(([k, v]) =>
      `<div class="dd-field"><span class="k">${MS.esc(k)}</span><span class="v">${MS.esc(typeof v === 'object' ? JSON.stringify(v) : (v == null ? '—' : String(v)))}</span></div>`
    ).join('');
    targetBlock = `<div class="dd-section"><div class="dd-section-title">Resolved target</div>${rows}</div>`;
  }

  let metadataBlock = '';
  if (e.metadata && Object.keys(e.metadata).length) {
    metadataBlock = `
      <div class="dd-section">
        <div class="dd-section-title">Metadata</div>
        <div class="diff-box">${MS.esc(JSON.stringify(e.metadata, null, 2))}</div>
      </div>`;
  }

  let chainBlock = '';
  if (chain.length > 1) {
    chainBlock = `
      <div class="dd-section">
        <div class="dd-section-title">Correlation chain <span style="font-weight:500;color:var(--text-faint)">${chain.length} events</span></div>
        <ul class="chain">
          ${chain.map(c => `
            <li class="chain-item" data-chain-id="${MS.esc(c.id)}" tabindex="0" role="button">
              <span class="dot ${MS.esc(c.severity || 'low')}"></span>
              <span class="a">${MS.esc(c.action)}</span>
              <span class="t">${MS.esc(relTime(c.created_at))}</span>
            </li>
          `).join('')}
        </ul>
      </div>`;
  }

  $('#dBody').innerHTML = `
    <div class="dd-section">
      <div class="dd-section-title">Summary</div>
      <div class="dd-field"><span class="k">Action</span><span class="v">${MS.esc(e.action)}</span></div>
      <div class="dd-field"><span class="k">Result</span><span class="v">${MS.esc(e.result)}${e.failure_code ? ' · ' + MS.esc(e.failure_code) : ''}</span></div>
      ${e.duration_ms != null ? `<div class="dd-field"><span class="k">Duration</span><span class="v">${MS.esc(String(e.duration_ms))} ms</span></div>` : ''}
      <div class="dd-field"><span class="k">Timestamp</span><span class="v">${MS.esc(fmtUtc(e.created_at))}</span></div>
    </div>

    <div class="dd-section">
      <div class="dd-section-title">Actor</div>
      <div class="dd-field"><span class="k">Type</span><span class="v">${MS.esc(e.actor_type || 'admin')}</span></div>
      <div class="dd-field"><span class="k">Admin</span><span class="v">${MS.esc(admin.username || e.admin_email || e.admin_id || '—')}</span></div>
      <div class="dd-field"><span class="k">Email</span><span class="v">${MS.esc(e.admin_email || '—')}</span></div>
      <div class="dd-field"><span class="k">Role</span><span class="v">${MS.esc(admin.role || e.admin_role || '—')}</span></div>
    </div>

    <div class="dd-section">
      <div class="dd-section-title">Target</div>
      <div class="dd-field"><span class="k">Type</span><span class="v">${MS.esc(e.target_type || '—')}</span></div>
      ${idField('ID', e.target_id)}
      ${e.provider ? `<div class="dd-field"><span class="k">Provider</span><span class="v">${MS.esc(e.provider)}</span></div>` : ''}
      ${e.operation ? `<div class="dd-field"><span class="k">Operation</span><span class="v">${MS.esc(e.operation)}</span></div>` : ''}
    </div>

    ${targetBlock}
    ${diffBlock}
    ${metadataBlock}

    <div class="dd-section">
      <div class="dd-section-title">Reason &amp; note</div>
      <div class="dd-field"><span class="k">Reason</span><span class="v" style="text-align:left;font-family:inherit;font-size:12.5px;font-weight:500">${MS.esc(e.reason || '—')}</span></div>
      <div class="dd-field"><span class="k">Note</span><span class="v" style="text-align:left;font-family:inherit;font-size:12.5px;font-weight:500">${MS.esc(e.admin_note || '—')}</span></div>
    </div>

    <div class="dd-section">
      <div class="dd-section-title">Request</div>
      ${idField('IP address', e.ip_address, { showCopy: false })}
      <div class="dd-field"><span class="k">Device</span><span class="v">${MS.esc(e.device || '—')}</span></div>
      <div class="dd-field"><span class="k">Location</span><span class="v">${MS.esc(e.location || '—')}</span></div>
      ${idField('Request ID', e.request_id)}
      ${idField('Session ID', e.session_id, { showCopy: false })}
      ${idField('Correlation ID', e.correlation_id)}
      <div class="dd-field"><span class="k">User agent</span><span class="v" style="text-align:left;font-family:inherit;font-size:12px">${MS.esc(e.user_agent || '—')}</span></div>
    </div>

    ${chainBlock}
  `;

  // Copy buttons
  $('#dBody').querySelectorAll('[data-copy]').forEach(b => {
    b.addEventListener('click', () => MS.copyText(b.dataset.copy).then(ok => ok && notify('Copied', 'success')));
  });

  // Chain clicks
  $('#dBody').querySelectorAll('[data-chain-id]').forEach(li => {
    const go = () => openEntry(li.dataset.chainId);
    li.addEventListener('click', go);
    li.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
  });
}

// ════════════════════════════════════════════════════════════════
// Export
// ════════════════════════════════════════════════════════════════

async function handleExport() {
  const btn = $('#exportBtn');
  if (!btn) return;
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Exporting…';

  try {
    const url = API.export + '?' + buildQuery(false);
    const ok = await MS.downloadCsv(url, {
      filename: 'admin_audit_' + new Date().toISOString().slice(0, 10) + '.csv'
    });
    if (ok) notify('Export started', 'success');
    else    notify('Export failed', 'error');
  } catch (e) {
    notify('Export failed: ' + (e.message || 'unknown'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

// ════════════════════════════════════════════════════════════════
// Drawer close wiring (once)
// ════════════════════════════════════════════════════════════════

function wireDrawerOnce() {
  const dClose = $('#dClose');
  const dCopy  = $('#dCopy');
  const dScrim = $('#drawerScrim');
  if (dClose) dClose.addEventListener('click', closeDrawer);
  if (dScrim) dScrim.addEventListener('click', closeDrawer);
  if (dCopy)  dCopy.addEventListener('click', () => {
    MS.copyText(location.href).then(ok => ok && notify('Link copied', 'success'));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#drawer').classList.contains('open')) {
      closeDrawer();
    }
  });
}

// Expose the current list cache for the drawer to find prev/next in
// the loaded page.
const _origRenderRows = renderRows;
renderRows = function(entries) {
  window.__auditRows = entries;
  return _origRenderRows(entries);
};

// ════════════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', async () => {
  if (!AdminSession || !AdminSession.getToken()) {
    return AdminSession.redirectToLogin();
  }

  if (typeof MS === 'undefined' || typeof MS.init !== 'function') {
    const app = document.getElementById('appRoot');
    if (app) app.innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger)">admin-shell.js failed to load</div>';
    return;
  }

  // Shell (sidebar + topbar). MS.init renders the sidebar, wires the
  // mobile drawer open/close, wires the theme toggle, and fills in
  // admin identity.
  MS.init({
    activeKey: 'audit',
    title: 'Audit Log',
    breadcrumb: [
      { label: 'System' },
      { label: 'Audit Log' }
    ]
  });

  // Restore filters from the URL
  state.filters = readFiltersFromUrl();

  renderPage();
  wireDrawerOnce();

  // Load everything once
  const ready = await loadBootstrapOnce();
  if (!ready) return;

  hydrateFormFromFilters();

  await Promise.all([
    loadSummary(),
    loadList(),
    loadRecent()
  ]);

  startLiveTail();
});
</script>
