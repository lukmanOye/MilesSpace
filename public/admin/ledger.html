<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Ledger — MilesSpace Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/css/admin-shell.css">
<script src="/js/admin-session.js?v=2026-ledger-v2"></script>
<script src="/js/admin-shell.js?v=2026-ledger-v2"></script>
</head>
<body>

<script>
(function() {
  try {
    if (localStorage.getItem('ms-theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    } else {
      document.documentElement.classList.add('light');
      document.documentElement.style.colorScheme = 'light';
    }
  } catch(_) {}
})();
</script>

<div class="app" id="appRoot"></div>

<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="dd-head">
    <div class="dd-ic" id="ddIcon"><i class="fas fa-book"></i></div>
    <div class="dd-titles"><h2 id="ddTitle">Ledger Entry</h2><div class="dd-sub" id="ddSub"></div></div>
    <button class="dd-close" id="ddClose" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="dd-body" id="ddBody"></div>
</aside>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
'use strict';

document.addEventListener('DOMContentLoaded', () => {
  if (!window.AdminSession?.getToken?.()) return window.AdminSession?.redirectToLogin?.() || window.location.replace('/admin/index.html');
  MS.init({
    activeKey: 'ledger',
    title: 'Ledger',
    breadcrumb: [
      { label: 'Home', href: '/admin/dashboard.html' },
      { label: 'Money' },
      { label: 'Ledger' }
    ]
  });
  renderContent();
  loadBalances();
  loadList();
});

const API = {
  list:     '/api/admin/ledger',
  balances: '/api/admin/ledger/balances',
  export:   '/api/admin/ledger/export',
};

const State = { page: 1, limit: 25, totalPages: 1, count: 0, filters: {}, entries: [] };

function renderContent() {
  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <div>
        <h2>Ledger</h2>
        <div class="sub">The accounting source of truth. Every entry is immutable. Corrections are new entries, never edits.</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="reloadBtn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
        <button class="btn btn-primary" id="exportBtn" type="button"><i class="fas fa-download"></i> Export CSV</button>
      </div>
    </div>

    <div class="kpi-grid" id="balanceRow"></div>

    <div class="filters-card">
      <div class="filters-bar">
        <div class="search-input-wrap">
          <i class="fas fa-search"></i>
          <input type="search" id="fSearch" class="search-input" placeholder="Search transaction ref, entry ID, description…">
        </div>
        <select id="fCurrency" class="select-input">
          <option value="all">All Currencies</option>
          <option value="NGN">NGN</option>
          <option value="USD">USD</option>
        </select>
        <select id="fDirection" class="select-input">
          <option value="all">Both Directions</option>
          <option value="credit">Credits only</option>
          <option value="debit">Debits only</option>
        </select>
        <input type="date" id="fFrom" class="date-input">
        <input type="date" id="fTo" class="date-input">
        <button class="btn btn-primary" id="applyBtn" type="button"><i class="fas fa-filter"></i> Apply</button>
        <button class="btn btn-ghost" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Entry</th>
              <th>User</th>
              <th>Transaction</th>
              <th>Type</th>
              <th style="text-align:right">Amount</th>
              <th style="text-align:right">Balance After</th>
              <th>Description</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <div id="pageInfo">—</div>
        <div class="pagination" id="pagerControls"></div>
      </div>
    </div>`;

  document.getElementById('applyBtn').addEventListener('click', () => { readFilters(); State.page = 1; loadList(); });
  document.getElementById('clearBtn').addEventListener('click', () => {
    ['fSearch','fFrom','fTo'].forEach(id => document.getElementById(id).value = '');
    ['fCurrency','fDirection'].forEach(id => document.getElementById(id).value = 'all');
    readFilters(); State.page = 1; loadList();
  });
  document.getElementById('reloadBtn').addEventListener('click', () => { loadBalances(); loadList(); });
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('fSearch').addEventListener('keydown', e => { if (e.key === 'Enter') { readFilters(); State.page = 1; loadList(); } });

  document.getElementById('ddClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerScrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}

function readFilters() {
  State.filters = {
    search: document.getElementById('fSearch').value.trim(),
    currency: document.getElementById('fCurrency').value,
    direction: document.getElementById('fDirection').value,
    from: document.getElementById('fFrom').value,
    to: document.getElementById('fTo').value,
  };
}

async function loadBalances() {
  const el = document.getElementById('balanceRow');
  if (!el) return;
  el.innerHTML = `<div class="kpi-card"><div class="lbl">Balances</div><div class="val"><span class="skel" style="width:120px;display:inline-block"></span></div></div>`;
  const r = await MS.api(API.balances);
  if (!r.ok) {
    el.innerHTML = `<div class="kpi-card"><div class="lbl">Balances</div><div class="val" style="font-size:13px;color:var(--text-faint)">Unavailable</div></div>`;
    return;
  }
  const b = r.data.data?.balances || r.data.balances || {};
  const entries = Object.entries(b).filter(([ccy]) => ['NGN', 'USD'].includes(String(ccy).toUpperCase()));
  if (!entries.length) {
    el.innerHTML = `<div class="kpi-card"><div class="lbl">Balances</div><div class="val" style="font-size:13px;color:var(--text-faint)">No data</div></div>`;
    return;
  }
  el.innerHTML = entries.map(([ccy, v]) => `
    <div class="kpi-card">
      <div class="lbl">${MS.esc(ccy)} · Customer Liability</div>
      <div class="val">${MS.esc(MS.fmtMoney(v.available, ccy))}</div>
      <div class="sub">Held: ${MS.esc(MS.fmtMoney(v.held, ccy))}</div>
    </div>`).join('');
}

function buildQuery() {
  const q = new URLSearchParams();
  q.set('page', String(State.page));
  q.set('limit', String(State.limit));
  const f = State.filters;
  if (f.search) q.set('search', f.search);
  if (f.currency && f.currency !== 'all') q.set('currency', f.currency);
  if (f.direction && f.direction !== 'all') q.set('direction', f.direction);
  if (f.from) q.set('from', f.from);
  if (f.to) q.set('to', f.to);
  return q.toString();
}

async function loadList() {
  const tb = document.getElementById('tableBody');
  tb.innerHTML = Array.from({ length: 8 }).map(() => `<tr><td colspan="8"><span class="skel" style="width:${50 + Math.random() * 40}%;display:inline-block"></span></td></tr>`).join('');

  const r = await MS.api(API.list + '?' + buildQuery());
  if (!r.ok) {
    tb.innerHTML = `<tr><td colspan="8"><div class="unavailable-box"><i class="fas fa-triangle-exclamation"></i><div>Unable to load ledger entries.</div><button class="btn btn-ghost" onclick="loadList()" style="margin-top:10px"><i class="fas fa-rotate"></i> Retry</button></div></td></tr>`;
    return;
  }

  const data = r.data.data || r.data;
  const rows = data.entries || [];
  State.totalPages = data.totalPages || 1;
  State.count = data.count || 0;
  State.entries = rows;

  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><div class="title">No entries</div><div class="sub">No ledger entries match your filters.</div></div></td></tr>`;
    document.getElementById('pageInfo').textContent = 'No results';
    return;
  }

  tb.innerHTML = rows.map((e, i) => {
    const dir = e.direction === 'credit' ? 'credit' : 'debit';
    const sign = dir === 'credit' ? '+' : '−';
    const amt = MS.fmtMoney(e.amount, e.currency) || '—';
    const bal = MS.fmtMoney(e.balance_after, e.currency) || '—';
    return `<tr data-idx="${i}">
      <td data-cell="ref"><span class="mono" style="font-size:11px">${MS.esc(String(e.id).slice(0, 8))}…</span></td>
      <td data-cell="user">
        <strong>${MS.esc(e.user?.username || '—')}</strong>
        <span style="display:block;font-size:10.5px;color:var(--text-dim)">${MS.esc(e.user?.email || '')}</span>
      </td>
      <td data-cell="ref"><span class="mono" style="font-size:10.5px">${MS.esc(e.transaction_reference || '—')}</span></td>
      <td data-cell="type"><span class="badge ${dir}">${MS.esc(e.entry_type || dir.toUpperCase())}</span></td>
      <td data-cell="amount" style="text-align:right;font-weight:700;color:${dir === 'credit' ? 'var(--success)' : 'var(--danger)'}">${sign} ${amt}</td>
      <td data-cell="amount" style="text-align:right;font-variant-numeric:tabular-nums">${bal}</td>
      <td data-cell="desc" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${MS.esc(e.description || '—')}</td>
      <td data-cell="date" title="${MS.esc(MS.fmtDateTime(e.created_at))}">${MS.esc(MS.timeAgo(e.created_at))}</td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('tr[data-idx]').forEach(tr => {
    tr.addEventListener('click', () => openDetail(State.entries[parseInt(tr.dataset.idx, 10)]));
  });

  document.getElementById('pageInfo').textContent = State.count
    ? `Showing ${(State.page - 1) * State.limit + 1}–${Math.min(State.page * State.limit, State.count)} of ${State.count}`
    : 'No results';
  renderPager();
}

function renderPager() {
  const c = document.getElementById('pagerControls');
  if (!c) return;
  c.innerHTML = '';
  if (State.totalPages <= 1) return;
  const mk = (label, page, disabled, active) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener('click', () => { State.page = page; loadList(); });
    return b;
  };
  c.appendChild(mk('‹', State.page - 1, State.page <= 1, false));
  c.appendChild(mk(String(State.page), State.page, false, true));
  c.appendChild(mk('›', State.page + 1, State.page >= State.totalPages, false));
}

function openDetail(e) {
  if (!e) return;
  const dir = e.direction === 'credit' ? 'credit' : 'debit';
  const sign = dir === 'credit' ? '+' : '−';
  const amt = MS.fmtMoney(e.amount, e.currency) || '—';
  const before = MS.fmtMoney(e.balance_before, e.currency) || '—';
  const after = MS.fmtMoney(e.balance_after, e.currency) || '—';

  document.getElementById('ddIcon').innerHTML = dir === 'credit' ? '<i class="fas fa-plus"></i>' : '<i class="fas fa-minus"></i>';
  document.getElementById('ddTitle').textContent = (e.entry_type || 'Entry') + ' · ' + (e.currency || '');
  document.getElementById('ddSub').textContent = (e.user?.username || '') + ' · ' + MS.timeAgo(e.created_at);

  document.getElementById('ddBody').innerHTML = `
    <div class="dd-hero">
      <div>
        <div class="amount ${dir}">${sign} ${MS.esc(amt)}</div>
        <div class="meta">${MS.esc(e.currency || '')} · ${MS.esc(e.entry_type || '')}</div>
      </div>
    </div>
    <div class="dd-section">
      <div class="dd-section-title">Entry</div>
      <div class="dd-field"><span class="k">ID</span><span class="v mono" style="font-size:11px">${MS.esc(e.id)}</span></div>
      <div class="dd-field"><span class="k">Transaction</span><span class="v mono" style="font-size:11px">${MS.esc(e.transaction_reference || '—')}</span></div>
      <div class="dd-field"><span class="k">Type</span><span class="v">${MS.esc(e.entry_type || '—')}</span></div>
      <div class="dd-field"><span class="k">Amount</span><span class="v">${MS.esc(amt)}</span></div>
      <div class="dd-field"><span class="k">Description</span><span class="v">${MS.esc(e.description || '—')}</span></div>
      <div class="dd-field"><span class="k">Time</span><span class="v">${MS.esc(MS.fmtDateTime(e.created_at))}</span></div>
    </div>
    <div class="dd-section">
      <div class="dd-section-title">Balance Movement</div>
      <div class="dd-field"><span class="k">Before</span><span class="v">${MS.esc(before)}</span></div>
      <div class="dd-field"><span class="k">Change</span><span class="v" style="color:${dir === 'credit' ? 'var(--success)' : 'var(--danger)'}">${sign} ${MS.esc(amt)}</span></div>
      <div class="dd-field"><span class="k">After</span><span class="v">${MS.esc(after)}</span></div>
    </div>
    <div class="dd-section">
      <div class="dd-section-title">User</div>
      <div class="dd-field"><span class="k">Username</span><span class="v">${MS.esc(e.user?.username || '—')}</span></div>
      <div class="dd-field"><span class="k">Email</span><span class="v">${MS.esc(e.user?.email || '—')}</span></div>
    </div>`;

  document.getElementById('detailDrawer').classList.add('open');
  document.getElementById('drawerScrim').classList.add('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'false');
  MS.lockScroll();
}

function closeDrawer() {
  document.getElementById('detailDrawer').classList.remove('open');
  document.getElementById('drawerScrim').classList.remove('open');
  document.getElementById('detailDrawer').setAttribute('aria-hidden', 'true');
  MS.unlockScroll();
}

async function exportCsv() {
  const q = new URLSearchParams();
  if (State.filters.currency && State.filters.currency !== 'all') q.set('currency', State.filters.currency);
  if (State.filters.direction && State.filters.direction !== 'all') q.set('direction', State.filters.direction);
  if (State.filters.from) q.set('from', State.filters.from);
  if (State.filters.to) q.set('to', State.filters.to);
  await MS.downloadCsv(
    API.export + (q.toString() ? '?' + q.toString() : ''),
    { filename: `ledger_${Date.now()}.csv` }
  );
}

window.loadList = loadList;
</script>
</body>
</html>
