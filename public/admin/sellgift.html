<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Gift Cards · MilesSpace Admin</title>

<link rel="icon" href="/images/miles.png" type="image/png">
<link rel="apple-touch-icon" href="/images/miles.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/css/admin-shell.css">
<script src="/js/admin-session.js?v=2026-giftcards-v3"></script>
<script src="/js/admin-shell.js?v=2026-giftcards-v3"></script>

<style>
/* ── Side-menu layout (same tokens as the old page) ────────── */
.layout{display:flex;gap:22px;align-items:flex-start}
.side-menu{width:220px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;position:sticky;top:calc(var(--topbar-h) + 16px);max-height:calc(100vh - var(--topbar-h) - 40px);overflow-y:auto}
.side-menu .item{padding:10px 12px;font-size:13px;color:var(--text-dim);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;min-height:40px}
.side-menu .item:hover{background:var(--bg);color:var(--text)}
.side-menu .item.active{background:var(--brand);color:#fff}
.side-menu .item i{width:16px;text-align:center;flex-shrink:0}
.panels{flex:1;min-width:0}
.panel{display:none}
.panel.active{display:block}

/* ── Card / KPI ─────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.card + .card{margin-top:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.kpi .lbl{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .lbl i{opacity:.7}
.kpi .val{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi .sub{font-size:11px;color:var(--text-faint);margin-top:4px}

/* ── Filters / buttons / tables ────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input,.filters select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;min-height:42px}
.filters input[type="search"]{flex:1 1 260px;min-width:200px}
.filters input[type="date"]{flex:0 1 160px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--brand);font-family:inherit;min-height:42px;transition:background .15s}
.btn:hover:not(:disabled){background:var(--gold-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover:not(:disabled){background:var(--brand-light);color:#fff}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover:not(:disabled){background:#b91c1c;color:#fff}
.btn-sm{padding:6px 10px;font-size:11.5px;min-height:32px;border-radius:8px}

.table-scroll{overflow-x:auto;overflow-y:auto;max-height:640px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
th{text-align:left;padding:11px 14px;color:var(--text-dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.row-clickable{cursor:pointer}
tr.row-clickable:hover{background:rgba(245,166,35,.05)}
tr:last-child td{border-bottom:none}

.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;text-transform:capitalize;white-space:nowrap}
.badge.success{background:var(--success-bg);color:var(--success)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.warn{background:var(--warn-bg);color:#b3720a}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.purple{background:var(--purple-bg);color:var(--purple)}
.badge.neutral{background:var(--bg);color:var(--text-dim);border:1px solid var(--border)}

.empty-box{text-align:center;padding:30px 20px;color:var(--text-faint);font-size:13px}
.empty-box i{font-size:22px;margin-bottom:6px;display:block;opacity:.6}
.unavailable-box{text-align:center;padding:24px 14px;color:var(--text-faint)}
.unavailable-box button{margin-top:10px;border:1px solid var(--border);background:var(--surface);color:var(--brand);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}

.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 0;font-size:12.5px;color:var(--text-dim);gap:8px;flex-wrap:wrap}
.pagination .actions{display:flex;gap:6px}

/* ── Drawer ─────────────────────────────────────────────── */
.drawer-scrim{position:fixed;inset:0;background:rgba(5,15,20,.5);backdrop-filter:blur(2px);z-index:300;opacity:0;pointer-events:none;transition:opacity 220ms ease}
.drawer-scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(720px,96vw);background:var(--bg);z-index:301;box-shadow:var(--shadow-md);transform:translateX(100%);transition:transform 260ms cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.dh{display:flex;align-items:center;gap:14px;padding:20px 22px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;flex-shrink:0}
.dh .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dh .titles{flex:1;min-width:0}
.dh h2{margin:0;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .sub{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .close{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.db{flex:1;overflow-y:auto;padding:20px 22px 40px}
.dd-hero{padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.dd-hero .amt{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-word}
.dd-hero .meta{font-size:11px;color:var(--text-faint);margin-top:2px}
.dd-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed var(--border)}
.dd-section:last-child{border-bottom:none}
.dd-section h4{margin:0 0 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}
.field{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px;flex-wrap:wrap}
.field .k{color:var(--text-dim);font-weight:600;flex-shrink:0}
.field .v{font-weight:700;text-align:right;word-break:break-word;overflow-wrap:anywhere;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.delivery-reveal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13px;flex-wrap:wrap;word-break:break-all}
.delivery-reveal #codeDisplay{min-width:0;overflow-wrap:anywhere}

/* ── Modal (shared shape) ───────────────────────────────── */
.modal-scrim{position:fixed;inset:0;background:rgba(5,15,20,.6);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.modal-scrim.show{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:480px;width:100%;box-shadow:var(--shadow-md);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.modal h3{margin:0;padding:18px 22px;font-size:16px;font-weight:800;border-bottom:1px solid var(--border)}
.modal .body{padding:18px 22px;overflow-y:auto;flex:1}
.modal .body p.note{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5}
.modal .body label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.modal .body input[type="text"],.modal .body input[type="number"],.modal .body textarea,.modal .body select{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--text);outline:none}
.modal .body textarea{resize:vertical;min-height:80px}
.modal .body input:focus,.modal .body textarea:focus,.modal .body select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,76,92,.1)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--border);flex-shrink:0}
.modal .err{display:none;background:var(--danger-bg);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:12px;margin-top:10px}
.modal .err.show{display:block}

/* ── Toast ──────────────────────────────────────────────── */
.toast-stack{position:fixed;bottom:22px;right:22px;left:auto;display:flex;flex-direction:column;gap:10px;z-index:500;max-width:380px;pointer-events:none}
.toast{background:#0c1f26;color:#fff;padding:12px 16px;border-radius:11px;font-size:12.8px;font-weight:600;border-left:3px solid var(--gold);box-shadow:var(--shadow-md);pointer-events:auto;word-break:break-word}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}

/* ── Skeletons ──────────────────────────────────────────── */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,#eef1f7 37%,var(--border) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:6px;height:12px;display:inline-block}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ── Provider card ──────────────────────────────────────── */
.provider-card{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.provider-card h4{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.status-dot.ok{background:var(--success);box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.status-dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.18)}

/* ── Pricing calculator ─────────────────────────────────── */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.calc-panel{padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--border)}
.calc-panel h4{margin:0 0 12px;font-size:13px;font-weight:800}
.calc-result{display:flex;flex-direction:column;gap:6px}
.calc-result .row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.calc-result .row.big{font-size:15px;font-weight:800;border-top:1px dashed var(--border);padding-top:8px;margin-top:8px}
.calc-result .row .k{color:var(--text-dim)}
.calc-result .row .v{font-variant-numeric:tabular-nums}

/* ── Product cell ───────────────────────────────────────── */
.prod-logo{width:32px;height:32px;border-radius:6px;background:var(--bg);display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:11px;font-weight:800;color:var(--text-dim)}
.prod-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.prod-wrap{display:flex;align-items:center;gap:10px}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width:1100px){
    .layout{flex-direction:column;gap:14px}
    .side-menu{width:100%;position:static;max-height:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px}
    .side-menu .item{flex:1 1 auto;min-width:120px;justify-content:center;margin-bottom:0}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .calc-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
    .topbar{padding:0 14px;height:64px;gap:10px}
    .content{padding:14px 12px 80px}
    .card{padding:16px 14px}
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .kpi{padding:12px 12px}
    .kpi .val{font-size:18px}
    .filters{flex-direction:column;align-items:stretch}
    .filters input,.filters select,.filters .btn{width:100%;min-width:0}
    .table-scroll{overflow:visible;max-height:none}
    table{min-width:0;width:100%}
    thead{display:none}
    tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
    td{border-bottom:1px dashed var(--border);padding:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;text-align:right}
    td:last-child{border-bottom:none}
    td::before{content:attr(data-label);flex-shrink:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:700;text-align:left}
    td[data-label=""]::before{display:none}
    .drawer{width:100vw;max-width:100vw}
    .dh{padding:16px 18px}
    .db{padding:16px 18px 32px}
    .toast-stack{left:12px;right:12px;bottom:12px;max-width:none}
}
@media (max-width:480px){
    .kpi-grid{grid-template-columns:1fr;gap:8px}
    .side-menu .item{min-width:0;flex:1 1 calc(50% - 3px);font-size:12px;padding:9px 8px}
    .side-menu .item span{display:none}
    .side-menu .item i{font-size:14px}
    .actions{flex-direction:column}
    .actions .btn{width:100%}
    .dd-hero{flex-direction:column;align-items:flex-start}
    .modal .foot{flex-direction:column}
    .modal .foot .btn{width:100%}
    .field{flex-direction:column;align-items:flex-start;gap:2px}
    .field .v{text-align:left}
    .delivery-reveal{flex-direction:column;align-items:stretch}
    .delivery-reveal .btn{width:100%}
}
</style>
</head>
<body>

<div class="app" id="appRoot"></div>

<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
    <div class="dh">
        <div class="ic" id="dIcon"><i class="fas fa-gift"></i></div>
        <div class="titles"><h2 id="dTitle">Order</h2><div class="sub" id="dSub"></div></div>
        <button class="close" id="dClose" aria-label="Close"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="db" id="dBody"></div>
</aside>

<div class="modal-scrim" id="modalScrim">
    <div class="modal" role="dialog" aria-modal="true">
        <h3 id="mTitle">Action</h3>
        <div class="body" id="mBody"></div>
        <div class="foot">
            <button class="btn" id="mCancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="mConfirm" type="button">Confirm</button>
        </div>
    </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
'use strict';

// ─── API surface ─────────────────────────────────────────────
const API = {
    summary:           '/api/admin/gift-cards/summary',
    orders:            '/api/admin/gift-cards/orders',
    order:             id => `/api/admin/gift-cards/orders/${encodeURIComponent(id)}`,
    reveal:            id => `/api/admin/gift-cards/orders/${encodeURIComponent(id)}/reveal-code`,
    retry:             id => `/api/admin/gift-cards/orders/${encodeURIComponent(id)}/retry`,
    refund:            id => `/api/admin/gift-cards/orders/${encodeURIComponent(id)}/refund`,
    sync:              id => `/api/admin/gift-cards/orders/${encodeURIComponent(id)}/sync`,
    products:          '/api/admin/gift-cards/products',
    productEnabled:    id => `/api/admin/gift-cards/products/${encodeURIComponent(id)}/enabled`,
    productPricing:    id => `/api/admin/gift-cards/products/${encodeURIComponent(id)}/pricing`,
    productUpdate:     id => `/api/admin/gift-cards/products/${encodeURIComponent(id)}`,
    catalog:           '/api/admin/gift-cards/catalog',
    import:            '/api/admin/gift-cards/products/import',
    preview:           '/api/admin/gift-cards/pricing/preview',
    pricingGet:        '/api/admin/gift-cards/pricing',
    pricingPut:        '/api/admin/gift-cards/pricing',
    refreshCosts:      '/api/admin/gift-cards/products/refresh-costs',
    providerHealth:    '/api/admin/gift-cards/provider/health',
    providerCheck:     '/api/admin/gift-cards/provider/health-check'
};

const CURRENCY_SYMBOLS = { NGN:'₦', USD:'$', GHS:'GH₵', KES:'KSh', ZAR:'R', XOF:'CFA', XAF:'FCFA', TZS:'TSh', EGP:'E£' };

const State = {
    orderPage: 1,
    orderLimit: 25,
    orderTotalPages: 1,
    filters: {},
    currentOrder: null,
    productsCache: [],
    productsCacheAt: 0,
    pricingConfig: null,
    catalogSelected: new Set(),
    catalogRows: []
};

// ─── Utilities ──────────────────────────────────────────────
function esc(s){
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtMoney(amount, ccy){
    if (amount == null || amount === '') return null;
    const c = String(ccy || '').toUpperCase();
    const n = Number(amount);
    if (!Number.isFinite(n)) return null;
    const s = n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (CURRENCY_SYMBOLS[c] || (c ? c + ' ' : '')) + s;
}
function fmtNum(v){
    const n = Number(v);
    return Number.isFinite(n) ? n.toLocaleString('en-US') : '—';
}
function fmtDateTime(iso){
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function timeAgo(iso){
    if (!iso) return '—';
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60)+'m ago';
    if (s < 86400) return Math.floor(s/3600)+'h ago';
    if (s < 604800) return Math.floor(s/86400)+'d ago';
    return new Date(iso).toLocaleDateString();
}
function statusBadge(status){
    const s = String(status||'').toLowerCase();
    if (s === 'completed') return 'success';
    if (s === 'failed' || s === 'cancelled') return 'danger';
    if (s === 'refund_pending' || s === 'refunded') return 'info';
    if (['pending_payment','paid','processing','provider_pending','reconciliation_required'].includes(s)) return 'warn';
    return 'neutral';
}
function toast(msg, kind='info'){
    const stack = document.getElementById('toastStack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 3600);
}

// ─── API wrapper ────────────────────────────────────────────
async function api(url, opts = {}){
    try {
        const res = await AdminSession.fetch(url, opts);
        let json = null;
        try { json = await res.json(); } catch {}
        if (!res.ok || json?.success === false){
            return {
                ok: false,
                status: res.status,
                code: json?.code,
                message: json?.message || json?.error || `HTTP ${res.status}`,
                requestId: json?.request_id
            };
        }
        return { ok: true, data: json.data != null ? json.data : json };
    } catch (e) {
        return { ok: false, status: 0, message: e.message || 'Network error' };
    }
}

// ─── Boot ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    if (!AdminSession.getToken()) return AdminSession.redirectToLogin();

    // Sidebar from shared admin-shell.js
    MS.init({
        activeKey: 'sellgift',
        title: 'Gift Cards',
        breadcrumb: [
            { label: 'Home', href: '/admin/dashboard.html' },
            { label: 'Services' },
            { label: 'Gift Cards' }
        ]
    });

    // Load content into #content injected by admin-shell
    document.getElementById('content').innerHTML = renderShell();
    wireMenu();
    wireModalGlobal();

    // Load overview initially
    showSection('overview');
});

function renderShell(){
    return `
        <div class="layout">
            <aside class="side-menu" id="giftMenu" role="tablist">
                <div class="item active" data-section="overview" role="tab"><i class="fas fa-chart-pie"></i><span>Overview</span></div>

function wireMenu(){
    document.querySelectorAll('#giftMenu .item').forEach(el => {
        el.addEventListener('click', () => showSection(el.dataset.section));
    });
}

function showSection(section){
    document.querySelectorAll('#giftMenu .item').forEach(el => {
        el.classList.toggle('active', el.dataset.section === section);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('panel-' + section);
    if (target) target.classList.add('active');

    if (section === 'overview') { loadOverview(); loadOverviewProvider(); }
    else if (section === 'orders')  wireOrders(); 
    else if (section === 'catalog') wireCatalog();
    else if (section === 'products') wireProducts();
    else if (section === 'pricing') { wirePricing(); loadPricingConfig(); }
    else if (section === 'attention') loadAttention();
    else if (section === 'refunds')  loadRefunds();
    else if (section === 'provider') loadProviderDetail();
}

// ─── Overview ─────────────────────────────────────────────
async function loadOverview(){

        el.innerHTML = `<div class="unavailable-box" style="grid-column:1/-1">${esc(r.message)} <button onclick="loadOverview()">Retry</button></div>`;
        return;
    }
    const s = r.data.summary || r.data || {};
    const kpis = [
        { lbl: 'Orders',           val: fmtNum(s.total),                    icon: 'fa-receipt',      color: '' },
        { lbl: 'Revenue',          val: s.revenueNgn != null ? fmtMoney(s.revenueNgn,'NGN') : '—', icon: 'fa-naira-sign', color: 'var(--success)' },

    el.innerHTML = `
        <div class="provider-card">
            <h4><i class="fas fa-plug"></i> ${esc(h.label || 'Provider')}</h4>

            <div class="field"><span class="k">Connectivity</span><span class="v"><span class="status-dot ${labelFor(c.connectivity)}"></span>${esc(c.connectivity || '—')}</span></div>
            <div class="field"><span class="k">Balance</span><span class="v"><span class="status-dot ${labelFor(c.balance)}"></span>${esc(c.balance || '—')}</span></div>
            <div class="field"><span class="k">Catalog</span><span class="v"><span class="status-dot ${labelFor(c.catalog)}"></span>${esc(c.catalog || '—')}</span></div>

// ─── Orders ───────────────────────────────────────────────
let ordersWired = false;
function wireOrders(){
    if (ordersWired) { loadOrders(); return; }
    ordersWired = true;

    document.getElementById('oApply').addEventListener('click', () => {
        State.filters = {
            search: document.getElementById('oSearch').value.trim(),
            status: document.getElementById('oStatus').value,
            from:   document.getElementById('oFrom').value,
            to:     document.getElementById('oTo').value
        };
        State.orderPage = 1;
        loadOrders();
    });
    document.getElementById('oClear').addEventListener('click', () => {
        document.getElementById('oSearch').value = '';
        document.getElementById('oStatus').value = 'all';
        document.getElementById('oFrom').value = '';
        document.getElementById('oTo').value = '';
        State.filters = {};
        State.orderPage = 1;
        loadOrders();
    });
    document.getElementById('oSearch').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('oApply').click();
    });
    document.getElementById('ordersPrev').addEventListener('click', () => {
        if (State.orderPage > 1) { State.orderPage--; loadOrders(); }
    });
    document.getElementById('ordersNext').addEventListener('click', () => {
        if (State.orderPage < State.orderTotalPages) { State.orderPage++; loadOrders(); }
    });

    loadOrders();
}

function buildOrdersQuery(){
    const q = new URLSearchParams();
    q.set('page', State.orderPage);
    q.set('limit', State.orderLimit);
    const f = State.filters;
    if (f.search) q.set('search', f.search);
    if (f.status && f.status !== 'all') q.set('status', f.status);
    if (f.from) q.set('from', f.from);
    if (f.to) q.set('to', f.to);
    return q.toString();
}

async function loadOrders(){
    const tb = document.getElementById('ordersBody');
    if (!tb) return;
    tb.innerHTML = '<tr><td colspan="7"><div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div></td></tr>';

    const r = await api(API.orders + '?' + buildOrdersQuery());
    if (!r.ok){
        tb.innerHTML = `<tr><td colspan="7"><div class="unavailable-box">${esc(r.message)} <button onclick="loadOrders()">Retry</button></div></td></tr>`;
        return;
    }
    const rows = r.data.orders || [];
    State.orderTotalPages = r.data.totalPages || 1;

    if (!rows.length){
        tb.innerHTML = '<tr><td colspan="7"><div class="empty-box"><i class="fas fa-inbox"></i>No orders yet</div></td></tr>';
        document.getElementById('ordersPageInfo').textContent = 'No results';
        document.getElementById('ordersPrev').disabled = true;
        document.getElementById('ordersNext').disabled = true;
        return;
    }

    tb.innerHTML = rows.map(o => `
        <tr class="row-clickable" data-id="${esc(o.id)}">
            <td data-label="Order"><span style="font-family:'JetBrains Mono',monospace;font-size:11px">${esc(o.order_ref || '—')}</span></td>
            <td data-label="User">${esc(o.user?.username || '—')}</td>
            <td data-label="Gift card">${esc(o.brand || '—')}<div style="font-size:10.5px;color:var(--text-dim)">${esc(o.country_name || '')}</div></td>
            <td data-label="Value">${o.face_value != null ? esc(o.face_value + ' ' + (o.face_currency || '')) : '—'}</td>
            <td data-label="Price">${fmtMoney(o.customer_price_ngn, 'NGN') || '—'}</td>
            <td data-label="Status"><span class="badge ${statusBadge(o.status)}">${esc(o.status)}</span></td>
            <td data-label="Created" title="${esc(fmtDateTime(o.created_at))}">${esc(timeAgo(o.created_at))}</td>
        </tr>`).join('');

    tb.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.addEventListener('click', () => openOrder(tr.dataset.id));
    });
    const info = document.getElementById('ordersPageInfo');
    info.textContent = r.data.count ? `Showing ${(State.orderPage-1)*State.orderLimit+1}–${Math.min(State.orderPage*State.orderLimit, r.data.count)} of ${r.data.count}` : 'No results';
    document.getElementById('ordersPrev').disabled = State.orderPage <= 1;
    document.getElementById('ordersNext').disabled = State.orderPage >= State.orderTotalPages;
}

function buildOrderActions(o){
    const buttons = [];
    if (o.status === 'failed') {
        buttons.push(`<button class="btn btn-sm btn-primary" id="btnRetry" type="button"><i class="fas fa-rotate-right"></i> Retry</button>`);
        buttons.push(`<button class="btn btn-sm btn-danger" id="btnRefund" type="button"><i class="fas fa-rotate-left"></i> Refund</button>`);
    } else if (o.status === 'refund_pending') {
        buttons.push(`<button class="btn btn-sm btn-danger" id="btnRefund" type="button"><i class="fas fa-rotate-left"></i> Confirm refund</button>`);
    }
    return buttons.length ? `<div class="actions">${buttons.join('')}</div>` : '';
}

// ─── Retry / Refund modals ────────────────────────────────
function openRetryModal(o){
    openModal({
        title: 'Retry order',
        confirmLabel: 'Retry',
        bodyHtml: `
            <p class="note">Provider state will be verified before any new purchase. If the original was already fulfilled, the existing card will be delivered instead of buying again.</p>
            <label for="retryReason">Reason (required)</label>
            <textarea id="retryReason" placeholder="Why is this being retried?"></textarea>
            <div class="err" id="retryErr"></div>
        `,
        onConfirm: async () => {
            const reason = document.getElementById('retryReason').value.trim();
            const errEl = document.getElementById('retryErr');
            errEl.classList.remove('show');
            if (reason.length < 4) {
                errEl.textContent = 'Reason must be at least 4 characters.';
                errEl.classList.add('show');
                return false;
            }
            const r = await api(API.retry(o.id), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason })
            });
            if (!r.ok) {
                errEl.textContent = r.message || 'Retry failed.';
                errEl.classList.add('show');
                return false;
            }
            toast(`Retry outcome: ${r.data.outcome || 'unknown'}`, 'success');
            openOrder(o.id);
            loadOrders();
            return true;
        }
    });
}

function openRefundModal(o){
    openModal({
        title: 'Refund order',
        confirmLabel: 'Refund',
        bodyHtml: `
            <p class="note">This credits the customer's wallet for ${esc(fmtMoney(o.customer_price_ngn, 'NGN') || '—')} and marks the order as refunded. The original debit is left unchanged.</p>

            <textarea id="refundReason" placeholder="Why is this being refunded?"></textarea>
            <div class="err" id="refundErr"></div>
        `,
        onConfirm: async () => {
            const reason = document.getElementById('refundReason').value.trim();
            const errEl = document.getElementById('refundErr');
            errEl.classList.remove('show');
            if (reason.length < 4) {
                errEl.textContent = 'Reason must be at least 4 characters.';
                errEl.classList.add('show');
                return false;
            }
            const r = await api(API.refund(o.id), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason })

            if (!r.ok) {
                errEl.textContent = r.message || 'Refund failed.';

// ─── Modal ────────────────────────────────────────────────
function wireModalGlobal(){
    document.getElementById('mCancel').addEventListener('click', () => {
        document.getElementById('modalScrim').classList.remove('show');
    });
    document.getElementById('modalScrim').addEventListener('click', (e) => {
        if (e.target.id === 'modalScrim') document.getElementById('modalScrim').classList.remove('show');
    });
    document.getElementById('dClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerScrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.getElementById('modalScrim').classList.remove('show');
            closeDrawer();
        }
    });
}

function openModal({ title, bodyHtml, confirmLabel = 'Confirm', onConfirm }){
    const scrim = document.getElementById('modalScrim');
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBody').innerHTML = bodyHtml;
    const confirmBtn = document.getElementById('mConfirm');
    confirmBtn.textContent = confirmLabel;
    confirmBtn.onclick = async () => {
        confirmBtn.disabled = true;
        try {
            const ok = await onConfirm();
            if (ok) scrim.classList.remove('show');
        } finally {
            confirmBtn.disabled = false;
        }
    };
    scrim.classList.add('show');
}

// ─── Catalog ──────────────────────────────────────────────
let catalogWired = false;
function wireCatalog(){
    if (catalogWired) { loadCatalog(); return; }
    catalogWired = true;

    document.getElementById('catApply').addEventListener('click', loadCatalog);
    document.getElementById('catClear').addEventListener('click', () => {
        document.getElementById('catSearch').value = '';
        document.getElementById('catCountry').value = '';
        loadCatalog();
    });
    document.getElementById('catImport').addEventListener('click', importSelected);
    document.getElementById('catSelectAll').addEventListener('change', (e) => {
        const rows = document.querySelectorAll('#catalogBody tr[data-provider-id]');
        rows.forEach(tr => {
            const imported = tr.dataset.imported === 'true';
            if (imported) return;
            const cb = tr.querySelector('input[type=checkbox]');
            if (!cb) return;
            cb.checked = e.target.checked;
            if (e.target.checked) State.catalogSelected.add(tr.dataset.providerId);
            else State.catalogSelected.delete(tr.dataset.providerId);
        });
        updateImportButton();
    });

    loadCatalog();
}

async function loadCatalog(){
    const tb = document.getElementById('catalogBody');
    if (!tb) return;
    tb.innerHTML = '<tr><td colspan="8"><div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div></td></tr>';
    State.catalogSelected.clear();
    updateImportButton();

    const params = new URLSearchParams();
    const search = document.getElementById('catSearch').value.trim();
    const country = document.getElementById('catCountry').value.trim().toUpperCase();
    if (search) params.set('search', search);
    if (country) params.set('country', country);

    const r = await api(API.catalog + (params.toString() ? '?' + params.toString() : ''));
    if (!r.ok){
        tb.innerHTML = `<tr><td colspan="8"><div class="unavailable-box">${esc(r.message)} <button onclick="loadCatalog()">Retry</button></div></td></tr>`;
        return;
    }

    State.catalogRows = r.data.products || [];
    if (!State.catalogRows.length){
        tb.innerHTML = '<tr><td colspan="8"><div class="empty-box"><i class="fas fa-inbox"></i>No products in catalog for this filter</div></td></tr>';
        return;
    }

    tb.innerHTML = State.catalogRows.map(p => `
        <tr data-provider-id="${esc(p.providerProductId)}" data-imported="${p.alreadyImported ? 'true' : 'false'}">
            <td style="width:36px">${p.alreadyImported
                ? '<i class="fas fa-check" style="color:var(--success)"></i>'
                : `<input type="checkbox" data-catalog-cb="${esc(p.providerProductId)}">`}</td>
            <td data-label="Brand">${esc(p.name)}</td>
            <td data-label="Country">${esc(p.countryName || p.countryIso || '—')}</td>
            <td data-label="Face value">${esc(p.faceValue ?? '—')} ${esc(p.faceCurrency || '')}</td>
            <td data-label="Wholesale">${esc(p.wholesaleAmount)} ${esc(p.wholesaleCurrency)}</td>
            <td data-label="Suggested NGN">${fmtMoney(p.suggestedPriceNgn, 'NGN') || '—'}</td>
            <td data-label="Suggested USD">${fmtMoney(p.suggestedPriceUsd, 'USD') || '—'}</td>
            <td data-label="Status">${p.alreadyImported
                ? '<span class="badge success">Imported</span>'
                : '<span class="badge neutral">Not imported</span>'}</td>
        </tr>`).join('');

    tb.querySelectorAll('input[data-catalog-cb]').forEach(cb => {
        cb.addEventListener('change', () => {
            if (cb.checked) State.catalogSelected.add(cb.dataset.catalogCb);
            else State.catalogSelected.delete(cb.dataset.catalogCb);
            updateImportButton();
        });
    });
}

function updateImportButton(){
    const btn = document.getElementById('catImport');
    const count = State.catalogSelected.size;
    btn.disabled = count === 0;
    btn.innerHTML = `<i class="fas fa-download"></i> Import ${count ? `(${count})` : 'selected'}`;
}

function importSelected(){
    if (!State.catalogSelected.size) return;
    openModal({
        title: `Import ${State.catalogSelected.size} product${State.catalogSelected.size === 1 ? '' : 's'}`,
        confirmLabel: 'Import',
        bodyHtml: `
            <p class="note">Imported products are created disabled by default. Enable them individually after reviewing their pricing.</p>
            <label for="importReason">Reason (required)</label>
            <textarea id="importReason" placeholder="Why is this being imported?"></textarea>
            <div class="err" id="importErr"></div>
        `,
        onConfirm: async () => {
            const reason = document.getElementById('importReason').value.trim();
            const errEl = document.getElementById('importErr');
            errEl.classList.remove('show');
            if (reason.length < 4) {
                errEl.textContent = 'Reason must be at least 4 characters.';
                errEl.classList.add('show');
                return false;
            }
            const r = await api(API.import, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    provider_product_ids: Array.from(State.catalogSelected),
                    enable: false,
                    reason
                })
            });
            if (!r.ok) {
                errEl.textContent = r.message || 'Import failed.';
                errEl.classList.add('show');
                return false;
            }
            toast(`Imported ${r.data.imported.length} product${r.data.imported.length === 1 ? '' : 's'}`, 'success');
            loadCatalog();
            return true;
        }
    });
}

// ─── Products ─────────────────────────────────────────────
let productsWired = false;
function wireProducts(){
    if (productsWired) { loadProducts(); return; }
    productsWired = true;

    document.getElementById('pApply').addEventListener('click', loadProducts);
    document.getElementById('pClear').addEventListener('click', () => {
        document.getElementById('pSearch').value = '';
        document.getElementById('pEnabled').value = '';
        loadProducts();
    });
    document.getElementById('pRefreshCosts').addEventListener('click', refreshCosts);

    loadProducts();
}

async function loadProducts(){
    const tb = document.getElementById('productsBody');
    if (!tb) return;
    tb.innerHTML = '<tr><td colspan="8"><div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div></td></tr>';

    const params = new URLSearchParams();
    const search = document.getElementById('pSearch').value.trim();
    const enabled = document.getElementById('pEnabled').value;
    if (search) params.set('search', search);
    if (enabled) params.set('enabled', enabled);

    const r = await api(API.products + (params.toString() ? '?' + params.toString() : ''));
    if (!r.ok){
        tb.innerHTML = `<tr><td colspan="8"><div class="unavailable-box">${esc(r.message)} <button onclick="loadProducts()">Retry</button></div></td></tr>`;
        return;
    }
    State.productsCache = r.data.products || [];
    State.productsCacheAt = Date.now();

    if (!State.productsCache.length){
        tb.innerHTML = '<tr><td colspan="8"><div class="empty-box"><i class="fas fa-inbox"></i>No products yet. Import some from the Catalog.</div></td></tr>';
        return;
    }

    tb.innerHTML = State.productsCache.map(p => `
        <tr data-product-id="${esc(p.id)}">
            <td data-label="Product">
                <div class="prod-wrap">
                    <div class="prod-logo">${p.logo_url
                        ? `<img src="${esc(p.logo_url)}" alt="" onerror="this.style.display='none'">`
                        : (p.display_name || p.brand || '?').slice(0,2).toUpperCase()}</div>
                    <div>
                        <div style="font-weight:600">${esc(p.display_name || p.brand || '—')}</div>
                        <div style="font-size:10.5px;color:var(--text-dim)">${p.featured ? '<i class="fas fa-fire" style="color:var(--gold)"></i> Featured' : ''}</div>
                    </div>
                </div>
            </td>
            <td data-label="Country">${esc(p.country_name || p.country_iso || '—')}</td>
            <td data-label="Face value">${esc(p.face_value ?? '—')} ${esc(p.face_currency || '')}</td>
            <td data-label="Wholesale">${esc(p.wholesale_amount || '—')} ${esc(p.wholesale_currency || '')}</td>
            <td data-label="Pricing">${esc(p.pricing_mode || 'global')}${p.pricing_value ? ' · ' + esc(String(p.pricing_value)) : ''}</td>
            <td data-label="Customer NGN">${fmtMoney(p.customer_price_ngn, 'NGN') || '—'}</td>
            <td data-label="Customer USD">${fmtMoney(p.customer_price_usd, 'USD') || '—'}</td>
            <td data-label="Actions">
                <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
                    <button class="btn btn-sm" data-edit-pricing="${esc(p.id)}" type="button"><i class="fas fa-tag"></i> Price</button>
                    <button class="btn btn-sm" data-toggle="${esc(p.id)}" data-enabled="${p.enabled ? 'false' : 'true'}" type="button">${p.enabled ? 'Disable' : 'Enable'}</button>
                    <button class="btn btn-sm" data-feature="${esc(p.id)}" data-featured="${p.featured ? 'false' : 'true'}" type="button" title="Toggle featured"><i class="fas fa-fire"></i></button>
                </div>
            </td>
        </tr>`).join('');

    tb.querySelectorAll('[data-edit-pricing]').forEach(b => b.addEventListener('click', () => openPricingModal(State.productsCache.find(p => p.id === b.dataset.editPricing))));
    tb.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => toggleEnabled(b.dataset.toggle, b.dataset.enabled === 'true')));
    tb.querySelectorAll('[data-feature]').forEach(b => b.addEventListener('click', () => toggleFeatured(b.dataset.feature, b.dataset.featured === 'true')));
}

async function toggleEnabled(id, enabled){
    openModal({
        title: `${enabled ? 'Enable' : 'Disable'} product`,
        confirmLabel: enabled ? 'Enable' : 'Disable',
        bodyHtml: `
            <label for="enabledReason">Reason (required)</label>
            <textarea id="enabledReason"></textarea>
            <div class="err" id="enabledErr"></div>
        `,
        onConfirm: async () => {
            const reason = document.getElementById('enabledReason').value.trim();
            const errEl = document.getElementById('enabledErr');
            errEl.classList.remove('show');
            if (reason.length < 4) { errEl.textContent = 'Reason required (min 4 chars).'; errEl.classList.add('show'); return false; }
            const r = await api(API.productEnabled(id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled, reason })
            });
            if (!r.ok) { errEl.textContent = r.message || 'Update failed.'; errEl.classList.add('show'); return false; }
            toast(enabled ? 'Enabled' : 'Disabled', 'success');
            loadProducts();
            return true;
        }
    });
}

async function toggleFeatured(id, featured){
    const r = await api(API.productUpdate(id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ featured })
    });
    if (!r.ok) { toast(r.message || 'Update failed', 'error'); return; }
    toast(featured ? 'Marked as featured' : 'Unfeatured', 'success');
    loadProducts();
}

function openPricingModal(product){
    if (!product) return;
    const currentMode = product.pricing_mode || 'global';
    const currentValue = product.pricing_value || '';
    openModal({
        title: `Pricing — ${product.display_name || product.brand}`,
        confirmLabel: 'Save pricing',
        bodyHtml: `
            <p class="note">The customer price is recomputed from the provider cost using the mode you pick here.</p>
            <label>Mode</label>
            <select id="mMode">
                <option value="global" ${currentMode === 'global' ? 'selected' : ''}>Global markup (default)</option>
                <option value="markup_pct" ${currentMode === 'markup_pct' ? 'selected' : ''}>Custom markup %</option>
                <option value="fixed_ngn" ${currentMode === 'fixed_ngn' ? 'selected' : ''}>Fixed NGN price</option>
                <option value="fixed_usd" ${currentMode === 'fixed_usd' ? 'selected' : ''}>Fixed USD price</option>
            </select>
            <label style="margin-top:10px">Value</label>
            <input type="text" id="mValue" value="${esc(currentValue)}" placeholder="0.10 or 12500.00">
            <label style="margin-top:10px">Reason (required)</label>
            <textarea id="mReason"></textarea>
            <div class="err" id="mErr"></div>
        `,
        onConfirm: async () => {
            const mode = document.getElementById('mMode').value;
            const value = document.getElementById('mValue').value.trim();
            const reason = document.getElementById('mReason').value.trim();
            const errEl = document.getElementById('mErr');
            errEl.classList.remove('show');
            if (reason.length < 4) { errEl.textContent = 'Reason required.'; errEl.classList.add('show'); return false; }
            if (mode !== 'global' && !value) { errEl.textContent = 'Value is required for this mode.'; errEl.classList.add('show'); return false; }
            const r = await api(API.productPricing(product.id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mode,
                    value: mode === 'global' ? null : value,
                    reason,
                    expected_updated_at: product.price_updated_at || null
                })
            });
            if (!r.ok) { errEl.textContent = r.message || 'Update failed.'; errEl.classList.add('show'); return false; }
            toast('Pricing updated', 'success');
            loadProducts();
            return true;
        }
    });
}

async function refreshCosts(){
    openModal({
        title: 'Refresh provider costs',
        confirmLabel: 'Refresh',
        bodyHtml: `
            <p class="note">Re-reads the current wholesale price from the provider for up to 25 enabled products, recomputes customer prices, and reports any products now below cost or unavailable.</p>
            <div class="err" id="refreshErr"></div>
        `,
        onConfirm: async () => {
            const errEl = document.getElementById('refreshErr');
            errEl.classList.remove('show');
            const r = await api(API.refreshCosts, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ limit: 25 })
            });
            if (!r.ok) { errEl.textContent = r.message || 'Refresh failed.'; errEl.classList.add('show'); return false; }
            const d = r.data;
            toast(`Checked ${d.checked}, updated ${d.updated}${d.belowCost.length ? `, ${d.belowCost.length} below cost` : ''}`, d.belowCost.length ? 'error' : 'success');
            loadProducts();
            return true;
        }
    });
}

// ─── Pricing ──────────────────────────────────────────────
let pricingWired = false;
function wirePricing(){
    if (pricingWired) return;
    pricingWired = true;

    document.getElementById('pSave').addEventListener('click', savePricing);
    document.getElementById('calcRun').addEventListener('click', runCalculator);
}

async function loadPricingConfig(){
    const el = document.getElementById('pricingCurrent');
    if (!el) return;
    el.innerHTML = '<div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div>';

    const r = await api(API.pricingGet);
    if (!r.ok){
        el.innerHTML = `<div class="unavailable-box">${esc(r.message)}</div>`;
        return;
    }
    State.pricingConfig = r.data;
    const d = r.data.display || {};

    el.innerHTML = `
        <div class="row"><span class="k">USD → NGN</span><span class="v">${esc(r.data.usdToNgn || '—')}</span></div>
        <div class="row"><span class="k">USD markup</span><span class="v">${esc(d.markupUsdPct || '—')}</span></div>
        <div class="row"><span class="k">NGN markup</span><span class="v">${esc(d.markupNgnPct || '—')}</span></div>
        <div class="row"><span class="k">Version</span><span class="v">${esc(r.data.pricingVersion || '—')}</span></div>
    `;

    document.getElementById('pUsdNgn').value = r.data.usdToNgn || '';
    // Convert stored decimal (0.1570) to display percent (15.7) client-side,
    // but only for populating the input — the value sent back is converted
    // to decimal before submitting.
    document.getElementById('pMarkupUsd').value = (parseFloat(r.data.markupUsd || 0) * 100).toFixed(2);
    document.getElementById('pMarkupNgn').value = (parseFloat(r.data.markupNgn || 0) * 100).toFixed(2);
}

async function savePricing(){
    const usdNgn = document.getElementById('pUsdNgn').value.trim();
    const markupUsd = document.getElementById('pMarkupUsd').value.trim();
    const markupNgn = document.getElementById('pMarkupNgn').value.trim();
    const reason = document.getElementById('pReason').value.trim();

    if (reason.length < 4){ toast('Reason required (min 4 chars).', 'error'); return; }

    // Convert display percent (15.7) → decimal (0.1570) using string math
    // so the wire format is exactly what adminSettings expects.
    const toDecimal = (pctStr) => {
        const s = String(pctStr).trim();
        if (!/^\d+(\.\d+)?$/.test(s)) throw new Error(`Invalid percent: ${s}`);
        const [intP, fracP = ''] = s.split('.');
        const paddedFrac = (fracP + '0000').slice(0, 4);
        const wholePart = intP === '0' ? '0' : intP.slice(0, -2) || '0';
        const takeFromInt = intP.length < 2 ? intP.padStart(2, '0') : intP.slice(-2);
        const combined = wholePart + '.' + (takeFromInt + paddedFrac).slice(0, 6).replace(/0+$/, '') || '0';
        const [w, f = ''] = combined.split('.');
        return w + '.' + (f + '0000').slice(0, 4);
    };

    let patch;
    try {
        patch = {
            usd_to_ngn: usdNgn,
            giftcard_markup_pct_usd: toDecimal(markupUsd),
            giftcard_markup_pct_ngn: toDecimal(markupNgn)
        };
    } catch (e) {
        toast(e.message, 'error');
        return;
    }

    const r = await api(API.pricingPut, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            patch,
            reason,
            expectedVersion: State.pricingConfig?.pricingVersion
        })
    });
    if (!r.ok){ toast(r.message || 'Save failed', 'error'); return; }
    toast('Pricing saved', 'success');
    document.getElementById('pReason').value = '';
    loadPricingConfig();
}

async function runCalculator(){
    const wholesale = document.getElementById('calcWholesale').value.trim();
    const currency = document.getElementById('calcCurrency').value;
    const mode = document.getElementById('calcMode').value;
    const value = document.getElementById('calcValue').value.trim();
    const resultEl = document.getElementById('calcResult');

    if (!wholesale){ resultEl.innerHTML = '<div class="empty-box">Enter a wholesale amount.</div>'; return; }

    const r = await api(API.preview, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            wholesale_amount: wholesale,
            wholesale_currency: currency,
            mode,
            value: mode === 'global' ? null : value
        })
    });
    if (!r.ok){ resultEl.innerHTML = `<div class="unavailable-box">${esc(r.message)}</div>`; return; }

    const d = r.data;
    resultEl.innerHTML = `
        <div class="row"><span class="k">Cost (NGN)</span><span class="v">${fmtMoney(d.costNgn, 'NGN') || '—'}</span></div>
        <div class="row"><span class="k">Cost (USD)</span><span class="v">${fmtMoney(d.costUsd, 'USD') || '—'}</span></div>
        <div class="row big"><span class="k">Customer (NGN)</span><span class="v">${fmtMoney(d.priceNgn, 'NGN') || '—'}</span></div>
        <div class="row big"><span class="k">Customer (USD)</span><span class="v">${fmtMoney(d.priceUsd, 'USD') || '—'}</span></div>
        <div class="row"><span class="k">Profit (NGN)</span><span class="v">${fmtMoney(d.profitNgn, 'NGN') || '—'}</span></div>
        <div class="row"><span class="k">Margin</span><span class="v">${esc(String(d.marginPct || 0))}%</span></div>
    `;
}

// ─── Attention / Refunds / Provider ───────────────────────
async function loadAttention(){
    const tb = document.getElementById('attentionBody');
    if (!tb) return;
    tb.innerHTML = '<tr><td colspan="7"><div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div></td></tr>';

    // Three separate queries, merged.
    const [failed, recon, refundPending] = await Promise.all([
        api(API.orders + '?status=failed&limit=50'),
        api(API.orders + '?status=reconciliation_required&limit=50'),
        api(API.orders + '?status=refund_pending&limit=50')
    ]);

    const merged = [];
    for (const r of [failed, recon, refundPending]) {
        if (r.ok) {
            for (const o of r.data.orders || []) merged.push(o);
        }
    }

    if (!merged.length) {
        tb.innerHTML = '<tr><td colspan="7"><div class="empty-box"><i class="fas fa-check-circle" style="color:var(--success)"></i>Nothing needs attention</div></td></tr>';
        return;
    }

    tb.innerHTML = merged.map(o => `
        <tr class="row-clickable" data-id="${esc(o.id)}">
            <td data-label="Order"><span style="font-family:'JetBrains Mono',monospace;font-size:11px">${esc(o.order_ref || '—')}</span></td>
            <td data-label="User">${esc(o.user?.username || '—')}</td>
            <td data-label="Product">${esc(o.brand || '—')} ${o.face_value != null ? esc(o.face_value + ' ' + (o.face_currency || '')) : ''}</td>
            <td data-label="Price">${fmtMoney(o.customer_price_ngn, 'NGN') || '—'}</td>
            <td data-label="Status"><span class="badge ${statusBadge(o.status)}">${esc(o.status)}</span></td>
            <td data-label="Reason" style="max-width:260px">${esc(o.failure_reason || '—')}</td>
            <td data-label="" style="text-align:right"><button class="btn btn-sm" data-open="${esc(o.id)}" type="button">View</button></td>
        </tr>`).join('');

    tb.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => openOrder(tr.dataset.id)));
}

async function loadRefunds(){
    const tb = document.getElementById('refundsBody');
    if (!tb) return;
    tb.innerHTML = '<tr><td colspan="5"><div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div></td></tr>';

    const r = await api(API.orders + '?status=refunded&limit=100');
    if (!r.ok){
        tb.innerHTML = `<tr><td colspan="5"><div class="unavailable-box">${esc(r.message)}</div></td></tr>`;
        return;
    }
    const rows = r.data.orders || [];
    if (!rows.length){
        tb.innerHTML = '<tr><td colspan="5"><div class="empty-box"><i class="fas fa-inbox"></i>No refunds yet</div></td></tr>';
        return;
    }
    tb.innerHTML = rows.map(o => `
        <tr class="row-clickable" data-id="${esc(o.id)}">
            <td data-label="Order"><span style="font-family:'JetBrains Mono',monospace;font-size:11px">${esc(o.order_ref || '—')}</span></td>
            <td data-label="User">${esc(o.user?.username || '—')}</td>
            <td data-label="Refunded">${fmtMoney(o.customer_price_ngn, 'NGN') || '—'}</td>
            <td data-label="Reference"><span style="font-family:'JetBrains Mono',monospace;font-size:11px">${esc(o.refund_transaction_id || '—')}</span></td>
            <td data-label="Refunded at">${esc(fmtDateTime(o.refunded_at))}</td>
        </tr>`).join('');
    tb.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => openOrder(tr.dataset.id)));
}

async function loadProviderDetail(){
    const el = document.getElementById('providerDetail');
    if (!el) return;
    el.innerHTML = '<div class="empty-box"><i class="fas fa-circle-notch fa-spin"></i></div>';

    const r = await api(API.providerHealth);
    if (!r.ok){
        el.innerHTML = `<div class="unavailable-box">${esc(r.message)}</div>`;
        return;
    }
    renderProviderHealthInto(el, r.data.health || {});

    // Add the test button below the health card
    const extra = document.createElement('button');
    extra.className = 'btn btn-primary';
    extra.type = 'button';
    extra.style.marginTop = '12px';
    extra.innerHTML = '<i class="fas fa-heart-pulse"></i> Test connection';
    extra.addEventListener('click', async () => {
        extra.disabled = true;
        const rr = await api(API.providerCheck, { method: 'POST' });
        extra.disabled = false;
        if (!rr.ok) { toast(rr.message || 'Test failed', 'error'); return; }
        toast(rr.data.reachable ? 'Reachable' : 'Unreachable', rr.data.reachable ? 'success' : 'error');
        loadProviderDetail();
    });
    el.appendChild(extra);
}
